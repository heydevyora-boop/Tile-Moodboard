<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Casa de Aurum — Print Board Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/shell.css">
<style>
  .pb-grid { display: grid; grid-template-columns: 340px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 980px) { .pb-grid { grid-template-columns: 1fr; } }

  .format-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 18px; }
  .format-card { border: 1px solid var(--line); border-radius: 5px; padding: 12px 10px; cursor: pointer; background: #fff; text-align: left; }
  .format-card:hover { border-color: var(--brass); }
  .format-card.on { border-color: var(--brass); background: #FBF6EC; }
  .format-card .ic { font-size: 18px; margin-bottom: 6px; display: block; }
  .format-card .t { font-size: 12.5px; font-weight: 700; color: var(--ink); }
  .format-card .d { font-size: 10.5px; color: var(--stone-600); margin-top: 2px; }

  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .preset-btn { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); background: #fff; color: #4B443A; padding: 6px 10px; border-radius: 12px; cursor: pointer; }
  .preset-btn.on { border-color: var(--brass); background: #FBF6EC; color: var(--brass); }

  .dim-row { display: flex; gap: 8px; align-items: flex-end; }
  .dim-row .field { flex: 1; }
  .dim-row .field.unit { max-width: 90px; }
  .dim-row label { display: block; font-size: 12px; color: var(--stone-600); margin-bottom: 6px; font-family: var(--mono); }
  .dim-row input, .dim-row select { width: 100%; font-family: var(--mono); font-size: 13px; padding: 10px 11px; border: 1px solid var(--line); border-radius: 2px; background: var(--stone-50); color: var(--ink); }

  .layout-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .layout-card { border: 1px solid var(--line); border-radius: 5px; padding: 10px; cursor: pointer; background: #fff; }
  .layout-card:hover { border-color: var(--brass); }
  .layout-card.on { border-color: var(--brass); background: #FBF6EC; }
  .layout-card .mini { height: 46px; border: 1px solid var(--line); border-radius: 3px; background: var(--stone-50); display: grid; gap: 2px; padding: 4px; margin-bottom: 7px; }
  .layout-card .mini div { background: var(--stone-400); border-radius: 2px; }
  .layout-card .t { font-size: 11.5px; font-weight: 700; }

  .export-row { display: flex; flex-direction: column; gap: 8px; }
  .export-opt { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 5px; padding: 10px 12px; cursor: pointer; background: #fff; }
  .export-opt.on { border-color: var(--brass); background: #FBF6EC; }
  .export-opt input { accent-color: var(--brass); }
  .export-opt .lab { font-size: 12.5px; font-weight: 600; }
  .export-opt .sub { font-size: 10.5px; color: var(--stone-600); font-family: var(--mono); }

  .preview-frame { background: var(--stone-100); border: 1px solid var(--line); display: flex; flex-direction: column; width: 100%; max-width: 520px; margin: 0 auto; box-shadow: var(--shadow); }
  .pf-header { background: var(--charcoal); color: var(--stone-50); text-align: center; padding: 12px 8px; font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: .03em; }
  .pf-body { flex: 1; padding: 14px; display: flex; gap: 8px; min-height: 240px; }
  .pf-hero { flex: 1; background: linear-gradient(135deg,#C9BFA9,#8F8062); border-radius: 2px; }
  .pf-side { width: 34%; display: flex; flex-direction: column; gap: 8px; }
  .pf-side div { flex: 1; border-radius: 2px; }
  .pf-grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pf-grid div { border-radius: 2px; }
  .pf-cassette { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .pf-cassette .strip { display: flex; gap: 8px; flex: 1; }
  .pf-cassette .strip div { flex: 1; border-radius: 2px; }
  .pf-footer { background: var(--stone-200); text-align: center; padding: 9px; font-family: var(--mono); font-size: 10.5px; color: var(--stone-700); }
  .dim-readout { font-family: var(--mono); font-size: 12px; color: var(--stone-600); margin-top: 14px; text-align: center; }
  .dim-readout strong { color: var(--ink); }

  .combo-kv { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed rgba(34,29,24,0.14); font-family: var(--mono); font-size: 12px; }
  .combo-kv:last-of-type { border-bottom: none; }
  .combo-kv .k { color: var(--stone-600); }
  .combo-kv .v { color: var(--ink); text-align: right; }
  .swatch-row { display: flex; gap: 8px; margin-top: 14px; }
  .swatch-row div { flex: 1; height: 48px; border-radius: 3px; border: 1px solid rgba(0,0,0,0.06); }

  .export-status { width: 100%; margin-top: 14px; padding: 12px 16px; border: 1px solid var(--brass); border-radius: 3px; background: #FBF6EC; font-family: var(--mono); font-size: 12px; color: var(--brass); font-weight: 500; display: none; }
  .export-status.ready { border-color: var(--sage); background: #F1F5EE; color: #4A7A2E; }
  .export-status.err { border-color: var(--clay); background: #FBEEEA; color: var(--clay); }
  .export-status a { color: inherit; text-decoration: underline; }

  .picker-panel select { width: 100%; font-family: var(--mono); font-size: 13px; padding: 10px 11px; border: 1px solid var(--line); border-radius: 2px; background: var(--stone-50); color: var(--ink); margin-bottom: 12px; }
  .state-box { text-align: center; padding: 40px 20px; color: var(--stone-600); font-family: var(--mono); font-size: 13px; }
</style>
</head>
<body>
<div id="casa-main-content">

  <div class="casa-pageheader">
    <div>
      <h1>Print Board Designer</h1>
      <p id="pageSub">Once a combination is approved, build the cassette panel, ACP signboard, or handout at exact print dimensions.</p>
    </div>
  </div>

  <div id="pickerArea"></div>
  <div id="designerArea" style="display:none;"></div>

</div>

<script src="assets/api-client.js"></script>
<script src="assets/notifications.js"></script>
<script src="assets/shell.js"></script>
<script>
(async () => {
  await CasaShell.init({ current: 'print-board-designer.html' });

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function absoluteUrl(relativeUrl) {
    const base = (window.CASA_API_BASE || 'http://localhost:5000/api/v1').replace(/\/api\/v1\/?$/, '');
    return relativeUrl && relativeUrl.startsWith('http') ? relativeUrl : base + relativeUrl;
  }
  function tileForRole(combo, role) {
    const tiles = Array.isArray(combo.tiles) ? combo.tiles : [];
    return tiles.find((t) => t.role === role) || (role === 'border' ? tiles.find((t) => t.role === 'accent') : null);
  }

  const params = new URLSearchParams(location.search);
  let moodBoardId = params.get('moodBoardId');
  let combinationIndex = params.get('combinationIndex') !== null ? Number(params.get('combinationIndex')) : null;

  const pickerArea = document.getElementById('pickerArea');
  const designerArea = document.getElementById('designerArea');

  let board = null;
  let combo = null;

  async function loadBoardAndCombo(id, idx) {
    board = await CasaApi.moodBoards.get(id);
    combo = Array.isArray(board.combinations) ? board.combinations[idx] : null;
    if (!combo) throw new Error('That combination could not be found on this mood board.');
    moodBoardId = id;
    combinationIndex = idx;
  }

  async function showPicker() {
    pickerArea.innerHTML = `<div class="casa-panel picker-panel"><div class="panel-head"><h3>Choose a Mood Board</h3></div><div class="panel-body" id="pickerBody"><div class="state-box">Loading mood boards…</div></div></div>`;
    const pickerBody = document.getElementById('pickerBody');

    let boards;
    try {
      const res = await CasaApi.moodBoards.list({ limit: 50 });
      boards = Array.isArray(res.boards) ? res.boards : [];
    } catch (err) {
      pickerBody.innerHTML = `<div class="state-box" style="color:var(--clay);">${escapeHtml(err.message || 'Could not load mood boards.')}</div>`;
      return;
    }

    const withCombos = boards.filter((b) => Array.isArray(b.combinations) && b.combinations.length);
    if (!withCombos.length) {
      pickerBody.innerHTML = `<div class="state-box">No mood boards with generated combinations yet. <a href="moodboard-wizard.html">Start a new brief →</a></div>`;
      return;
    }

    pickerBody.innerHTML = `
      <select id="boardSelect">${withCombos.map((b) => `<option value="${escapeHtml(b.id)}">${escapeHtml(b.style || '')} · ${escapeHtml(b.room || '')} · ${escapeHtml(new Date(b.createdAt).toLocaleDateString())} (${escapeHtml(b.id)})</option>`).join('')}</select>
      <select id="comboSelect"></select>
      <button class="casa-btn" id="useComboBtn" style="width:100%;">Use this combination</button>`;

    const boardSelect = document.getElementById('boardSelect');
    const comboSelect = document.getElementById('comboSelect');

    function fillCombos() {
      const b = withCombos.find((x) => x.id === boardSelect.value);
      comboSelect.innerHTML = (b.combinations || []).map((c, i) => `<option value="${i}">${escapeHtml(c.board_name || `Combination ${i + 1}`)}</option>`).join('');
    }
    boardSelect.addEventListener('change', fillCombos);
    fillCombos();

    document.getElementById('useComboBtn').addEventListener('click', async () => {
      try {
        await loadBoardAndCombo(boardSelect.value, Number(comboSelect.value));
        pickerArea.innerHTML = '';
        renderDesigner();
      } catch (err) {
        CasaNotify.error(err.message || 'Could not load that combination.');
      }
    });
  }

  if (moodBoardId && combinationIndex !== null && !Number.isNaN(combinationIndex)) {
    try {
      await loadBoardAndCombo(moodBoardId, combinationIndex);
      renderDesigner();
    } catch (err) {
      pickerArea.innerHTML = `<div class="state-box" style="color:var(--clay);">${escapeHtml(err.message)}</div>`;
      await showPicker();
    }
  } else {
    await showPicker();
  }

  // ============================================================
  // DESIGNER
  // ============================================================

  function renderDesigner() {
    document.getElementById('pageSub').textContent = `${combo.board_name || 'Selected combination'} · ${board.id} — combination ${combinationIndex + 1}`;
    designerArea.style.display = 'block';
    designerArea.innerHTML = `
      <div class="pb-grid">
        <div>
          <div class="casa-panel">
            <div class="panel-head"><h3>Format</h3></div>
            <div class="panel-body">
              <div class="format-grid" id="formatGrid"></div>
              <div class="presets" id="presetRow"></div>
              <div class="dim-row">
                <div class="field"><label>Width</label><input type="number" id="dimW" value="4"></div>
                <div class="field"><label>Height</label><input type="number" id="dimH" value="8"></div>
                <div class="field unit"><label>Unit</label><select id="dimUnit"><option value="ft">ft</option><option value="in">in</option><option value="cm">cm</option><option value="mm">mm</option></select></div>
              </div>
            </div>
          </div>
          <div class="casa-panel">
            <div class="panel-head"><h3>Layout Template</h3></div>
            <div class="panel-body"><div class="layout-grid" id="layoutGrid"></div></div>
          </div>
          <div class="casa-panel">
            <div class="panel-head"><h3>Export</h3></div>
            <div class="panel-body">
              <div class="export-row" id="exportRow"></div>
              <button class="casa-btn" id="exportBtn" style="width:100%;margin-top:16px;">Download for print shop</button>
            </div>
          </div>
        </div>
        <div>
          <div class="casa-panel">
            <div class="panel-body">
              <div class="preview-frame">
                <div class="pf-header" id="pfCaption">CASSETTE PANEL — SELECTED COMBINATION</div>
                <div class="pf-body" id="pfBody"></div>
                <div class="pf-footer" id="pfFooter"></div>
              </div>
              <div class="dim-readout">Print at actual size — do not scale. File is <strong id="readoutDim">4×8 ft</strong> at <strong id="readoutDpi">300 DPI</strong>.</div>
              <div class="export-status" id="exportStatus"></div>
            </div>
          </div>
          <div class="casa-panel">
            <div class="panel-head"><h3>Selected Combination</h3></div>
            <div class="panel-body" id="comboSummary"></div>
          </div>
        </div>
      </div>`;

    wireDesigner();
  }

  function wireDesigner() {
    const base = tileForRole(combo, 'base');
    const hi = tileForRole(combo, 'highlight');
    const border = tileForRole(combo, 'border');

    document.getElementById('comboSummary').innerHTML = `
      <div style="font-family:var(--display);font-weight:600;font-size:17px;color:var(--charcoal);margin-bottom:12px;">${escapeHtml(combo.board_name || 'Combination')}</div>
      <div class="combo-kv"><span class="k">Base</span><span class="v">${escapeHtml(base ? base.name || base.product_name || '—' : '—')}</span></div>
      <div class="combo-kv"><span class="k">Highlight</span><span class="v">${escapeHtml(hi ? hi.name || hi.product_name || '—' : '—')}</span></div>
      <div class="combo-kv"><span class="k">Border / Accent</span><span class="v">${escapeHtml(border ? border.name || border.product_name || '—' : '—')}</span></div>
      <div style="font-family:var(--sans);font-size:12px;color:var(--brass);font-weight:600;margin-top:8px;">Grout: ${escapeHtml(combo.grout_recommendation || '—')}</div>
      <div class="swatch-row"><div style="background:var(--stone-400);"></div><div style="background:var(--brass-light);"></div><div style="background:var(--stone-200);"></div></div>`;

    document.getElementById('pfFooter').textContent = `${(base && (base.name || base.product_name)) || 'Selected tile'} · ${combo.grout_recommendation ? 'Grout: ' + combo.grout_recommendation : ''}`;

    const presetsByFormat = {
      cassette: [{ l: '4×8 ft', w: 4, h: 8, u: 'ft' }, { l: '6×4 ft', w: 6, h: 4, u: 'ft' }, { l: '6×10 ft', w: 6, h: 10, u: 'ft' }],
      acp: [{ l: '4×8 ft', w: 4, h: 8, u: 'ft' }],
      handout: [{ l: 'A4', w: 210, h: 297, u: 'mm' }, { l: 'A3', w: 297, h: 420, u: 'mm' }],
      custom: [],
    };
    const formats = [
      { key: 'cassette', icon: '🏬', title: 'Cassette Panel', desc: 'Showroom wall display' },
      { key: 'acp', icon: '📋', title: 'ACP Signboard', desc: 'Aluminium composite' },
      { key: 'handout', icon: '🎨', title: 'Mood Board Print', desc: 'Customer handout' },
      { key: 'custom', icon: '✏️', title: 'Fully Custom', desc: 'Any size, any unit' },
    ];
    const layouts = [
      { key: 'hero', title: 'Hero + Info', cells: 2, cols: '2fr 1fr', rows: '1fr' },
      { key: 'grid', title: 'Tile Grid', cells: 4, cols: '1fr 1fr', rows: '1fr 1fr' },
      { key: 'side', title: 'Side by Side', cells: 2, cols: '1.4fr 1fr', rows: '1fr' },
      { key: 'cassette', title: 'Cassette Style', cells: 3, cols: '1fr 1fr 1fr', rows: '1fr 1fr' },
    ];
    const formatLabels = { cassette: 'CASSETTE PANEL', acp: 'ACP SIGNBOARD', handout: 'MOOD BOARD PRINT', custom: 'CUSTOM BOARD' };
    const FORMAT_MAP = { cassette: 'CASSETTE_PANEL', acp: 'ACP_SIGNBOARD', handout: 'MOOD_BOARD_PRINT', custom: 'CUSTOM' };
    const LAYOUT_MAP = { hero: 'HERO_IMAGE', grid: 'TILE_GRID', side: 'SIDE_BY_SIDE', cassette: 'CASSETTE_STYLE' };
    const layoutTemplates = {
      hero: `<div class="pf-hero"></div><div class="pf-side"><div style="background:var(--stone-400)"></div><div style="background:var(--brass-light)"></div><div style="background:var(--stone-200)"></div></div>`,
      grid: `<div class="pf-grid"><div style="background:var(--stone-400)"></div><div style="background:var(--brass-light)"></div><div style="background:var(--stone-200)"></div><div style="background:#B96A45"></div></div>`,
      side: `<div class="pf-hero" style="flex:1.4"></div><div class="pf-side" style="width:38%"><div style="background:var(--stone-400)"></div><div style="background:var(--brass-light)"></div></div>`,
      cassette: `<div class="pf-cassette"><div style="background:var(--stone-400);border-radius:2px;"></div><div class="strip"><div style="background:var(--brass-light)"></div><div style="background:var(--stone-200)"></div><div style="background:#B96A45"></div></div></div>`,
    };

    let currentFormat = 'cassette';
    let currentLayout = 'hero';

    const formatGrid = document.getElementById('formatGrid');
    const presetRow = document.getElementById('presetRow');
    const layoutGrid = document.getElementById('layoutGrid');
    const dimW = document.getElementById('dimW');
    const dimH = document.getElementById('dimH');
    const dimUnit = document.getElementById('dimUnit');
    const exportRow = document.getElementById('exportRow');
    const pfBody = document.getElementById('pfBody');
    const pfCaption = document.getElementById('pfCaption');
    const readoutDim = document.getElementById('readoutDim');
    const readoutDpi = document.getElementById('readoutDpi');

    let exportIdx = 0;
    const exportOpts = [
      { label: 'PNG · 300 DPI', sub: 'Send via WhatsApp or email' },
      { label: 'PDF · exact size', sub: 'Preferred by professional shops' },
      { label: '600 DPI option', sub: 'For 6×10 ft boards and above' },
    ];

    function renderFormatGrid() {
      formatGrid.innerHTML = formats.map((f) => `
        <div class="format-card${currentFormat === f.key ? ' on' : ''}" data-fmt="${f.key}">
          <span class="ic">${f.icon}</span><div class="t">${escapeHtml(f.title)}</div><div class="d">${escapeHtml(f.desc)}</div>
        </div>`).join('');
      formatGrid.querySelectorAll('[data-fmt]').forEach((card) => {
        card.addEventListener('click', () => {
          currentFormat = card.dataset.fmt;
          const list = presetsByFormat[currentFormat];
          if (list.length) { dimW.value = list[0].w; dimH.value = list[0].h; dimUnit.value = list[0].u; }
          renderFormatGrid();
          renderPresets();
          updatePreview();
        });
      });
    }

    function renderPresets() {
      const list = presetsByFormat[currentFormat];
      presetRow.innerHTML = !list.length
        ? `<span class="casa-hint">Enter custom dimensions below</span>`
        : list.map((p, i) => `<button type="button" class="preset-btn${i === 0 ? ' on' : ''}" data-w="${p.w}" data-h="${p.h}" data-u="${p.u}">${escapeHtml(p.l)}</button>`).join('');
      presetRow.querySelectorAll('.preset-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          presetRow.querySelectorAll('.preset-btn').forEach((b) => b.classList.remove('on'));
          btn.classList.add('on');
          dimW.value = btn.dataset.w; dimH.value = btn.dataset.h; dimUnit.value = btn.dataset.u;
          updatePreview();
        });
      });
    }

    function renderLayoutGrid() {
      layoutGrid.innerHTML = layouts.map((l) => `
        <div class="layout-card${currentLayout === l.key ? ' on' : ''}" data-layout="${l.key}">
          <div class="mini" style="grid-template-columns:${l.cols};grid-template-rows:${l.rows};">${'<div></div>'.repeat(l.cells)}</div>
          <div class="t">${escapeHtml(l.title)}</div>
        </div>`).join('');
      layoutGrid.querySelectorAll('[data-layout]').forEach((card) => {
        card.addEventListener('click', () => {
          currentLayout = card.dataset.layout;
          renderLayoutGrid();
          renderLayoutPreview();
        });
      });
    }

    function renderLayoutPreview() { pfBody.innerHTML = layoutTemplates[currentLayout]; }

    function renderExportOpts() {
      exportRow.innerHTML = exportOpts.map((e, i) => `
        <label class="export-opt${exportIdx === i ? ' on' : ''}" data-idx="${i}">
          <input type="radio" name="exp" ${exportIdx === i ? 'checked' : ''}>
          <div><div class="lab">${escapeHtml(e.label)}</div><div class="sub">${escapeHtml(e.sub)}</div></div>
        </label>`).join('');
      exportRow.querySelectorAll('.export-opt').forEach((opt) => {
        opt.addEventListener('click', () => {
          exportIdx = Number(opt.dataset.idx);
          renderExportOpts();
          updatePreview();
        });
      });
    }

    function currentDpi() { return exportOpts[exportIdx].label.includes('600') ? 600 : 300; }
    function currentFileFormat() { return exportOpts[exportIdx].label.includes('PDF') ? 'PDF' : 'PNG'; }

    function updatePreview() {
      pfCaption.textContent = `${formatLabels[currentFormat]} — SELECTED COMBINATION`;
      readoutDim.textContent = `${dimW.value || 0}×${dimH.value || 0} ${dimUnit.value}`;
      readoutDpi.textContent = `${currentDpi()} DPI`;
    }
    [dimW, dimH, dimUnit].forEach((el) => el.addEventListener('input', updatePreview));

    renderFormatGrid();
    renderPresets();
    renderLayoutGrid();
    renderLayoutPreview();
    renderExportOpts();
    updatePreview();

    const exportBtn = document.getElementById('exportBtn');
    const exportStatus = document.getElementById('exportStatus');

    exportBtn.addEventListener('click', async () => {
      exportStatus.className = 'export-status';
      exportStatus.style.display = 'block';
      exportStatus.textContent = 'Preparing file at exact print dimensions…';
      exportBtn.disabled = true;

      const fileFormat = currentFileFormat();
      const dpi = currentDpi();
      const notice = CasaNotify.processing(`Exporting ${fileFormat} at ${dpi} DPI...`);

      try {
        const generated = await CasaApi.printBoards.generate({
          moodBoardId: board.id,
          combinationIndex,
          format: FORMAT_MAP[currentFormat],
          layout: LAYOUT_MAP[currentLayout],
          widthValue: Number(dimW.value),
          heightValue: Number(dimH.value),
          unit: dimUnit.value.toUpperCase(),
          dpi,
          fileFormat,
        });

        const filename = `${formatLabels[currentFormat]}_${dimW.value}x${dimH.value}${dimUnit.value}.${fileFormat.toLowerCase()}`;
        exportStatus.className = 'export-status ready';
        exportStatus.innerHTML = `✓ Ready — <a href="${absoluteUrl(generated.fileUrl)}" target="_blank">open ${escapeHtml(filename)}</a> · <a href="#" id="shareToDriveLink">share via Google Drive</a>`;
        notice.dismiss();
        CasaNotify.exportReady(`${fileFormat} export ready.`, { url: absoluteUrl(generated.fileUrl), label: `Open ${filename}` });

        document.getElementById('shareToDriveLink').addEventListener('click', async (e) => {
          e.preventDefault();
          const link = e.target;
          link.textContent = 'sharing...';
          const shareNotice = CasaNotify.processing('Uploading to Google Drive...');
          try {
            const shared = await CasaApi.printBoards.share(generated.id);
            link.outerHTML = `<a href="${escapeHtml(shared.driveShareUrl)}" target="_blank">Drive link ready →</a>`;
            shareNotice.dismiss();
            CasaNotify.exportReady('Uploaded to Google Drive.', { url: shared.driveShareUrl, label: 'Open Drive link' });
          } catch (err) {
            link.textContent = err.message || 'Share failed';
            shareNotice.error('Drive upload failed: ' + (err.message || 'unknown error'));
          }
        });
      } catch (err) {
        exportStatus.className = 'export-status err';
        exportStatus.textContent = err.message || 'Export failed.';
        notice.error(err.message || 'Export failed.');
      } finally {
        exportBtn.disabled = false;
      }
    });
  }
})();
</script>
</body>
</html>
