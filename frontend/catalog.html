<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalog · De’vyora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1A1512; --paper:#F7F3EC; --card:#fff; --line:#E7DFD1; --sand:#F4EEE3; --gold:#8A6A3B; --gold-light:#E3C58E; --muted:#8B8177; --text2:#5B5147; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:'DM Sans',sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:var(--gold); text-decoration:none; }
  .mono { font-family:'JetBrains Mono',monospace; }
  .serif { font-family:'Playfair Display',serif; }
  button { font-family:inherit; }
  img { max-width:100%; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:#DED3C0; border-radius:8px; border:3px solid var(--paper); }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  @keyframes rise { from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none} }
  @keyframes shimmer { from{background-position:180% 0} to{background-position:-180% 0} }

  .layout { display:flex; height:100vh; overflow:hidden; }
  .sidebar { flex:0 0 auto; width:266px; height:100%; display:flex; flex-direction:column; background:#FCFAF6; border-right:1px solid var(--line); overflow-y:auto; }
  .brand { padding:26px 22px 20px; border-bottom:1px solid #EFE7DA; }
  .brand .name { font-size:19px; letter-spacing:.14em; line-height:1.1; }
  .brand-row { display:flex; align-items:center; gap:10px; }
  .brand-mark { flex:0 0 auto; width:30px; height:30px; border-radius:7px; display:block; }
  /* The name div carries BOTH .brand and .name, so .brand's own
     22px padding was landing on it a second time and pushing the
     wordmark 22px clear of the mark, and .brand's border-bottom was
     drawing a second rule under it. Inside the row it is a wordmark,
     not a block: it shrink-wraps, carries neither, and the only space
     between the two is the gap above. */
  .brand-row .name { padding:0; border-bottom:none; flex:0 0 auto; }
  .brand .tag { font-size:9px; letter-spacing:.22em; color:var(--muted); margin-top:6px; }
  .nav { padding:20px 14px 8px; }
  .nav-label { font-size:9.5px; letter-spacing:.2em; color:#A0968A; padding:0 8px 10px; }
  .nav-items { display:flex; flex-direction:column; gap:3px; }
  .nav-item { display:flex; align-items:center; gap:12px; width:100%; min-height:48px; padding:0 12px; border:none; border-radius:12px; cursor:pointer; font-size:14px; text-align:left; background:transparent; color:#4A4038; }
  .nav-item.active { background:var(--ink); color:#FBF6EC; font-weight:500; }
  .nav-item:not(.active):hover { background:#F1EADD; }
  .nav-item .lbl { flex:1; }
  .nav-item .badge { font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.08em; padding:3px 7px; border-radius:100px; background:#F1EADD; color:var(--muted); }
  .nav-item.active .badge { background:rgba(227,197,142,.2); color:var(--gold-light); }
  .profile-wrap { margin-top:auto; padding:18px 16px; }
  .profile { display:flex; align-items:center; gap:11px; padding:12px; background:var(--sand); border:1px solid var(--line); border-radius:14px; }
  .avatar-circle { width:36px; height:36px; flex:0 0 auto; border-radius:50%; background:linear-gradient(150deg,#C09A5E,var(--gold)); display:grid; place-items:center; font-size:13px; color:#FFF8EC; }
  .profile .name { font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .profile .role { font-size:9px; letter-spacing:.14em; color:var(--muted); }
  .logout-btn { margin-top:10px; width:100%; padding:8px; background:transparent; border:1px solid var(--line); border-radius:10px; cursor:pointer; font-size:10px; letter-spacing:.1em; color:var(--muted); }
  .logout-btn:hover { color:var(--ink); border-color:#C7B393; }

  .main { flex:1; min-width:0; overflow-y:auto; padding:clamp(22px,3vw,44px); }
  .stage { animation:fadeIn .35s ease both; max-width:1200px; }

  .eyebrow { display:flex; align-items:center; gap:9px; font-size:10px; letter-spacing:.2em; color:var(--gold); }
  .dot { width:6px; height:6px; border-radius:50%; background:var(--gold); flex:0 0 auto; }
  h1.page-h1 { font-weight:600; font-size:clamp(28px,3.8vw,44px); line-height:1.08; margin:12px 0 0; }
  .page-sub { max-width:660px; margin:12px 0 0; font-size:clamp(14px,1.1vw,16px); line-height:1.55; color:var(--text2); }

  .search-box { display:flex; align-items:center; gap:9px; padding:0 14px; height:46px; max-width:420px; background:#fff; border:1px solid var(--line); border-radius:12px; margin-top:20px; }
  .search-box input { flex:1; min-width:0; border:none; outline:none; background:transparent; font-size:12px; letter-spacing:.02em; color:var(--ink); }

  .empty-state { padding:clamp(28px,4vw,48px) clamp(20px,3vw,32px); background:#fff; border:1px dashed #D8C9AE; border-radius:20px; text-align:center; }
  .empty-icon { width:58px; height:58px; margin:0 auto; border-radius:16px; background:var(--sand); display:grid; place-items:center; }
  .empty-title { font-weight:600; font-size:clamp(20px,2.2vw,26px); margin:18px 0 0; }
  .empty-desc { max-width:380px; margin:10px auto 0; font-size:14px; line-height:1.55; color:var(--text2); }
  .btn-primary { min-height:52px; padding:0 22px; margin-top:20px; background:var(--ink); color:#FBF6EC; border:none; border-radius:13px; cursor:pointer; font-size:10.5px; letter-spacing:.14em; }
  .btn-primary:hover { background:#33291F; }

  .skeleton-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr)); gap:16px; margin-top:24px; }
  .skeleton { height:220px; border-radius:16px; background:linear-gradient(90deg,#F1EADD 20%,#F8F3E9 50%,#F1EADD 80%); background-size:200% 100%; animation:shimmer 1.4s linear infinite; }

  .collections-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr)); gap:clamp(14px,1.6vw,20px); margin-top:clamp(20px,2.4vw,30px); }
  .coll-card { background:var(--card); border:1px solid var(--line); border-radius:20px; overflow:hidden; display:flex; flex-direction:column; animation:rise .4s ease both; }
  .coll-img { position:relative; height:clamp(170px,18vw,220px); overflow:hidden; background:var(--sand); }
  .coll-img img { width:100%; height:100%; object-fit:cover; display:block; }
  .coll-tag { position:absolute; left:14px; top:14px; font-size:9px; letter-spacing:.14em; background:#FBF7EF; color:var(--ink); padding:7px 10px; border-radius:7px; border:1px solid var(--line); }
  .coll-body { padding:clamp(18px,1.8vw,24px); display:flex; flex-direction:column; gap:11px; flex:1; }
  .coll-body h3 { font-weight:600; font-size:clamp(20px,2vw,26px); margin:0; line-height:1.15; }
  .coll-foot { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:auto; padding-top:12px; }
  .coll-count { font-size:10px; letter-spacing:.1em; color:var(--muted); }
  .use-palette-btn { display:flex; align-items:center; gap:9px; min-height:44px; background:transparent; border:none; padding:0; cursor:pointer; font-size:10.5px; letter-spacing:.14em; color:#6E5228; }
  .use-palette-btn:hover { color:var(--ink); }

  /* ---- Company -> Collection -> Product browsing (Stage 2) ---- */
  .breadcrumb { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:18px; font-size:11px; letter-spacing:.06em; color:var(--muted); }
  .breadcrumb button { background:transparent; border:none; cursor:pointer; padding:4px 2px; font-size:11px; letter-spacing:.06em; color:var(--gold); font-family:inherit; }
  .breadcrumb button:hover { color:var(--ink); text-decoration:underline; }
  .breadcrumb .sep { color:#C9BCA3; }
  .breadcrumb .current { color:var(--ink); font-weight:500; }

  .filter-row { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  .filter-select { height:38px; padding:0 12px; background:#fff; border:1px solid var(--line); border-radius:10px; font-size:11.5px; color:var(--ink); font-family:inherit; }

  .company-card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px; display:flex; align-items:center; gap:14px; cursor:pointer; animation:rise .4s ease both; text-align:left; width:100%; font-family:inherit; }
  .company-card:hover { border-color:#C7B393; }
  .company-logo { width:46px; height:46px; flex:0 0 auto; border-radius:12px; object-fit:cover; background:var(--sand); }
  .company-logo.placeholder { display:grid; place-items:center; font-size:15px; }
  .company-name { font-weight:600; font-size:17px; }
  .company-meta { font-size:10px; letter-spacing:.1em; color:var(--muted); margin-top:4px; }

  /* Card hierarchy: company (small metadata) / collection (secondary
     heading) / product (primary heading) -- never mixed on one line,
     per the brief's explicit visual order. */
  .prod-card { background:var(--card); border:1px solid var(--line); border-radius:20px; overflow:hidden; display:flex; flex-direction:column; cursor:pointer; animation:rise .4s ease both; text-align:left; font-family:inherit; }
  .prod-card:hover { border-color:#C7B393; }
  .prod-img { height:clamp(150px,16vw,200px); overflow:hidden; background:var(--sand); }
  .prod-img img { width:100%; height:100%; object-fit:cover; display:block; }
  .prod-body { padding:clamp(16px,1.6vw,20px); display:flex; flex-direction:column; gap:4px; }
  .prod-company { font-size:9.5px; letter-spacing:.16em; color:var(--muted); text-transform:uppercase; }
  .prod-collection { font-size:12.5px; letter-spacing:.04em; color:#6E5228; font-weight:500; }
  .prod-name { font-weight:600; font-size:clamp(18px,1.8vw,22px); margin:2px 0 0; line-height:1.18; }
  .prod-variants { font-size:10px; letter-spacing:.08em; color:var(--muted); margin-top:8px; }

  .detail-panel { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:clamp(20px,2.4vw,32px); margin-top:20px; animation:rise .35s ease both; }
  .detail-eyebrow { font-size:9.5px; letter-spacing:.16em; color:var(--muted); text-transform:uppercase; }
  .detail-collection { font-size:13px; color:#6E5228; font-weight:500; margin-top:4px; }
  .detail-name { font-weight:600; font-size:clamp(24px,2.6vw,32px); margin:6px 0 0; }
  .detail-grid { display:grid; grid-template-columns:minmax(0,1fr); gap:20px; margin-top:18px; }
  @media (min-width: 720px) { .detail-grid { grid-template-columns:260px 1fr; } }
  .detail-img { height:220px; border-radius:16px; overflow:hidden; background:var(--sand); }
  .detail-img img { width:100%; height:100%; object-fit:cover; display:block; }
  .option-group { margin-top:4px; }
  .option-label { font-size:10px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase; margin-bottom:8px; }
  .option-chip-row { display:flex; gap:8px; flex-wrap:wrap; }
  .option-chip { height:36px; padding:0 14px; border-radius:100px; border:1px solid var(--line); background:#fff; font-size:11.5px; letter-spacing:.03em; cursor:pointer; font-family:inherit; color:var(--ink); }
  .option-chip.active { background:var(--ink); color:#FBF6EC; border-color:var(--ink); }
  .option-chip:disabled { opacity:.4; cursor:not-allowed; text-decoration:line-through; }
  .variant-resolved { margin-top:14px; padding:12px 14px; background:var(--sand); border-radius:12px; font-size:12px; color:var(--text2); }
  .spec-block { margin-top:16px; font-size:13px; line-height:1.6; color:var(--text2); }

  .section-title { font-weight:600; font-size:clamp(22px,2.3vw,30px); margin:clamp(30px,3.4vw,44px) 0 0; }
  .section-sub { margin:8px 0 0; font-size:14px; color:var(--text2); }

  .surface-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr)); gap:clamp(10px,1.2vw,14px); margin-top:18px; }
  .surface-card { display:flex; gap:12px; align-items:center; padding:14px; background:var(--card); border:1px solid var(--line); border-radius:14px; }
  .surface-card img { width:44px; height:44px; flex:0 0 auto; border-radius:11px; object-fit:cover; background:var(--sand); }
  .surface-card .sn { display:block; font-size:13.5px; font-weight:500; line-height:1.3; }
  .surface-card .ss { display:block; font-size:9.5px; letter-spacing:.08em; color:var(--muted); margin-top:5px; }
  .stock-dot { display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:5px; }
  .stock-dot.yes { background:#6E5228; }
  .stock-dot.no { background:#A8552A; }

  .load-more-row { display:flex; justify-content:center; margin-top:22px; }
  .btn-secondary { min-height:48px; padding:0 22px; background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:13px; cursor:pointer; font-size:10.5px; letter-spacing:.14em; }
  .btn-secondary:hover:not(:disabled) { background:#F1EADD; }
  .btn-secondary:disabled { opacity:.5; cursor:not-allowed; }

  @media (max-width: 860px) {
    .sidebar { display:none; }
    .main { padding:18px; }
  }
</style>
<link rel="stylesheet" href="assets/sidebar.css">
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <a class="brand-row" href="home.html" aria-label="De’vyora home"><img class="brand-mark" src="img/devyora-mark.webp" alt="" width="30" height="30" decoding="async"><div class="brand name serif">DE’VYORA</div></a>
      <div class="brand tag mono">STUDIO &amp; SHOWROOM</div>
    </div>
    <div class="nav">
      <div class="nav-label mono">WORKSPACE</div>
      <nav class="nav-items" id="navItems"></nav>
    </div>
    <div class="profile-wrap">
      <div class="profile">
        <div class="avatar-circle serif" id="profileInitials">··</div>
        <div style="min-width:0; display:flex; flex-direction:column; gap:2px">
          <span class="name" id="profileName">—</span>
          <span class="role mono" id="profileRole">—</span>
        </div>
      </div>
      <button class="logout-btn mono" id="logoutBtn">SIGN OUT</button>
    </div>
  </aside>

  <main class="main">
    <div class="stage">
      <div class="eyebrow mono"><span class="dot"></span>CURATED ARCHIVES</div>
      <h1 class="page-h1 serif">Design Ideas &amp; Collections</h1>
      <p class="page-sub" id="catalogSub">Loading the surface archive…</p>

      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A0968A" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.6-3.6"></path></svg>
        <input id="searchInput" type="text" placeholder="Search companies, collections, products or SKU">
      </div>

      <nav class="breadcrumb mono" id="browseBreadcrumb"></nav>
      <div id="browseSection"></div>

      <h2 class="section-title serif">Curated Collections</h2>
      <p class="section-sub">A quick preview — browse the full hierarchy above.</p>
      <div id="collectionsSection"></div>

      <h2 class="section-title serif">Surface Archive</h2>
      <p class="section-sub" id="archiveSub">All surfaces currently in the catalog.</p>
      <div class="filter-row" id="archiveFilterRow">
        <select class="filter-select mono" id="archiveBrandFilter"><option value="">All companies</option></select>
        <select class="filter-select mono" id="archiveFinishFilter"><option value="">All finishes</option></select>
        <select class="filter-select mono" id="archiveSizeFilter"><option value="">All sizes</option></select>
      </div>
      <div id="surfaceSection"></div>
      <div class="load-more-row" id="loadMoreRow" style="display:none">
        <button class="btn-secondary mono" id="loadMoreBtn">LOAD MORE</button>
      </div>
    </div>
  </main>
</div>

<script src="assets/api-client.js"></script>
<script>
(function () {
  'use strict';

  const NAV_ITEMS = [
    { id: 'moodboard', label: 'Mood Board', href: 'mood-board.html', ready: true },
    { id: 'generations', label: 'Recent Generations', href: 'recent-generations.html', ready: true },
    { id: 'projects', label: 'Projects', href: 'projects.html', ready: true },
    { id: 'catalog', label: 'Catalog', href: 'catalog.html', ready: true },
    { id: 'library', label: "De\u2019vyora Library", href: 'devyora-library.html', ready: true },
    { id: 'samples', label: 'Sample Placement', href: 'sample-placement.html', ready: true },
    { id: 'clients', label: 'Client Wishlists', href: 'client-wishlists.html', ready: true, owner: true },
  ];

  function notReady() {
    alert('This section of the new design is still being rebuilt — coming soon.');
  }


  /* THE CLIENT REGISTER IS THE STUDIO'S OWN BOOK -- owner and admin
     only, the same gate the server puts on it. Hidden from everyone
     else rather than shown and then refused. */
  function navItemAllowed(item) {
    if (!item.owner) return true;
    const user = (window.CasaApi && CasaApi.getCachedUser) ? CasaApi.getCachedUser() : null;
    const role = String((user && user.role) || '').toUpperCase();
    return role === 'OWNER' || role === 'ADMIN';
  }

  function renderNav() {
    const nav = document.getElementById('navItems');
    nav.innerHTML = '';
    NAV_ITEMS.filter(navItemAllowed).forEach((item) => {
      const btn = document.createElement('button');
      btn.className = 'nav-item' + (item.id === 'catalog' ? ' active' : '');
      btn.innerHTML = '<span class="lbl">' + item.label + '</span>' + (item.ready ? '' : '<span class="badge mono">SOON</span>');
      btn.addEventListener('click', () => {
        if (item.href) location.href = item.href;
        else notReady();
      });
      nav.appendChild(btn);
    });
  }

  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s == null ? '' : s;
    return div.innerHTML;
  }

  // ============================================================
  // STATE
  // ============================================================

  const state = {
    query: '',
    collections: [],
    collectionsLoading: true,
    collectionsError: null,
    surfaces: [],
    surfacesLoading: true,
    surfacesError: null,
    page: 1,
    meta: null,
    archiveBrandId: '',
    archiveFinish: '',
    archiveSize: '',
  };

  // Company -> Collection -> Product browsing (Stage 2 hierarchy).
  const browse = {
    level: 'companies', // companies | collections | products | product
    companyId: null,
    companyName: '',
    collectionId: null,
    collectionName: '',
    items: [],
    loading: true,
    error: null,
    productDetail: null,
    productDetailLoading: false,
    productDetailError: null,
    selectedFinish: null,
    selectedSize: null,
  };

  let searchDebounce = null;

  // ============================================================
  // COLLECTIONS
  // ============================================================

  async function loadCollections() {
    state.collectionsLoading = true;
    state.collectionsError = null;
    renderCollections();
    try {
      const result = await CasaApi.dashboard.collections({ limit: 24 });
      state.collections = result.collections || [];
      document.getElementById('catalogSub').textContent =
        state.collections.length
          ? 'Explore ' + state.collections.length + ' curated collection' + (state.collections.length === 1 ? '' : 's') + ' from the live archive.'
          : 'Every surface currently in the catalog, grouped and searchable.';
    } catch (err) {
      state.collectionsError = (err && err.message) || 'Could not load collections.';
    } finally {
      state.collectionsLoading = false;
      renderCollections();
    }
  }

  function filteredCollections() {
    const q = state.query.trim().toLowerCase();
    if (!q) return state.collections;
    return state.collections.filter((c) => c.name.toLowerCase().includes(q));
  }

  function renderCollections() {
    const host = document.getElementById('collectionsSection');

    if (state.collectionsLoading) {
      host.innerHTML = '<div class="skeleton-grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>';
      return;
    }

    if (state.collectionsError) {
      host.innerHTML = '<div class="empty-state" style="margin-top:24px"><p class="empty-desc" style="color:#A8552A">' + escapeHtml(state.collectionsError) + '</p></div>';
      return;
    }

    const list = filteredCollections();

    if (state.collections.length === 0) {
      host.innerHTML =
        '<div class="empty-state" style="margin-top:24px">' +
        '<div class="empty-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8A6A3B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5M3 14l9 5 9-5"></path></svg></div>' +
        '<h3 class="empty-title serif">No curated collections yet</h3>' +
        '<p class="empty-desc">Tag tiles with a collection name in the catalog extractor to populate this.</p>' +
        '</div>';
      return;
    }

    if (list.length === 0) {
      host.innerHTML =
        '<div class="empty-state" style="margin-top:24px">' +
        '<div class="empty-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8A6A3B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.6-3.6"></path></svg></div>' +
        '<h3 class="empty-title serif">Nothing in the archive matches</h3>' +
        '<p class="empty-desc">Clear the search to browse all curated palettes and the full surface archive.</p>' +
        '<button class="btn-primary mono" id="clearSearchBtn">CLEAR SEARCH</button>' +
        '</div>';
      document.getElementById('clearSearchBtn').addEventListener('click', clearSearch);
      return;
    }

    host.innerHTML = '<div class="collections-grid" id="collectionsGrid"></div>';
    const grid = document.getElementById('collectionsGrid');
    list.forEach((c) => {
      const card = document.createElement('article');
      card.className = 'coll-card';
      const img = c.imageUrl ? '<img src="' + c.imageUrl + '" alt="' + escapeHtml(c.name) + '">' : '';
      card.innerHTML =
        '<div class="coll-img">' + img + '<span class="coll-tag mono">' + escapeHtml(c.name) + '</span></div>' +
        '<div class="coll-body">' +
        '<h3 class="serif">' + escapeHtml(c.name) + '</h3>' +
        '<div class="coll-foot"><span class="coll-count mono">' + c.tileCount + ' SURFACE' + (c.tileCount === 1 ? '' : 'S') + '</span><button class="use-palette-btn mono" data-use-palette>USE PALETTE →</button></div>' +
        '</div>';
      card.querySelector('[data-use-palette]').addEventListener('click', () => { location.href = 'mood-board.html'; });
      grid.appendChild(card);
    });
  }

  // ============================================================
  // COMPANY -> COLLECTION -> PRODUCT BROWSING
  // ============================================================

  function renderBreadcrumb() {
    const nav = document.getElementById('browseBreadcrumb');
    const parts = [];
    parts.push(browse.level === 'companies'
      ? '<span class="current">Companies</span>'
      : '<button data-crumb="companies">Companies</button>');
    if (browse.companyId) {
      parts.push('<span class="sep">/</span>');
      parts.push(browse.level === 'collections'
        ? '<span class="current">' + escapeHtml(browse.companyName) + '</span>'
        : '<button data-crumb="collections">' + escapeHtml(browse.companyName) + '</button>');
    }
    if (browse.collectionId) {
      parts.push('<span class="sep">/</span>');
      parts.push(browse.level === 'products'
        ? '<span class="current">' + escapeHtml(browse.collectionName) + '</span>'
        : '<button data-crumb="products">' + escapeHtml(browse.collectionName) + '</button>');
    }
    if (browse.level === 'product' && browse.productDetail) {
      parts.push('<span class="sep">/</span>');
      parts.push('<span class="current">' + escapeHtml(browse.productDetail.name) + '</span>');
    }
    nav.innerHTML = parts.join('');
    nav.querySelectorAll('[data-crumb]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const target = btn.getAttribute('data-crumb');
        if (target === 'companies') goToCompanies();
        else if (target === 'collections') goToCollections(browse.companyId, browse.companyName);
        else if (target === 'products') goToProducts(browse.collectionId, browse.collectionName);
      });
    });
  }

  function goToCompanies() {
    browse.level = 'companies';
    browse.companyId = null; browse.companyName = '';
    browse.collectionId = null; browse.collectionName = '';
    loadBrowseLevel();
  }

  function goToCollections(companyId, companyName) {
    browse.level = 'collections';
    browse.companyId = companyId; browse.companyName = companyName;
    browse.collectionId = null; browse.collectionName = '';
    loadBrowseLevel();
  }

  function goToProducts(collectionId, collectionName) {
    browse.level = 'products';
    browse.collectionId = collectionId; browse.collectionName = collectionName;
    loadBrowseLevel();
  }

  function goToProduct(productId) {
    browse.level = 'product';
    browse.selectedFinish = null;
    browse.selectedSize = null;
    loadProductDetail(productId);
  }

  async function loadBrowseLevel() {
    browse.loading = true;
    browse.error = null;
    renderBreadcrumb();
    renderBrowseSection();
    try {
      if (browse.level === 'companies') {
        browse.items = await CasaApi.companies.list({});
      } else if (browse.level === 'collections') {
        const result = await CasaApi.collections.list({ brandId: browse.companyId, limit: 100 });
        browse.items = result.collections;
      } else if (browse.level === 'products') {
        const result = await CasaApi.products.list({ collectionId: browse.collectionId, limit: 100 });
        browse.items = result.products;
      }
    } catch (err) {
      browse.error = (err && err.message) || 'Could not load the catalog.';
    } finally {
      browse.loading = false;
      renderBreadcrumb();
      renderBrowseSection();
    }
  }

  async function loadProductDetail(productId) {
    browse.productDetailLoading = true;
    browse.productDetailError = null;
    browse.productDetail = null;
    renderBreadcrumb();
    renderBrowseSection();
    try {
      browse.productDetail = await CasaApi.products.get(productId);
      // Default to the first finish so the panel never opens empty.
      if (browse.productDetail.finishes.length) browse.selectedFinish = browse.productDetail.finishes[0];
    } catch (err) {
      browse.productDetailError = (err && err.message) || 'Could not load this product.';
    } finally {
      browse.productDetailLoading = false;
      renderBreadcrumb();
      renderBrowseSection();
    }
  }

  function browseSearchFiltered(items, nameOf) {
    const q = state.query.trim().toLowerCase();
    if (!q) return items;
    return items.filter((item) => nameOf(item).toLowerCase().includes(q));
  }

  function renderBrowseSection() {
    const host = document.getElementById('browseSection');

    if (browse.level === 'product') {
      renderProductDetail(host);
      return;
    }

    if (browse.loading) {
      host.innerHTML = '<div class="skeleton-grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>';
      return;
    }
    if (browse.error) {
      host.innerHTML = '<div class="empty-state" style="margin-top:20px"><p class="empty-desc" style="color:#A8552A">' + escapeHtml(browse.error) + '</p></div>';
      return;
    }

    if (browse.level === 'companies') {
      const list = browseSearchFiltered(browse.items, (c) => c.name);
      if (list.length === 0) {
        host.innerHTML = '<div class="empty-state" style="margin-top:20px"><h3 class="empty-title serif">No companies yet</h3><p class="empty-desc">Companies appear here once added to the catalog.</p></div>';
        return;
      }
      host.innerHTML = '<div class="collections-grid" id="companyGrid"></div>';
      const grid = document.getElementById('companyGrid');
      list.forEach((c) => {
        const card = document.createElement('button');
        card.className = 'company-card';
        const logo = c.logoUrl
          ? '<img class="company-logo" src="' + c.logoUrl + '" alt="">'
          : '<span class="company-logo placeholder serif">' + escapeHtml((c.name || '?').charAt(0)) + '</span>';
        card.innerHTML = logo +
          '<span><span class="company-name serif">' + escapeHtml(c.name) + '</span>' +
          '<span class="company-meta mono">' + (c.code ? escapeHtml(c.code) : 'COMPANY') + '</span></span>';
        card.addEventListener('click', () => goToCollections(c.id, c.name));
        grid.appendChild(card);
      });
      return;
    }

    if (browse.level === 'collections') {
      const list = browseSearchFiltered(browse.items, (c) => c.name);
      if (list.length === 0) {
        host.innerHTML = '<div class="empty-state" style="margin-top:20px"><h3 class="empty-title serif">No collections yet</h3><p class="empty-desc">' + escapeHtml(browse.companyName) + ' has no collections in the catalog yet.</p></div>';
        return;
      }
      host.innerHTML = '<div class="collections-grid" id="collectionGrid"></div>';
      const grid = document.getElementById('collectionGrid');
      list.forEach((c) => {
        const card = document.createElement('article');
        card.className = 'coll-card';
        card.style.cursor = 'pointer';
        const img = c.coverImageUrl ? '<img src="' + c.coverImageUrl + '" alt="' + escapeHtml(c.name) + '">' : '';
        const productCount = (c._count && c._count.products) || 0;
        card.innerHTML =
          '<div class="coll-img">' + img + '<span class="coll-tag mono">' + escapeHtml(browse.companyName) + '</span></div>' +
          '<div class="coll-body"><h3 class="serif">' + escapeHtml(c.name) + '</h3>' +
          '<div class="coll-foot"><span class="coll-count mono">' + productCount + ' PRODUCT' + (productCount === 1 ? '' : 'S') + '</span></div></div>';
        card.addEventListener('click', () => goToProducts(c.id, c.name));
        grid.appendChild(card);
      });
      return;
    }

    if (browse.level === 'products') {
      const list = browseSearchFiltered(browse.items, (p) => p.name);
      if (list.length === 0) {
        host.innerHTML = '<div class="empty-state" style="margin-top:20px"><h3 class="empty-title serif">No products yet</h3><p class="empty-desc">' + escapeHtml(browse.collectionName) + ' has no products in the catalog yet.</p></div>';
        return;
      }
      host.innerHTML = '<div class="collections-grid" id="productGrid"></div>';
      const grid = document.getElementById('productGrid');
      list.forEach((p) => {
        const card = document.createElement('button');
        card.className = 'prod-card';
        const img = p.coverImageUrl ? '<div class="prod-img"><img src="' + p.coverImageUrl + '" alt="' + escapeHtml(p.name) + '"></div>' : '';
        const variantCount = (p._count && p._count.tiles) || 0;
        card.innerHTML = img +
          '<div class="prod-body">' +
          '<span class="prod-company mono">' + escapeHtml(browse.companyName) + '</span>' +
          '<span class="prod-collection">' + escapeHtml(browse.collectionName) + '</span>' +
          '<span class="prod-name serif">' + escapeHtml(p.name) + '</span>' +
          '<span class="prod-variants mono">' + variantCount + ' VARIANT' + (variantCount === 1 ? '' : 'S') + '</span>' +
          '</div>';
        card.addEventListener('click', () => goToProduct(p.id));
        grid.appendChild(card);
      });
      return;
    }
  }

  function renderProductDetail(host) {
    if (browse.productDetailLoading) {
      host.innerHTML = '<div class="skeleton-grid"><div class="skeleton" style="height:280px"></div></div>';
      return;
    }
    if (browse.productDetailError) {
      host.innerHTML = '<div class="empty-state" style="margin-top:20px"><p class="empty-desc" style="color:#A8552A">' + escapeHtml(browse.productDetailError) + '</p></div>';
      return;
    }
    const p = browse.productDetail;
    if (!p) return;

    const brandName = (p.collection && p.collection.brand && p.collection.brand.name) || browse.companyName;
    const collectionName = (p.collection && p.collection.name) || browse.collectionName;

    // Finish selection filters the valid sizes for THAT finish; size
    // selection then resolves exactly one variant. Never both free at once
    // in a way that could point at a combination that doesn't exist.
    const validSizesForFinish = p.finishSizePairs.filter((pair) => pair.finish === browse.selectedFinish).map((pair) => pair.size);
    if (browse.selectedSize && !validSizesForFinish.includes(browse.selectedSize)) browse.selectedSize = null;
    const resolved = browse.selectedFinish && browse.selectedSize
      ? p.finishSizePairs.find((pair) => pair.finish === browse.selectedFinish && pair.size === browse.selectedSize)
      : null;
    const resolvedTile = resolved ? p.tiles.find((t) => t.id === resolved.tileId) : null;

    const img = (resolvedTile && resolvedTile.imageUrl) || p.coverImageUrl;

    // Standardized product information sequence: Image, Brand, Collection,
    // Product Name, SKU, Specifications, Finish/Variant, Selling Price.
    // SKU and price are shown only once a finish+size resolves one real
    // variant -- a Product spans several SKUs/prices, so showing one
    // before resolution would be a guess, not a fact.
    const specLines = [];
    if (resolvedTile && resolvedTile.size) specLines.push('Size: ' + escapeHtml(resolvedTile.size));
    if (resolvedTile && resolvedTile.material) specLines.push('Material: ' + escapeHtml(resolvedTile.material));
    if (resolvedTile && resolvedTile.thickness) specLines.push('Thickness: ' + escapeHtml(resolvedTile.thickness));
    if (p.specifications) specLines.push(escapeHtml(p.specifications));
    if (p.category) specLines.push('Category: ' + escapeHtml(p.category));

    host.innerHTML =
      '<div class="detail-panel">' +
      '<div class="detail-img" style="height:260px">' + (img ? '<img src="' + img + '" alt="' + escapeHtml(p.name) + '">' : '') + '</div>' +
      '<span class="detail-eyebrow mono" style="margin-top:16px; display:block">' + escapeHtml(brandName) + '</span>' +
      '<div class="detail-collection">' + escapeHtml(collectionName) + '</div>' +
      '<h2 class="detail-name serif">' + escapeHtml(p.name) + '</h2>' +
      '<div id="variantResolvedSlot"></div>' +
      (p.description ? '<p class="page-sub" style="margin-top:10px">' + escapeHtml(p.description) + '</p>' : '') +
      (specLines.length ? '<div class="spec-block"><strong>Specifications</strong><br>' + specLines.join('<br>') + '</div>' : '') +
      (p.finishes.length ? '<div class="option-group" style="margin-top:16px"><div class="option-label mono">FINISH</div><div class="option-chip-row" id="finishChips"></div></div>' : '') +
      (p.finishes.length ? '<div class="option-group" style="margin-top:14px"><div class="option-label mono">SIZE</div><div class="option-chip-row" id="sizeChips"></div></div>' : '') +
      ((p.collection && p.collection.catalogueDocumentUrl)
        ? '<div class="spec-block"><a href="' + p.collection.catalogueDocumentUrl + '" target="_blank" rel="noopener">View catalogue PDF →</a></div>'
        : '') +
      '</div>';

    if (p.finishes.length) {
      const finishHost = document.getElementById('finishChips');
      p.finishes.forEach((f) => {
        const chip = document.createElement('button');
        chip.className = 'option-chip mono' + (browse.selectedFinish === f ? ' active' : '');
        chip.textContent = f;
        chip.addEventListener('click', () => { browse.selectedFinish = f; browse.selectedSize = null; renderBrowseSection(); });
        finishHost.appendChild(chip);
      });

      const sizeHost = document.getElementById('sizeChips');
      const allSizes = [...new Set(p.finishSizePairs.map((pair) => pair.size))];
      allSizes.forEach((s) => {
        const valid = validSizesForFinish.includes(s);
        const chip = document.createElement('button');
        chip.className = 'option-chip mono' + (browse.selectedSize === s ? ' active' : '');
        chip.textContent = s;
        chip.disabled = !valid;
        if (valid) chip.addEventListener('click', () => { browse.selectedSize = s; renderBrowseSection(); });
        sizeHost.appendChild(chip);
      });
    }

    const slot = document.getElementById('variantResolvedSlot');
    if (slot) {
      if (resolvedTile) {
        // SKU, then price (where set -- never a fabricated placeholder
        // when it is not), then stock status.
        const priceLine = resolvedTile.sellingPrice
          ? '₹' + resolvedTile.sellingPrice + (resolvedTile.unitOfMeasure ? '/' + resolvedTile.unitOfMeasure.toLowerCase() : '')
          : null;
        slot.innerHTML =
          '<div class="variant-resolved mono">SKU ' + escapeHtml(resolvedTile.productCode || resolvedTile.id) + '</div>' +
          (priceLine ? '<div class="variant-resolved mono">' + escapeHtml(priceLine) + '</div>' : '') +
          '<div class="variant-resolved mono">' + (resolvedTile.inStock ? 'IN STOCK' : 'OUT OF STOCK') + '</div>';
      } else {
        slot.innerHTML = browse.selectedFinish ? '<div class="variant-resolved mono">Select a size to resolve the exact variant.</div>' : '';
      }
    }
  }

  // ============================================================
  // SURFACE ARCHIVE
  // ============================================================

  async function loadSurfaces(reset) {
    if (reset) {
      state.page = 1;
      state.surfaces = [];
    }
    state.surfacesLoading = true;
    state.surfacesError = null;
    renderSurfaces();

    try {
      const result = await CasaApi.tiles.list({
        page: state.page,
        limit: 24,
        search: state.query || undefined,
        brandId: state.archiveBrandId || undefined,
        finish: state.archiveFinish || undefined,
        size: state.archiveSize || undefined,
      });
      state.surfaces = reset ? result.tiles : state.surfaces.concat(result.tiles);
      state.meta = result.meta;
      recordFinishOptions(result.tiles);
      document.getElementById('archiveSub').textContent =
        state.meta && typeof state.meta.total === 'number'
          ? state.meta.total + ' surface' + (state.meta.total === 1 ? '' : 's') + ' currently in the catalog.'
          : 'All surfaces currently in the catalog.';
    } catch (err) {
      state.surfacesError = (err && err.message) || 'Could not load the surface archive.';
    } finally {
      state.surfacesLoading = false;
      renderSurfaces();
    }
  }

  function renderSurfaces() {
    const host = document.getElementById('surfaceSection');
    const loadMoreRow = document.getElementById('loadMoreRow');

    if (state.surfacesLoading && state.surfaces.length === 0) {
      host.innerHTML = '<div class="skeleton-grid"><div class="skeleton" style="height:74px"></div><div class="skeleton" style="height:74px"></div><div class="skeleton" style="height:74px"></div><div class="skeleton" style="height:74px"></div></div>';
      loadMoreRow.style.display = 'none';
      return;
    }

    if (state.surfacesError) {
      host.innerHTML = '<div class="empty-state" style="margin-top:18px"><p class="empty-desc" style="color:#A8552A">' + escapeHtml(state.surfacesError) + '</p></div>';
      loadMoreRow.style.display = 'none';
      return;
    }

    if (state.surfaces.length === 0) {
      host.innerHTML =
        '<div class="empty-state" style="margin-top:18px">' +
        '<h3 class="empty-title serif">No surfaces found</h3>' +
        '<p class="empty-desc">' + (state.query ? 'Nothing matches "' + escapeHtml(state.query) + '".' : 'No tiles have been extracted into the catalog yet.') + '</p>' +
        '</div>';
      loadMoreRow.style.display = 'none';
      return;
    }

    host.innerHTML = '<div class="surface-grid" id="surfaceGrid"></div>';
    const grid = document.getElementById('surfaceGrid');
    state.surfaces.forEach((s) => {
      const card = document.createElement('article');
      card.className = 'surface-card';
      const img = s.imageUrl ? '<img src="' + s.imageUrl + '" alt="' + escapeHtml(s.name) + '">' : '<span style="width:44px;height:44px;flex:0 0 auto;border-radius:11px;background:var(--sand)"></span>';
      // Standardized sequence (image already first, being the card's
      // thumbnail): Brand, Collection, Product Name, SKU, Specifications,
      // Finish, Selling Price. Falls back to the free-text collection
      // label and the tile's own name for tiles not yet linked to the
      // Company/Collection/Product hierarchy -- never invented.
      const brandName = s.brand ? s.brand.name : null;
      const collectionName = (s.productId && s.product && s.product.collection) ? s.product.collection.name : (s.collection || null);
      const productName = (s.productId && s.product) ? s.product.name : s.name;
      const metaLine = [brandName, collectionName].filter(Boolean).join(' · ');
      const specParts = [s.size, s.material, s.thickness].filter(Boolean).join(' · ');
      const skuSpecLine = [s.productCode, specParts, s.finish].filter(Boolean).join(' · ');
      const priceLine = s.sellingPrice ? ('₹' + s.sellingPrice + (s.unitOfMeasure ? '/' + s.unitOfMeasure.toLowerCase() : '')) : null;
      card.innerHTML =
        img +
        '<span style="min-width:0">' +
        (metaLine ? '<span class="ss mono">' + escapeHtml(metaLine) + '</span>' : '') +
        '<span class="sn">' + escapeHtml(productName) + '</span>' +
        (skuSpecLine ? '<span class="ss mono">' + escapeHtml(skuSpecLine) + '</span>' : '') +
        '<span class="ss mono">' + (priceLine ? escapeHtml(priceLine) + ' · ' : '') + '<span class="stock-dot ' + (s.inStock ? 'yes' : 'no') + '"></span>' + (s.inStock ? 'IN STOCK' : 'OUT OF STOCK') + '</span>' +
        '</span>';
      grid.appendChild(card);
    });

    const hasMore = !!(state.meta && state.meta.hasNextPage);
    loadMoreRow.style.display = hasMore ? 'flex' : 'none';
    document.getElementById('loadMoreBtn').disabled = state.surfacesLoading;
  }

  function clearSearch() {
    state.query = '';
    document.getElementById('searchInput').value = '';
    renderCollections();
    renderBrowseSection();
    loadSurfaces(true);
  }

  // Finish has no dedicated list endpoint today; its filter options are
  // built progressively from whatever has actually been loaded, rather
  // than inventing a fixed list.
  const knownFinishes = new Set();
  function recordFinishOptions(tiles) {
    let added = false;
    (tiles || []).forEach((t) => { if (t.finish && !knownFinishes.has(t.finish)) { knownFinishes.add(t.finish); added = true; } });
    if (!added) return;
    const select = document.getElementById('archiveFinishFilter');
    const current = select.value;
    select.innerHTML = '<option value="">All finishes</option>' +
      [...knownFinishes].sort().map((f) => '<option value="' + escapeHtml(f) + '">' + escapeHtml(f) + '</option>').join('');
    select.value = current;
  }

  // ============================================================
  // INIT
  // ============================================================

  async function init() {
    const user = await CasaApi.requireAuth();

    document.getElementById('profileInitials').textContent = CasaApi.initials(user.name);
    document.getElementById('profileName').textContent = user.name || user.email;
    document.getElementById('profileRole').textContent = (user.role || '').toUpperCase();

    renderNav();
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await CasaApi.auth.logout();
      location.href = 'login.html';
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      state.query = e.target.value;
      renderCollections();
      renderBrowseSection();
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => loadSurfaces(true), 300);
    });

    document.getElementById('loadMoreBtn').addEventListener('click', () => {
      state.page += 1;
      loadSurfaces(false);
    });

    document.getElementById('archiveBrandFilter').addEventListener('change', (e) => {
      state.archiveBrandId = e.target.value;
      loadSurfaces(true);
    });
    document.getElementById('archiveFinishFilter').addEventListener('change', (e) => {
      state.archiveFinish = e.target.value;
      loadSurfaces(true);
    });
    document.getElementById('archiveSizeFilter').addEventListener('change', (e) => {
      state.archiveSize = e.target.value;
      loadSurfaces(true);
    });

    try {
      const companiesForFilter = await CasaApi.companies.list({});
      const brandSelect = document.getElementById('archiveBrandFilter');
      brandSelect.innerHTML = '<option value="">All companies</option>' +
        companiesForFilter.map((c) => '<option value="' + c.id + '">' + escapeHtml(c.name) + '</option>').join('');
    } catch { /* filter stays "All companies" if this fails */ }

    try {
      const sizes = await CasaApi.tiles.sizes();
      const sizeSelect = document.getElementById('archiveSizeFilter');
      sizeSelect.innerHTML = '<option value="">All sizes</option>' +
        (sizes || []).map((s) => '<option value="' + escapeHtml(s.size || s) + '">' + escapeHtml(s.size || s) + '</option>').join('');
    } catch { /* filter stays "All sizes" if this fails */ }

    await Promise.all([loadCollections(), loadSurfaces(true), loadBrowseLevel()]);
  }

  init();
})();
</script>
<script src="assets/sidebar.js" defer></script>
