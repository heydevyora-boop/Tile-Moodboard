    const note = state.viewOnly ? 'FETCHING SAVED PROJECT' : 'CALLING GEMINI · MATCHING AGAINST LIVE INVENTORY';
    main.innerHTML =
      '<div class="stage">' +
      '<div class="generating-box">' +
      '<div class="spinner-ring"><div class="spinner-core">✦</div></div>' +
      '<div class="gen-label mono">● STUDIO &amp; SHOWROOM ●</div>' +
      '<div class="gen-title serif">DE’VYORA</div>' +
      '<div class="gen-sub serif">' + sub + '</div>' +
      '<div class="gen-note mono">' + note + '</div>' +
      '</div>' +
      '</div>';
  }

  // ============================================================
  // ERROR
  // ============================================================

  function renderError() {
    const main = document.getElementById('mainContent');
    const title = state.viewOnly ? 'Could not load this project' : 'Could not generate this mood board';
    const code = state.viewOnly ? 'PROJECT LOAD FAILED' : 'RENDER PIPELINE INTERRUPTED';
    const secondaryLabel = state.viewOnly ? '← BACK TO PROJECTS' : '◇ EDIT DESIGN DNA';
    main.innerHTML =
      '<div class="stage">' +
      '<div class="error-box">' +
      '<div class="error-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#A8552A" stroke-width="1.7" stroke-linecap="round"><path d="M12 8v5M12 16.5v.5M10.3 4 3.4 17a1.6 1.6 0 0 0 1.4 2.4h14.4A1.6 1.6 0 0 0 20.6 17L13.7 4a1.6 1.6 0 0 0-2.8 0z"></path></svg></div>' +
      '<div class="error-code mono">' + code + '</div>' +
      '<h2 class="error-title serif">' + title + '</h2>' +
      '<p class="error-msg">' + escapeHtml(state.errorMessage || 'Unknown error.') + '</p>' +
      '<div class="error-actions">' +
      '<button class="btn-primary mono" id="retryBtn">↻ RETRY</button>' +
      '<button class="btn-secondary mono" id="editBtn">' + secondaryLabel + '</button>' +
      '</div>' +
      '</div>' +
      '</div>';
    document.getElementById('retryBtn').addEventListener('click', () => {
      if (state.viewOnly && state.pendingBoardId) loadBoardFromId(state.pendingBoardId);
      else runGenerate();
    });
    document.getElementById('editBtn').addEventListener('click', () => {
      if (state.viewOnly) { location.href = 'projects.html'; return; }
      state.stage = 'wizard'; state.step = 1; render();
    });
  }

  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  // ============================================================
  // RESULTS
  // ============================================================

  function renderResults() {
    const main = document.getElementById('mainContent');
    const specLine = state.viewOnly
      ? state.room + ' · ' + state.theme + (state.loadedBoard && state.loadedBoard.clientBrief ? ' — ' + state.loadedBoard.clientBrief : '')
      : state.room + ' · ' + state.theme + ' · ' + budgetText() + ' · ' + sizeText() + ' · ' + featureText() + ' · ' + state.view;

    const iterateBoxHtml = state.viewOnly
      ? '<div class="iterate-box"><h3 class="serif" style="margin:0; font-size:clamp(20px,2vw,26px)">Saved project</h3><p style="margin:8px 0 0; font-size:14px; color:var(--text2); line-height:1.55">Viewing a previously saved mood board.</p><div class="iterate-actions"><button class="btn-dashed mono" id="backToProjectsBtn">← BACK TO PROJECTS</button></div></div>'
      : '<div class="iterate-box"><h3 class="serif" style="margin:0; font-size:clamp(20px,2vw,26px)">Iterate the design</h3><p style="margin:8px 0 0; font-size:14px; color:var(--text2); line-height:1.55">Keeps the same room, feature and budget while generating a fresh set.</p><div class="iterate-actions"><button class="btn-amber mono" id="regenBtn">↻ TRY ' + boardCount() + ' MORE VARIATIONS</button></div></div>';

    main.innerHTML =
      '<div class="stage">' +
      '<div style="display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:wrap">' +
      '<div class="mono" style="font-size:10px; letter-spacing:.18em; color:var(--muted)">' + (state.viewOnly ? 'SAVED MOOD BOARD' : 'MOOD BOARD RESULT') + '</div>' +
      '</div>' +
      '<h1 class="step-h1 serif">' + state.combinations.length + ' Curated Mood Board' + (state.combinations.length === 1 ? '' : 's') + '</h1>' +
      '<p class="step-sub">' + escapeHtml(specLine) + '</p>' +
      (state.warnings.length ? '<p class="step-sub" style="color:var(--err)">' + state.warnings.length + ' note(s) from generation — see console for detail.</p>' : '') +
      '<div class="results-tags"><span class="results-tag mono">◈ ' + state.combinations.length + ' CONCEPT' + (state.combinations.length === 1 ? '' : 'S') + ' READY</span></div>' +
      '<div class="boards-grid" id="boardsGrid"></div>' +
      iterateBoxHtml +
      '</div>';

    if (state.warnings.length) console.warn('Mood board generation warnings:', state.warnings);

    const grid = document.getElementById('boardsGrid');
    state.combinations.forEach((combo, i) => {
      const card = document.createElement('article');
      card.className = 'board-card';
      const thumbTiles = combo.tiles.map((t) => state.tilesById[t.tileId]).filter((t) => t && t.imageUrl).slice(0, 4);
      card.innerHTML =
        '<div class="board-strip mono"><span>PART 0' + (i + 1) + '</span><span style="opacity:.75">' + escapeHtml(combo.rooms_suitable.join(', ')) + '</span></div>' +
        '<div class="board-body">' +
        '<div class="board-name-row"><h3 class="serif">' + escapeHtml(combo.board_name) + '</h3></div>' +
        '<p class="board-desc">' + escapeHtml(combo.reason_for_selection || 'No description provided.') + '</p>' +
        (thumbTiles.length ? '<div class="board-thumbs">' + thumbTiles.map((t) => '<span class="board-thumb"><img src="' + CasaApi.resolveBackendImageUrl(t.imageUrl) + '" alt=""></span>').join('') + '</div>' : '') +
        // The scene is what the client is choosing between, so it comes
        // before the specification rather than under it. Below the tile
        // list it opened off the bottom of the card and had to be
        // scrolled to, which is the one thing a picture cannot survive.
        '<div class="viz-section" id="vizSection-' + i + '">' + visualizationSectionHtml(i) + '</div>' +
        // The card's own secondary button style, the same one PRODUCTS
        // USED wears at the bottom.
        '<button class="btn-view-products mono" data-mood-board="' + i + '">◇ VIEW MOOD BOARD ↗</button>' +
        // SPECIFIED TILES used to be listed here as well. PRODUCTS USED
        // opens the same three products in the same card, in more
        // detail, so the card said everything twice and the scene --
        // the thing being chosen between -- had a spec sheet under it.
        // The grout line stays: it is the one spec PRODUCTS USED does
        // not carry.
        (combo.grout_recommendation ? '<div class="mono" style="font-size:10px;color:var(--muted)">GROUT: ' + escapeHtml(combo.grout_recommendation) + '</div>' : '') +
        '<div class="products-section" id="productsSection-' + i + '">' + productsSectionHtml(combo, i) + '</div>' +
        '</div>';
      grid.appendChild(card);
    });

    state.combinations.forEach((_, i) => { wireVizSection(i); wireProductsSection(i); });

    grid.querySelectorAll('[data-mood-board]').forEach((btn) =>
      btn.addEventListener('click', () => openMoodBoard(parseInt(btn.dataset.moodBoard, 10))));

    // The swatch row is the tile itself at 44px. Opening it full size is
    // the only way to actually see the surface being proposed.
    grid.querySelectorAll('.board-thumb').forEach((thumb) => thumb.addEventListener('click', () => {
      const img = thumb.querySelector('img');
      if (img) openSceneLightbox(img.src, { tile: true });
    }));

    if (state.viewOnly) {
      document.getElementById('backToProjectsBtn').addEventListener('click', () => { location.href = 'projects.html'; });
    } else {
      document.getElementById('regenBtn').addEventListener('click', runGenerate);
    }
  }

  // ============================================================
  // PRODUCTS USED — expands inside the card
  //
  // This used to be a link to a separate detail page whose whole job was
  // to list these same three products one size larger. The client is
  // comparing two boards; sending them to a page that shows one of them
  // is the wrong direction, so the list opens where it is referred to.
  // ============================================================

  function productRowHtml(tileRef) {
    const detail = state.tilesById[tileRef.tileId];
    const role = '<span class="ps mono">' + escapeHtml(String(tileRef.role || '').toUpperCase()) + '</span>';

    if (!detail) {
      return '<div class="product-row">' +
        '<span style="width:50px;height:50px;flex:0 0 auto;border-radius:12px;background:var(--sand)"></span>' +
        '<span style="flex:1;min-width:0"><span class="pn">' + escapeHtml(tileRef.name || 'Tile no longer available') + '</span>' + role + '</span>' +
        '</div>';
    }

    const img = detail.imageUrl
      ? '<img src="' + CasaApi.resolveBackendImageUrl(detail.imageUrl) + '" alt="' + escapeHtml(detail.name) + '">'
      : '<span style="width:50px;height:50px;flex:0 0 auto;border-radius:12px;background:var(--sand)"></span>';
    // The role is what the card promised -- BASE, HIGHLIGHT, ACCENT --
    // so it leads, and the brand/size/finish follows it. Without it the
    // three rows are just three product names in no stated order.
    const spec = [String(tileRef.role || '').toUpperCase(), detail.brand ? detail.brand.name : null, detail.size, detail.finish].filter(Boolean).join(' · ');

    return '<div class="product-row">' + img +
      '<span style="flex:1;min-width:0"><span class="pn">' + escapeHtml(detail.name) + '</span><span class="ps mono">' + escapeHtml(spec) + '</span></span>' +
      '<span style="flex:0 0 auto; text-align:right"><span class="stock-badge mono ' + (detail.inStock ? 'stock-yes' : 'stock-no') + '">' + (detail.inStock ? 'IN STOCK' : 'OUT OF STOCK') + '</span></span>' +
      '</div>';
  }

  function productsSectionHtml(combo, index) {
    const open = state.expandedProducts[index] === true;
    const count = combo.tiles.length;

    return '<button class="btn-view-products mono" data-view-products="' + index + '" aria-expanded="' + open + '">' +
      (open ? 'HIDE PRODUCTS USED (' + count + ') ↑' : 'VIEW PRODUCTS USED (' + count + ') ↓') +
      '</button>' +
      (open ? '<div class="products-list">' + combo.tiles.map(productRowHtml).join('') + '</div>' : '');
  }

  function wireProductsSection(index) {
    const host = document.getElementById('productsSection-' + index);
    if (!host) return;

    const btn = host.querySelector('[data-view-products]');
    if (!btn) return;

    btn.addEventListener('click', () => {
      state.expandedProducts[index] = !(state.expandedProducts[index] === true);
      // Repaint this card only, for the same reason renderVizSection
      // does: a full render() rebuilds both cards and sends the page back
      // to the top, so the list the user just opened would scroll away
      // from them.
      host.innerHTML = productsSectionHtml(state.combinations[index], index);
      wireProductsSection(index);
    });
  }

  // ============================================================
  // MOOD BOARD PANEL
  //
  // The concept as a presentation sheet, in the shape the printed
  // Fusion panels use: the rendered scene across the top, then every
  // specified tile at its own proportion with its name and size set
  // underneath it. Nothing here is new data -- it is the combination's
  // own tiles and the scene the card already generated.
  // ============================================================

  // "600x1200", "600X1200X5MM" and "310x310mm" all mean the same pair
  // of numbers. Anything that does not carry two of them is left alone
  // rather than guessed at.
  function parseTileSize(size) {
    const numbers = String(size || '').match(/\d+(?:\.\d+)?/g);
    if (!numbers || numbers.length < 2) return null;
    const w = parseFloat(numbers[0]);
    const h = parseFloat(numbers[1]);
    if (!(w > 0) || !(h > 0)) return null;
    return { w: w, h: h };
  }

  function formatTileSize(size) {
    const parsed = parseTileSize(size);
    if (parsed) return parsed.w + ' × ' + parsed.h + ' mm';
    return String(size || '').trim();
  }

  // A slab runs across two columns; everything else keeps one.
  function isLargeFormat(parsed) {
    return !!parsed && Math.max(parsed.w, parsed.h) >= 1000;
  }

  /**
   * The aspect ratio the thumbnail is drawn at.
   *
   * The caption carries the real size, so this is free to be a crop:
   * a 43x243 listello drawn true to proportion would be six times
   * taller than it is wide and would wreck the row it sits in. A wide
   * cell is laid out landscape, a single cell is clamped near square,
   * and the image is cover-fitted into whichever it gets.
   */
  function tileCellRatio(parsed, wide) {
    if (!parsed) return 1;
    if (wide) return Math.min(Math.max(parsed.w, parsed.h) / Math.min(parsed.w, parsed.h), 2.6);
    return Math.min(Math.max(parsed.w / parsed.h, 0.55), 1.6);
  }

  function moodBoardTileHtml(tileRef) {
    const detail = state.tilesById[tileRef.tileId];
    const name = (detail && detail.name) || tileRef.name || 'Tile unavailable';
    const size = detail ? detail.size : null;
    const parsed = parseTileSize(size);
    const wide = isLargeFormat(parsed);
    const sizeText = formatTileSize(size);

    // TODO(backend): detail.imageUrl is the catalog thumbnail the Tile
    // row already carries, which is all this panel has to work with. If
    // a print-resolution asset is added later it belongs on the same
    // object -- read it here as `detail.highResUrl || detail.imageUrl`
    // and nothing else on this page has to change. getTilesByIds in
    // moodBoard.service.ts is the one select that would widen.
    const shot = detail && detail.imageUrl
      ? '<img src="' + CasaApi.resolveBackendImageUrl(detail.imageUrl) + '" alt="' + escapeHtml(name) + '">'
      : '<span class="mb-shot-empty mono">' + escapeHtml((detail && detail.productCode) || name) + '</span>';

    return '<figure class="mb-tile' + (wide ? ' is-large' : '') + '">' +
      '<div class="mb-shot" style="aspect-ratio:' + tileCellRatio(parsed, wide).toFixed(3) + '">' +
      shot +
      '<span class="mb-role mono">' + escapeHtml(String(tileRef.role || '').toUpperCase()) + '</span>' +
      '</div>' +
      '<figcaption class="mb-cap">' +
      '<span class="mb-name">' + escapeHtml(name) + '</span>' +
      (sizeText ? '<span class="mb-size mono">' + escapeHtml(sizeText) + '</span>' : '') +
      '</figcaption>' +
      '</figure>';
  }

  /**
   * How many products sit side by side on the board. Mirrors
   * tileColumns() in moodBoardPdf.service.ts exactly -- the preview has
   * to be the shape the PDF comes out at, so the rule lives in one form
   * on each side and nowhere else.
   */
  function boardColumns(size, tileCount) {
    if (tileCount <= 1) return 1;
    return Math.max(1, Math.min(tileCount, Math.round((size.w / size.h) * 2)));
  }

  /**
   * The board at true proportions: the generated scene on top, the
   * products it was built from below. aspect-ratio does the work, so
   * nothing inside is stretched -- every image is object-fit:contain.
   */
  function moodBoardPreviewHtml(index) {
    const combo = state.combinations[index];
    if (!combo) return '';

    const size = state.boardSize;
    const viz = vizStateFor(index);
    const cols = boardColumns(size, combo.tiles.length);

    const scene = viz.status === 'success' && viz.imageUrl
      ? '<img src="' + viz.imageUrl + '" alt="' + sceneAlt() + '">'
      : '<p>The generated ' + sceneNounPlain() + ' sits here. Render it above and it appears on the board and in the PDF.</p>';

    const tiles = combo.tiles.map((tileRef) => {
      const detail = state.tilesById[tileRef.tileId];
      const name = (detail && detail.name) || tileRef.name || 'Tile unavailable';
      const sizeText = formatTileSize(detail && detail.size);
      const shot = detail && detail.imageUrl
        ? '<img src="' + CasaApi.resolveBackendImageUrl(detail.imageUrl) + '" alt="">'
        : '';
      return '<div class="mb-board-tile">' +
        '<div class="mb-board-shot">' + shot + '</div>' +
        '<div class="mb-board-cap"><b>' + escapeHtml(String(tileRef.role || '').toUpperCase()) + '</b>' +
        escapeHtml(name) + (sizeText ? ' \u00B7 ' + escapeHtml(sizeText) : '') + '</div>' +
        '</div>';
    }).join('');

    return '<div class="mb-board" id="moodBoardPreview" style="aspect-ratio:' + size.w + '/' + size.h + '">' +
      '<div class="mb-board-head mono"><span>' + escapeHtml(combo.board_name) + '</span><span>' + boardSizeLabel(size) + '</span></div>' +
      '<div class="mb-board-scene">' + scene + '</div>' +
      '<div class="mb-board-tiles" style="grid-template-columns:repeat(' + cols + ',minmax(0,1fr))">' + tiles + '</div>' +
      '</div>';
  }

  function moodBoardSizesHtml() {
    return '<div class="mb-sizes">' + BOARD_SIZES.map((size) =>
      '<button class="mb-size-chip mono' + (boardSizeKey(size) === boardSizeKey(state.boardSize) ? ' selected' : '') +
      '" data-board-size="' + boardSizeKey(size) + '">' + boardSizeLabel(size) + '</button>').join('') + '</div>';
  }

  function moodBoardExportHtml() {
    return '<div class="mb-export-row">' +
      '<button class="btn-amber mono" id="moodBoardExport"' + (state.exporting ? ' disabled' : '') + '>' +
      (state.exporting ? 'BUILDING PDF\u2026' : '\u21E9 EXPORT PDF') + '</button>' +
      '<span class="mb-export-note mono">' + boardSizeLabel(state.boardSize).toUpperCase() + ' PAGE</span>' +
      (state.exportError ? '<span class="mb-export-error mono">' + escapeHtml(state.exportError) + '</span>' : '') +
      '</div>';
  }

  function moodBoardSceneHtml(index) {
    const v = vizStateFor(index);

    if (v.status === 'success' && v.imageUrl) {
      return '<div class="mb-scene"><img src="' + v.imageUrl + '" alt="' + sceneAlt() + '"></div>';
    }
    if (v.status === 'loading') {
      return '<div class="mb-scene-empty">' +
        '<p>Rendering the scene for this combination. It stays on this panel when it is done.</p>' +
        '<button class="btn-amber mono" data-generate-scene="' + index + '" disabled>GENERATING ' + sceneNounCaps() + '…</button>' +
        '</div>';
    }
    if (v.status === 'error') {
      return '<div class="mb-scene-empty">' +
        '<div class="viz-error mono">COULD NOT GENERATE: ' + escapeHtml(v.error || 'Unknown error') + '</div>' +
        '<button class="btn-dashed mono" data-generate-scene="' + index + '">↻ TRY AGAIN</button>' +
        '</div>';
    }
    return '<div class="mb-scene-empty">' +
      '<p>No scene has been rendered for this combination yet.</p>' +
      '<button class="btn-amber mono" data-generate-scene="' + index + '">GENERATE ' + sceneNounCaps() + ' →</button>' +
      '</div>';
  }

  // Repaints only the scene half of an open panel. Called by
  // renderVizSection, so the card and the panel can never disagree
  // about what has been generated.
  function renderMoodBoardScene(index) {
    if (state.moodBoardIndex !== index) return;
    const host = document.getElementById('moodBoardScene');
    if (!host) return;
    host.innerHTML = moodBoardSceneHtml(index);
    wireMoodBoardScene(index);
    // The board carries the same scene, so it repaints with it.
    renderMoodBoardBoard(index);
  }

  /**
   * Repaints the size row, the preview and the export button. Changing
   * the size only redraws these -- it never touches the scene or the
   * chosen products, so no image is regenerated and no combination
   * changes.
   */
  function renderMoodBoardBoard(index) {
    if (state.moodBoardIndex !== index) return;
    const sizes = document.getElementById('moodBoardSizes');
    const preview = document.getElementById('moodBoardPreviewHost');
    const exportHost = document.getElementById('moodBoardExportHost');
    if (!sizes || !preview || !exportHost) return;

    sizes.innerHTML = moodBoardSizesHtml();
    preview.innerHTML = moodBoardPreviewHtml(index);
    exportHost.innerHTML = moodBoardExportHtml();
    wireMoodBoardBoard(index);
  }

  function wireMoodBoardBoard(index) {
    document.querySelectorAll('[data-board-size]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const picked = BOARD_SIZES.find((size) => boardSizeKey(size) === btn.dataset.boardSize);
        if (!picked) return;
        state.boardSize = picked;
        state.exportError = '';
        renderMoodBoardBoard(index);
      });
    });

    const exportBtn = document.getElementById('moodBoardExport');
    if (exportBtn) exportBtn.addEventListener('click', () => exportMoodBoardPdf(index));
  }

  /**
   * Builds the PDF on the server, where the catalog's images can be
   * fetched without the browser's cross-origin rules tainting a canvas,
   * and at the exact page size in points.
   *
   * state.exporting gates the button, so a second click while one
   * export is in flight cannot start another.
   */
  async function exportMoodBoardPdf(index) {
    if (state.exporting) return;

    const combo = state.combinations[index];
    if (!combo) return;

    state.exporting = true;
    state.exportError = '';
    renderMoodBoardBoard(index);

    try {
      const viz = vizStateFor(index);
      const payload = {
        boardName: combo.board_name || 'Mood board',
        widthFt: state.boardSize.w,
        heightFt: state.boardSize.h,
        tiles: combo.tiles.map((tileRef) => {
          const detail = state.tilesById[tileRef.tileId] || {};
          const tile = { role: String(tileRef.role || ''), name: detail.name || tileRef.name || 'Tile' };
          if (detail.brandName) tile.brandName = detail.brandName;
          if (detail.size) tile.size = detail.size;
          if (detail.colorTone) tile.colorTone = detail.colorTone;
          const image = absoluteUrl(CasaApi.resolveBackendImageUrl(detail.imageUrl));
          if (image) tile.imageUrl = image;
          return tile;
        }),
      };
      if (combo.reason_for_selection) payload.brief = combo.reason_for_selection.slice(0, 600);
      if (combo.grout_recommendation) payload.grout = combo.grout_recommendation;
      /*
       * The generated scene almost never has an address the server could
       * fetch. Node and Python run as separate functions with no shared
       * disk, so Python embeds the image it just wrote as a data: URL and
       * that is what arrives here -- meaningful only inside this tab.
       * Posting it as a URL therefore drew the renderer's "no bathroom
       * scene" placeholder over a scene that had in fact been generated.
       *
       * So the bytes go up themselves, and the renderer embeds them. A
       * fetchable address, which is what Drive gives when it is
       * connected, still travels as a URL.
       */
      const sceneSource = viz.status === 'success' ? String(viz.imageUrl || '') : '';
      if (/^data:image\//i.test(sceneSource)) {
        if (sceneSource.length <= MAX_INLINE_SCENE_CHARS) payload.sceneImage = sceneSource;
      } else {
        const scene = absoluteUrl(sceneSource);
        if (scene) payload.sceneImageUrl = scene;
      }

      const blob = await CasaApi.moodBoards.exportPdf(payload);
      downloadBlob(blob, slugify(payload.boardName) + '-' + state.boardSize.w + 'x' + state.boardSize.h + 'ft.pdf');
    } catch (err) {
      state.exportError = (err && err.message) || 'Could not build the PDF.';
    } finally {
      state.exporting = false;
      renderMoodBoardBoard(index);
    }
  }

  /**
   * An address the SERVER can fetch.
   *
   * A page-relative path is no use to it, so this absolutises against
   * the current page. Anything that is not http(s) after that -- a
   * data: or blob: image, which only means something inside this tab --
   * is dropped rather than posted, and the renderer draws its labelled
   * swatch instead.
   */
  function absoluteUrl(url) {
    if (!url) return '';
    try {
      const resolved = new URL(url, location.href).href;
      return /^https?:/i.test(resolved) ? resolved : '';
    } catch (err) {
      return '';
    }
  }

  function slugify(value) {
    return String(value).replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase() || 'mood-board';
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    // Revoked on the next tick so the click has taken the URL first.
    setTimeout(() => URL.revokeObjectURL(url), 0);
  }

  function wireMoodBoardScene(index) {
    const host = document.getElementById('moodBoardScene');
    if (!host) return;
    const btn = host.querySelector('[data-generate-scene]');
    // The same call the card's own button makes, on the same state.
    if (btn) btn.addEventListener('click', () => generateBathroomScene(index));
  }

  function closeMoodBoard() {
    state.moodBoardIndex = null;
    const overlay = document.querySelector('.mb-overlay');
    if (overlay) overlay.remove();
    document.removeEventListener('keydown', moodBoardKeydown);
  }

  function moodBoardKeydown(event) {
    if (event.key !== 'Escape') return;
    // A tile opened from inside the panel sits above it, and Escape
    // should close that first rather than both at once.
    if (document.querySelector('.viz-lightbox')) return;
    closeMoodBoard();
  }

  function openMoodBoard(index) {
    const combo = state.combinations[index];
    if (!combo) return;
    closeMoodBoard();
    state.moodBoardIndex = index;

    const overlay = document.createElement('div');
    overlay.className = 'mb-overlay';
    overlay.innerHTML =
      '<section class="mb-panel" role="dialog" aria-modal="true" aria-label="Mood board">' +
      '<header class="mb-head">' +
      '<div>' +
      '<div class="mb-eyebrow mono">PART 0' + (index + 1) + ' · MOOD BOARD</div>' +
      '<h2 class="mb-title serif">' + escapeHtml(combo.board_name) + '</h2>' +
      '<p class="mb-sub">' + escapeHtml(combo.reason_for_selection || 'No description provided.') + '</p>' +
      '</div>' +
      '<button class="mb-close" id="moodBoardClose" aria-label="Close">×</button>' +
      '</header>' +
      '<div class="mb-body">' +
      '<div class="mb-lbl mono">' + sceneNounCaps() + '</div>' +
      '<div id="moodBoardScene">' + moodBoardSceneHtml(index) + '</div>' +
      '<div class="mb-lbl mono">SPECIFIED TILES (' + combo.tiles.length + ')</div>' +
      '<div class="mb-grid">' + combo.tiles.map(moodBoardTileHtml).join('') + '</div>' +
      '<div class="mb-lbl mono">MOOD BOARD SIZE</div>' +
      '<div id="moodBoardSizes">' + moodBoardSizesHtml() + '</div>' +
      '<div id="moodBoardPreviewHost">' + moodBoardPreviewHtml(index) + '</div>' +
      '<div id="moodBoardExportHost">' + moodBoardExportHtml() + '</div>' +
      (combo.grout_recommendation ? '<div class="mb-grout mono">GROUT: ' + escapeHtml(combo.grout_recommendation) + '</div>' : '') +
      '</div>' +
      '</section>';

    // Clicking the backdrop closes; clicking inside the panel does not.
    overlay.addEventListener('click', (event) => { if (event.target === overlay) closeMoodBoard(); });
    document.addEventListener('keydown', moodBoardKeydown);
    document.getElementById('modalHost').appendChild(overlay);

    document.getElementById('moodBoardClose').addEventListener('click', closeMoodBoard);
    wireMoodBoardScene(index);
    wireMoodBoardBoard(index);

    // Each plate opens its own tile full size. A plate showing only a
    // product code has no image to open, so it stays inert rather than
    // offering a zoom cursor that does nothing.
    overlay.querySelectorAll('.mb-shot').forEach((shot) => {
      const img = shot.querySelector('img');
      if (!img) return;
      shot.classList.add('is-zoomable');
      shot.addEventListener('click', () => openSceneLightbox(img.src, { tile: true }));
    });
  }

  // ============================================================
  // SCENE LIGHTBOX
  // ============================================================

  function openSceneLightbox(src, options) {
    if (!src || document.querySelector('.viz-lightbox')) return;

    const overlay = document.createElement('div');
    overlay.className = 'viz-lightbox' + (options && options.tile ? ' is-tile' : '');
    overlay.innerHTML =
      '<button class="viz-lightbox-close mono" aria-label="Close">×</button>' +
      '<img src="' + src + '" alt="' + sceneAlt() + '">';

    function close() {
      overlay.remove();
      document.removeEventListener('keydown', onKey);
    }
    function onKey(event) {
      if (event.key === 'Escape') close();
    }

    overlay.addEventListener('click', close);
    document.addEventListener('keydown', onKey);
    document.body.appendChild(overlay);
  }

  // ============================================================
  // THE SCENE VISUALIZATION — reuses the existing
  // POST /ai/visualizations pipeline (CasaApi.ai.generateImageUrl),
  // scoped to the BASE tile of ONE combination. No new backend, no new
  // API-client method.
  //
  // It lives on the combination's own card. It used to be reachable only
  // by opening that combination's detail page AND having saved the board
  // first, which put two clicks and a commitment between the client and
  // the one picture that tells them which board they want.
  // ============================================================

  /*
   * What the render is called on screen.
   *
   * It was "bathroom scene" everywhere, so a kitchen board offered to
   * generate a bathroom. The generator itself was never wrong -- it is
   * sent requirements.room, the client's real room -- only the wording
   * around it was.
   */
  function sceneNoun() { return (state.room || 'Room') + ' scene'; }
  function sceneNounCaps() { return escapeHtml(sceneNoun().toUpperCase()); }
  function sceneNounPlain() { return escapeHtml(sceneNoun().toLowerCase()); }
  function sceneAlt() { return escapeHtml('Generated ' + sceneNoun().toLowerCase()); }

  const IDLE_VISUALIZATION = { status: 'idle', imageUrl: null, error: null };

  function vizStateFor(index) {
    return state.visualizations[index] || IDLE_VISUALIZATION;
  }

  function visualizationSectionHtml(index) {
    const v = vizStateFor(index);
    const label = '<div class="mono" style="font-size:9.5px; letter-spacing:.18em; color:var(--muted)">' + sceneNounCaps() + ' VISUALIZATION</div>';
    // Two cards are on screen at once, so the button is found by a data
    // attribute scoped to this card -- an id would be duplicated and
    // getElementById would wire only the first one.
    const button = (cls, text, extra) => '<button class="' + cls + ' mono" data-generate-scene="' + index + '"' + (extra || '') + '>' + text + '</button>';

    if (v.status === 'loading') {
      return label + button('btn-amber', 'GENERATING ' + sceneNounCaps() + '…', ' disabled');
    }
    if (v.status === 'error') {
      return label +
        '<div class="viz-error mono">COULD NOT GENERATE: ' + escapeHtml(v.error || 'Unknown error') + '</div>' +
        button('btn-dashed', '↻ TRY AGAIN');
    }
    if (v.status === 'success' && v.imageUrl) {
      return label +
        '<div class="viz-image-frame"><img src="' + v.imageUrl + '" alt="' + sceneAlt() + '"></div>' +
        button('btn-dashed', '↻ GENERATE AGAIN');
    }
    return label + button('btn-amber', 'GENERATE ' + sceneNounCaps() + ' →');
  }

  function wireVizSection(index) {
    const host = document.getElementById('vizSection-' + index);
    if (!host) return;

    const btn = host.querySelector('[data-generate-scene]');
    if (btn) btn.addEventListener('click', () => generateBathroomScene(index));

    // The finished scene opens full size on click -- inside a card it is
    // rendered at half the page width, which is not enough to judge a
    // tile by.
    const frame = host.querySelector('.viz-image-frame');
    if (frame) {
      frame.addEventListener('click', () => {
        const img = frame.querySelector('img');
        if (img) openSceneLightbox(img.src);
      });
    }
  }

  /**
   * Repaints one card's scene block instead of calling render().
   *
   * A full re-render rebuilds both cards and sends the page back to the
   * top, so the image the client just asked for would appear off-screen,
   * and the other card's finished scene would flash away and back. The
   * state above is the record; this only repaints what changed. Returns
   * silently when the host is gone -- the request may land after the
   * user has opened a detail page or started a new generation, and
   * state.visualizations keeps the result either way.
   */
  function renderVizSection(index) {
    const host = document.getElementById('vizSection-' + index);
    if (host) {
      host.innerHTML = visualizationSectionHtml(index);
      wireVizSection(index);
    }
    // The mood board panel shows the same scene, so it follows the same
    // state. No-ops unless the panel is open on this combination.
    renderMoodBoardScene(index);
  }

  async function generateBathroomScene(index) {
    if (vizStateFor(index).status === 'loading') return;

    const combo = state.combinations[index];
    if (!combo) return;

    // The combination's foundational tile -- every combination is
    // guaranteed a 'base' tile server-side (promptBuilder.service.ts
    // VALID_ROLES / the "must include a base tile" check), so this is
    // the real, already-selected product to visualize, not a guess.
    const baseTile = combo.tiles.find((t) => t.role === 'base');
    if (!baseTile) {
      state.visualizations[index] = { status: 'error', imageUrl: null, error: 'This combination has no base tile to visualize.' };
      renderVizSection(index);
      return;
    }

    // ...and EVERY other material the board selected with it. This line
    // is where the highlight and the accent used to be lost: only
    // baseTile was sent, so the generator could only ever draw one
    // material and the board's other two choices had no effect on the
    // image at all. The base stays first so it is IMAGE 2 / the primary
    // surface downstream.
    //
    // Ids only -- the backend resolves each to that tile's current
    // image, so a re-extracted tile is picked up without this page
    // having to know anything about it.
    const materials = [
      baseTile,
      ...combo.tiles.filter((t) => t !== baseTile),
    ].map((t) => ({ role: t.role, tile_id: t.tileId }));

    // The client's choices, so the scene is built from them rather than a
    // generic "luxury bathroom". A reopened board only has its room and
    // theme saved -- every other wizard field would be its default, not
    // the client's pick -- so those are sent only for a board built here.
    const requirements = {
      room: state.room,
      style: state.theme,
      combination_name: combo.board_name,
    };
    if (!state.viewOnly) {
      Object.assign(requirements, {
        feature: featureText(),
        // An explicit flag, not an empty string: the generator has to be
        // able to tell "pick one" apart from "the client said nothing".
        // The size itself is omitted so no default can stand in for it.
        ...(state.sizeMode === 'auto'
          ? { size_auto: true }
          : { size: sizeText() }),
        finish: state.finish,
        grout: state.grout,
        view: state.view,
      });
    }

    state.visualizations[index] = { status: 'loading', imageUrl: null, error: null };
    renderVizSection(index);

    try {
      const imageUrl = await CasaApi.ai.generateImageUrl({
        product_id: baseTile.tileId,
        // No surface picker exists in this UI; WALL matches the default
        // the previous Scene & Angles tool used for the same backend call.
        surface: 'WALL',
        materials,
        requirements,
      });
      state.visualizations[index] = { status: 'success', imageUrl, error: null };
    } catch (err) {
      state.visualizations[index] = { status: 'error', imageUrl: null, error: (err && err.message) || ('Something went wrong generating the ' + sceneNoun().toLowerCase() + '.') };
    }
    renderVizSection(index);
  }

  // ============================================================
  // INIT
  // ============================================================

  async function init() {
    const user = await CasaApi.requireAuth();

    document.getElementById('profileInitials').textContent = CasaApi.initials(user.name);
    document.getElementById('profileName').textContent = user.name || user.email;
    document.getElementById('profileRole').textContent = (user.role || '').toUpperCase();

    renderNav();
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await CasaApi.auth.logout();
      location.href = 'login.html';
    });

    const boardId = new URLSearchParams(location.search).get('boardId');
    if (boardId) {
      loadBoardFromId(boardId);
    } else {
      render();
    }
  }

  init();
})();
</script>
</body>
</html>
