<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mood Board Generator · De’vyora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1A1512; --paper:#F7F3EC; --card:#fff; --line:#E7DFD1; --sand:#F4EEE3; --gold:#8A6A3B; --gold-light:#E3C58E; --muted:#8B8177; --text2:#5B5147; --err:#A8552A; --err-bg:#F6E6DC; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:'DM Sans',sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:var(--gold); text-decoration:none; }
  .mono { font-family:'JetBrains Mono',monospace; }
  .serif { font-family:'Playfair Display',serif; }
  button { font-family:inherit; }
  img { max-width:100%; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:#DED3C0; border-radius:8px; border:3px solid var(--paper); }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  @keyframes rise { from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none} }
  @keyframes spin { to{transform:rotate(360deg)} }
  @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }

  /* ---- shell (same as dashboard.html) ---- */
  .layout { display:flex; height:100vh; overflow:hidden; }
  .sidebar { flex:0 0 auto; width:266px; height:100%; display:flex; flex-direction:column; background:#FCFAF6; border-right:1px solid var(--line); overflow-y:auto; }
  .brand { padding:26px 22px 20px; border-bottom:1px solid #EFE7DA; }
  .brand .name { font-size:19px; letter-spacing:.14em; line-height:1.1; }
  .brand-row { display:flex; align-items:center; gap:10px; }
  .brand-mark { flex:0 0 auto; width:30px; height:30px; border-radius:7px; display:block; }
  /* The name div carries BOTH .brand and .name, so .brand's own
     22px padding was landing on it a second time and pushing the
     wordmark 22px clear of the mark, and .brand's border-bottom was
     drawing a second rule under it. Inside the row it is a wordmark,
     not a block: it shrink-wraps, carries neither, and the only space
     between the two is the gap above. */
  .brand-row .name { padding:0; border-bottom:none; flex:0 0 auto; }
  .brand .tag { font-size:9px; letter-spacing:.22em; color:var(--muted); margin-top:6px; }
  .nav { padding:20px 14px 8px; }
  .nav-label { font-size:9.5px; letter-spacing:.2em; color:#A0968A; padding:0 8px 10px; }
  .nav-items { display:flex; flex-direction:column; gap:3px; }
  .nav-item { display:flex; align-items:center; gap:12px; width:100%; min-height:48px; padding:0 12px; border:none; border-radius:12px; cursor:pointer; font-size:14px; text-align:left; background:transparent; color:#4A4038; }
  .nav-item.active { background:var(--ink); color:#FBF6EC; font-weight:500; }
  .nav-item:not(.active):hover { background:#F1EADD; }
  .nav-item .lbl { flex:1; }
  .nav-item .badge { font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.08em; padding:3px 7px; border-radius:100px; background:#F1EADD; color:var(--muted); }
  .nav-item.active .badge { background:rgba(227,197,142,.2); color:var(--gold-light); }
  .profile-wrap { margin-top:auto; padding:18px 16px; }
  .profile { display:flex; align-items:center; gap:11px; padding:12px; background:var(--sand); border:1px solid var(--line); border-radius:14px; }
  .avatar-circle { width:36px; height:36px; flex:0 0 auto; border-radius:50%; background:linear-gradient(150deg,#C09A5E,var(--gold)); display:grid; place-items:center; font-size:13px; color:#FFF8EC; }
  .profile .name { font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .profile .role { font-size:9px; letter-spacing:.14em; color:var(--muted); }
  .logout-btn { margin-top:10px; width:100%; padding:8px; background:transparent; border:1px solid var(--line); border-radius:10px; cursor:pointer; font-size:10px; letter-spacing:.1em; color:var(--muted); }
  .logout-btn:hover { color:var(--ink); border-color:#C7B393; }

  .main { flex:1; min-width:0; overflow-y:auto; padding:clamp(22px,3vw,44px); }
  .stage { animation:fadeIn .35s ease both; max-width:1040px; }

  /* ---- wizard ---- */
  .step-head { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .eyebrow { display:flex; align-items:center; gap:9px; font-size:10px; letter-spacing:.18em; color:var(--gold); }
  .dot { width:6px; height:6px; border-radius:50%; background:var(--gold); flex:0 0 auto; }
  .pct { font-size:10px; letter-spacing:.14em; color:var(--muted); }
  .progress-track { height:5px; border-radius:100px; background:var(--line); margin-top:12px; overflow:hidden; }
  .progress-fill { height:100%; background:linear-gradient(90deg,var(--gold),var(--gold-light)); transition:width .3s ease; }
  .step-tabs { display:flex; gap:8px; margin-top:14px; overflow-x:auto; padding-bottom:6px; }
  .step-tab { flex:0 0 auto; white-space:nowrap; padding:9px 14px; border-radius:100px; cursor:pointer; font-size:9.5px; letter-spacing:.1em; border:1px solid transparent; background:var(--sand); color:#A0968A; }
  .step-tab.done { background:#EFE7DA; color:#6E5228; }
  .step-tab.current { background:var(--ink); color:#FBF6EC; }

  .step-title-row { display:flex; align-items:center; gap:14px; margin-top:clamp(22px,2.6vw,34px); }
  .step-title-row .lbl { font-size:9.5px; letter-spacing:.2em; color:var(--muted); white-space:nowrap; }
  .step-title-row .rule { flex:1; height:1px; background:var(--line); }
  h1.step-h1 { font-weight:600; font-size:clamp(28px,3.8vw,44px); line-height:1.08; margin:14px 0 0; }
  .step-sub { max-width:660px; margin:12px 0 0; font-size:clamp(14px,1.1vw,16px); line-height:1.55; color:var(--text2); }

  .grid-rooms { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(255px,100%),1fr)); gap:clamp(12px,1.4vw,18px); margin-top:clamp(18px,2vw,26px); }
  .room-card { display:flex; flex-direction:column; text-align:left; padding:0; overflow:hidden; background:var(--card); border-radius:18px; cursor:pointer; border:1px solid var(--line); }
  .room-card.selected { border-color:var(--ink); }
  .room-img { position:relative; height:150px; overflow:hidden; background:var(--sand); }
  .room-img img { width:100%; height:100%; object-fit:cover; display:block; }
  .room-badge { position:absolute; left:12px; bottom:12px; font-size:9px; letter-spacing:.12em; background:rgba(26,21,18,.75); color:#FBF6EC; padding:5px 8px; border-radius:6px; }
  .room-check { position:absolute; top:12px; right:12px; width:28px; height:28px; border-radius:50%; background:var(--ink); color:#FBF6EC; display:grid; place-items:center; font-size:13px; }
  .room-body { display:flex; flex-direction:column; gap:6px; padding:16px 18px 18px; }
  .room-body .rn { font-size:20px; line-height:1.15; }
  .room-body .rd { font-size:13px; line-height:1.5; color:var(--text2); }

  .option-row { display:flex; align-items:flex-start; gap:14px; padding:16px; background:var(--card); border-radius:14px; cursor:pointer; border:1px solid var(--line); text-align:left; width:100%; }
  .option-row.selected { border-color:var(--ink); }
  .option-dot { width:18px; height:18px; flex:0 0 auto; margin-top:2px; border-radius:50%; border:1px solid #C7BCAA; }
  .option-row.selected .option-dot { border-color:var(--ink); background:var(--ink); box-shadow:inset 0 0 0 3px #FBF6EC; }
  .option-row .ol { display:block; font-size:10.5px; letter-spacing:.14em; }
  .option-row .od { display:block; font-size:13px; color:var(--text2); margin-top:6px; line-height:1.5; }
  .walls { display:flex; flex-direction:column; gap:10px; margin-left:32px; }
  .walls-toggle { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:48px; padding:0 16px; background:var(--card); border:1px solid var(--line); border-radius:13px; cursor:pointer; font-size:10.5px; letter-spacing:.12em; color:#4A4038; text-align:left; }
  .walls-toggle:hover { background:#F1EADD; }
  .walls-toggle .caret { flex:0 0 auto; color:var(--muted); }
  /* Columns, not one long stack: a catalog with a dozen sizes has to be
     readable without scrolling the step. auto-fill keeps one column on a
     phone and as many as fit on a desktop. */
  .walls-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:1px; background:var(--card); border:1px solid var(--line); border-radius:13px; overflow:hidden; }
  /* The hairlines are drawn by each cell rather than by the gaps
     showing a darker background through, so the tail of the last row
     -- which has no cells -- reads as empty card instead of a block. */
  .wall-row { display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--card); box-shadow:0 0 0 1px var(--line); cursor:pointer; text-align:left; border:none; width:100%; font-size:12.5px; color:var(--ink); }
  .wall-row:hover { background:#F7F2E8; }
  .wall-box { width:17px; height:17px; flex:0 0 auto; border:1px solid #C7BCAA; border-radius:5px; }
  .wall-row.checked .wall-box { border-color:var(--ink); background:var(--ink); box-shadow:inset 0 0 0 3px #FBF6EC; }

  .chip { display:flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:0 16px; border-radius:12px; cursor:pointer; font-size:10px; letter-spacing:.12em; background:var(--card); color:#3A322A; border:1px solid var(--line); }
  .chip.selected { background:var(--ink); color:#FBF6EC; border-color:var(--ink); }
  .chip-row { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .section-lbl { font-size:9.5px; letter-spacing:.16em; color:var(--muted); margin-top:26px; }

  .finish-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr)); gap:12px; margin-top:12px; }
  .finish-card { display:flex; gap:14px; align-items:center; padding:14px; background:var(--card); border-radius:14px; cursor:pointer; border:1px solid var(--line); text-align:left; }
  .finish-card.selected { border-color:var(--ink); }
  .finish-card img { width:56px; height:56px; border-radius:12px; object-fit:cover; flex:0 0 auto; }
  .finish-card .fl { display:block; font-size:14px; font-weight:500; }
  .finish-card .fs { display:block; font-size:9.5px; letter-spacing:.1em; color:var(--muted); margin-top:6px; }

  .budget-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr)); gap:clamp(12px,1.4vw,16px); margin-top:clamp(18px,2vw,26px); }
  .budget-card { display:flex; flex-direction:column; padding:18px; background:var(--card); border-radius:16px; cursor:pointer; border:1px solid var(--line); text-align:left; }
  .budget-card.selected { border-color:var(--ink); }
  .budget-top { display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; }
  .budget-tier { font-size:9.5px; letter-spacing:.16em; color:var(--gold); }
  .budget-check { width:22px; height:22px; border-radius:50%; background:var(--ink); color:#FBF6EC; display:grid; place-items:center; font-size:11px; }
  .budget-range { display:block; font-size:26px; margin-top:12px; }
  .budget-note { display:block; font-size:9.5px; letter-spacing:.12em; color:var(--muted); margin-top:6px; }
  .budget-desc { display:block; font-size:13.5px; color:var(--text2); margin-top:12px; line-height:1.55; }

  /* grid-auto-rows:1fr so every row is as tall as the tallest card --
     without it a theme whose spec line wraps makes its whole row 10px
     taller than the rest of the grid. */
  .palette-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr)); grid-auto-rows:1fr; gap:12px; margin-top:12px; }
  /* The hybrid theme card: a static 16:9 preview, the name, the
     materials the theme is built from, then its colours. Every card is
     the same height whatever its content, so the grid stays even. */
  .palette-card { display:flex; flex-direction:column; padding:0; overflow:hidden; background:var(--card); border-radius:14px; cursor:pointer; border:1px solid var(--line); text-align:left; }
  .palette-card.selected { border-color:var(--ink); box-shadow:0 0 0 1px var(--ink) inset; }
  /* 16:9, but capped: on a 230px card that ratio alone gives a 129px
     picture, which reads as the subject of the card rather than a
     preview of it. The cap keeps every card's picture identical in
     height whatever the column width. */
  .palette-art { display:block; width:100%; aspect-ratio:16/9; max-height:92px; object-fit:cover; background:var(--sand); border-bottom:1px solid var(--line); }
  .palette-body { display:flex; flex-direction:column; flex:1; gap:9px; padding:12px 14px 14px; }
  .palette-card .pl { display:block; font-size:14px; font-weight:500; }
  .palette-card .ps { display:block; font-size:9px; letter-spacing:.1em; color:var(--muted); margin-top:4px; }
  .material-row { display:flex; gap:5px; width:100%; }
  .material { flex:1; height:14px; border-radius:4px; border:1px solid rgba(26,21,18,.1); background-size:cover; }
  .swatch-row { display:flex; gap:5px; width:100%; margin-top:auto; }
  .swatch { flex:1; height:20px; border-radius:6px; border:1px solid rgba(26,21,18,.08); }

  .summary-card { background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden; }
  .summary-row { display:flex; gap:12px; align-items:baseline; background:#fff; padding:14px 18px; border-bottom:1px solid var(--line); }
  .summary-row:last-child { border-bottom:none; }
  .summary-row .k { width:106px; flex:0 0 auto; font-size:9px; letter-spacing:.14em; color:var(--muted); }
  .summary-row .v { flex:1; min-width:0; font-size:13.5px; color:#2E271F; }

  .view-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr)); gap:clamp(12px,1.4vw,16px); margin-top:clamp(18px,2vw,26px); }
  .view-card { padding:16px; background:var(--card); border-radius:16px; cursor:pointer; border:1px solid var(--line); text-align:left; }
  .view-card.selected { border-color:var(--ink); }
  .view-card .vl { display:block; font-size:10.5px; letter-spacing:.14em; }
  .view-card .vd { display:block; font-size:13px; color:var(--text2); margin-top:6px; line-height:1.5; }

  .step-actions { position:sticky; bottom:0; display:flex; gap:12px; flex-wrap:wrap; margin-top:22px; padding:16px 0 8px; background:linear-gradient(180deg,rgba(247,243,236,0),var(--paper) 34%); }
  .btn-back { min-height:56px; padding:0 22px; background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:14px; cursor:pointer; font-size:11px; letter-spacing:.16em; }
  .btn-back:hover { background:#F1EADD; }
  .btn-next { flex:1; min-width:240px; display:flex; align-items:center; gap:12px; min-height:56px; padding:0 22px; background:var(--ink); color:#FBF6EC; border:none; border-radius:14px; cursor:pointer; font-size:11.5px; letter-spacing:.16em; }
  .btn-next:hover:not(:disabled) { background:#33291F; }
  .btn-next:disabled { opacity:.5; cursor:not-allowed; }

  /* ---- generating ---- */
  .generating-box { background:var(--ink); border-radius:24px; padding:clamp(28px,4vw,44px); text-align:center; max-width:600px; margin:40px auto 0; }
  .spinner-ring { width:80px; height:80px; margin:0 auto; border-radius:50%; border:2px dashed #6B5A42; display:grid; place-items:center; animation:spin 8s linear infinite; }
  .spinner-core { width:52px; height:52px; border-radius:14px; background:#3A2F24; display:grid; place-items:center; font-size:22px; color:var(--gold-light); animation:pulse 2s ease-in-out infinite; }
  .gen-label { font-size:10px; letter-spacing:.24em; color:#B08F5C; margin-top:20px; }
  .gen-title { font-weight:700; font-size:clamp(24px,3.4vw,34px); letter-spacing:.04em; color:#FBF6EC; margin-top:10px; }
  .gen-sub { font-style:italic; font-size:clamp(15px,1.8vw,20px); color:var(--gold-light); margin-top:6px; }
  .gen-note { font-size:9.5px; letter-spacing:.14em; color:#8A7F70; margin-top:22px; line-height:1.8; }

  /* ---- error ---- */
  .error-box { background:#fff; border:1px solid #E1CFC0; border-radius:22px; padding:clamp(24px,3vw,38px); text-align:center; max-width:560px; margin:40px auto 0; }
  .error-icon { width:64px; height:64px; margin:0 auto; border-radius:50%; background:var(--err-bg); display:grid; place-items:center; }
  .error-code { font-size:10px; letter-spacing:.2em; color:var(--err); margin-top:20px; }
  .error-title { font-weight:600; font-size:clamp(22px,3vw,30px); margin:12px 0 0; line-height:1.15; }
  .error-msg { margin:12px 0 0; font-size:14px; line-height:1.6; color:var(--text2); }
  .error-actions { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr)); gap:10px; margin-top:20px; }
  .btn-primary { display:flex; align-items:center; justify-content:center; gap:10px; min-height:52px; padding:0 18px; background:var(--ink); color:#FBF6EC; border:none; border-radius:13px; cursor:pointer; font-size:11px; letter-spacing:.14em; }
  .btn-primary:hover { background:#33291F; }
  .btn-secondary { display:flex; align-items:center; justify-content:center; gap:10px; min-height:52px; padding:0 18px; background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:13px; cursor:pointer; font-size:11px; letter-spacing:.14em; }
  .btn-secondary:hover { background:#F1EADD; }

  /* ---- results ---- */
  .results-tags { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  .results-tag { display:flex; align-items:center; gap:9px; font-size:9.5px; letter-spacing:.14em; color:#6E5228; background:var(--sand); border:1px solid var(--line); padding:9px 13px; border-radius:10px; }
  .boards-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr)); gap:clamp(14px,1.6vw,20px); margin-top:clamp(20px,2.4vw,30px); }
  .board-card { background:var(--card); border:1px solid var(--line); border-radius:20px; overflow:hidden; display:flex; flex-direction:column; animation:rise .4s ease both; }
  .board-strip { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 16px; font-size:9px; letter-spacing:.12em; background:var(--sand); color:#6E5228; border-bottom:1px solid var(--line); }
  .board-body { padding:clamp(18px,1.8vw,24px); display:flex; flex-direction:column; gap:12px; flex:1; }
  .board-name-row { display:flex; align-items:baseline; justify-content:space-between; gap:14px; }
  .board-name-row h3 { font-weight:600; font-size:clamp(21px,2vw,26px); margin:0; line-height:1.15; }
  .board-desc { margin:0; font-size:14px; line-height:1.55; color:var(--text2); }
  .board-thumbs { display:flex; gap:6px; }
  .board-thumb { width:44px; height:44px; border-radius:8px; overflow:hidden; background:var(--sand); flex:0 0 auto; cursor:zoom-in; }
  .board-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .btn-view-products { display:flex; align-items:center; justify-content:center; gap:10px; min-height:48px; background:#fff; border:1px solid var(--line); border-radius:13px; cursor:pointer; font-size:10.5px; letter-spacing:.14em; color:#4A4038; }
  .btn-view-products:hover { background:#F1EADD; }

  .iterate-box { margin-top:clamp(20px,2.4vw,30px); background:var(--sand); border:1px solid var(--line); border-radius:20px; padding:clamp(20px,2.2vw,28px); }
  .iterate-actions { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr)); gap:10px; margin-top:18px; }
  .btn-amber { display:flex; align-items:center; justify-content:center; gap:10px; min-height:54px; padding:0 18px; background:var(--gold); color:#FFF8EC; border:none; border-radius:13px; cursor:pointer; font-size:11px; letter-spacing:.14em; }
  .btn-amber:hover { background:#6E5228; }
  .btn-dashed { display:flex; align-items:center; justify-content:center; gap:10px; min-height:54px; padding:0 18px; background:transparent; color:#4A4038; border:1px dashed #D8C9AE; border-radius:13px; cursor:pointer; font-size:11px; letter-spacing:.14em; }
  .btn-dashed:hover { background:#EFE7DA; }

  /* ---- products used, expanded inside the card ---- */
  .products-section { display:flex; flex-direction:column; gap:10px; }
  .products-list { display:flex; flex-direction:column; gap:10px; }
  .product-row { display:flex; gap:14px; align-items:center; padding:12px; background:#fff; border:1px solid var(--line); border-radius:14px; }
  .product-row img { width:50px; height:50px; flex:0 0 auto; border-radius:12px; object-fit:cover; background:var(--sand); }
  .product-row .pn { display:block; font-size:14px; font-weight:500; }
  .product-row .ps { display:block; font-size:9.5px; letter-spacing:.08em; color:var(--muted); margin-top:6px; }
  .stock-badge { font-size:8.5px; letter-spacing:.08em; }
  .stock-yes { color:#6E5228; }
  .stock-no { color:var(--err); }

  /* ---- bathroom scene visualization (same tokens as the rest of this page) ---- */
  .btn-amber:disabled { opacity:.55; cursor:not-allowed; }
  .viz-section { display:flex; flex-direction:column; gap:10px; }
  .viz-error { padding:14px 16px; background:var(--err-bg); border-radius:13px; font-size:12.5px; line-height:1.5; color:var(--err); }
  .viz-image-frame { border-radius:16px; overflow:hidden; background:var(--sand); border:1px solid var(--line); cursor:zoom-in; }
  .viz-image-frame img { width:100%; display:block; object-fit:cover; }
  .viz-lightbox { position:fixed; inset:0; background:rgba(26,21,18,.88); display:flex; align-items:center; justify-content:center; padding:clamp(16px,4vw,48px); z-index:100; cursor:zoom-out; animation:fadeIn .18s ease both; }
  .viz-lightbox img { max-width:100%; max-height:100%; display:block; border-radius:14px; box-shadow:0 24px 70px rgba(0,0,0,.45); }
  /* A tile is opened to be looked at, and a stored tile shot can be a few
     hundred pixels -- at its natural size it would come up barely larger
     than the swatch that was clicked. The scene keeps its own sizing: it
     is already wide, and holding it to this width would shrink it. */
  .viz-lightbox.is-tile img { width:min(640px,92vw); height:auto; max-height:92vh; }
  /* ---- mood board panel: the concept as a presentation sheet ---- */
  .mb-overlay { position:fixed; inset:0; z-index:95; display:flex; align-items:flex-start; justify-content:center; padding:clamp(10px,3vw,40px); background:rgba(26,21,18,.82); overflow-y:auto; animation:fadeIn .18s ease both; }
  .mb-panel { width:min(980px,100%); background:var(--card); border:1px solid var(--line); border-radius:20px; overflow:hidden; animation:rise .3s ease both; }
  .mb-head { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; padding:clamp(16px,2vw,26px); background:var(--sand); border-bottom:1px solid var(--line); }
  .mb-eyebrow { font-size:9px; letter-spacing:.18em; color:var(--gold); }
  .mb-title { font-weight:600; font-size:clamp(21px,2.4vw,30px); line-height:1.12; margin:7px 0 0; }
  .mb-sub { margin:8px 0 0; font-size:13.5px; line-height:1.55; color:var(--text2); max-width:62ch; }
  .mb-close { flex:0 0 auto; min-width:44px; min-height:44px; background:transparent; border:none; cursor:pointer; font-size:24px; line-height:1; color:var(--muted); }
  .mb-close:hover { color:var(--ink); }
  .mb-body { padding:clamp(16px,2vw,26px); display:flex; flex-direction:column; gap:clamp(14px,1.8vw,22px); }
  .mb-lbl { font-size:9.5px; letter-spacing:.18em; color:var(--muted); }
  .mb-scene { border-radius:16px; overflow:hidden; background:var(--sand); border:1px solid var(--line); }
  /* Capped so the tile grid below is not pushed off the first screen
     of the panel. contain, not cover -- a bathroom the client is
     judging must not be cropped to fit a box. */
  .mb-scene img { width:100%; display:block; max-height:min(540px,54vh); object-fit:contain; }
  .mb-scene-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; min-height:clamp(170px,24vw,280px); padding:26px; text-align:center; border-radius:16px; background:var(--sand); border:1px dashed #D8C9AE; }
  .mb-scene-empty p { margin:0; font-size:13.5px; line-height:1.55; color:var(--text2); max-width:46ch; }
  .mb-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr)); gap:clamp(12px,1.5vw,20px); }
  .mb-tile { display:flex; flex-direction:column; gap:10px; }
  /* A large-format tile reads as a slab, not a swatch -- it takes the
     width two of the smaller ones would, the way the reference panels
     run a 600x1200 across the sheet. */
  .mb-tile.is-large { grid-column:span 2; }
  @media (max-width:620px) { .mb-tile.is-large { grid-column:auto; } }
  .mb-shot.is-zoomable { cursor:zoom-in; }
  .mb-shot { position:relative; border-radius:14px; overflow:hidden; background:var(--sand); border:1px solid var(--line); }
  .mb-shot img { width:100%; height:100%; display:block; object-fit:cover; }
  .mb-shot-empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:14px; text-align:center; font-size:8.5px; letter-spacing:.08em; line-height:1.5; color:var(--muted); word-break:break-word; }
  .mb-role { position:absolute; top:10px; left:10px; padding:5px 9px; border-radius:7px; background:rgba(251,246,236,.93); border:1px solid var(--line); font-size:8.5px; letter-spacing:.12em; color:#6E5228; }
  .mb-cap { text-align:center; }
  .mb-name { display:block; font-size:13px; font-weight:500; line-height:1.35; word-break:break-word; }
  .mb-size { display:block; margin-top:5px; font-size:9.5px; letter-spacing:.1em; color:var(--muted); }
  .mb-grout { padding-top:14px; border-top:1px solid var(--line); text-align:center; font-size:10px; letter-spacing:.12em; color:var(--muted); }
  /* Board size + export. The preview below is a true-to-ratio frame, so
     what the client sees is the shape the PDF comes out at. */
  .mb-sizes { display:flex; flex-wrap:wrap; gap:9px; }
  /* 10px was too small to read at a glance against the rest of the
     panel. 12px with a little more padding and slightly tighter
     tracking reads clearly and keeps the chip the same shape. */
  .mb-size-chip { padding:9px 15px; border-radius:100px; border:1px solid var(--line); background:var(--card); cursor:pointer; font-size:12px; letter-spacing:.08em; color:#4A4038; }
  .mb-size-chip:hover { background:#F1EADD; }
  .mb-size-chip.selected { background:var(--ink); color:#FBF6EC; border-color:var(--ink); }
  .mb-export-row { display:flex; flex-wrap:wrap; align-items:center; gap:12px; }
  .mb-export-note { font-size:10px; letter-spacing:.1em; color:var(--muted); }
  .mb-export-error { flex:1 1 100%; font-size:10px; letter-spacing:.08em; color:#8A3A2E; }
  .mb-board { width:100%; background:#FBF6EC; border:1px solid var(--line); border-radius:14px; padding:clamp(10px,1.4vw,18px); display:flex; flex-direction:column; gap:clamp(8px,1vw,14px); overflow:hidden; }
  .mb-board-head { display:flex; justify-content:space-between; gap:10px; font-size:9px; letter-spacing:.16em; color:var(--muted); }
  .mb-board-scene { flex:1 1 auto; min-height:0; border-radius:10px; overflow:hidden; background:#EFE7DA; display:flex; align-items:center; justify-content:center; }
  .mb-board-scene img { width:100%; height:100%; object-fit:contain; }
  .mb-board-scene p { margin:0; padding:10px; font-size:11px; color:var(--muted); text-align:center; }
  /* A fixed share of the board, so a wide 10x4 strip cannot let square
     product shots eat the height the bathroom scene needs. The shots
     fill whatever cell they get and contain their image, so nothing is
     stretched at any ratio. Mirrors the 56/44 split the PDF uses. */
  .mb-board-tiles { flex:0 0 40%; min-height:0; display:grid; gap:clamp(6px,0.8vw,12px); }
  .mb-board-tile { min-width:0; min-height:0; display:flex; flex-direction:column; gap:4px; }
  .mb-board-shot { flex:1 1 auto; min-height:0; border-radius:8px; overflow:hidden; background:#fff; border:1px solid var(--line); }
  .mb-board-shot img { width:100%; height:100%; object-fit:contain; }
  .mb-board-cap { min-width:0; font-size:8.5px; line-height:1.3; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mb-board-cap b { display:block; font-weight:500; letter-spacing:.14em; font-size:7.5px; color:#B08D4E; }
  .viz-lightbox-close { position:absolute; top:16px; right:20px; background:transparent; border:none; color:#FBF6EC; font-size:26px; line-height:1; cursor:pointer; }

  /* ---- shared ---- */
  .modal-overlay { position:fixed; inset:0; background:rgba(26,21,18,.5); display:flex; align-items:center; justify-content:center; padding:20px; z-index:70; }
  .modal-box { background:#fff; border-radius:20px; padding:24px; max-width:480px; width:100%; max-height:80vh; overflow-y:auto; }
  .modal-close { float:right; background:transparent; border:none; cursor:pointer; font-size:18px; color:var(--muted); }
  .empty-state { padding:26px; text-align:center; color:var(--muted); font-size:13px; background:var(--sand); border-radius:16px; }

  @media (max-width: 860px) {
    .sidebar { display:none; }
    .main { padding:18px; }
  }
</style>
</head>

<script>
(function () {
  'use strict';

  // ============================================================
  // NAV (same pattern as dashboard.html)
  // ============================================================

  // How many combinations one generation produces. Read by the wizard's
  // own button, by the request, and by the "try more variations" box, so
  // the number the client is promised and the number asked for can never
  // drift apart.
  const COMBINATION_COUNT = 2;

  const NAV_ITEMS = [
    { id: 'dashboard', label: 'Dashboard', href: 'dashboard.html', ready: true },
    { id: 'moodboard', label: 'Mood Board', href: 'mood-board.html', ready: true },
    { id: 'generations', label: 'Recent Generations', href: 'recent-generations.html', ready: true },
    { id: 'projects', label: 'Projects', href: 'projects.html', ready: true },
    { id: 'catalog', label: 'Catalog', href: 'catalog.html', ready: true },
  ];

  function notReady() {
    alert('This section of the new design is still being rebuilt — coming soon.');
  }

  function renderNav() {
    const nav = document.getElementById('navItems');
    nav.innerHTML = '';
    NAV_ITEMS.forEach((item) => {
      const btn = document.createElement('button');
      btn.className = 'nav-item' + (item.id === 'moodboard' ? ' active' : '');
      btn.innerHTML = '<span class="lbl">' + item.label + '</span>' + (item.ready ? '' : '<span class="badge mono">SOON</span>');
      btn.addEventListener('click', () => {
        if (item.href) location.href = item.href;
        else notReady();
      });
      nav.appendChild(btn);
    });
  }

  // ============================================================
  // STATIC WIZARD OPTIONS (form configuration, not backend data --
  // the generated combinations, tiles, and boards below are all real)
  // ============================================================

  const ROOMS = [
    { name: 'Bathroom', badge: 'WET SPACE', desc: 'Wet zone and walk-in shower automatically calibrated.', img: 'img/room-bathroom.webp' },
    { name: 'Powder Room', badge: 'COMPACT VANITY', desc: 'Compact vanity & accent wall statement focus.', img: 'img/room-powder.webp' },
    { name: 'Living Room', badge: 'OPEN FLOOR', desc: 'Large format open floor plan & fireplace wraps.', img: 'img/room-living.webp' },
    { name: 'Bedroom', badge: 'AMBIENT SLEEP', desc: 'Warm textured ambient surfaces and quiet tones.', img: 'img/room-bedroom.webp' },
    { name: 'Kitchen & Dining', badge: 'HIGH TRAFFIC', desc: 'Splashback focal point & stain-resistant porcelain.', img: 'img/room-kitchen.webp' },
    { name: 'Balcony & Patio', badge: 'OUTDOOR R11', desc: 'Anti-skid outdoor porcelain & weather resistance.', img: 'img/room-terrace.webp' },
  ];

  /*
   * The feature surfaces each room actually has.
   *
   * This was one flat list, so a kitchen and a bedroom were offered a
   * basin wall and a shower nook -- and whatever was picked went into
   * the brief verbatim, which is how "Design a Kitchen & Dining with
   * shower nook." reached the generator.
   *
   * Every room opens on the quiet option and closes on Custom, both of
   * which mean the same thing everywhere. Only the two between them are
   * the room's own, keyed by the names in ROOMS.
   */
  const NO_FEATURE = { label: 'No feature wall', desc: 'Uniform surface across all four walls — quietest option.' };
  const CUSTOM_FEATURE = { label: 'Custom', desc: 'Name the walls yourself, or leave the choice to the studio.' };

  const ROOM_FEATURES = {
    'Bathroom': [
      { label: 'Basin wall', desc: 'Statement surface behind the vanity, mirrored in the render.' },
      { label: 'Shower nook', desc: 'Accent restricted to the wet niche and shelf return.' },
    ],
    'Powder Room': [
      { label: 'Basin wall', desc: 'Statement surface behind the vanity, mirrored in the render.' },
      { label: 'Mirror wall', desc: 'Accent carried full height behind the mirror alone.' },
    ],
    'Living Room': [
      { label: 'Media wall', desc: 'Statement surface behind the television and console.' },
      { label: 'Fireplace wrap', desc: 'Accent restricted to the hearth surround and its return.' },
    ],
    'Bedroom': [
      { label: 'Headboard wall', desc: 'Statement surface behind the bed, carried full width.' },
      { label: 'Wardrobe return', desc: 'Accent restricted to the wardrobe face and its return.' },
    ],
    'Kitchen & Dining': [
      { label: 'Splashback', desc: 'Statement surface between the counter and the overhead units.' },
      { label: 'Island face', desc: 'Accent restricted to the island cladding and its return.' },
    ],
    'Balcony & Patio': [
      { label: 'Boundary wall', desc: 'Statement surface on the parapet, weather-exposed.' },
      { label: 'Planter return', desc: 'Accent restricted to the planter face and the step riser.' },
    ],
  };

  /** What step 2 offers for the chosen room. */
  function featuresFor(room) {
    return [NO_FEATURE].concat(ROOM_FEATURES[room] || [], [CUSTOM_FEATURE]);
  }

  // The five things the Custom dropdown offers. Checkboxes only -- there
  // is no free-text path into this field, so nothing unvalidated can
  // reach the brief or the generator.
  const CUSTOM_WALLS = ['Left wall', 'Right wall', 'Front wall', 'Back wall'];
  const LET_STUDIO_DECIDE = 'Let De\u2019vyora decide';

  // The two presets the catalog genuinely stocks. 800x800 was here and
  // is gone: no tile in the catalog comes in it, so offering it put a
  // dimension into the brief that no product could satisfy. Any other
  // size has to be chosen from CUSTOM_SIZE, which is read from the
  // catalog itself -- nothing is invented here.
  const SIZES = ['600×600 mm', '600×1200 mm'];

  const CUSTOM_SIZE = 'Custom';
  const AUTO_SIZE = 'Let De\u2019vyora decide';

  const FINISHES = [
    { label: 'Honed Matte', spec: 'R10 · ANTI-SKID · WET ZONE', img: 'img/tex-travertine.webp' },
    { label: 'Polished Gloss', spec: 'REFLECTIVE · DRY ZONE ONLY', img: 'img/tex-calacatta.webp' },
    { label: 'Textured Grip', spec: 'R11 · OUTDOOR RATED', img: 'img/tex-terrazzo.webp' },
  ];

  // THE ROOM EVERY BUDGET IS QUOTED AGAINST.
  //
  // A budget means nothing without the area it has to cover, so one
  // reference room is fixed here and shown on the step. 7ft is the
  // height walls are normally tiled to; one standard door opening is
  // deducted because nobody tiles a doorway.
  //
  // It is a YARDSTICK, and the copy says so. It used to be described as
  // "a 10ft x 10ft bathroom", which put the word bathroom -- and
  // sanitaryware, basins and a WC -- into the brief for a kitchen and a
  // bedroom too. The figures are unchanged: every band in BUDGETS below
  // was set against this room's 359 sq ft, so the area is what the
  // amounts mean.
  const REFERENCE_ROOM = {
    lengthFt: 10,
    widthFt: 10,
    wallHeightFt: 7,
    doorWidthFt: 3,
    doorHeightFt: 7,
    // Cuts and breakage. 10% is the usual allowance on a tile order.
    wastage: 0.10,
  };

  function referenceAreas() {
    const r = REFERENCE_ROOM;
    const floor = r.lengthFt * r.widthFt;
    const perimeter = 2 * (r.lengthFt + r.widthFt);
    const walls = perimeter * r.wallHeightFt - r.doorWidthFt * r.doorHeightFt;
    return { floor: floor, walls: walls, total: floor + walls };
  }

  // THE BUDGET BANDS.
  //
  // These are TOTAL tile cost for the reference room above -- floor
  // and wall tiles only, no sanitaryware, no fittings, no labour.
  //
  // The ladder is the five bands the project asked for. Two further
  // figures were discussed later, Rs 20,000-25,000 and Rs 40,000-60,000;
  // both sit inside bands already here (CORE covers 20-40k, SIGNATURE
  // covers 40-90k), so they are honoured by the ladder rather than added
  // as overlapping cards -- two cards whose ranges overlap cannot be
  // compared against each other, which is what this step is for.
  //
  // The three per-sq-ft bands that preceded all of this are gone: over
  // this room's 359 sq ft they came to Rs 62,825-125,650,
  // Rs 125,650-251,300 and Rs 251,300-502,600, which contradicts the
  // totals above. Each card states the rate it implies instead, so the
  // arithmetic is visible rather than buried.
  //
  // `total` is [floor, ceiling]; a null ceiling means open-ended.
  const BUDGETS = [
    { tier: 'ESSENTIAL', total: [10000, 20000], desc: 'Plain porcelain bodies in bulk stock, one module throughout.' },
    { tier: 'MID-RANGE', total: [20000, 40000], desc: 'Matte neutrals with a modest decorated return.' },
    { tier: 'SIGNATURE', total: [40000, 90000], desc: 'Vein-cut travertine, fluted accents and polished marfil.' },
    { tier: 'PREMIUM', total: [90000, 150000], desc: 'Large-format bodies, book-matched panels, worked surfaces.' },
    { tier: 'LUXURY', total: [150000, null], desc: 'Statement marble, bespoke inlay and full-height feature walls.' },
  ];

  function rupees(value) {
    return '\u20B9' + Math.round(value).toLocaleString('en-IN');
  }

  function budgetRangeText(band) {
    if (band.total[1] === null) return rupees(band.total[0]) + ' and above';
    return rupees(band.total[0]) + ' \u2013 ' + rupees(band.total[1]);
  }

  /** The per-sq-ft rate a total band works out to over the tiled area. */
  function budgetRateText(band) {
    const area = referenceAreas().total;
    if (band.total[1] === null) return rupees(band.total[0] / area) + ' and above';
    return rupees(band.total[0] / area) + ' \u2013 ' + rupees(band.total[1] / area);
  }

  // THE DESIGN THEMES.
  //
  // These replace the three tonal palettes that stood here. A theme is a
  // design language rather than a temperature, so each carries the
  // colours it is actually built from: the swatches are how the client
  // reads it, and the label is what reaches STYLE_PROFILES in
  // tileRecommendation.service.ts, where each theme maps onto the finish,
  // colour family and role a Tile row really stores.
  //
  // LET_STUDIO_THEME is deliberately NOT in that table. It means "no
  // theme was specified", so the scorer stays neutral and the model
  // picks the theme itself from the room, the budget and the stock.
  const LET_STUDIO_THEME = 'Let De’vyora Decide';
  //
  // `art` is a static 16:9 preview in img/themes/ -- an abstract material
  // collage in the theme's own palette, drawn once and committed, never
  // generated at page load and never an AI request. They are inspiration
  // only: no preview is, or stands for, a catalogue product.
  //
  // `materials` is the strip under the name: the surfaces the theme is
  // built from, as CSS so it costs no extra asset.
  const THEMES = [
    {
      label: 'British', spec: 'HERITAGE GREEN · OXBLOOD · BRASS',
      art: 'img/themes/british.svg',
      materials: [
        { name: 'Panelled timber', css: 'repeating-linear-gradient(90deg,#2F4A3C 0 6px,#26402F 6px 8px)' },
        { name: 'Encaustic', css: 'repeating-conic-gradient(#7A2E2E 0% 25%,#EFE8D8 0% 50%) 0/10px 10px' },
        { name: 'Brass', css: 'linear-gradient(135deg,#D8B775,#B08D4E 60%,#8E6E36)' },
      ],
      sw: ['#EFE8D8', '#2F4A3C', '#7A2E2E', '#B08D4E'],
    },
    {
      label: 'Roman Touch', spec: 'TRAVERTINE · STONE · TERRACOTTA',
      art: 'img/themes/roman-touch.svg',
      materials: [
        { name: 'Travertine', css: 'repeating-linear-gradient(0deg,#EDE2CD 0 3px,#D9C7A6 3px 5px)' },
        { name: 'Limestone', css: 'linear-gradient(135deg,#E4D7BC,#C2AE8A)' },
        { name: 'Terracotta', css: 'linear-gradient(135deg,#C09277,#B2876A 60%,#9C7257)' },
      ],
      sw: ['#EDE2CD', '#D9C7A6', '#B2876A', '#8A7A62'],
    },
    {
      label: 'Floral', spec: 'BLUSH · SAGE · IVORY',
      art: 'img/themes/floral.svg',
      materials: [
        { name: 'Glazed ceramic', css: 'linear-gradient(135deg,#F6EDE6,#E3C3C0)' },
        { name: 'Sage matte', css: 'linear-gradient(135deg,#BCC9B2,#A8B79C)' },
        { name: 'Ivory biscuit', css: 'repeating-linear-gradient(45deg,#F6EDE6 0 4px,#EDE0D6 4px 8px)' },
      ],
      sw: ['#F6EDE6', '#E3C3C0', '#A8B79C', '#8A6A62'],
    },
    {
      label: 'Tropical', spec: 'PALM · TEAL · SAND',
      art: 'img/themes/tropical.svg',
      materials: [
        { name: 'Palm green', css: 'linear-gradient(135deg,#2E7D6B,#1F4F45)' },
        { name: 'Teal glaze', css: 'linear-gradient(135deg,#3FA392,#2E7D6B)' },
        { name: 'Sand', css: 'repeating-linear-gradient(0deg,#EFE7D2 0 3px,#C2A878 3px 5px)' },
      ],
      sw: ['#EFE7D2', '#C2A878', '#2E7D6B', '#1F4F45'],
    },
    {
      label: 'Geometrical', spec: 'IVORY · GRAPHITE · TERRACOTTA',
      art: 'img/themes/geometrical.svg',
      materials: [
        { name: 'Ivory porcelain', css: 'linear-gradient(135deg,#F7F5EF,#F4F1E9)' },
        { name: 'Graphite', css: 'repeating-linear-gradient(135deg,#5C5F63 0 5px,#4C4F53 5px 10px)' },
        { name: 'Charcoal', css: 'linear-gradient(135deg,#2A2A2A,#1C1C1C)' },
      ],
      sw: ['#F4F1E9', '#5C5F63', '#1C1C1C', '#B5705A'],
    },
    {
      label: 'Metallic', spec: 'PEARL · GUNMETAL · CHAMPAGNE',
      art: 'img/themes/metallic.svg',
      materials: [
        { name: 'Brushed silver', css: 'repeating-linear-gradient(90deg,#DCDCE0 0 2px,#CFCFD4 2px 4px)' },
        { name: 'Gunmetal', css: 'linear-gradient(135deg,#5C6268,#4A4F55)' },
        { name: 'Champagne gold', css: 'linear-gradient(135deg,#E2CFA2,#C9A96A 60%,#A98A4F)' },
      ],
      sw: ['#F2EADA', '#CFCFD4', '#4A4F55', '#C9A96A'],
    },
    {
      label: 'Rustic', spec: 'NATURAL CLAY · TERRACOTTA · OCHRE',
      art: 'img/themes/rustic.svg',
      materials: [
        { name: 'Natural clay', css: 'linear-gradient(135deg,#E8D0B8,#E0C3A8)' },
        { name: 'Sandstone', css: 'repeating-linear-gradient(0deg,#D6B68E 0 3px,#C9A77C 3px 6px)' },
        { name: 'Muted ochre', css: 'linear-gradient(135deg,#D79B45,#C98A33)' },
      ],
      sw: ['#E0C3A8', '#C9A77C', '#A4573A', '#C98A33'],
    },
    {
      label: 'Moroccan', spec: 'ZELLIGE · COBALT · SAFFRON',
      art: 'img/themes/moroccan.svg',
      materials: [
        { name: 'Zellige', css: 'repeating-linear-gradient(45deg,#F2EADA 0 5px,#E6DBC6 5px 10px)' },
        { name: 'Cobalt glaze', css: 'linear-gradient(135deg,#3B72BC,#2B5FA8)' },
        { name: 'Saffron', css: 'linear-gradient(135deg,#E8B948,#D9A52E)' },
      ],
      sw: ['#F2EADA', '#2B5FA8', '#1B8A7A', '#D9A52E'],
    },
    {
      label: 'Black & White', spec: 'IVORY · ASH · CHARCOAL',
      art: 'img/themes/black-white.svg',
      materials: [
        { name: 'Veined marble', css: 'linear-gradient(115deg,#F6F3EC 0 46%,#CFCBC3 48%,#F6F3EC 52%)' },
        { name: 'Checker', css: 'repeating-conic-gradient(#1A1917 0% 25%,#F6F3EC 0% 50%) 0/12px 12px' },
        { name: 'Charcoal', css: 'linear-gradient(135deg,#2B2A28,#1A1917)' },
      ],
      sw: ['#F6F3EC', '#CFCBC3', '#5A5651', '#1A1917'],
    },
    {
      label: LET_STUDIO_THEME, spec: 'THE STUDIO PICKS THE THEME',
      art: 'img/themes/studio-decides.svg',
      materials: [
        { name: 'Stone', css: 'repeating-linear-gradient(0deg,#EDE2CD 0 3px,#D9C7A6 3px 5px)' },
        { name: 'Marble', css: 'linear-gradient(115deg,#F6F3EC 0 46%,#C6C2BA 48%,#F6F3EC 52%)' },
        { name: 'Timber', css: 'repeating-linear-gradient(0deg,#C2A271 0 4px,#A98A5C 4px 6px)' },
        { name: 'Metal', css: 'repeating-linear-gradient(90deg,#C4C2BC 0 2px,#B9B6AF 2px 4px)' },
      ],
      sw: [],
    },
  ];
  const GROUTS = ['Ivory Matte', 'Charcoal'];

  // THE MOOD BOARD SIZES, in feet.
  //
  // A closed set, matching BOARD_SIZES_FT in the backend validator: the
  // client picks a physical panel, and the PDF is produced at exactly
  // that size (1 ft = 12 in = 864 pt). No free-text size, because a
  // number nobody prints is not an option worth offering.
  const BOARD_SIZES = [
    { w: 2, h: 2 }, { w: 2, h: 4 }, { w: 4, h: 2 }, { w: 4, h: 4 }, { w: 4, h: 6 },
    { w: 6, h: 4 }, { w: 8, h: 4 }, { w: 9, h: 4 }, { w: 10, h: 4 },
  ];

  /*
   * How much of a generated scene may be posted with an export, matching
   * the cap the backend's exportMoodBoardPdfSchema accepts. A 1024px
   * scene lands around 1.5-2.5 MB as base64, so this leaves headroom.
   */
  const MAX_INLINE_SCENE_CHARS = 6 * 1024 * 1024;

  function boardSizeKey(size) { return size.w + 'x' + size.h; }
  function boardSizeLabel(size) { return size.w + ' ft \u00D7 ' + size.h + ' ft'; }

  /*
   * The client views. An elevation and a wide corner read the same in
   * any room; the close-up does not -- "Vanity Close-Up" was being
   * offered for a kitchen and a balcony, and it goes into the brief by
   * name, so it is the room's own here as well.
   */
  const VIEW_ELEVATION = { label: 'Front Elevation', desc: 'Straight-on wall for like-for-like comparison.' };
  const VIEW_CORNER = { label: 'Wide Corner', desc: 'Shows floor module and wall junction together.' };

  const ROOM_CLOSE_UP = {
    'Bathroom': { label: 'Vanity Close-Up', desc: 'Tight crop on the basin and feature return.' },
    'Powder Room': { label: 'Vanity Close-Up', desc: 'Tight crop on the basin and feature return.' },
    'Living Room': { label: 'Media Wall Close-Up', desc: 'Tight crop on the console wall and its return.' },
    'Bedroom': { label: 'Headboard Close-Up', desc: 'Tight crop on the bed wall and its return.' },
    'Kitchen & Dining': { label: 'Splashback Close-Up', desc: 'Tight crop on the counter run and its return.' },
    'Balcony & Patio': { label: 'Parapet Close-Up', desc: 'Tight crop on the boundary wall and the floor junction.' },
  };

  /** What step 7 offers for the chosen room. */
  function viewsFor(room) {
    const closeUp = ROOM_CLOSE_UP[room];
    return closeUp ? [VIEW_ELEVATION, closeUp, VIEW_CORNER] : [VIEW_ELEVATION, VIEW_CORNER];
  }

  const STEP_META = {
    1: { key: 'ROOM TYPOLOGY', eyebrow: 'ARCHITECTURAL FOUNDATION', title: 'What are you designing?', sub: 'Select your space to automatically calibrate ambient lighting, scale proportions, and surface drainage parameters.' },
    2: { key: 'FEATURE PLACEMENT', eyebrow: 'STATEMENT SURFACE', title: 'Where should the feature wall sit?', sub: 'The accent surface anchors the composition.' },
    3: { key: 'DIMENSION & FINISH', eyebrow: 'MODULE GEOMETRY', title: 'Pick the floor module', sub: 'Larger modules mean fewer grout lines. Finish drives slip rating and reflectivity.' },
    4: { key: 'BUDGET BAND', eyebrow: 'COMMERCIAL ENVELOPE', title: 'What is the surface budget?', sub: 'Each band is carried into the brief with the room and its coverage, so the concepts answer the amount you set.' },
    5: { key: 'THEME & GROUT', eyebrow: 'DESIGN DIRECTION', title: 'Pick the design theme', sub: 'The theme drives which surfaces are combined. Grout tone is specified alongside it — it changes the perceived scale of the whole wall.' },
    6: { key: 'REVIEW SPEC', eyebrow: 'DESIGN DNA', title: 'Review the design DNA', sub: 'This is what gets sent to generate your combinations.' },
    7: { key: 'CAMERA', eyebrow: 'RENDER PIPELINE', title: 'Choose the client view', sub: 'Included as context for the design brief.' },
  };

  // ============================================================
  // STATE
  // ============================================================

  const state = {
    stage: 'wizard', // wizard | generating | error | results
    step: 1,
    room: null,
    feature: NO_FEATURE.label,
    // Checked walls under Custom. Held apart from `feature` so switching
    // to another option and back does not lose what was ticked.
    customWalls: [],
    // Open from the start: choosing Custom is a request to name the
    // walls, so the list is the point of the option, not a second step
    // behind a caret.
    customWallsOpen: true,
    // Set when a dropdown has just been opened, cleared once it has been
    // brought into view. One-shot, because the list can arrive a render
    // later than the click that asked for it.
    revealList: false,
    size: SIZES[1],
    // 'preset' | 'custom' | 'auto'. One mode at a time, which is what
    // makes the three mutually exclusive: picking any chip sets it.
    sizeMode: 'preset',
    customSize: '',
    customSizeOpen: true,
    // Filled from GET /tiles/sizes the first time Custom is opened.
    catalogSizes: null,
    catalogSizesError: '',
    finish: FINISHES[0].label,
    // Several bands at once, so one brief can ask for alternatives to
    // compare. Held as an array; the rest of the wizard reads it
    // through budgetText().
    budgets: [BUDGETS[0]],
    theme: THEMES[0].label,
    // The mood board panel's physical size. Held on the wizard's state,
    // not on the panel, so closing and reopening the panel -- or moving
    // between combinations -- keeps what was chosen.
    boardSize: BOARD_SIZES[3],
    exporting: false,
    exportError: '',
    grout: GROUTS[0],
    view: VIEW_ELEVATION.label,
    combinations: [],
    warnings: [],
    tilesById: {},
    errorMessage: null,
    // The combination whose mood board panel is open, or null.
    moodBoardIndex: null,
    // Which cards have PRODUCTS USED open, keyed by combination index.
    // Kept in state rather than read off the DOM so a re-render of the
    // results stage puts every card back the way the user left it.
    expandedProducts: {},
    // One bathroom scene per combination, keyed by its index, because
    // every card now carries its own. A single slot with a forIndex tag
    // was enough while the scene lived on the detail page, where exactly
    // one combination was ever open; it cannot hold two cards' scenes at
    // once. Index is the key the rest of this file already identifies a
    // combination by (data-view-products, data-generate-scene), and it is
    // cleared wherever state.combinations is replaced.
    visualizations: {},
    // Set when this page was opened via ?boardId= from Projects "Open
    // Board" -- viewing a previously-saved board rather than a live
    // wizard session, so the wizard-only fields above (feature/size/
    // finish/budget/grout/view) were never set and must not be shown.
    viewOnly: false,
    loadedBoard: null,
    pendingBoardId: null,
  };

  function render() {
    // The panel lives in modalHost, outside the stage that render()
    // rewrites, so it would otherwise survive a regeneration and go on
    // showing a combination that no longer exists.
    closeMoodBoard();

    switch (state.stage) {
      case 'wizard': return renderWizard();
      case 'generating': return renderGenerating();
      case 'error': return renderError();
      case 'results': return renderResults();
      default: return renderWizard();
    }
  }

  // ============================================================
  // WIZARD
  // ============================================================

  function stepValid(step) {
    if (step === 1) return !!state.room;
    // Custom is only a choice once something under it is ticked --
    // the same shape as step 1's rule, so Continue stays disabled
    // rather than sending a brief that says "Custom" and nothing else.
    if (step === 2 && state.feature === 'Custom') return state.customWalls.length > 0;
    // Custom is only a choice once a catalog size is picked.
    if (step === 3 && state.sizeMode === 'custom') return !!state.customSize;
    if (step === 4) return state.budgets.length > 0;
    return true;
  }

  function renderWizard() {
    const meta = STEP_META[state.step];
    const pct = Math.round((state.step / 7) * 100);
    const main = document.getElementById('mainContent');

    const tabs = [1, 2, 3, 4, 5, 6, 7].map((n) => {
      const cls = n === state.step ? 'current' : n < state.step ? 'done' : '';
      return '<button class="step-tab mono ' + cls + '" data-goto-step="' + n + '">' + n + '. ' + ['ROOM', 'FEATURE', 'SIZE', 'BUDGET', 'FINISH', 'REVIEW', 'RENDER'][n - 1] + '</button>';
    }).join('');

    main.innerHTML =
      '<div class="stage">' +
      '<div class="step-head"><div class="eyebrow mono"><span class="dot"></span>STEP ' + state.step + ' OF 7 · ' + meta.key + '</div><span class="pct mono">' + pct + '% Complete</span></div>' +
      '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="step-tabs">' + tabs + '</div>' +
      '<div class="step-title-row"><span class="lbl mono">' + meta.eyebrow + '</span><span class="rule"></span></div>' +
      '<h1 class="step-h1 serif">' + meta.title + '</h1>' +
      '<p class="step-sub">' + meta.sub + '</p>' +
      '<div id="stepBody"></div>' +
      '<div class="step-actions">' +
      '<button class="btn-back mono" id="prevBtn">← ' + (state.step === 1 ? 'DASHBOARD' : 'BACK') + '</button>' +
      '<button class="btn-next mono" id="nextBtn"' + (stepValid(state.step) ? '' : ' disabled') + '><span style="width:6px;height:6px;border-radius:50%;background:#E3C58E"></span><span style="flex:1;text-align:left">' + (state.step === 7 ? 'GENERATE ' + boardCount() + ' MOOD BOARDS' : 'CONTINUE TO STEP ' + (state.step + 1)) + '</span><span>→</span></button>' +
      '</div>' +
      '</div>';

    renderStepBody();

    document.querySelectorAll('[data-goto-step]').forEach((btn) => {
      btn.addEventListener('click', () => { state.step = parseInt(btn.dataset.gotoStep, 10); render(); });
    });
    document.getElementById('prevBtn').addEventListener('click', () => {
      if (state.step === 1) { location.href = 'dashboard.html'; return; }
      state.step -= 1; render();
    });
    document.getElementById('nextBtn').addEventListener('click', () => {
      if (!stepValid(state.step)) return;
      if (state.step === 7) { runGenerate(); return; }
      state.step += 1; render();
    });
  }

  // ============================================================
  // CUSTOM FEATURE WALLS
  //
  // A disclosure, not a <select>: the options are checkboxes and several
  // may be ticked, which a native select cannot show without turning
  // into a list box. The summary line on the toggle is what a closed
  // dropdown would have shown.
  // ============================================================

  /**
   * Bring a just-opened dropdown into view inside the scrolling panel,
   * so the options are on screen without the client hunting for them.
   * 'nearest' moves the minimum needed, so a list already in view does
   * not jump.
   */
  function revealOpenList(body) {
    if (!state.revealList) return;
    const list = body.querySelector('.walls-list');
    if (!list) return;
    state.revealList = false;
    list.scrollIntoView({ block: 'nearest' });
  }

  function customWallsSummary() {
    if (state.customWalls.includes(LET_STUDIO_DECIDE)) return LET_STUDIO_DECIDE;
    if (state.customWalls.length === 0) return 'CHOOSE WALLS';
    return state.customWalls.join(', ');
  }

  function customWallsHtml() {
    const rows = [...CUSTOM_WALLS, LET_STUDIO_DECIDE].map((wall) => {
      const checked = state.customWalls.includes(wall);
      return '<button class="wall-row' + (checked ? ' checked' : '') + '" data-wall="' + escapeHtml(wall) + '" role="checkbox" aria-checked="' + checked + '">' +
        '<span class="wall-box"></span><span>' + escapeHtml(wall) + '</span></button>';
    }).join('');

    return '<div class="walls">' +
      '<button class="walls-toggle mono" id="wallsToggle" aria-expanded="' + state.customWallsOpen + '">' +
      '<span>' + escapeHtml(customWallsSummary().toUpperCase()) + '</span><span class="caret">' + (state.customWallsOpen ? '▲' : '▼') + '</span>' +
      '</button>' +
      (state.customWallsOpen ? '<div class="walls-list">' + rows + '</div>' : '') +
      '</div>';
  }

  /**
   * "Let De'vyora decide" and the four walls cannot both be true.
   *
   * Naming a wall means the client made the call, so the studio's
   * standing offer drops away; choosing the offer means they did not,
   * so the named walls drop away. Anything else would send a brief that
   * contradicts itself.
   */
  function toggleWall(wall) {
    const checked = state.customWalls.includes(wall);

    if (wall === LET_STUDIO_DECIDE) {
      state.customWalls = checked ? [] : [LET_STUDIO_DECIDE];
      return;
    }

    const walls = state.customWalls.filter((w) => w !== LET_STUDIO_DECIDE && w !== wall);
    if (!checked) walls.push(wall);
    // Kept in the order they are offered, not the order they were
    // clicked, so the summary reads the same way every time.
    state.customWalls = CUSTOM_WALLS.filter((w) => walls.includes(w));
  }

  function wireCustomWalls(body) {
    const toggle = body.querySelector('#wallsToggle');
    if (toggle) {
      toggle.addEventListener('click', () => {
        state.customWallsOpen = !state.customWallsOpen;
        state.revealList = state.customWallsOpen;
        render();
      });
    }
    revealOpenList(body);
    body.querySelectorAll('[data-wall]').forEach((row) => {
      row.addEventListener('click', () => {
        toggleWall(row.dataset.wall);
        render();
      });
    });
  }

  /** What the rest of the wizard calls the feature choice. */
  function featureText() {
    if (state.feature !== 'Custom') return state.feature;
    if (state.customWalls.includes(LET_STUDIO_DECIDE)) {
      return 'Feature wall placement left to the studio';
    }
    if (state.customWalls.length === 0) return 'Custom';
    return 'Feature wall on the ' + state.customWalls.map((w) => w.toLowerCase()).join(', the ');
  }

  // ============================================================
  // CUSTOM FLOOR MODULE
  //
  // The options are read from the catalog, never written here. A size
  // the stock does not come in is not a size the client can be offered,
  // however plausible it sounds -- which is why 800x800 is gone and why
  // this is a dropdown rather than a text field.
  // ============================================================

  async function loadCatalogSizes() {
    if (state.catalogSizes !== null) return;
    try {
      const sizes = await CasaApi.tiles.sizes();
      state.catalogSizes = sizes;
      state.catalogSizesError = '';
    } catch (err) {
      state.catalogSizes = [];
      state.catalogSizesError = (err && err.message) || 'Could not read the catalog.';
    }
    render();
  }

  function customSizeHtml() {
    if (state.catalogSizes === null) {
      return '<div class="walls"><button class="walls-toggle mono" disabled>READING THE CATALOG…</button></div>';
    }
    if (state.catalogSizes.length === 0) {
      return '<div class="walls"><button class="walls-toggle mono" disabled>' +
        escapeHtml((state.catalogSizesError || 'No sizes recorded in the catalog').toUpperCase()) +
        '</button></div>';
    }

    const rows = state.catalogSizes.map((entry) => {
      const chosen = state.customSize === entry.size;
      return '<button class="wall-row' + (chosen ? ' checked' : '') + '" data-custom-size="' + escapeHtml(entry.size) + '" role="radio" aria-checked="' + chosen + '">' +
        '<span class="wall-box"></span><span style="flex:1">' + escapeHtml(entry.size) + '</span>' +
        '<span class="mono" style="font-size:9px; color:var(--muted)">' + entry.tiles + ' TILE' + (entry.tiles === 1 ? '' : 'S') + '</span></button>';
    }).join('');

    return '<div class="walls">' +
      '<button class="walls-toggle mono" id="customSizeToggle" aria-expanded="' + state.customSizeOpen + '">' +
      '<span>' + escapeHtml((state.customSize || 'Choose a size the catalog stocks').toUpperCase()) + '</span>' +
      '<span class="caret">' + (state.customSizeOpen ? '▲' : '▼') + '</span></button>' +
      (state.customSizeOpen ? '<div class="walls-list">' + rows + '</div>' : '') +
      '</div>';
  }

  function wireCustomSize(body) {
    const toggle = body.querySelector('#customSizeToggle');
    if (toggle) {
      toggle.addEventListener('click', () => {
        state.customSizeOpen = !state.customSizeOpen;
        state.revealList = state.customSizeOpen;
        render();
      });
    }
    revealOpenList(body);
    body.querySelectorAll('[data-custom-size]').forEach((row) => {
      row.addEventListener('click', () => {
        // One size, not several -- a floor has one module.
        state.customSize = row.dataset.customSize;
        state.customSizeOpen = false;
        render();
      });
    });
  }

  /** What the rest of the wizard calls the floor module. */
  function sizeText() {
    if (state.sizeMode === 'auto') return AUTO_SIZE;
    if (state.sizeMode === 'custom') return state.customSize || CUSTOM_SIZE;
    return state.size;
  }

  // ============================================================
  // WHAT THE BUDGET HAS TO BUY
  //
  // Quantity is arithmetic on the real coverage and the module the
  // client picked, so it is worked out here and shown. Cost is NOT:
  // no product in this catalog carries a price -- there is no price
  // column on Tile and none in the MASTER sheet -- so the rate each
  // band implies is given instead, which is derived from the client's
  // own figures rather than invented.
  // ============================================================

  const SQ_FT_PER_SQ_M = 10.7639;

  /** Tiles needed for a given area, or null when the module is unknown. */
  function tilesFor(areaSqFt) {
    const parsed = parseTileSize(sizeText());
    if (!parsed) return null;

    const tileSqFt = (parsed.w / 1000) * (parsed.h / 1000) * SQ_FT_PER_SQ_M;
    if (!(tileSqFt > 0)) return null;

    return Math.ceil((areaSqFt / tileSqFt) * (1 + REFERENCE_ROOM.wastage));
  }

  function budgetText() {
    const bands = state.budgets.length ? state.budgets : [];
    if (bands.length === 0) return '';
    return bands
      .map((b) => b.tier + ' ' + budgetRangeText(b))
      .join(' or ');
  }

  /**
   * Tiles the order comes to: floor and wall rounded up separately,
   * which is how tile is actually bought, and never as one pooled area.
   */
  function orderTiles() {
    const area = referenceAreas();
    const floor = tilesFor(area.floor);
    const walls = tilesFor(area.walls);
    if (floor === null || walls === null) return null;
    return { floor: floor, walls: walls, total: floor + walls };
  }

  /** What the bands actually have to buy, at the module that was chosen. */
  function quantityText() {
    const q = orderTiles();
    if (!q) return '';

    return ' At ' + sizeText() + ' that is about ' + q.floor + ' floor tiles and '
      + q.walls + ' wall tiles, ' + q.total + ' in all, cuts included.';
  }

  /** The whole envelope, in the words the model and the client both see. */
  function budgetBrief() {
    const area = referenceAreas();
    const r = REFERENCE_ROOM;
    const bands = state.budgets.map((b) =>
      b.tier + ' ' + budgetRangeText(b) + ' total (about ' + budgetRateText(b) + ' per sq ft)');

    return 'Budget for floor and wall tiles only, for a '
      + 'reference ' + r.lengthFt + 'ft x ' + r.widthFt + 'ft room tiled to '
      + r.wallHeightFt + 'ft: ' + Math.round(area.floor) + ' sq ft of floor and '
      + Math.round(area.walls) + ' sq ft of wall, ' + Math.round(area.total)
      + ' sq ft in all. Excludes fixtures, fittings and installation.'
      + quantityText() + ' '
      + (bands.length > 1
        ? 'Propose one combination for each of these bands so they can be compared: '
        : 'Stay within: ')
      + bands.join('; ') + '.';
  }

  /**
   * How the theme reaches the brief. "Let De'vyora Decide" is not a
   * theme the model can look up, so it is spelled out as the absence of
   * one rather than passed through as if it were a style name.
   */
  function themeBrief() {
    if (state.theme === LET_STUDIO_THEME) {
      return 'Theme: not specified \u2014 choose the one the room, the budget and the listed stock support best, and name it. Grout: '
        + state.grout + '.';
    }
    return 'Theme: ' + state.theme + ', with ' + state.grout + ' grout.';
  }

  /**
   * One board per band when several are being compared, otherwise the
   * house default of two variations on the single band.
   */
  function boardCount() {
    return state.budgets.length > 1 ? state.budgets.length : COMBINATION_COUNT;
  }

  function renderStepBody() {
    const body = document.getElementById('stepBody');

    if (state.step === 1) {
      body.innerHTML = '<div class="grid-rooms">' + ROOMS.map((r) => {
        const sel = state.room === r.name;
        return '<button class="room-card' + (sel ? ' selected' : '') + '" data-room="' + r.name + '">' +
          '<span class="room-img"><img src="' + r.img + '" alt="' + r.name + '" loading="lazy" decoding="async" width="640" height="437"><span class="room-badge mono">' + r.badge + '</span>' + (sel ? '<span class="room-check">✓</span>' : '') + '</span>' +
          '<span class="room-body"><span class="rn serif">' + r.name + '</span><span class="rd">' + r.desc + '</span></span>' +
          '</button>';
      }).join('') + '</div>';
      body.querySelectorAll('[data-room]').forEach((btn) => btn.addEventListener('click', () => {
        state.room = btn.dataset.room;
        // A basin wall is not on offer in a kitchen. Anything the
        // previous room had and this one does not falls back to the
        // option every room shares, so no stranded choice can reach the
        // brief unseen.
        if (!featuresFor(state.room).some((f) => f.label === state.feature)) state.feature = NO_FEATURE.label;
        if (!viewsFor(state.room).some((v) => v.label === state.view)) state.view = VIEW_ELEVATION.label;
        render();
      }));
      return;
    }

    if (state.step === 2) {
      body.innerHTML = '<div style="display:flex; flex-direction:column; gap:12px; margin-top:clamp(18px,2vw,26px); max-width:520px">' + featuresFor(state.room).map((f) => {
        const sel = state.feature === f.label;
        return '<button class="option-row' + (sel ? ' selected' : '') + '" data-feature="' + f.label + '"><span class="option-dot"></span><span style="flex:1;min-width:0"><span class="ol mono">' + f.label.toUpperCase() + '</span><span class="od">' + f.desc + '</span></span></button>' +
          (sel && f.label === 'Custom' ? customWallsHtml() : '');
      }).join('') + '</div>';
      body.querySelectorAll('[data-feature]').forEach((btn) => btn.addEventListener('click', () => {
        state.feature = btn.dataset.feature;
        if (state.feature === 'Custom') { state.customWallsOpen = true; state.revealList = true; }
        render();
      }));
      wireCustomWalls(body);
      return;
    }

    if (state.step === 3) {
      // Warm the catalog sizes while the client is still reading this
      // step. loadCatalogSizes returns immediately once they are held,
      // so this costs one request per visit at most -- and the Custom
      // dropdown then opens on data already in hand instead of showing
      // "READING THE CATALOG..." and waiting for a round trip.
      loadCatalogSizes();

      body.innerHTML =
        '<div style="margin-top:clamp(18px,2vw,26px)">' +
        '<div class="section-lbl mono" style="margin-top:0">FLOOR TILE DIMENSION</div>' +
        '<div class="chip-row">' +
        SIZES.map((s) => '<button class="chip mono' + (state.sizeMode === 'preset' && state.size === s ? ' selected' : '') + '" data-size="' + s + '">' + s + '</button>').join('') +
        '<button class="chip mono' + (state.sizeMode === 'custom' ? ' selected' : '') + '" data-size-mode="custom">' + CUSTOM_SIZE.toUpperCase() + '</button>' +
        '<button class="chip mono' + (state.sizeMode === 'auto' ? ' selected' : '') + '" data-size-mode="auto">' + AUTO_SIZE.toUpperCase() + '</button>' +
        '</div>' +
        (state.sizeMode === 'custom' ? customSizeHtml() : '') +
        (state.sizeMode === 'auto' ? '<p class="step-sub" style="margin-top:12px; font-size:13px">De\u2019vyora picks the module from the room, the theme and what the catalog actually stocks.</p>' : '') +
        '<div class="section-lbl mono">SURFACE FINISH</div>' +
        '<div class="finish-grid">' + FINISHES.map((f) => {
          const sel = state.finish === f.label;
          return '<button class="finish-card' + (sel ? ' selected' : '') + '" data-finish="' + f.label + '"><img src="' + f.img + '" alt="" loading="lazy" decoding="async" width="128" height="128"><span style="flex:1;min-width:0"><span class="fl">' + f.label + '</span><span class="fs mono">' + f.spec + '</span></span></button>';
        }).join('') + '</div>' +
        '</div>';
      body.querySelectorAll('[data-size]').forEach((btn) => btn.addEventListener('click', () => {
        state.sizeMode = 'preset';
        state.size = btn.dataset.size;
        render();
      }));
      body.querySelectorAll('[data-size-mode]').forEach((btn) => btn.addEventListener('click', () => {
        state.sizeMode = btn.dataset.sizeMode;
        if (state.sizeMode === 'custom') { state.customSizeOpen = true; state.revealList = true; loadCatalogSizes(); }
        render();
      }));
      wireCustomSize(body);
      body.querySelectorAll('[data-finish]').forEach((btn) => btn.addEventListener('click', () => { state.finish = btn.dataset.finish; render(); }));
      return;
    }

    if (state.step === 4) {
      const area = referenceAreas();
      const r = REFERENCE_ROOM;

      body.innerHTML =
        '<p class="step-sub" style="margin-top:clamp(14px,1.6vw,20px)">' +
        'Quoted against a reference ' + r.lengthFt + '\u00D7' + r.widthFt + ' ft room tiled to ' +
        r.wallHeightFt + ' ft \u2014 ' + Math.round(area.floor) + ' sq ft of floor and ' +
        Math.round(area.walls) + ' sq ft of wall, ' + Math.round(area.total) +
        ' sq ft in all. Tiles only: no fixtures, fittings or labour. ' +
        'Pick more than one band to compare.</p>' +
        '<div class="budget-grid">' + BUDGETS.map((b) => {
          const sel = state.budgets.some((x) => x.tier === b.tier);
          const tiles = orderTiles();
          return '<button class="budget-card' + (sel ? ' selected' : '') + '" data-budget="' + b.tier + '" role="checkbox" aria-checked="' + sel + '">' +
            '<span class="budget-top"><span class="budget-tier mono">' + b.tier + '</span>' + (sel ? '<span class="budget-check">\u2713</span>' : '') + '</span>' +
            '<span class="budget-range serif">' + budgetRangeText(b) + '</span>' +
            '<span class="budget-note mono">TOTAL \u00B7 FLOOR + WALL TILES \u00B7 ABOUT ' + budgetRateText(b).toUpperCase() + ' / SQ FT</span>' +
            '<span class="budget-desc">' + b.desc + '</span>' +
            (tiles ? '<span class="budget-note mono">\u2248 ' + tiles.total + ' \u00D7 ' + escapeHtml(sizeText()) + ' TILES, CUTS INCLUDED</span>' : '') +
            '</button>';
        }).join('') + '</div>';

      body.querySelectorAll('[data-budget]').forEach((btn) => btn.addEventListener('click', () => {
        const band = BUDGETS.find((b) => b.tier === btn.dataset.budget);
        const already = state.budgets.some((x) => x.tier === band.tier);
        // Kept in the order they are offered, so the brief reads the
        // same way however they were clicked.
        const chosen = state.budgets.filter((x) => x.tier !== band.tier);
        if (!already) chosen.push(band);
        state.budgets = BUDGETS.filter((b) => chosen.some((x) => x.tier === b.tier));
        render();
      }));
      return;
    }

    if (state.step === 5) {
      body.innerHTML =
        '<div style="margin-top:clamp(18px,2vw,26px)">' +
        '<div class="section-lbl mono" style="margin-top:0">DESIGN THEME</div>' +
        '<div class="palette-grid">' + THEMES.map((p) => {
          const sel = state.theme === p.label;
          // The studio-decides card carries no swatches: naming colours
          // for it would promise a palette that has not been chosen yet.
          // Its materials strip carries the idea instead.
          const swatches = p.sw.length
            ? '<span class="swatch-row">' + p.sw.map((c) => '<span class="swatch" style="background:' + c + '"></span>').join('') + '</span>'
            : '';
          const materials = '<span class="material-row">' + p.materials.map((m) =>
            '<span class="material" style="background:' + m.css + '" title="' + escapeHtml(m.name) + '"></span>').join('') + '</span>';
          // loading="lazy" because ten previews sit below the fold of
          // every earlier step; decoding="async" keeps them off the
          // paint path.
          return '<button class="palette-card' + (sel ? ' selected' : '') + '" data-palette="' + escapeHtml(p.label) + '">' +
            '<img class="palette-art" src="' + p.art + '" alt="" loading="lazy" decoding="async">' +
            '<span class="palette-body">' +
            '<span><span class="pl">' + escapeHtml(p.label) + '</span><span class="ps mono">' + p.spec + '</span></span>' +
            materials + swatches +
            '</span></button>';
        }).join('') + '</div>' +
        '<div class="section-lbl mono">GROUT TONE</div>' +
        '<div class="chip-row">' + GROUTS.map((g) => '<button class="chip mono' + (state.grout === g ? ' selected' : '') + '" data-grout="' + g + '">' + g + '</button>').join('') + '</div>' +
        '</div>';
      body.querySelectorAll('[data-palette]').forEach((btn) => btn.addEventListener('click', () => { state.theme = btn.dataset.palette; render(); }));
      body.querySelectorAll('[data-grout]').forEach((btn) => btn.addEventListener('click', () => { state.grout = btn.dataset.grout; render(); }));
      return;
    }

    if (state.step === 6) {
      const summary = [
        ['ROOM', state.room || '—'], ['FEATURE WALL', featureText()], ['FLOOR MODULE', sizeText()],
        ['FINISH', state.finish], ['BUDGET', budgetText()],
        ['THEME', state.theme], ['GROUT', state.grout], ['CAMERA', state.view],
      ];
      body.innerHTML = '<div class="summary-card" style="margin-top:clamp(18px,2vw,26px)">' +
        summary.map(([k, v]) => '<div class="summary-row"><span class="k mono">' + k + '</span><span class="v">' + v + '</span></div>').join('') +
        '</div>';
      return;
    }

    if (state.step === 7) {
      body.innerHTML = '<div class="view-grid">' + viewsFor(state.room).map((v) => {
        const sel = state.view === v.label;
        return '<button class="view-card' + (sel ? ' selected' : '') + '" data-view="' + v.label + '"><span class="vl mono">' + v.label + '</span><span class="vd">' + v.desc + '</span></button>';
      }).join('') + '</div>';
      body.querySelectorAll('[data-view]').forEach((btn) => btn.addEventListener('click', () => { state.view = btn.dataset.view; render(); }));
      return;
    }
  }

  // ============================================================
  // GENERATE — real call, honest loading state (no fake progress)
  // ============================================================

  function buildBriefText() {
    return [
      'Design a ' + state.room + ' with ' + featureText().toLowerCase() + '.',
      (state.sizeMode === 'auto'
        ? 'Choose the floor tile module yourself, from what the catalog stocks, in a ' + state.finish + ' finish.'
        : 'Use ' + sizeText() + ' floor tiles in a ' + state.finish + ' finish.'),
      budgetBrief(),
      themeBrief(),
      'Client view requested for the handout: ' + state.view + '.',
    ].join(' ');
  }

  async function runGenerate() {
    state.stage = 'generating';
    render();

    try {
      const payload = {
        text: buildBriefText(),
        room: state.room,
        style: state.theme,
        budget: budgetBrief(),
        combinationCount: boardCount(),
      };
      const result = await CasaApi.moodBoards.generate(payload);
      state.combinations = result.combinations || [];
      // Index 0 now means a different board than it did a moment ago.
      state.visualizations = {};
      state.expandedProducts = {};
      state.warnings = result.warnings || [];

      if (state.combinations.length === 0) {
        state.errorMessage = 'No combinations came back for this brief. Try widening the budget band or picking a different room.';
        state.stage = 'error';
        render();
        return;
      }

      const ids = [...new Set(state.combinations.flatMap((c) => c.tiles.map((t) => t.tileId)))];
      try {
        const tiles = await CasaApi.moodBoards.tiles(ids);
        state.tilesById = {};
        tiles.forEach((t) => { state.tilesById[t.id] = t; });
      } catch (err) {
        state.tilesById = {}; // non-fatal -- the cards still render, just without images or stock
      }

      state.stage = 'results';
      render();
    } catch (err) {
      state.errorMessage = (err && err.message) || 'Something went wrong generating this mood board.';
      state.stage = 'error';
      render();
    }
  }

  // ============================================================
  // LOAD AN EXISTING SAVED BOARD — Projects page's "Open Board" links
  // here with ?boardId=. Reuses GET /mood-boards/:id and the same
  // tile-lookup endpoint the wizard already uses; no new backend.
  // ============================================================

  async function loadBoardFromId(boardId) {
    state.viewOnly = true;
    state.pendingBoardId = boardId;
    state.stage = 'generating';
    render();

    try {
      const board = await CasaApi.moodBoards.get(boardId);
      state.loadedBoard = board;
      state.combinations = board.combinations || [];
      state.visualizations = {};
      state.expandedProducts = {};
      state.room = board.room;
      state.theme = board.style;

      if (state.combinations.length === 0) {
        state.errorMessage = 'This saved project has no combinations.';
        state.stage = 'error';
        render();
        return;
      }

      const ids = [...new Set(state.combinations.flatMap((c) => c.tiles.map((t) => t.tileId)))];
      try {
        const tiles = await CasaApi.moodBoards.tiles(ids);
        state.tilesById = {};
        tiles.forEach((t) => { state.tilesById[t.id] = t; });
      } catch (err) {
        state.tilesById = {};
      }

      state.stage = 'results';
      render();
    } catch (err) {
      state.errorMessage = (err && err.message) || 'Could not load this saved project.';
      state.stage = 'error';
      render();
    }
  }

  function renderGenerating() {
    const main = document.getElementById('mainContent');
    const sub = state.viewOnly ? 'Loading your saved mood board…' : 'Synthesizing your mood boards…';
