<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa de Aurum — Generated Scenes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/shell.css">
<style>
  .filters-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center;justify-content:space-between;}
  .status-chips{display:flex;gap:8px;flex-wrap:wrap;}
  .view-toggle{display:flex;gap:6px;}
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;}
  @media (max-width:960px){.grid{grid-template-columns:1fr 1fr;}}
  @media (max-width:640px){.grid{grid-template-columns:1fr;}}
  .scene-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .scene-hero{aspect-ratio:4/3;position:relative;display:flex;}
  .scene-hero .a{flex:1.6;} .scene-hero .b{flex:1;}
  .scene-hero .tag{position:absolute;top:10px;left:12px;font-family:var(--mono);font-size:9.5px;color:rgba(255,255,255,.9);background:rgba(26,22,17,.45);padding:3px 8px;border-radius:8px;}
  .scene-hero .tag2{position:absolute;top:10px;right:12px;font-family:var(--mono);font-size:9.5px;color:rgba(255,255,255,.9);background:rgba(26,22,17,.45);padding:3px 8px;border-radius:8px;}
  .scene-body{padding:14px 16px;}
  .scene-body h4{font-family:var(--display);font-weight:600;font-size:15.5px;color:var(--charcoal);margin:0 0 8px;}
  .scene-meta{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
  .scene-meta .row{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:10.5px;}
  .scene-meta .row .k{color:var(--stone-600);}
  .scene-meta .row .v{color:var(--ink);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:65%;}
  .scene-foot{display:flex;align-items:center;justify-content:space-between;padding-top:11px;border-top:1px solid var(--line);}
</style>
</head>
<body>
<div id="casa-main-content">
  <div class="casa-pageheader">
    <div>
      <h1>Generated Scenes</h1>
      <p>Approved mood boards — the combination staff locked in with the client.</p>
    </div>
  </div>

  <div class="casa-stat-grid" id="statGrid">
    <div class="casa-stat-card"><div class="label">Loading…</div><div class="value">—</div></div>
  </div>

  <div class="filters-row">
    <div class="status-chips" id="statusChips"></div>
    <div class="view-toggle" id="viewToggle"></div>
  </div>

  <div id="content"><div class="casa-empty">Loading…</div></div>
  <div class="casa-hint" id="pagerHint" style="margin-top:12px;"></div>
</div>

<script src="assets/api-client.js"></script>
<script src="assets/notifications.js"></script>
<script src="assets/shell.js"></script>
<script>
  function esc(s) { return CasaShell.escapeHtml(s); }

  const STATUSES = [
    { v: 'APPROVED', l: 'Approved' },
    { v: '', l: 'All' },
    { v: 'GENERATED', l: 'Generated' },
    { v: 'REFINED', l: 'Refined' },
    { v: 'ARCHIVED', l: 'Archived' },
  ];
  const STATUS_PILL = { DRAFT: 'neutral', GENERATED: 'warn', REFINED: 'warn', APPROVED: 'ok', REJECTED: 'err', ARCHIVED: 'neutral' };

  const STYLE_TONES = {
    SUBTLE: ['#E7E0D0', '#C9BFA9'],
    LUXURY: ['#D8B677', '#AD8348'],
    BOLD: ['#33465A', '#1A1611'],
  };
  function tonesFor(style) { return STYLE_TONES[(style || '').toUpperCase()] || ['#C9BFA9', '#8F8062']; }

  let statusFilter = 'APPROVED';
  let view = 'grid';
  let currentPage = 1;
  let boards = [];
  let pageMeta = null;

  function selectedCombo(board) {
    const combos = Array.isArray(board.combinations) ? board.combinations : [];
    const idx = board.selectedIndex != null ? board.selectedIndex : 0;
    return combos[idx] || combos[0] || null;
  }

  function renderStatusChips() {
    document.getElementById('statusChips').innerHTML = STATUSES.map((s) => `
      <div class="casa-chip ${statusFilter === s.v ? 'on' : ''}" data-v="${esc(s.v)}">${esc(s.l)}</div>
    `).join('');
    document.querySelectorAll('#statusChips .casa-chip').forEach((chip) => {
      chip.addEventListener('click', () => { statusFilter = chip.dataset.v; currentPage = 1; renderStatusChips(); loadBoards(); });
    });
  }

  function renderViewToggle() {
    document.getElementById('viewToggle').innerHTML = ['grid', 'table'].map((v) => `
      <div class="casa-chip ${view === v ? 'on' : ''}" data-v="${v}">${v === 'grid' ? 'Gallery' : 'Table'}</div>
    `).join('');
    document.querySelectorAll('#viewToggle .casa-chip').forEach((chip) => {
      chip.addEventListener('click', () => { view = chip.dataset.v; renderViewToggle(); renderBoards(); });
    });
  }

  function renderStats() {
    const approved = boards.filter((b) => b.status === 'APPROVED').length;
    document.getElementById('statGrid').innerHTML = [
      `<div class="casa-stat-card"><div class="label">On this page</div><div class="value">${boards.length}</div><div class="sub">${pageMeta ? `of ${pageMeta.total} total` : ''}</div></div>`,
      `<div class="casa-stat-card"><div class="label">Approved</div><div class="value">${approved}</div></div>`,
      `<div class="casa-stat-card"><div class="label">Avg. combinations / board</div><div class="value">${boards.length ? (boards.reduce((s, b) => s + (Array.isArray(b.combinations) ? b.combinations.length : 0), 0) / boards.length).toFixed(1) : '—'}</div></div>`,
    ].join('');
  }

  function cardHtml(b) {
    const combo = selectedCombo(b);
    const tones = tonesFor(b.style);
    const tileNames = combo ? combo.tiles.map((t) => t.name || t.role).join(', ') : '—';
    return `
      <div class="scene-card">
        <div class="scene-hero">
          <div class="a" style="background:linear-gradient(160deg,${tones[0]},${tones[1]});"></div>
          <div class="b" style="background:linear-gradient(160deg,${tones[1]},${tones[0]});"></div>
          <span class="tag">${esc(b.id.slice(0, 10))}</span>
          <span class="tag2">${combo ? combo.tiles.length : 0} tiles</span>
        </div>
        <div class="scene-body">
          <h4>${esc(combo?.board_name || b.clientBrief.slice(0, 40))}</h4>
          <div class="scene-meta">
            <div class="row"><span class="k">Staff</span><span class="v">${esc(b.createdBy?.name || 'Unknown')}</span></div>
            <div class="row"><span class="k">Style / Room</span><span class="v">${esc(b.style)} · ${esc(b.room)}</span></div>
            <div class="row"><span class="k">Tiles</span><span class="v" title="${esc(tileNames)}">${esc(tileNames)}</span></div>
            <div class="row"><span class="k">Created</span><span class="v">${esc(CasaApi.relativeTime(b.createdAt))}</span></div>
          </div>
          <div class="scene-foot">
            <span class="casa-pill ${STATUS_PILL[b.status] || 'neutral'}">${esc(b.status)}</span>
            <span class="casa-hint">${b.customer?.name || 'No customer linked'}</span>
          </div>
        </div>
      </div>`;
  }

  function rowHtml(b) {
    const combo = selectedCombo(b);
    return `
      <tr>
        <td><div style="font-family:var(--mono);font-size:11.5px;">${esc(b.id.slice(0, 12))}</div><div class="casa-hint">${esc(new Date(b.createdAt).toLocaleDateString())}</div></td>
        <td><div style="font-weight:600;font-size:13px;">${esc(combo?.board_name || b.clientBrief.slice(0, 40))}</div><div class="casa-hint">${esc(b.clientBrief.slice(0, 60))}</div></td>
        <td>${esc(b.style)}</td>
        <td>${esc(b.room)}</td>
        <td>${combo ? combo.tiles.length : 0}</td>
        <td><span class="casa-pill ${STATUS_PILL[b.status] || 'neutral'}">${esc(b.status)}</span></td>
      </tr>`;
  }

  function renderBoards() {
    const container = document.getElementById('content');
    if (!boards.length) {
      container.innerHTML = '<div class="casa-empty">No mood boards match this filter.</div>';
      return;
    }
    if (view === 'grid') {
      container.innerHTML = `<div class="grid">${boards.map(cardHtml).join('')}</div>`;
    } else {
      container.innerHTML = `
        <div class="casa-panel" style="margin-bottom:0;">
          <table class="casa-table">
            <thead><tr><th>Scene</th><th>Name / Brief</th><th>Style</th><th>Room</th><th>Tiles</th><th>Status</th></tr></thead>
            <tbody>${boards.map(rowHtml).join('')}</tbody>
          </table>
        </div>`;
    }
  }

  async function loadBoards() {
    document.getElementById('content').innerHTML = '<div class="casa-empty">Loading…</div>';
    try {
      const params = { page: currentPage, limit: 24 };
      if (statusFilter) params.status = statusFilter;
      const { boards: b, meta } = await CasaApi.moodBoards.list(params);
      boards = b;
      pageMeta = meta;
      renderStats();
      renderBoards();
      document.getElementById('pagerHint').textContent = meta.total ? `Showing ${boards.length} of ${meta.total}` : '';
    } catch (err) {
      document.getElementById('content').innerHTML = `<div class="casa-error-inline">${esc(err.message || 'Failed to load mood boards.')}</div>`;
    }
  }

  (async () => {
    await CasaShell.init({ current: 'admin-generated-scenes.html', allowedRoles: ['ADMIN','OWNER'] });
    renderStatusChips();
    renderViewToggle();
    await loadBoards();
  })();
</script>
</body>
</html>
