<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Casa de Aurum — Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #221d18;
        --charcoal: #1a1611;
        --stone-50: #f1ece1;
        --stone-100: #e9e2d3;
        --stone-200: #dfd5bf;
        --stone-400: #b7ab94;
        --stone-600: #78705f;
        --stone-700: #4b443a;
        --brass: #ad8348;
        --brass-light: #d8b677;
        --clay: #9c4b2c;
        --sage: #7a9165;
        --line: rgba(34, 29, 24, 0.14);
        --shadow: 0 12px 30px rgba(26, 22, 17, 0.14);
        --radius: 3px;
        --display: "Fraunces", serif;
        --sans: "Inter", sans-serif;
        --mono: "IBM Plex Mono", monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background: var(--stone-50);
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction:column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }
      .grain {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        opacity: 0.05;
        background-image: radial-gradient(
          circle at 1px 1px,
          #000 1px,
          transparent 0
        );
        background-size: 3px 3px;
      }
      .card {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 380px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 36px 32px 32px;
      }
      .wordmark {
        text-align: center;
        margin-bottom: 6px;
      }
      .wordmark .name {
        font-family: var(--display);
        font-weight: 600;
        font-size: 24px;
        letter-spacing: 0.04em;
        color: var(--charcoal);
      }
      .wordmark .name em {
        font-style: normal;
        color: var(--brass);
      }
      .sub {
        font-family: var(--mono);
        font-size: 10.5px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--stone-600);
        text-align: center;
        margin-bottom: 28px;
      }
      .field {
        margin-bottom: 16px;
      }
      .field label {
        display: block;
        font-size: 12px;
        color: var(--stone-600);
        margin-bottom: 6px;
        font-family: var(--mono);
        letter-spacing: 0.03em;
      }
      .field input {
        width: 100%;
        font-family: var(--mono);
        font-size: 13.5px;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: var(--stone-50);
        color: var(--ink);
      }
      .field input:focus {
        outline: 2px solid var(--brass);
        outline-offset: 1px;
      }
      button.primary {
        width: 100%;
        font-family: var(--sans);
        font-weight: 600;
        font-size: 13.5px;
        background: var(--charcoal);
        color: var(--stone-50);
        border: none;
        padding: 13px 22px;
        border-radius: 2px;
        cursor: pointer;
        letter-spacing: 0.01em;
        transition: background 0.15s ease;
        margin-top: 6px;
      }
      button.primary:hover {
        background: #000;
      }
      button.primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .error-box {
        background: #fbeeea;
        border: 1px solid var(--clay);
        color: var(--clay);
        font-size: 12.5px;
        padding: 10px 12px;
        border-radius: 2px;
        margin-bottom: 16px;
        display: none;
        font-family: var(--sans);
      }
      .success-box {
        background: #f1f5ee;
        border: 1px solid var(--sage);
        color: var(--sage);
        font-size: 12.5px;
        padding: 10px 12px;
        border-radius: 2px;
        margin-bottom: 16px;
        display: none;
        font-family: var(--sans);
      }
      .forgot {
        display: block;
        text-align: center;
        margin-top: 18px;
        font-size: 12.5px;
        color: var(--stone-600);
        text-decoration: none;
        font-family: var(--mono);
      }
      .forgot:hover {
        color: var(--brass);
      }
      footer.note {
        text-align: center;
        margin-top: 24px;
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--stone-400);
      }
    </style>
  </head>
  <body>
    <div class="grain"></div>
    <div class="card">
      <div class="wordmark"><div class="name">CASA DE A<em>U</em>RUM</div></div>
      <div class="sub">Internal Studio Tools</div>

      <div class="error-box" id="errorBox"></div>
      <div class="success-box" id="successBox"></div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            autocomplete="username"
            placeholder="you@casadeaurum.com"
            required
          />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            autocomplete="current-password"
            placeholder="********"
            required
          />
        </div>
        <button type="submit" class="primary" id="submitBtn">Sign in</button>
      </form>

      <a href="#" class="forgot" id="forgotLink">Forgot your password?</a>
    </div>
    <footer class="note">CASA DE AURUM — INTERNAL OPERATIONS TOOL</footer>

    <script src="assets/api-client.js"></script>
    <script>
      const form = document.getElementById("loginForm");
      const errorBox = document.getElementById("errorBox");
      const successBox = document.getElementById("successBox");
      const submitBtn = document.getElementById("submitBtn");

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.style.display = "block";
        successBox.style.display = "none";
      }
      function showSuccess(msg) {
        successBox.textContent = msg;
        successBox.style.display = "block";
        errorBox.style.display = "none";
      }

      // If a session already exists (refresh cookie still valid), skip straight past login.
      (async () => {
        const params = new URLSearchParams(location.search);
        const redirect = params.get("redirect") || "dashboard.html";
        const user = await CasaApi.auth.ensureSession();
        if (user) location.href = redirect;
      })();

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorBox.style.display = "none";
        submitBtn.disabled = true;
        submitBtn.textContent = "Signing in...";

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        try {
          await CasaApi.auth.login(email, password);
          const params = new URLSearchParams(location.search);
          location.href = params.get("redirect") || "dashboard.html";
        } catch (err) {
          showError(
            err.message ||
              "Could not sign in. Check your credentials and try again.",
          );
          submitBtn.disabled = false;
          submitBtn.textContent = "Sign in";
        }
      });

      document
        .getElementById("forgotLink")
        .addEventListener("click", async (e) => {
          e.preventDefault();
          const email = prompt(
            "Enter your account email - we will send a reset link if it exists:",
          );
          if (!email) return;
          try {
            await CasaApi.auth.forgotPassword(email.trim());
            showSuccess(
              "If an account exists for that email, a reset link has been sent.",
            );
          } catch (err) {
            showError(err.message || "Something went wrong. Try again.");
          }
        });
    </script>
  </body>
</html>
