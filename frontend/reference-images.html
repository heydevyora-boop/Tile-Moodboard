<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa de Aurum — Reference Image Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#221D18; --charcoal:#1A1611; --stone-50:#F1ECE1; --stone-100:#E9E2D3; --stone-200:#DFD5BF;
    --stone-400:#B7AB94; --stone-600:#78705F; --stone-700:#4B443A; --brass:#AD8348; --brass-light:#D8B677;
    --clay:#9C4B2C; --sage:#7A9165; --line: rgba(34,29,24,0.14); --shadow: 0 12px 30px rgba(26,22,17,0.14);
    --radius: 3px; --display: 'Fraunces', serif; --sans: 'Inter', sans-serif; --mono: 'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--stone-50);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  a{color:var(--brass);text-decoration:none;}
  header.top{padding:26px clamp(18px,4vw,56px) 0;background:var(--stone-50);border-bottom:1px solid var(--line);}
  .brandrow{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;padding-bottom:20px;}
  .wordmark .name{font-family:var(--display);font-weight:600;font-size:clamp(22px,3vw,30px);letter-spacing:.04em;color:var(--charcoal);}
  .wordmark .name em{font-style:normal;color:var(--brass);}
  .wordmark .sub{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--stone-600);}
  .flowchip{font-family:var(--mono);font-size:12px;color:var(--stone-600);display:flex;align-items:center;gap:16px;}
  main{max-width:1280px;margin:0 auto;padding:32px clamp(18px,4vw,56px) 60px;}
  .tool-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
  h1{font-family:var(--display);font-weight:600;font-size:28px;margin:0 0 4px;color:var(--charcoal);}
  .tool-head p{margin:0;font-family:var(--mono);font-size:12px;color:var(--stone-600);}

  .panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:20px;}
  .panel-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .panel-head h3{margin:0;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;font-family:var(--mono);color:var(--stone-700);font-weight:500;}
  .panel-body{padding:18px;}

  .upload-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:end;}
  @media (max-width:900px){.upload-grid{grid-template-columns:repeat(2,1fr);}}
  .field label{display:block;font-size:11px;color:var(--stone-600);margin-bottom:5px;font-family:var(--mono);}
  .field input, .field select{width:100%;font-family:var(--mono);font-size:12.5px;padding:9px 10px;border:1px solid var(--line);border-radius:2px;background:var(--stone-50);color:var(--ink);}
  button.primary{grid-column:span 1;font-family:var(--sans);font-weight:600;font-size:13px;background:var(--charcoal);color:var(--stone-50);border:none;padding:10px 16px;border-radius:2px;cursor:pointer;}
  button.primary:hover{background:#000;}
  button.primary:disabled{opacity:.5;cursor:not-allowed;}
  button.ghost{font-family:var(--sans);font-weight:600;font-size:11.5px;background:none;color:var(--stone-700);border:1px solid var(--line);padding:5px 10px;border-radius:2px;cursor:pointer;}
  button.ghost:hover{border-color:var(--brass);color:var(--brass);}
  button.ghost.danger:hover{border-color:var(--clay);color:var(--clay);}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
  .toolbar input[type=text]{font-family:var(--mono);font-size:13px;padding:9px 12px;border:1px solid var(--line);border-radius:2px;background:#fff;min-width:220px;}
  .toolbar select{font-family:var(--mono);font-size:12.5px;padding:9px 10px;border:1px solid var(--line);border-radius:2px;background:#fff;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .card .thumb{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--stone-200);display:block;cursor:pointer;}
  .card .body{padding:10px 12px;}
  .card .tag{font-weight:600;font-size:12.5px;margin-bottom:4px;word-break:break-word;}
  .card .meta{font-family:var(--mono);font-size:10.5px;color:var(--stone-600);display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .card .badge{background:var(--stone-100);padding:2px 6px;border-radius:8px;}
  .card .desc{font-size:11.5px;color:var(--stone-700);margin-bottom:8px;min-height:14px;}
  .card .actions{display:flex;gap:8px;flex-wrap:wrap;}
  .card input[type=file]{display:none;}

  .error-box{background:#FBEEEA;border:1px solid var(--clay);color:var(--clay);font-size:12px;padding:9px 11px;border-radius:2px;margin-top:10px;display:none;}

  .lightbox{display:none;position:fixed;inset:0;background:rgba(20,16,12,0.85);z-index:60;align-items:center;justify-content:center;padding:30px;}
  .lightbox img{max-width:90vw;max-height:85vh;border-radius:2px;box-shadow:0 12px 30px rgba(0,0,0,0.4);}
  .lightbox .close{position:absolute;top:24px;right:32px;color:#fff;font-family:var(--mono);font-size:13px;cursor:pointer;}

  footer.note{max-width:1280px;margin:0 auto;padding:0 clamp(18px,4vw,56px) 50px;font-family:var(--mono);font-size:11px;color:var(--stone-400);text-align:center;}
</style>
</head>
<body>

<header class="top">
  <div class="brandrow">
    <div class="wordmark">
      <div class="name">CASA DE A<em>U</em>RUM</div>
      <div class="sub">Internal Studio Tools . Reference Image Library</div>
    </div>
    <div class="flowchip">
      <span id="whoami"></span>
      <a href="dashboard.html">Dashboard</a>
      <a href="design-rules.html">Design Rules</a>
      <a href="#" id="logoutLink" style="color:var(--clay);">Sign out</a>
    </div>
  </div>
</header>

<main>
  <div class="tool-head">
    <div>
      <h1>Reference Image Library</h1>
      <p>Example combinations the owner considers on-brand -- used to steer AI mood board generation.</p>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h3>Upload an Image</h3></div>
    <div class="panel-body">
      <div class="upload-grid">
        <div class="field">
          <label>Style tag</label>
          <input type="text" id="uploadStyleTag" placeholder="luxury_bathroom_02">
        </div>
        <div class="field">
          <label>Style</label>
          <input type="text" id="uploadStyle" placeholder="LUXURY">
        </div>
        <div class="field">
          <label>Room</label>
          <input type="text" id="uploadRoom" placeholder="BATHROOM">
        </div>
        <div class="field">
          <label>Description</label>
          <input type="text" id="uploadDescription" placeholder="Optional note">
        </div>
        <div class="field">
          <label>Image file</label>
          <input type="file" id="uploadFile" accept="image/jpeg,image/png,image/webp">
        </div>
      </div>
      <button class="primary" id="uploadBtn" style="margin-top:12px;">Upload Image</button>
      <div class="error-box" id="uploadError"></div>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="Search style tag or description...">
    <select id="styleFilter"><option value="">All styles</option></select>
    <select id="roomFilter"><option value="">All rooms</option></select>
    <button class="ghost" id="clearFiltersBtn">Clear</button>
  </div>

  <div class="grid" id="imageGrid">Loading...</div>
</main>

<div class="lightbox" id="lightbox">
  <span class="close" id="lightboxClose">Close X</span>
  <img id="lightboxImg" src="" alt="">
</div>

<footer class="note">CASA DE AURUM — INTERNAL OPERATIONS TOOL</footer>

<script src="assets/api-client.js"></script>
<script src="assets/notifications.js"></script>
<script>
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function absoluteUrl(imageUrl) {
    const base = (window.CASA_API_BASE || 'http://localhost:5000/api/v1').replace(/\/api\/v1\/?$/, '');
    return base + imageUrl;
  }

  let currentQuery = {};

  async function loadCategories() {
    try {
      const cats = await CasaApi.referenceImages.categories();
      const styleSel = document.getElementById('styleFilter');
      const roomSel = document.getElementById('roomFilter');
      styleSel.innerHTML = `<option value="">All styles</option>` + cats.styles.map((s) => `<option value="${s}">${s}</option>`).join('');
      roomSel.innerHTML = `<option value="">All rooms</option>` + cats.rooms.map((r) => `<option value="${r}">${r}</option>`).join('');
    } catch (err) {
      // non-fatal -- filters just stay empty
    }
  }

  function cardHtml(img) {
    return `
      <div class="card" data-id="${img.id}">
        <img class="thumb" src="${absoluteUrl(img.imageUrl)}" alt="${escapeHtml(img.styleTag)}" data-action="preview" data-id="${img.id}">
        <div class="body">
          <div class="tag">${escapeHtml(img.styleTag)}</div>
          <div class="meta">
            ${img.style ? `<span class="badge">${escapeHtml(img.style)}</span>` : ''}
            ${img.room ? `<span class="badge">${escapeHtml(img.room)}</span>` : ''}
          </div>
          <div class="desc">${img.description ? escapeHtml(img.description) : ''}</div>
          <div class="actions">
            <label class="ghost" style="cursor:pointer;">
              Replace
              <input type="file" accept="image/jpeg,image/png,image/webp" data-action="replace" data-id="${img.id}">
            </label>
            <button class="ghost danger" data-action="delete" data-id="${img.id}">Delete</button>
          </div>
        </div>
      </div>`;
  }

  async function loadImages() {
    const grid = document.getElementById('imageGrid');
    try {
      const { images } = await CasaApi.referenceImages.list({ ...currentQuery, limit: 100 });
      grid.innerHTML = images.length
        ? images.map(cardHtml).join('')
        : `<p style="font-family:var(--mono);font-size:12px;color:var(--stone-600);">No images match.</p>`;

      grid.querySelectorAll('[data-action="preview"]').forEach((el) => el.addEventListener('click', () => openLightbox(el.src)));
      grid.querySelectorAll('[data-action="delete"]').forEach((el) => el.addEventListener('click', () => deleteImage(el.dataset.id)));
      grid.querySelectorAll('[data-action="replace"]').forEach((el) => el.addEventListener('change', (e) => replaceImage(el.dataset.id, e.target.files[0])));
    } catch (err) {
      grid.innerHTML = `<p style="color:var(--clay);font-family:var(--mono);font-size:12px;">${escapeHtml(err.message)}</p>`;
    }
  }

  function openLightbox(src) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightbox').style.display = 'flex';
  }
  document.getElementById('lightboxClose').addEventListener('click', () => { document.getElementById('lightbox').style.display = 'none'; });
  document.getElementById('lightbox').addEventListener('click', (e) => { if (e.target.id === 'lightbox') document.getElementById('lightbox').style.display = 'none'; });

  async function deleteImage(id) {
    if (!confirm('Delete this reference image? This cannot be undone.')) return;
    try {
      await CasaApi.referenceImages.remove(id);
      await loadImages();
      CasaNotify.success('Reference image deleted.');
    } catch (err) {
      CasaNotify.error('Delete failed: ' + err.message);
    }
  }

  async function replaceImage(id, file) {
    if (!file) return;
    const notice = CasaNotify.processing('Replacing image...');
    try {
      await CasaApi.referenceImages.replaceImage(id, file);
      await loadImages();
      notice.success('Image replaced.');
    } catch (err) {
      notice.error('Replace failed: ' + err.message);
    }
  }

  document.getElementById('uploadBtn').addEventListener('click', async () => {
    const errorBox = document.getElementById('uploadError');
    errorBox.style.display = 'none';

    const styleTag = document.getElementById('uploadStyleTag').value.trim();
    const style = document.getElementById('uploadStyle').value.trim();
    const room = document.getElementById('uploadRoom').value.trim();
    const description = document.getElementById('uploadDescription').value.trim();
    const file = document.getElementById('uploadFile').files[0];

    if (!styleTag || !file) {
      errorBox.textContent = 'Style tag and an image file are required.';
      errorBox.style.display = 'block';
      return;
    }

    const btn = document.getElementById('uploadBtn');
    btn.disabled = true;
    btn.textContent = 'Uploading...';
    const notice = CasaNotify.processing('Uploading reference image...');
    try {
      await CasaApi.referenceImages.upload(file, { styleTag, style, room, description });
      document.getElementById('uploadStyleTag').value = '';
      document.getElementById('uploadStyle').value = '';
      document.getElementById('uploadRoom').value = '';
      document.getElementById('uploadDescription').value = '';
      document.getElementById('uploadFile').value = '';
      await Promise.all([loadImages(), loadCategories()]);
      notice.success('Reference image uploaded.');
    } catch (err) {
      errorBox.textContent = err.message || 'Upload failed.';
      errorBox.style.display = 'block';
      notice.error(err.message || 'Upload failed.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Upload Image';
    }
  });

  let searchDebounce = null;
  document.getElementById('searchInput').addEventListener('input', (e) => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(() => {
      currentQuery.search = e.target.value.trim() || undefined;
      loadImages();
    }, 300);
  });
  document.getElementById('styleFilter').addEventListener('change', (e) => { currentQuery.style = e.target.value || undefined; loadImages(); });
  document.getElementById('roomFilter').addEventListener('change', (e) => { currentQuery.room = e.target.value || undefined; loadImages(); });
  document.getElementById('clearFiltersBtn').addEventListener('click', () => {
    currentQuery = {};
    document.getElementById('searchInput').value = '';
    document.getElementById('styleFilter').value = '';
    document.getElementById('roomFilter').value = '';
    loadImages();
  });

  (async () => {
    const currentUser = await CasaApi.requireAuth(['ADMIN','OWNER']);
    const ROLE_LABEL = { OWNER: 'Owner', ADMIN: 'Manager', STAFF: 'Sales Staff' };
    document.getElementById('whoami').textContent = `${currentUser.name} (${ROLE_LABEL[currentUser.role.name] || currentUser.role.name})`;
    document.getElementById('logoutLink').addEventListener('click', (e) => { e.preventDefault(); CasaApi.auth.logout(); });
    await Promise.all([loadImages(), loadCategories()]);
  })();
</script>
</body>
</html>
