<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa de Aurum — Catalog Detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/shell.css">
<style>
  .crumb{font-family:var(--mono);font-size:11px;color:var(--stone-600);margin-bottom:16px;display:flex;align-items:center;gap:7px;}
  .crumb .sep{color:var(--stone-400);}
  .detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start;}
  @media (max-width:900px){.detail-grid{grid-template-columns:1fr;}}
  .kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;}
  @media (max-width:520px){.kv-grid{grid-template-columns:1fr;}}
  .kv-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);}
  .kv-row .k{font-family:var(--mono);font-size:12px;color:var(--stone-600);}
  .kv-row .v{font-family:var(--mono);font-size:12px;color:var(--ink);font-weight:500;text-align:right;}
  .sticky{position:sticky;top:20px;}
  .tile-row{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid rgba(34,29,24,0.06);}
  .tile-row .sw{width:30px;height:30px;border-radius:2px;border:1px solid rgba(0,0,0,.08);flex:none;background-size:cover;background-position:center;background-color:var(--stone-200);}
  .tile-row .nm{font-size:12.5px;font-weight:600;color:var(--ink);}
  .tile-row .meta{font-family:var(--mono);font-size:10.5px;color:var(--stone-600);}
  .log-box{background:var(--charcoal);color:#D9D2C2;font-family:var(--mono);font-size:11.5px;line-height:1.6;padding:14px 16px;border-radius:2px;max-height:220px;overflow-y:auto;white-space:pre-wrap;}
</style>
</head>
<body>
<div id="casa-main-content">
  <div class="crumb">
    <a href="admin-extraction-status.html">Extraction Status</a><span class="sep">/</span>
    <span id="crumbBrand">…</span><span class="sep">/</span>
    <span id="crumbCatalog" style="color:var(--ink);">…</span>
  </div>

  <div class="casa-pageheader" style="border-bottom:1px solid var(--line);padding-bottom:18px;">
    <div>
      <h1 id="catalogTitle">Catalog Detail</h1>
      <p id="catalogSub">Loading…</p>
    </div>
    <div class="casa-actions">
      <button class="casa-btn secondary" id="retryBtn">Retry Extraction</button>
      <button class="casa-btn danger" id="removeBtn">Remove Catalog</button>
    </div>
  </div>

  <div id="notFound" class="casa-error-inline" style="display:none;">No catalog id given — open this page from Extraction Status.</div>

  <div class="detail-grid" id="detailGrid" style="display:none;">
    <div>
      <div class="casa-panel">
        <div class="panel-head"><h3>Extraction Record</h3><span class="casa-pill" id="statusPill"></span></div>
        <div class="panel-body kv-grid" id="recordBody"></div>
      </div>

      <div class="casa-panel" id="errorPanel" style="display:none;border-left:3px solid var(--clay);">
        <div class="panel-head"><h3>Error</h3></div>
        <div class="panel-body" id="errorBody" style="font-family:var(--mono);font-size:12.5px;color:var(--clay);"></div>
      </div>

      <div class="casa-panel" id="logPanel" style="display:none;">
        <div class="panel-head"><h3>Processing Log</h3></div>
        <div class="panel-body"><div class="log-box" id="logBox"></div></div>
      </div>

      <div class="casa-panel">
        <div class="panel-head"><h3>Extracted Tiles<span class="hint" id="tileCountHint"></span></h3></div>
        <div class="panel-body" style="padding:0;" id="tileList">
          <div class="casa-empty">Loading…</div>
        </div>
      </div>
    </div>

    <div class="sticky">
      <div class="casa-panel">
        <div class="panel-head"><h3>Source File</h3></div>
        <div class="panel-body kv-grid" id="sourceBody" style="grid-template-columns:1fr;"></div>
      </div>
    </div>
  </div>
</div>

<script src="../assets/api-client.js"></script>
<script src="../assets/notifications.js"></script>
<script src="assets/shell.js"></script>
<script>
  const STATUS_PILL = { PENDING: 'neutral', PROCESSING: 'warn', COMPLETED: 'ok', FAILED: 'err' };
  function esc(s) { return CasaShell.escapeHtml(s); }
  function fmtDate(d) { return d ? new Date(d).toLocaleString() : '—'; }

  const catalogId = new URLSearchParams(location.search).get('id');
  let currentCatalog = null;

  function kv(k, v) {
    return `<div class="kv-row"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`;
  }

  function renderCatalog(cat) {
    currentCatalog = cat;
    document.getElementById('detailGrid').style.display = '';
    document.getElementById('catalogTitle').textContent = cat.fileName;
    document.getElementById('catalogSub').textContent = `${cat.brand?.name || 'Unknown brand'} · ${cat.status}`;
    document.getElementById('crumbBrand').textContent = cat.brand?.name || 'Unknown brand';
    document.getElementById('crumbCatalog').textContent = cat.fileName;

    document.getElementById('statusPill').className = `casa-pill ${STATUS_PILL[cat.status] || 'neutral'}`;
    document.getElementById('statusPill').textContent = cat.status;

    const duration = cat.startedAt && cat.completedAt
      ? `${Math.round((new Date(cat.completedAt) - new Date(cat.startedAt)) / 1000)} s`
      : '—';

    document.getElementById('recordBody').innerHTML = [
      kv('Brand', cat.brand?.name || '—'),
      kv('Status', cat.status),
      kv('Pages', cat.totalPages ? `${cat.currentPage || 0} / ${cat.totalPages}` : '—'),
      kv('Tiles extracted', cat.tilesExtracted || 0),
      kv('Duplicate images skipped', cat.duplicateImagesSkipped || 0),
      kv('Duplicate tiles skipped', cat.duplicateTilesSkipped || 0),
      kv('Queue position', cat.queuePosition ?? '—'),
      kv('Started', fmtDate(cat.startedAt)),
      kv('Completed', fmtDate(cat.completedAt)),
      kv('Duration', duration),
      kv('Uploaded by', cat.uploadedBy?.name || 'System'),
      kv('Created', fmtDate(cat.createdAt)),
    ].join('');

    document.getElementById('sourceBody').innerHTML = [
      kv('File name', cat.fileName),
      kv('Catalog ID', cat.id),
      kv('Brand ID', cat.brandId),
    ].join('');

    if (cat.errorMessage) {
      document.getElementById('errorPanel').style.display = '';
      document.getElementById('errorBody').textContent = cat.errorMessage;
    } else {
      document.getElementById('errorPanel').style.display = 'none';
    }

    if (cat.processingLog) {
      document.getElementById('logPanel').style.display = '';
      document.getElementById('logBox').textContent = cat.processingLog;
    } else {
      document.getElementById('logPanel').style.display = 'none';
    }

    document.getElementById('retryBtn').style.display = (cat.status === 'FAILED' || cat.status === 'PENDING') ? '' : 'none';
  }

  function tileRowHtml(t) {
    const bg = t.imageUrl ? `background-image:url('${esc(CasaApi.resolveBackendImageUrl(t.imageUrl))}');` : '';
    return `
      <div class="tile-row">
        <div class="sw" style="${bg}"></div>
        <div style="flex:1;min-width:0;">
          <div class="nm">${esc(t.name)}</div>
          <div class="meta">${esc(t.size || '—')} · ${esc(t.finish || '—')} · ${esc(t.type)}</div>
        </div>
        <span class="casa-hint">${t.inStock ? 'In stock' : 'Out of stock'}</span>
      </div>`;
  }

  async function loadTiles() {
    try {
      const { tiles, meta } = await CasaApi.catalogExtractor.tiles(catalogId, { limit: 20 });
      document.getElementById('tileCountHint').textContent = `Showing ${tiles.length} of ${meta.total ?? tiles.length}`;
      document.getElementById('tileList').innerHTML = tiles.length
        ? tiles.map(tileRowHtml).join('')
        : '<div class="casa-empty">No tiles extracted yet.</div>';
      if (meta.total > tiles.length) {
        document.getElementById('tileList').innerHTML += `<div style="padding:12px 16px;"><a href="admin-product-data.html?catalogId=${encodeURIComponent(catalogId)}">View all ${meta.total} tiles in Product Data →</a></div>`;
      }
    } catch (err) {
      document.getElementById('tileList').innerHTML = `<div class="casa-error-inline">${esc(err.message || 'Failed to load tiles.')}</div>`;
    }
  }

  async function loadCatalog() {
    try {
      const cat = await CasaApi.catalogExtractor.get(catalogId);
      renderCatalog(cat);
      await loadTiles();
    } catch (err) {
      document.getElementById('detailGrid').style.display = 'none';
      document.getElementById('notFound').style.display = '';
      document.getElementById('notFound').textContent = err.message || 'Could not load this catalog.';
    }
  }

  (async () => {
    await CasaShell.init({ current: 'admin-catalog-detail.html' });

    if (!catalogId) {
      document.getElementById('notFound').style.display = '';
      return;
    }

    document.getElementById('retryBtn').addEventListener('click', async () => {
      const notice = CasaNotify.processing('Queuing retry…');
      try {
        const cat = await CasaApi.catalogExtractor.retry(catalogId);
        notice.success('Retry queued.');
        renderCatalog(cat);
      } catch (err) {
        notice.error(err.message || 'Retry failed.');
      }
    });

    document.getElementById('removeBtn').addEventListener('click', async () => {
      if (!confirm('Remove this catalog? Its tiles will be detached, not deleted.')) return;
      const notice = CasaNotify.processing('Removing catalog…');
      try {
        await CasaApi.catalogExtractor.remove(catalogId, false);
        notice.success('Catalog removed.');
        location.href = 'admin-extraction-status.html';
      } catch (err) {
        notice.error(err.message || 'Remove failed.');
      }
    });

    await loadCatalog();
  })();
</script>
</body>
</html>
