<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Casa de Aurum — New Moodboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/shell.css">
<style>
  .casa-main-inner { padding-bottom: 100px !important; }
  .wiz-wrap { max-width: 720px; margin: 0 auto; }
  .wiz-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 11px; }
  .wiz-top .counter { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--stone-600); }
  .wiz-top .pct { font-family: var(--mono); font-size: 11px; color: var(--brass); white-space: nowrap; }
  .wiz-dots { display: flex; gap: 4px; margin-bottom: 28px; }
  .wiz-dots div { flex: 1; height: 4px; border-radius: 2px; background: var(--stone-200); cursor: pointer; transition: background .2s ease; }
  .wiz-dots div.done { background: var(--brass); }
  .wiz-dots div.active { background: var(--charcoal); }

  .wiz-title { font-family: var(--display); font-weight: 600; font-size: clamp(22px,3.2vw,30px); margin: 0 0 8px; color: var(--charcoal); }
  .wiz-sub { margin: 0 0 24px; font-size: 14px; color: var(--stone-600); line-height: 1.55; max-width: 56ch; }

  .opt-grid { display: grid; gap: 10px; margin-bottom: 22px; }
  .opt-card { border: 1px solid var(--line); background: #fff; border-radius: 4px; padding: 15px 16px; cursor: pointer; transition: all .12s ease; }
  .opt-card:hover { border-color: var(--brass); }
  .opt-card.on { border-color: var(--brass); background: #FBF6EC; }
  .opt-card .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .opt-card .lab { font-size: 14px; font-weight: 600; color: #221D18; }
  .opt-card.on .lab { color: #7A5B2C; }
  .opt-card .hint { font-family: var(--mono); font-size: 10.5px; color: var(--stone-600); margin-top: 3px; }
  .opt-card .tick { width: 18px; height: 18px; border-radius: 50%; background: var(--brass); color: #fff; font-size: 11px; display: flex; align-items: center; justify-content: center; flex: none; }

  .wiz-box { background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 18px; margin-bottom: 22px; }
  .wiz-box.partition { border-left: 3px solid var(--brass); }
  .wiz-box .lbl { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--stone-600); margin-bottom: 12px; }
  .dim-row { display: grid; grid-template-columns: 1fr 1fr 1fr 84px; gap: 10px; }
  .dim-row .field label { display: block; font-family: var(--mono); font-size: 11px; color: var(--stone-600); margin-bottom: 5px; }
  .dim-row input, .dim-row select { width: 100%; font-family: var(--mono); font-size: 13px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 2px; background: var(--stone-50); color: var(--ink); }

  .pill-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { font-size: 12.5px; font-weight: 600; padding: 9px 15px; border-radius: 14px; border: 1px solid var(--line); background: #fff; color: #4B443A; cursor: pointer; white-space: nowrap; }
  .pill:hover { border-color: var(--brass); }
  .pill.on { background: var(--charcoal); color: var(--stone-50); border-color: var(--charcoal); }
  .pill.mono { font-family: var(--mono); font-weight: 500; }

  .fbox-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .soft-badge { font-family: var(--mono); font-size: 10px; padding: 2px 8px; border-radius: 8px; border: 1px solid var(--brass); color: var(--brass); white-space: nowrap; }

  .san-list { display: flex; flex-direction: column; gap: 9px; margin-bottom: 22px; }
  .san-row { background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .san-row.off { background: #FAF7F0; }
  .san-row .lab { font-size: 14px; font-weight: 600; color: #221D18; }
  .san-row .hint { font-family: var(--mono); font-size: 11px; color: var(--stone-600); margin-top: 2px; }
  .san-toggle { display: flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; flex: none; }
  .san-toggle button { font-size: 11.5px; font-weight: 600; padding: 8px 14px; border: none; background: #fff; color: var(--stone-600); cursor: pointer; white-space: nowrap; }
  .san-toggle button + button { border-left: 1px solid var(--line); }
  .san-toggle button.on-req { background: var(--brass); color: #fff; }
  .san-toggle button.on-skip { background: var(--charcoal); color: var(--stone-50); }

  .warn-box { background: #fff; border: 1px solid rgba(156,75,44,0.35); border-left: 3px solid var(--clay); border-radius: 4px; padding: 18px 20px; margin-bottom: 20px; }
  .warn-box .row { display: flex; align-items: flex-start; gap: 11px; }
  .warn-box .row .t { font-size: 14px; font-weight: 700; color: #221D18; margin-bottom: 4px; }
  .warn-box .row .d { font-family: var(--mono); font-size: 11.5px; color: #4B443A; line-height: 1.6; }

  .summary-panel { background: #fff; border: 1px solid var(--line); border-radius: 4px; margin-bottom: 20px; }
  .summary-row { padding: 11px 18px; border-bottom: 1px solid rgba(34,29,24,0.06); display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .summary-row:last-child { border-bottom: none; }
  .summary-row .k { font-family: var(--mono); font-size: 12px; color: var(--stone-600); flex: none; }
  .summary-row .v { font-size: 13px; font-weight: 600; color: #221D18; text-align: right; }
  .summary-row .edit { font-family: var(--mono); font-size: 10.5px; color: var(--brass); cursor: pointer; flex: none; }
  .summary-row .edit:hover { text-decoration: underline; }

  .note-box { font-family: var(--mono); font-size: 11px; color: var(--stone-600); line-height: 1.6; background: #FAF7F0; border: 1px solid rgba(34,29,24,0.10); border-radius: 3px; padding: 14px 16px; }

  .wiz-navbar { position: fixed; bottom: 0; left: 260px; right: 0; z-index: 30; background: #fff; border-top: 1px solid var(--line); box-shadow: 0 -4px 20px rgba(26,22,17,0.06); }
  .wiz-navbar-inner { max-width: 720px; margin: 0 auto; padding: 14px 0; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  @media (max-width: 900px) { .wiz-navbar { left: 0; } .wiz-navbar-inner { padding: 14px 20px; } }
  .wiz-hint { font-family: var(--mono); font-size: 11px; color: var(--stone-400); text-align: center; }
</style>
</head>
<body>
<div id="casa-main-content">
  <div class="wiz-wrap">
    <div class="wiz-top">
      <span class="counter" id="stepCounter">Step 1 of 11</span>
      <span class="pct" id="stepPct">9%</span>
    </div>
    <div class="wiz-dots" id="stepDots"></div>

    <div id="stepArea"></div>
  </div>
</div>

<div class="wiz-navbar">
  <div class="wiz-navbar-inner">
    <button class="casa-btn secondary" id="backBtn">Back</button>
    <span class="wiz-hint" id="wizHint">Every answer becomes a rule the AI must follow</span>
    <button class="casa-btn" id="nextBtn">Continue</button>
  </div>
</div>

<script src="../assets/api-client.js"></script>
<script src="../assets/notifications.js"></script>
<script src="assets/shell.js"></script>
<script>
(async () => {
  const user = await CasaShell.init({ current: 'moodboard-wizard.html' });

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  const a = {
    space: 'Bathroom', size: 'Medium', customLength: '', customWidth: '', customHeight: '', customUnit: 'ft', layout: 'Corner',
    shower: 'Separate shower', partition: 'Full glass',
    highlight: 'Feature wall',
    floorRequired: 'Yes', finish: 'Matte', floorSize: '6x4',
    wall: 'Different from floor', wallFormat: 'Large',
    budget: 'Mid range', style: 'Modern', color: 'Beige',
    sanitary: { Basin: true, WC: true, Faucet: true, Shower: true, 'Flush plate': false },
  };

  const steps = [
    { key: 'space', title: 'What are you designing?', sub: 'Sets which rule set and reference images the AI draws from.', cols: 2,
      opts: [{ l: 'Bathroom', h: 'Full wet area' }, { l: 'Powder room', h: 'No shower, guest use' }] },
    { key: 'size', title: 'How big is the space?', sub: 'Size drives tile format and how many products fit the scene.', cols: 3,
      opts: [{ l: 'Compact' }, { l: 'Small' }, { l: 'Medium' }, { l: 'Large' }, { l: 'Custom' }] },
    { key: 'layout', title: 'What is the layout?', sub: 'Determines wall arrangement and where a highlight can land.', cols: 3,
      opts: [{ l: 'Straight' }, { l: 'L-shaped' }, { l: 'Corner' }, { l: 'Open' }, { l: 'Other' }] },
    { key: 'shower', title: 'Is there a shower area?', sub: 'A separate shower changes the anti-slip and partition rules.', cols: 3,
      opts: [{ l: 'No shower' }, { l: 'Open shower' }, { l: 'Separate shower' }] },
    { key: 'highlight', title: 'Highlight requirement', sub: 'Where the accent or feature tile is allowed to appear.', cols: 2,
      opts: [{ l: 'No highlight' }, { l: 'Single highlight' }, { l: 'Feature wall' }, { l: 'Shower highlight' }] },
    { key: 'floorRequired', title: 'Do you need a floor tile?', sub: 'Turn this off when the floor is already decided or unchanged.', cols: 2,
      opts: [{ l: 'Yes' }, { l: 'No' }] },
    { key: 'wall', title: 'How should the wall relate to the floor?', sub: 'Open to AI lets the model pair freely within the style rules.', cols: 3,
      opts: [{ l: 'Same tile family' }, { l: 'Different from floor' }, { l: 'Open to AI' }] },
    { key: 'budget', title: 'Budget band', sub: 'No prices in this version — the band filters the product pool.', cols: 3,
      opts: [{ l: 'Budget friendly' }, { l: 'Mid range' }, { l: 'High range' }] },
    { key: 'style', title: 'Design style', sub: 'Maps to the matching style section in the system instructions.', cols: 3,
      opts: [{ l: 'Modern' }, { l: 'Minimal' }, { l: 'Luxury' }, { l: 'Natural' }, { l: 'Contemporary' }, { l: 'Classic' }, { l: 'Let AI decide' }] },
    { key: 'color', title: 'Primary colour', sub: 'Secondary colour is optional and left to the AI unless set.', cols: 3,
      opts: [{ l: 'White' }, { l: 'Beige' }, { l: 'Brown' }, { l: 'Grey' }, { l: 'Black' }, { l: 'Green' }, { l: 'Blue' }, { l: 'Custom' }, { l: 'AI decide' }] },
    { key: 'sanitary', title: 'Sanitary requirements', sub: 'Only the items marked required are placed in the scene.', cols: 1, opts: [] },
  ];

  const TOTAL_STEPS = steps.length; // 11 question steps, +1 review = index steps.length
  let step = 0;
  let catalogWarning = null; // { pending, total } or null

  try {
    const overview = await CasaApi.dashboard.overview();
    const c = overview?.stats?.catalogs;
    if (c && typeof c.total === 'number') {
      const completed = Array.isArray(c.byStatus) ? (c.byStatus.find((s) => s.status === 'COMPLETED')?.count || 0) : 0;
      const pending = Math.max(0, c.total - completed);
      if (pending > 0) catalogWarning = { pending, total: c.total, completed };
    }
  } catch (_) {
    // catalog readiness is a nice-to-have; skip silently if unavailable for this role
  }

  function pillHtml(list, current, keyForClick) {
    return `<div class="pill-row">` + list.map((l) => {
      const on = current === l;
      return `<button type="button" class="pill mono${on ? ' on' : ''}" data-pillkey="${escapeHtml(keyForClick)}" data-pillval="${escapeHtml(l)}">${escapeHtml(l)}</button>`;
    }).join('') + `</div>`;
  }

  function renderQuestion(cur) {
    let html = `<h1 class="wiz-title">${escapeHtml(cur.title)}</h1><p class="wiz-sub">${escapeHtml(cur.sub)}</p>`;

    if (cur.opts.length) {
      html += `<div class="opt-grid" style="grid-template-columns:repeat(${cur.cols},1fr);">`;
      cur.opts.forEach((o) => {
        const sel = a[cur.key] === o.l;
        html += `<div class="opt-card${sel ? ' on' : ''}" data-optkey="${escapeHtml(cur.key)}" data-optval="${escapeHtml(o.l)}">
          <div class="row">
            <div><div class="lab">${escapeHtml(o.l)}</div>${o.h ? `<div class="hint">${escapeHtml(o.h)}</div>` : ''}</div>
            ${sel ? `<span class="tick">✓</span>` : ''}
          </div>
        </div>`;
      });
      html += `</div>`;
    }

    if (cur.key === 'size' && a.size === 'Custom') {
      html += `<div class="wiz-box">
        <div class="lbl">Custom dimensions</div>
        <div class="dim-row">
          <div class="field"><label>Length</label><input type="number" id="customLength" placeholder="0" value="${escapeHtml(a.customLength)}"></div>
          <div class="field"><label>Width</label><input type="number" id="customWidth" placeholder="0" value="${escapeHtml(a.customWidth)}"></div>
          <div class="field"><label>Height</label><input type="number" id="customHeight" placeholder="0" value="${escapeHtml(a.customHeight)}"></div>
          <div class="field"><label>Unit</label><select id="customUnit"><option${a.customUnit === 'ft' ? ' selected' : ''}>ft</option><option${a.customUnit === 'm' ? ' selected' : ''}>m</option><option${a.customUnit === 'mm' ? ' selected' : ''}>mm</option></select></div>
        </div>
      </div>`;
    }

    if (cur.key === 'shower' && a.shower !== 'No shower') {
      html += `<div class="wiz-box partition">
        <div class="lbl">Shower partition</div>
        ${pillHtml(['None', 'Full glass', 'Half glass', 'Other'], a.partition, 'partition')}
      </div>`;
    }

    if (cur.key === 'floorRequired' && a.floorRequired === 'Yes') {
      html += `<div class="wiz-box">
        <div class="fbox-head"><span class="lbl" style="margin:0;">Finish</span><span class="soft-badge">Soft preference</span></div>
        <div style="margin-bottom:16px;">${pillHtml(['Matte', 'Gloss', 'Any'], a.finish, 'finish')}</div>
        <div class="lbl">Size — first priority, closest match if unavailable</div>
        ${pillHtml(['2x2', '2x4', '4x4', '6x4', 'Custom', 'Any'], a.floorSize, 'floorSize')}
      </div>`;
    }

    if (cur.key === 'wall') {
      html += `<div class="wiz-box">
        <div class="lbl">Preferred format</div>
        ${pillHtml(['Large', 'Medium', 'Small', 'Any'], a.wallFormat, 'wallFormat')}
      </div>`;
    }

    if (cur.key === 'sanitary') {
      html += `<div class="san-list">`;
      Object.keys(a.sanitary).forEach((k) => {
        const on = a.sanitary[k];
        html += `<div class="san-row${on ? '' : ' off'}">
          <div><div class="lab">${escapeHtml(k)}</div><div class="hint">${on ? 'Placed in the scene' : 'Excluded from the scene'}</div></div>
          <div class="san-toggle">
            <button type="button" class="${on ? 'on-req' : ''}" data-sankey="${escapeHtml(k)}" data-sanval="true">Required</button>
            <button type="button" class="${!on ? 'on-skip' : ''}" data-sankey="${escapeHtml(k)}" data-sanval="false">Not required</button>
          </div>
        </div>`;
      });
      html += `</div>`;
    }

    return html;
  }

  function summaryRows() {
    const sanitaryOn = Object.entries(a.sanitary).filter(([, v]) => v).map(([k]) => k);
    return [
      { label: 'Space', value: a.space, step: 0 },
      { label: 'Size', value: a.size === 'Custom' ? `Custom (${a.customLength || '?'}×${a.customWidth || '?'}×${a.customHeight || '?'} ${a.customUnit})` : a.size, step: 1 },
      { label: 'Layout', value: a.layout, step: 2 },
      { label: 'Shower', value: a.shower === 'No shower' ? a.shower : `${a.shower} · ${a.partition}`, step: 3 },
      { label: 'Highlight', value: a.highlight, step: 4 },
      { label: 'Floor', value: a.floorRequired === 'No' ? 'Not required' : `${a.floorSize} · ${a.finish}`, step: 5 },
      { label: 'Wall', value: `${a.wall} · ${a.wallFormat}`, step: 6 },
      { label: 'Budget', value: a.budget, step: 7 },
      { label: 'Style', value: a.style, step: 8 },
      { label: 'Colour', value: a.color, step: 9 },
      { label: 'Sanitary', value: sanitaryOn.length ? sanitaryOn.join(', ') : 'None', step: 10 },
    ];
  }

  function renderReview() {
    let html = `<h1 class="wiz-title">Review the brief</h1><p class="wiz-sub">This is exactly what the AI receives. Change anything before generating.</p>`;

    if (catalogWarning) {
      html += `<div class="warn-box"><div class="row">
        <span style="color:var(--clay);font-size:15px;">⚠</span>
        <div>
          <div class="t">Product library is not fully ready</div>
          <div class="d">${catalogWarning.total} catalogs found · ${catalogWarning.completed} extracted · ${catalogWarning.pending} pending<br>Generating now uses the extracted set only — some in-stock products stay invisible to the AI.</div>
        </div>
      </div></div>`;
    }

    const rows = summaryRows();
    html += `<div class="summary-panel">
      <div class="panel-head"><h3>Your Design</h3><span class="casa-hint">${rows.length} of ${rows.length} answered</span></div>
      <div>`;
    rows.forEach((r) => {
      html += `<div class="summary-row"><span class="k">${escapeHtml(r.label)}</span><div style="display:flex;align-items:center;gap:12px;min-width:0;"><span class="v">${escapeHtml(r.value)}</span><span class="edit" data-gostep="${r.step}">Edit</span></div></div>`;
    });
    html += `</div></div>`;

    html += `<div class="note-box">Size and format answers are sent as <strong style="color:var(--ink);">preferences</strong>, not hard filters — the backend ranks by them and falls back to the closest available product rather than returning nothing.</div>`;
    return html;
  }

  function buildBriefText() {
    const parts = [];
    parts.push(`${a.space} project`);
    parts.push(a.size === 'Custom' ? `custom size (${a.customLength || '?'}×${a.customWidth || '?'}×${a.customHeight || '?'} ${a.customUnit})` : `${a.size.toLowerCase()} size`);
    parts.push(`${a.layout.toLowerCase()} layout`);
    if (a.shower === 'No shower') parts.push('no shower area');
    else parts.push(`${a.shower.toLowerCase()} with ${a.partition.toLowerCase()} partition`);
    parts.push(a.highlight.toLowerCase());
    if (a.floorRequired === 'No') parts.push('floor tile not required (already decided)');
    else parts.push(`floor tile: ${a.finish.toLowerCase()} finish, ${a.floorSize} size preference`);
    parts.push(`wall tile ${a.wall.toLowerCase()}, ${a.wallFormat.toLowerCase()} format preference`);
    parts.push(`${a.budget.toLowerCase()} budget`);
    parts.push(`${a.style.toLowerCase()} style`);
    parts.push(`${a.color.toLowerCase()} primary colour`);
    const sanitaryOn = Object.entries(a.sanitary).filter(([, v]) => v).map(([k]) => k);
    parts.push(sanitaryOn.length ? `sanitary fixtures required: ${sanitaryOn.join(', ')}` : 'no sanitary fixtures required');
    return parts.join('; ') + '.';
  }

  function render() {
    const isReview = step === TOTAL_STEPS;
    document.getElementById('stepCounter').textContent = isReview ? `Review · step ${TOTAL_STEPS + 1} of ${TOTAL_STEPS + 1}` : `Step ${step + 1} of ${TOTAL_STEPS}`;
    document.getElementById('stepPct').textContent = Math.round(((step + 1) / (TOTAL_STEPS + 1)) * 100) + '%';

    const dots = document.getElementById('stepDots');
    dots.innerHTML = '';
    for (let i = 0; i <= TOTAL_STEPS; i++) {
      const d = document.createElement('div');
      d.className = i < step ? 'done' : i === step ? 'active' : '';
      d.addEventListener('click', () => { step = i; render(); });
      dots.appendChild(d);
    }

    const area = document.getElementById('stepArea');
    area.innerHTML = isReview ? renderReview() : renderQuestion(steps[step]);
    wireStepEvents();

    document.getElementById('backBtn').disabled = step === 0;
    document.getElementById('backBtn').style.opacity = step === 0 ? '.6' : '1';

    const nextBtn = document.getElementById('nextBtn');
    nextBtn.textContent = isReview ? 'Generate 4 moodboards' : (step === TOTAL_STEPS - 1 ? 'Review brief' : 'Continue');
    document.getElementById('wizHint').textContent = isReview ? 'Nothing is sent until you press generate' : 'Every answer becomes a rule the AI must follow';
  }

  function wireStepEvents() {
    document.querySelectorAll('[data-optkey]').forEach((el) => {
      el.addEventListener('click', () => {
        a[el.dataset.optkey] = el.dataset.optval;
        render();
      });
    });
    document.querySelectorAll('[data-pillkey]').forEach((el) => {
      el.addEventListener('click', () => {
        a[el.dataset.pillkey] = el.dataset.pillval;
        render();
      });
    });
    document.querySelectorAll('[data-sankey]').forEach((el) => {
      el.addEventListener('click', () => {
        a.sanitary[el.dataset.sankey] = el.dataset.sanval === 'true';
        render();
      });
    });
    document.querySelectorAll('[data-gostep]').forEach((el) => {
      el.addEventListener('click', () => { step = Number(el.dataset.gostep); render(); });
    });
    const cl = document.getElementById('customLength'); if (cl) cl.addEventListener('input', () => { a.customLength = cl.value; });
    const cw = document.getElementById('customWidth'); if (cw) cw.addEventListener('input', () => { a.customWidth = cw.value; });
    const ch = document.getElementById('customHeight'); if (ch) ch.addEventListener('input', () => { a.customHeight = ch.value; });
    const cu = document.getElementById('customUnit'); if (cu) cu.addEventListener('change', () => { a.customUnit = cu.value; });
  }

  document.getElementById('backBtn').addEventListener('click', () => {
    if (step > 0) { step -= 1; render(); }
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    if (step < TOTAL_STEPS) {
      step += 1;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }

    // Review step — submit.
    const room = a.space.toUpperCase().replace(/\s+/g, '_');
    const style = a.style.toUpperCase().replace(/\s+/g, '_');
    const payload = {
      text: buildBriefText(),
      style,
      room,
      combinationCount: 4,
    };

    sessionStorage.setItem('casaMoodboardBrief', JSON.stringify({ payload, answers: a }));
    location.href = 'ai-loading.html';
  });

  render();
})();
</script>
</body>
</html>
