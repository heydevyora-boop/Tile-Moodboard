<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Casa de Aurum — Moodboard Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/shell.css">
<style>
  .head-actions { display: flex; gap: 9px; }
  .chip-row { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 24px; }
  .chip-row span { font-family: var(--mono); font-size: 11px; padding: 5px 11px; border-radius: 12px; background: #fff; border: 1px solid var(--line); color: #4B443A; }

  .lock-banner { background: var(--charcoal); border: 1px solid rgba(216,182,119,0.3); border-radius: 4px; padding: 20px 22px; margin-bottom: 24px; }
  .lock-banner .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  .lock-banner .eyebrow { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--brass-light); }
  .lock-banner .eyebrow .ok { color: var(--sage); font-size: 14px; }
  .lock-banner .title { font-family: var(--display); font-weight: 600; font-size: 22px; color: #E9E2D3; margin-bottom: 6px; }
  .lock-banner .desc { font-family: var(--mono); font-size: 11.5px; color: var(--stone-400); line-height: 1.6; max-width: 60ch; }
  .lock-banner .actions { display: flex; gap: 9px; }

  .combo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 900px) { .combo-grid { grid-template-columns: 1fr; } }
  .combo-card { background: #fff; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; transition: all .15s ease; }
  .combo-card.dim { opacity: .55; }
  .combo-card .chead { padding: 13px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
  .combo-card .chead .num { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--stone-400); }
  .combo-card .chead .nm { font-family: var(--display); font-weight: 600; font-size: 16px; color: var(--charcoal); }
  .combo-card .chead .selected-tag { font-family: var(--mono); font-size: 9.5px; padding: 3px 9px; border-radius: 8px; background: var(--charcoal); color: var(--brass-light); }
  .combo-render { aspect-ratio: 4/3; position: relative; display: flex; align-items: flex-end; padding: 14px; }
  .combo-render .swatches { position: relative; z-index: 2; display: flex; gap: 6px; }
  .combo-render .sw { width: 34px; height: 34px; border-radius: 2px; border: 1px solid rgba(255,255,255,0.45); box-shadow: 0 2px 6px rgba(0,0,0,0.18); }
  .combo-plist { padding: 4px 0; }
  .combo-plist .prow { padding: 9px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid rgba(34,29,24,0.06); }
  .combo-plist .prow .slot { font-family: var(--mono); font-size: 11px; color: var(--stone-600); flex: none; width: 90px; }
  .combo-plist .prow .nm { font-size: 12.5px; font-weight: 600; color: var(--ink); text-align: right; }
  .combo-grout { padding: 10px 18px; display: flex; align-items: center; justify-content: space-between; }
  .combo-grout .k { font-family: var(--mono); font-size: 11px; color: var(--stone-600); }
  .combo-grout .v { font-family: var(--mono); font-size: 11.5px; color: var(--brass); font-weight: 500; }
  .combo-reason { padding: 13px 18px; background: #FAF7F0; border-top: 1px solid rgba(34,29,24,0.08); font-size: 12.5px; color: #4B443A; line-height: 1.55; }
  .combo-actions { padding: 13px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
  .combo-actions button { flex: 1; }
  .combo-actions button.cta { flex: 1.3; }

  .footnote { font-family: var(--mono); font-size: 11px; color: var(--stone-600); line-height: 1.6; background: #FAF7F0; border: 1px solid rgba(34,29,24,0.10); border-radius: 3px; padding: 14px 16px; margin-top: 20px; }
  .state-box { text-align: center; padding: 60px 20px; color: var(--stone-600); font-family: var(--mono); font-size: 13px; }
</style>
</head>
<body>
<div id="casa-main-content">

  <div class="casa-pageheader">
    <div>
      <h1 id="pageTitle">Mood board options</h1>
      <p id="pageSub">Loading…</p>
    </div>
    <div class="head-actions">
      <a class="casa-btn secondary" href="moodboard-wizard.html">Edit brief</a>
    </div>
  </div>

  <div class="chip-row" id="briefChips"></div>

  <div id="lockBannerArea"></div>

  <div id="comboArea"><div class="state-box">Loading mood board…</div></div>

  <div class="footnote" id="footnoteArea" style="display:none;"></div>

</div>

<script src="../assets/api-client.js"></script>
<script src="../assets/notifications.js"></script>
<script src="assets/shell.js"></script>
<script>
(async () => {
  await CasaShell.init({ current: 'moodboard-results.html' });

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  const styleAccent = {
    SUBTLE: ['#E7E0D0', '#C9BFA9', '#B7AB94'],
    LUXURY: ['#D8B677', '#AD8348', '#7A5B2C'],
    BOLD: ['#33465A', '#9C4B2C', '#1A1611'],
  };

  function tileForRole(combo, role) {
    const tiles = Array.isArray(combo.tiles) ? combo.tiles : [];
    return tiles.find((t) => t.role === role) || (role === 'border' ? tiles.find((t) => t.role === 'accent') : null);
  }

  function tileId(tile) {
    if (!tile) return '';
    return String(tile.product_id || tile.productId || tile.tile_id || tile.tileId || tile.id || '').trim();
  }

  const params = new URLSearchParams(location.search);
  const boardId = params.get('id') || sessionStorage.getItem('casaMoodboardId');

  if (!boardId) {
    document.getElementById('comboArea').innerHTML = `<div class="state-box">No mood board selected yet. <a href="moodboard-wizard.html">Start a new brief →</a></div>`;
    document.getElementById('pageSub').textContent = 'No mood board loaded';
    return;
  }

  let board;
  try {
    board = await CasaApi.moodBoards.get(boardId);
  } catch (err) {
    document.getElementById('comboArea').innerHTML = `<div class="state-box" style="color:var(--clay);">${escapeHtml(err.message || 'Could not load this mood board.')}</div>`;
    document.getElementById('pageSub').textContent = 'Error loading mood board';
    return;
  }

  const combinations = Array.isArray(board.combinations) ? board.combinations : [];
  let selectedIndex = [board.selectedIndex, board.approvedIndex, board.approvedCombinationIndex]
    .find((v) => typeof v === 'number' && !Number.isNaN(v));
  if (typeof selectedIndex !== 'number') selectedIndex = null;

  document.getElementById('pageTitle').textContent = combinations.length ? `${combinations.length} option${combinations.length === 1 ? '' : 's'}` : 'No options generated';
  document.getElementById('pageSub').textContent = `${escapeHtml(board.id)} · ${escapeHtml(board.style || '')} · ${escapeHtml(board.room || '')} · every product below exists in stock`;

  const chipVals = [board.room, board.style].filter(Boolean);
  document.getElementById('briefChips').innerHTML = chipVals.map((c) => `<span>${escapeHtml(c)}</span>`).join('');

  function renderLockBanner() {
    const area = document.getElementById('lockBannerArea');
    if (selectedIndex === null) { area.innerHTML = ''; return; }
    const combo = combinations[selectedIndex];
    area.innerHTML = `<div class="lock-banner">
      <div class="top">
        <div>
          <div class="eyebrow"><span class="ok">✓</span><span>Scene approved</span></div>
          <div class="title">${escapeHtml(combo?.board_name || `Combination ${selectedIndex + 1}`)}</div>
          <div class="desc">Products and configuration are now locked. Continue to Scene &amp; Angles to generate the AI bathroom visualization and camera angles.</div>
        </div>
        <div class="actions">
          <a class="casa-btn" href="scene-angles.html?moodBoardId=${encodeURIComponent(board.id)}&combinationIndex=${selectedIndex}">Generate angles →</a>
        </div>
      </div>
    </div>`;
  }

  function renderCombos() {
    const accent = styleAccent[String(board.style || '').toUpperCase()] || styleAccent.SUBTLE;
    const area = document.getElementById('comboArea');

    if (!combinations.length) {
      area.innerHTML = `<div class="state-box">No combinations were generated for this brief. <a href="moodboard-wizard.html">Try a broader brief →</a></div>`;
      return;
    }

    area.innerHTML = `<div class="combo-grid">` + combinations.map((c, i) => {
      const base = tileForRole(c, 'base');
      const hi = tileForRole(c, 'highlight');
      const border = tileForRole(c, 'border');
      const isSel = selectedIndex === i;
      const dimmed = selectedIndex !== null && !isSel;
      const products = (Array.isArray(c.tiles) ? c.tiles : []).map((t) => ({
        slot: (t.role || 'tile').replace(/_/g, ' '),
        name: t.name || t.product_name || t.productName || 'Selected tile',
      }));

      return `<div class="combo-card${dimmed ? ' dim' : ''}" data-idx="${i}">
        <div class="chead">
          <div style="display:flex;align-items:center;gap:10px;">
            <span class="num">Option ${i + 1}</span>
            <span class="nm">${escapeHtml(c.board_name || `Combination ${i + 1}`)}</span>
          </div>
          ${isSel ? `<span class="selected-tag">APPROVED</span>` : ''}
        </div>
        <div class="combo-render" style="background:${accent[0]};">
          <div style="position:absolute;inset:0;display:flex;">
            <div style="flex:1.6;background:linear-gradient(160deg,${accent[0]},${accent[1]});"></div>
            <div style="flex:1;background:linear-gradient(160deg,${accent[1]},${accent[2]});"></div>
          </div>
          <div style="position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(180deg,${accent[1]},${accent[2]});"></div>
          <div class="swatches">
            <div class="sw" style="background:${accent[0]};"></div>
            <div class="sw" style="background:${accent[1]};"></div>
            <div class="sw" style="background:${accent[2]};"></div>
          </div>
        </div>
        <div class="combo-plist">
          ${products.map((p) => `<div class="prow"><span class="slot">${escapeHtml(p.slot)}</span><span class="nm">${escapeHtml(p.name)}</span></div>`).join('') || '<div class="prow"><span class="slot">Tiles</span><span class="nm">—</span></div>'}
          <div class="combo-grout"><span class="k">Grout</span><span class="v">${escapeHtml(c.grout_recommendation || '—')}</span></div>
        </div>
        <div class="combo-reason">${escapeHtml(c.reason_for_selection || '')}</div>
        <div class="combo-actions">
          <button class="casa-btn cta" data-action="approve" data-idx="${i}" ${selectedIndex !== null ? 'disabled' : ''}>${isSel ? 'Approved' : 'Approve this combination'}</button>
        </div>
      </div>`;
    }).join('') + `</div>`;

    area.querySelectorAll('[data-action="approve"]').forEach((btn) => {
      btn.addEventListener('click', () => approveCombination(Number(btn.dataset.idx)));
    });
  }

  async function approveCombination(index) {
    const buttons = document.querySelectorAll('[data-action="approve"]');
    buttons.forEach((b) => { b.disabled = true; });
    const notice = CasaNotify.processing('Approving this combination...');

    try {
      await CasaApi.moodBoards.approve(board.id, index);
      selectedIndex = index;

      sessionStorage.setItem('casaApprovedCombination', JSON.stringify({ moodBoardId: board.id, combinationIndex: index }));

      notice.success('Combination approved.');
      renderLockBanner();
      renderCombos();
      document.getElementById('lockBannerArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (err) {
      buttons.forEach((b) => { b.disabled = false; });
      notice.error('Could not approve: ' + (err?.message || 'Unknown error'));
    }
  }

  renderLockBanner();
  renderCombos();

  const footnote = document.getElementById('footnoteArea');
  footnote.style.display = 'block';
  footnote.textContent = `Generated from stock matching the brief. ${combinations.length} combination(s) shown — every product listed exists in the tile catalog.`;
})();
</script>
</body>
</html>
