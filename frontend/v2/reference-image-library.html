<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Casa de Aurum — Reference Image Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/shell.css">
<style>
  .owner-badge{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass);border:1px solid var(--brass);padding:5px 10px;border-radius:2px;white-space:nowrap;}
  .subnav{display:flex;gap:0;margin-bottom:22px;border-bottom:1px solid var(--line);}
  .subnav a{font-family:var(--sans);font-weight:600;font-size:13px;padding:10px 18px;color:var(--stone-600);text-decoration:none;position:relative;}
  .subnav a:hover{color:var(--charcoal);}
  .subnav a.active{color:var(--charcoal);}
  .subnav a.active::after{content:"";position:absolute;left:18px;right:18px;bottom:-1px;height:2px;background:var(--brass);}

  .dropzone{border:2px dashed rgba(34,29,24,0.18);border-radius:3px;padding:32px 24px;text-align:center;margin-bottom:18px;background:rgba(255,255,255,0.5);cursor:pointer;transition:border-color .15s ease,background .15s ease;}
  .dropzone:hover, .dropzone.drag{border-color:var(--brass);background:rgba(255,255,255,0.85);}
  .dropzone svg{margin-bottom:8px;}
  .dropzone .t{font-family:var(--sans);font-size:14px;font-weight:600;color:var(--stone-700);margin-bottom:4px;}
  .dropzone .s{font-family:var(--mono);font-size:11px;color:var(--stone-400);}

  .upload-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px;}
  .upload-fields label{display:block;font-size:11px;color:var(--stone-600);margin-bottom:5px;font-family:var(--mono);}
  .upload-fields input{width:100%;font-family:var(--mono);font-size:12.5px;padding:9px 10px;border:1px solid var(--line);border-radius:2px;background:var(--stone-50);color:var(--ink);}
  .filename-chip{font-family:var(--mono);font-size:11.5px;color:var(--stone-700);background:var(--stone-100);padding:6px 10px;border-radius:2px;display:inline-block;margin-bottom:12px;}

  .toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .search-input{flex:1;min-width:200px;font-family:var(--mono);font-size:13px;padding:9px 12px;border:1px solid var(--line);border-radius:2px;background:#fff;}
  .search-input:focus{outline:2px solid var(--brass);outline-offset:1px;}
  .chip-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .chip-label{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--stone-600);}
  .chip{font-family:var(--sans);font-size:12px;font-weight:600;padding:6px 12px;border-radius:14px;border:1px solid var(--line);cursor:pointer;background:#fff;color:var(--stone-700);}
  .chip:hover{border-color:var(--brass);}
  .chip.active{background:var(--charcoal);color:var(--stone-50);border-color:var(--charcoal);}

  .results-count{font-family:var(--mono);font-size:11.5px;color:var(--stone-600);margin-bottom:16px;}
  .results-count a{color:var(--brass);text-decoration:underline;margin-left:4px;cursor:pointer;}

  .img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
  .img-card{background:#fff;border:1px solid var(--line);border-radius:3px;overflow:hidden;transition:box-shadow .15s ease;}
  .img-card:hover{box-shadow:0 12px 30px rgba(26,22,17,0.14);}
  .img-card .thumbwrap{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--stone-200);}
  .img-card .thumbwrap img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer;}
  .img-card .overlay{position:absolute;inset:0;background:rgba(26,22,17,0.5);opacity:0;transition:opacity .15s ease;display:flex;align-items:center;justify-content:center;gap:8px;pointer-events:none;}
  .img-card:hover .overlay{opacity:1;pointer-events:auto;}
  .overlay-btn{font-family:var(--sans);font-size:11px;font-weight:600;background:rgba(255,255,255,0.95);color:var(--ink);border:none;padding:7px 12px;border-radius:2px;cursor:pointer;}
  .overlay-btn.danger{background:rgba(156,75,44,0.92);color:#fff;}
  .img-card .body{padding:12px 14px;}
  .img-card .tag{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--charcoal);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .img-card .badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;}
  .img-card .badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:8px;background:var(--stone-100);color:var(--stone-700);font-weight:600;}
  .img-card .desc{font-size:11.5px;color:var(--stone-700);margin-bottom:6px;min-height:14px;}
  .img-card input[type=file]{display:none;}

  .lightbox{display:none;position:fixed;inset:0;background:rgba(20,16,12,0.85);z-index:60;align-items:center;justify-content:center;padding:30px;}
  .lightbox img{max-width:90vw;max-height:85vh;border-radius:2px;box-shadow:0 12px 30px rgba(0,0,0,0.4);}
  .lightbox .close{position:absolute;top:24px;right:32px;color:#fff;font-family:var(--mono);font-size:13px;cursor:pointer;}
  .err-box{background:#FBEEEA;border:1px solid var(--clay);color:var(--clay);font-size:12px;padding:9px 11px;border-radius:2px;margin-top:10px;display:none;}
</style>
</head>
<body>
<div id="casa-main-content">
  <div class="casa-pageheader">
    <div>
      <h1>Reference Image Library</h1>
      <p id="badgeSub">Upload inspiration images so the AI understands your preferred design aesthetic.</p>
    </div>
    <span class="owner-badge" id="countBadge">…</span>
  </div>

  <div class="subnav">
    <a href="design-rules-setup.html">Design Rules</a>
    <a href="reference-image-library.html" class="active">Reference Images</a>
    <a href="version-history.html">Version History</a>
  </div>

  <div class="casa-panel">
    <div class="panel-head"><h3>Upload an Image</h3></div>
    <div class="panel-body">
      <div class="dropzone" id="dropzone">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#B7AB94" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        <div class="t">Drop an image here or click to browse</div>
        <div class="s">JPG, PNG, WebP</div>
        <input type="file" id="uploadFile" accept="image/jpeg,image/png,image/webp" style="display:none;">
      </div>
      <div id="filenameChip"></div>
      <div class="upload-fields">
        <div>
          <label>Style tag</label>
          <input type="text" id="uploadStyleTag" placeholder="luxury_bathroom_02">
        </div>
        <div>
          <label>Style</label>
          <input type="text" id="uploadStyle" placeholder="LUXURY">
        </div>
        <div>
          <label>Room</label>
          <input type="text" id="uploadRoom" placeholder="BATHROOM">
        </div>
        <div>
          <label>Description</label>
          <input type="text" id="uploadDescription" placeholder="Optional note">
        </div>
      </div>
      <button class="casa-btn" id="uploadBtn">Upload Image</button>
      <div class="err-box" id="uploadError"></div>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" class="search-input" id="searchInput" placeholder="Search images by name or tag…">
    <div class="chip-group">
      <span class="chip-label">Style</span>
      <div id="styleChips"></div>
    </div>
    <div class="chip-group">
      <span class="chip-label">Room</span>
      <div id="roomChips"></div>
    </div>
  </div>

  <div class="results-count" id="resultsCount"></div>

  <div class="img-grid" id="imageGrid">Loading…</div>
</div>

<div class="lightbox" id="lightbox">
  <span class="close" id="lightboxClose">Close ✕</span>
  <img id="lightboxImg" src="" alt="">
</div>

<script src="../assets/api-client.js"></script>
<script src="../assets/notifications.js"></script>
<script src="assets/shell.js"></script>
<script>
(async () => {
  const user = await CasaShell.init({ current: 'reference-image-library.html', allowedRoles: ['ADMIN','OWNER'] });

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function absoluteUrl(imageUrl) {
    const base = (window.CASA_API_BASE || 'http://localhost:5000/api/v1').replace(/\/api\/v1\/?$/, '');
    return base + imageUrl;
  }

  let currentQuery = {};
  let activeStyle = '';
  let activeRoom = '';
  let totalCount = 0;

  function chipsHtml(list, active, groupKey) {
    return list.map((label) => `<button class="chip ${active === label ? 'active' : ''}" data-group="${groupKey}" data-value="${escapeHtml(label)}">${escapeHtml(label)}</button>`).join('');
  }

  async function loadCategories() {
    try {
      const cats = await CasaApi.referenceImages.categories();
      document.getElementById('styleChips').innerHTML = chipsHtml(cats.styles || [], activeStyle, 'style');
      document.getElementById('roomChips').innerHTML = chipsHtml(cats.rooms || [], activeRoom, 'room');
      wireChips();
    } catch (err) {
      // filters just stay empty — non-fatal
    }
  }

  function wireChips() {
    document.querySelectorAll('.chip[data-group]').forEach((el) => {
      el.addEventListener('click', () => {
        const group = el.dataset.group;
        const val = el.dataset.value;
        if (group === 'style') { activeStyle = activeStyle === val ? '' : val; currentQuery.style = activeStyle || undefined; }
        else { activeRoom = activeRoom === val ? '' : val; currentQuery.room = activeRoom || undefined; }
        loadCategories();
        loadImages();
      });
    });
  }

  function cardHtml(img) {
    const tags = [img.style, img.room].filter(Boolean);
    return `
      <div class="img-card" data-id="${img.id}">
        <div class="thumbwrap">
          <img src="${absoluteUrl(img.imageUrl)}" alt="${escapeHtml(img.styleTag)}" data-action="preview" data-id="${img.id}">
          <div class="overlay">
            <button class="overlay-btn" data-action="preview" data-id="${img.id}">Preview</button>
            <label class="overlay-btn" style="cursor:pointer;">Replace<input type="file" accept="image/jpeg,image/png,image/webp" data-action="replace" data-id="${img.id}"></label>
            <button class="overlay-btn danger" data-action="delete" data-id="${img.id}">Delete</button>
          </div>
        </div>
        <div class="body">
          <div class="tag">${escapeHtml(img.styleTag)}</div>
          <div class="badges">${tags.map((t) => `<span class="badge">${escapeHtml(t)}</span>`).join('')}</div>
          <div class="desc">${img.description ? escapeHtml(img.description) : ''}</div>
        </div>
      </div>`;
  }

  async function loadImages() {
    const grid = document.getElementById('imageGrid');
    try {
      const { images, meta } = await CasaApi.referenceImages.list({ ...currentQuery, search: document.getElementById('searchInput').value.trim() || undefined, limit: 100 });
      totalCount = totalCount || meta?.total || images.length;
      const hasFilter = !!(activeStyle || activeRoom || document.getElementById('searchInput').value.trim());
      document.getElementById('resultsCount').innerHTML =
        `Showing ${images.length} of ${meta?.total ?? images.length} images` +
        (hasFilter ? ` <a id="clearFiltersLink">· Clear filters</a>` : '');
      const clearLink = document.getElementById('clearFiltersLink');
      if (clearLink) clearLink.addEventListener('click', clearFilters);

      grid.innerHTML = images.length
        ? images.map(cardHtml).join('')
        : `<p style="font-family:var(--mono);font-size:12px;color:var(--stone-600);grid-column:1/-1;">No images match.</p>`;

      grid.querySelectorAll('[data-action="preview"]').forEach((el) => el.addEventListener('click', () => openLightbox(absoluteUrl(images.find((i) => String(i.id) === el.dataset.id).imageUrl))));
      grid.querySelectorAll('[data-action="delete"]').forEach((el) => el.addEventListener('click', () => deleteImage(el.dataset.id)));
      grid.querySelectorAll('[data-action="replace"]').forEach((el) => el.addEventListener('change', (e) => replaceImage(el.dataset.id, e.target.files[0])));

      document.getElementById('countBadge').textContent = `${meta?.total ?? images.length} images`;
    } catch (err) {
      grid.innerHTML = `<p style="color:var(--clay);font-family:var(--mono);font-size:12px;grid-column:1/-1;">${escapeHtml(err.message)}</p>`;
    }
  }

  function clearFilters() {
    currentQuery = {};
    activeStyle = '';
    activeRoom = '';
    document.getElementById('searchInput').value = '';
    loadCategories();
    loadImages();
  }

  function openLightbox(src) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightbox').style.display = 'flex';
  }
  document.getElementById('lightboxClose').addEventListener('click', () => { document.getElementById('lightbox').style.display = 'none'; });
  document.getElementById('lightbox').addEventListener('click', (e) => { if (e.target.id === 'lightbox') document.getElementById('lightbox').style.display = 'none'; });

  async function deleteImage(id) {
    if (!confirm('Delete this reference image? This cannot be undone.')) return;
    try {
      await CasaApi.referenceImages.remove(id);
      await loadImages();
      CasaNotify.success('Reference image deleted.');
    } catch (err) {
      CasaNotify.error('Delete failed: ' + err.message);
    }
  }

  async function replaceImage(id, file) {
    if (!file) return;
    const notice = CasaNotify.processing('Replacing image…');
    try {
      await CasaApi.referenceImages.replaceImage(id, file);
      await loadImages();
      notice.success('Image replaced.');
    } catch (err) {
      notice.error('Replace failed: ' + err.message);
    }
  }

  const dropzone = document.getElementById('dropzone');
  const uploadFile = document.getElementById('uploadFile');
  dropzone.addEventListener('click', () => uploadFile.click());
  dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.classList.remove('drag');
    if (e.dataTransfer.files[0]) {
      uploadFile.files = e.dataTransfer.files;
      updateFilenameChip();
    }
  });
  uploadFile.addEventListener('change', updateFilenameChip);
  function updateFilenameChip() {
    const f = uploadFile.files[0];
    document.getElementById('filenameChip').innerHTML = f ? `<span class="filename-chip">${escapeHtml(f.name)}</span>` : '';
  }

  document.getElementById('uploadBtn').addEventListener('click', async () => {
    const errorBox = document.getElementById('uploadError');
    errorBox.style.display = 'none';

    const styleTag = document.getElementById('uploadStyleTag').value.trim();
    const style = document.getElementById('uploadStyle').value.trim();
    const room = document.getElementById('uploadRoom').value.trim();
    const description = document.getElementById('uploadDescription').value.trim();
    const file = uploadFile.files[0];

    if (!styleTag || !file) {
      errorBox.textContent = 'Style tag and an image file are required.';
      errorBox.style.display = 'block';
      return;
    }

    const btn = document.getElementById('uploadBtn');
    btn.disabled = true;
    btn.textContent = 'Uploading…';
    const notice = CasaNotify.processing('Uploading reference image…');
    try {
      await CasaApi.referenceImages.upload(file, { styleTag, style, room, description });
      document.getElementById('uploadStyleTag').value = '';
      document.getElementById('uploadStyle').value = '';
      document.getElementById('uploadRoom').value = '';
      document.getElementById('uploadDescription').value = '';
      uploadFile.value = '';
      updateFilenameChip();
      totalCount = 0;
      await Promise.all([loadImages(), loadCategories()]);
      notice.success('Reference image uploaded.');
    } catch (err) {
      errorBox.textContent = err.message || 'Upload failed.';
      errorBox.style.display = 'block';
      notice.error(err.message || 'Upload failed.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Upload Image';
    }
  });

  let searchDebounce = null;
  document.getElementById('searchInput').addEventListener('input', () => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(loadImages, 300);
  });

  await Promise.all([loadImages(), loadCategories()]);
})();
</script>
</body>
</html>
