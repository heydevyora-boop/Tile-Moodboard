<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa de Aurum — Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/shell.css">
<style>
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:0;}
  @media (max-width:820px){.two-col{grid-template-columns:1fr;}}
  .status-breakdown{display:flex;gap:16px;flex-wrap:wrap;padding:14px 18px;}
  .status-chip{font-family:var(--mono);font-size:11.5px;display:flex;align-items:center;gap:6px;color:var(--stone-700);}
  .integ-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line);gap:10px;}
  .integ-row:last-child{border-bottom:none;}
  .integ-row .name{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12.5px;color:var(--stone-700);}
  .integ-row .detail{font-family:var(--mono);font-size:11px;color:var(--stone-600);}
</style>
</head>
<body>
<div id="casa-main-content">
  <div class="casa-pageheader">
    <div>
      <h1>Dashboard</h1>
      <p id="lastRefreshed">System overview</p>
    </div>
    <div class="casa-actions">
      <button class="casa-btn secondary" id="refreshBtn">Refresh</button>
      <a class="casa-btn" href="admin-catalog-extractor.html">Run Extractor</a>
    </div>
  </div>

  <div class="casa-stat-grid" id="statGrid">
    <div class="casa-stat-card"><div class="label">Loading…</div><div class="value">—</div></div>
  </div>

  <div class="two-col" style="margin-bottom:16px;">
    <div class="casa-panel" style="margin-bottom:0;">
      <div class="panel-head"><h3>Catalog Status</h3></div>
      <div class="status-breakdown" id="catalogBreakdown"></div>
    </div>
    <div class="casa-panel" style="margin-bottom:0;">
      <div class="panel-head"><h3>Mood Board Status</h3></div>
      <div class="status-breakdown" id="moodBoardBreakdown"></div>
    </div>
  </div>

  <div class="two-col">
    <div class="casa-panel" style="margin-bottom:0;">
      <div class="panel-head"><h3>Recent Activity</h3></div>
      <div class="panel-body" style="padding:0;">
        <table class="casa-table">
          <thead><tr><th>Who</th><th>Action</th><th>When</th></tr></thead>
          <tbody id="activityTbody">
            <tr><td colspan="3" class="casa-empty">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="casa-panel" style="margin-bottom:0;">
      <div class="panel-head"><h3>System Status</h3></div>
      <div class="panel-body" id="integrationsBody">
        <div class="casa-empty">Loading…</div>
      </div>
    </div>
  </div>
</div>

<script src="assets/api-client.js"></script>
<script src="assets/notifications.js"></script>
<script src="assets/shell.js"></script>
<script>
  const STATUS_CLASS = {
    PENDING: 'neutral', PROCESSING: 'warn', COMPLETED: 'ok', FAILED: 'err',
    DRAFT: 'neutral', GENERATED: 'warn', REFINED: 'warn',
    APPROVED: 'ok', REJECTED: 'err', ARCHIVED: 'neutral',
  };

  function escapeHtml(s) { return CasaShell.escapeHtml(s); }

  function statCard(label, value, sub, subClass) {
    return `<div class="casa-stat-card"><div class="label">${escapeHtml(label)}</div><div class="value">${escapeHtml(value)}</div>${sub !== undefined ? `<div class="sub ${subClass || ''}">${escapeHtml(sub)}</div>` : ''}</div>`;
  }

  function renderStats(stats) {
    document.getElementById('statGrid').innerHTML = [
      statCard('Catalogs', stats.catalogs.total, `+${stats.catalogs.newThisWeek} this week`, stats.catalogs.newThisWeek > 0 ? 'ok' : ''),
      statCard('Mood Boards', stats.moodBoards.total, `+${stats.moodBoards.newThisWeek} this week`, stats.moodBoards.newThisWeek > 0 ? 'ok' : ''),
      statCard('Print Boards', stats.printBoards.total, `+${stats.printBoards.newThisWeek} this week`, stats.printBoards.newThisWeek > 0 ? 'ok' : ''),
      statCard('Tiles', stats.tiles.total),
      statCard('Brands', stats.brands.total),
      statCard('Customers', stats.customers.total),
      statCard('Active Users', `${stats.users.active}/${stats.users.total}`),
      statCard('Design Rules', stats.designRules.total),
      statCard('Reference Images', stats.referenceImages.total),
    ].join('');

    const chip = (s) => `<span class="status-chip"><span class="casa-dot ${STATUS_CLASS[s.status] || 'neutral'}"></span>${escapeHtml(s.status)} · ${s.count}</span>`;
    document.getElementById('catalogBreakdown').innerHTML = stats.catalogs.byStatus.map(chip).join('') || '<span class="casa-hint">No catalogs yet.</span>';
    document.getElementById('moodBoardBreakdown').innerHTML = stats.moodBoards.byStatus.map(chip).join('') || '<span class="casa-hint">No mood boards yet.</span>';
  }

  function renderActivity(items) {
    const tbody = document.getElementById('activityTbody');
    if (!items.length) {
      tbody.innerHTML = `<tr><td colspan="3" class="casa-empty">No activity yet.</td></tr>`;
      return;
    }
    tbody.innerHTML = items.map((a) => `
      <tr>
        <td>${a.user ? escapeHtml(a.user.name) : '<span class="casa-hint">System</span>'}</td>
        <td><strong>${escapeHtml(a.action)}</strong>${a.entityType ? ` <span class="casa-hint">· ${escapeHtml(a.entityType)}</span>` : ''}</td>
        <td class="casa-hint">${CasaApi.relativeTime(a.createdAt)}</td>
      </tr>`).join('');
  }

  async function renderIntegrations(system) {
    const rows = [];
    rows.push({ name: 'Database', detail: system.db === 'up' ? `Connected · ${system.env}` : 'Unreachable', ok: system.db === 'up' });

    try {
      const gemini = await CasaApi.geminiStatus();
      rows.push({ name: 'Gemini API', detail: gemini.connected ? 'Connected' : (gemini.message || 'Not connected'), ok: !!gemini.connected });
    } catch { rows.push({ name: 'Gemini API', detail: 'Status unavailable', ok: false }); }

    try {
      const drive = await CasaApi.driveStatus();
      rows.push({ name: 'Google Drive', detail: drive.connected ? 'Connected' : (drive.message || 'Not connected'), ok: !!drive.connected });
    } catch { rows.push({ name: 'Google Drive', detail: 'Status unavailable', ok: false }); }

    try {
      const live = await CasaApi.designRules.live();
      rows.push({ name: 'Design Rules', detail: live ? `v${live.versionNumber} live` : 'No published version yet', ok: !!live });
    } catch { rows.push({ name: 'Design Rules', detail: 'No published version yet', ok: false }); }

    document.getElementById('integrationsBody').innerHTML = rows.map((r) => `
      <div class="integ-row">
        <span class="name"><span class="casa-dot ${r.ok ? 'ok' : 'neutral'}"></span>${escapeHtml(r.name)}</span>
        <span class="detail">${escapeHtml(r.detail)}</span>
      </div>`).join('');
  }

  async function loadDashboard() {
    try {
      const overview = await CasaApi.dashboard.overview();
      renderStats(overview.stats);
      renderActivity(overview.recentActivity);
      renderIntegrations(overview.system);
      document.getElementById('lastRefreshed').textContent = `System overview · Refreshed ${new Date().toLocaleTimeString()}`;
    } catch (err) {
      document.getElementById('statGrid').innerHTML = `<div class="casa-stat-card"><div class="label">Error</div><div class="value" style="font-size:15px;color:var(--clay);">${escapeHtml(err.message)}</div></div>`;
    }
  }

  (async () => {
    await CasaShell.init({ current: 'admin-dashboard.html', allowedRoles: ['ADMIN','OWNER'] });

    document.getElementById('refreshBtn').addEventListener('click', loadDashboard);

    await loadDashboard();
  })();
</script>
</body>
</html>
