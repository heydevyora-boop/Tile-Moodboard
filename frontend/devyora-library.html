<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>De’vyora Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1A1512; --paper:#F7F3EC; --card:#fff; --line:#E7DFD1; --sand:#F4EEE3; --gold:#8A6A3B; --gold-light:#E3C58E; --muted:#8B8177; --text2:#5B5147; --err:#A8552A; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:'DM Sans',sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:var(--gold); text-decoration:none; }
  .mono { font-family:'JetBrains Mono',monospace; }
  .serif { font-family:'Playfair Display',serif; }
  button { font-family:inherit; }
  img { max-width:100%; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:#DED3C0; border-radius:8px; border:3px solid var(--paper); }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  @keyframes rise { from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none} }
  @keyframes shimmer { from{background-position:180% 0} to{background-position:-180% 0} }

  .layout { display:flex; height:100vh; overflow:hidden; }
  .sidebar { flex:0 0 auto; width:266px; height:100%; display:flex; flex-direction:column; background:#FCFAF6; border-right:1px solid var(--line); overflow-y:auto; }
  .brand { padding:26px 22px 20px; border-bottom:1px solid #EFE7DA; }
  .brand .name { font-size:19px; letter-spacing:.14em; line-height:1.1; }
  .brand-row { display:flex; align-items:center; gap:10px; }
  .brand-mark { flex:0 0 auto; width:30px; height:30px; border-radius:7px; display:block; }
  /* The name div carries BOTH .brand and .name, so .brand's own
     22px padding was landing on it a second time and pushing the
     wordmark 22px clear of the mark, and .brand's border-bottom was
     drawing a second rule under it. Inside the row it is a wordmark,
     not a block: it shrink-wraps, carries neither, and the only space
     between the two is the gap above. */
  .brand-row .name { padding:0; border-bottom:none; flex:0 0 auto; }
  .brand .tag { font-size:9px; letter-spacing:.22em; color:var(--muted); margin-top:6px; }
  .nav { padding:20px 14px 8px; }
  .nav-label { font-size:9.5px; letter-spacing:.2em; color:#A0968A; padding:0 8px 10px; }
  .nav-items { display:flex; flex-direction:column; gap:3px; }
  .nav-item { display:flex; align-items:center; gap:12px; width:100%; min-height:48px; padding:0 12px; border:none; border-radius:12px; cursor:pointer; font-size:14px; text-align:left; background:transparent; color:#4A4038; }
  .nav-item.active { background:var(--ink); color:#FBF6EC; font-weight:500; }
  .nav-item:not(.active):hover { background:#F1EADD; }
  .nav-item .lbl { flex:1; }
  .nav-item .badge { font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.08em; padding:3px 7px; border-radius:100px; background:#F1EADD; color:var(--muted); }
  .nav-item.active .badge { background:rgba(227,197,142,.2); color:var(--gold-light); }
  .profile-wrap { margin-top:auto; padding:18px 16px; }
  .profile { display:flex; align-items:center; gap:11px; padding:12px; background:var(--sand); border:1px solid var(--line); border-radius:14px; }
  .avatar-circle { width:36px; height:36px; flex:0 0 auto; border-radius:50%; background:linear-gradient(150deg,#C09A5E,var(--gold)); display:grid; place-items:center; font-size:13px; color:#FFF8EC; }
  .profile .name { font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .profile .role { font-size:9px; letter-spacing:.14em; color:var(--muted); }
  .logout-btn { margin-top:10px; width:100%; padding:8px; background:transparent; border:1px solid var(--line); border-radius:10px; cursor:pointer; font-size:10px; letter-spacing:.1em; color:var(--muted); }
  .logout-btn:hover { color:var(--ink); border-color:#C7B393; }

  .main { flex:1; min-width:0; overflow-y:auto; padding:clamp(22px,3vw,44px); }
  .stage { animation:fadeIn .35s ease both; max-width:1100px; }

  .eyebrow { display:flex; align-items:center; gap:9px; font-size:10px; letter-spacing:.2em; color:var(--gold); }
  .dot { width:6px; height:6px; border-radius:50%; background:var(--gold); flex:0 0 auto; }
  h1.page-h1 { font-weight:600; font-size:clamp(28px,3.8vw,44px); line-height:1.08; margin:12px 0 0; }
  .page-sub { max-width:660px; margin:12px 0 0; font-size:clamp(14px,1.1vw,16px); line-height:1.55; color:var(--text2); }

  .search-box { display:flex; align-items:center; gap:9px; padding:0 14px; height:46px; max-width:420px; background:#fff; border:1px solid var(--line); border-radius:12px; margin-top:20px; }
  .search-box input { flex:1; min-width:0; border:none; outline:none; background:transparent; font-size:12px; letter-spacing:.02em; color:var(--ink); }

  .chip-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
  .chip { padding:9px 14px; border-radius:100px; cursor:pointer; font-size:10px; letter-spacing:.1em; background:var(--card); color:#4A4038; border:1px solid var(--line); }
  .chip.selected { background:var(--ink); color:#FBF6EC; border-color:var(--ink); }

  .skeleton-grid { display:flex; flex-direction:column; gap:10px; margin-top:20px; }
  .skeleton { height:74px; border-radius:16px; background:linear-gradient(90deg,#F1EADD 20%,#F8F3E9 50%,#F1EADD 80%); background-size:200% 100%; animation:shimmer 1.4s linear infinite; }

  .empty-state { padding:clamp(28px,4vw,48px) clamp(20px,3vw,32px); background:#fff; border:1px dashed #D8C9AE; border-radius:20px; text-align:center; margin-top:20px; }
  .empty-icon { width:58px; height:58px; margin:0 auto; border-radius:16px; background:var(--sand); display:grid; place-items:center; }
  .empty-title { font-weight:600; font-size:clamp(20px,2.2vw,26px); margin:18px 0 0; }
  .empty-desc { max-width:380px; margin:10px auto 0; font-size:14px; line-height:1.55; color:var(--text2); }
  .btn-primary { min-height:52px; padding:0 22px; margin-top:20px; background:var(--ink); color:#FBF6EC; border:none; border-radius:13px; cursor:pointer; font-size:10.5px; letter-spacing:.14em; }
  .btn-primary:hover { background:#33291F; }

  .sessions-list { display:flex; flex-direction:column; gap:8px; margin-top:20px; }
  .session-row { display:flex; align-items:center; gap:14px; flex-wrap:wrap; width:100%; text-align:left; padding:14px 16px; background:var(--sand); border:1px solid transparent; border-radius:16px; cursor:pointer; animation:rise .4s ease both; }
  .session-row:hover { background:#EFE7DA; border-color:#E1D5BF; }
  .session-icon { width:44px; height:44px; flex:0 0 auto; border-radius:12px; background:#E3D8C4; display:grid; place-items:center; }
  .session-main { flex:1; min-width:180px; display:flex; flex-direction:column; gap:4px; }
  .session-main .client { font-size:16.5px; }
  .session-main .meta { font-size:10px; letter-spacing:.1em; color:var(--muted); }
  .session-spec { font-size:10px; color:#4A4038; min-width:140px; }
  .status-pill { font-size:9px; letter-spacing:.1em; white-space:nowrap; padding:7px 10px; border-radius:100px; }
  .status-pill.approved { background:#F7DFBB; color:#6E5228; }
  .status-pill.neutral { background:#EDE8DF; color:#5B5147; }
  .status-pill.rejected { background:#F6E6DC; color:var(--err); }

  .load-more-row { display:flex; justify-content:center; margin-top:22px; }
  .btn-secondary { min-height:48px; padding:0 22px; background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:13px; cursor:pointer; font-size:10.5px; letter-spacing:.14em; }
  .btn-secondary:hover:not(:disabled) { background:#F1EADD; }
  .btn-secondary:disabled { opacity:.5; cursor:not-allowed; }

  /* ---- detail ---- */
  .detail-back { display:flex; align-items:center; gap:10px; min-height:44px; padding:0 4px; background:transparent; border:none; cursor:pointer; font-size:10px; letter-spacing:.18em; color:var(--muted); }
  .detail-back:hover { color:var(--ink); }
  .detail-head { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-top:6px; }
  .detail-head h1 { font-weight:600; font-size:clamp(26px,3.4vw,40px); line-height:1.14; margin:0; }
  .detail-head .sub { font-size:10px; letter-spacing:.14em; color:var(--muted); margin-top:8px; }
  .detail-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr)); gap:clamp(14px,1.8vw,22px); margin-top:clamp(18px,2.2vw,26px); }
  .thumb-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; border-radius:16px; overflow:hidden; }
  .thumb { width:100%; height:100px; background:var(--sand); overflow:hidden; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .facts-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(132px,100%),1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .fact-cell { background:var(--sand); padding:14px 16px; }
  .fact-cell .k { font-size:8.5px; letter-spacing:.16em; color:var(--muted); }
  .fact-cell .v { font-size:18px; margin-top:7px; line-height:1.2; }
  .formula-lbl { font-size:9.5px; letter-spacing:.18em; color:var(--muted); margin-top:4px; }
  .formula-list { display:flex; flex-direction:column; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .formula-row { display:flex; gap:12px; align-items:center; background:#fff; padding:13px 15px; }
  .formula-row img { width:32px; height:32px; flex:0 0 auto; border-radius:9px; object-fit:cover; background:var(--sand); }
  .formula-role { width:58px; flex:0 0 auto; font-size:9px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase; }
  .formula-val { flex:1; min-width:0; font-size:10.5px; color:#3A322A; }
  .products-list { display:flex; flex-direction:column; gap:10px; }
  .product-row { display:flex; gap:14px; align-items:center; padding:12px; background:#fff; border:1px solid var(--line); border-radius:14px; }
  .product-row img { width:48px; height:48px; flex:0 0 auto; border-radius:12px; object-fit:cover; background:var(--sand); }
  .product-row .pn { display:block; font-size:14px; font-weight:500; }
  .product-row .ps { display:block; font-size:9.5px; letter-spacing:.08em; color:var(--muted); margin-top:6px; }
  .stock-badge { font-size:8.5px; letter-spacing:.08em; }
  .stock-yes { color:#6E5228; }
  .stock-no { color:var(--err); }
  .detail-actions { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(186px,100%),1fr)); gap:10px; margin-top:auto; padding-top:8px; }
  .btn-detail-primary { display:flex; align-items:center; justify-content:center; gap:10px; min-height:54px; padding:0 16px; background:var(--ink); color:#FBF6EC; border:none; border-radius:13px; cursor:pointer; font-size:10.5px; letter-spacing:.14em; }
  .btn-detail-primary:hover { background:#33291F; }
  .btn-detail-secondary { display:flex; align-items:center; justify-content:center; gap:10px; min-height:54px; padding:0 16px; background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:13px; cursor:pointer; font-size:10.5px; letter-spacing:.14em; }
  .btn-detail-secondary:hover { background:#F1EADD; }
  .btn-detail-dashed { display:flex; align-items:center; justify-content:center; gap:10px; min-height:54px; padding:0 16px; background:transparent; color:#4A4038; border:1px dashed #D8C9AE; border-radius:13px; cursor:pointer; font-size:10.5px; letter-spacing:.14em; }
  .btn-detail-dashed:hover { background:#EFE7DA; }

  .modal-overlay { position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(26,21,18,.55); }
  .modal-box { width:min(480px,100%); background:var(--card); border:1px solid var(--line); border-radius:20px; padding:24px; }
  .modal-box h3 { font-weight:600; font-size:20px; margin:0 0 6px; }
  .modal-box p { margin:0 0 16px; font-size:13.5px; color:var(--text2); line-height:1.5; }
  .link-row { display:flex; gap:8px; align-items:center; padding:0 14px; height:48px; background:var(--sand); border:1px solid var(--line); border-radius:12px; }
  .link-row input { flex:1; min-width:0; border:none; outline:none; background:transparent; font-size:11.5px; color:var(--ink); }
  .modal-actions { display:flex; gap:10px; margin-top:16px; }

  @media (max-width: 860px) {
    .sidebar { display:none; }
    .main { padding:18px; }
  }
</style>

<style>
  /* De'vyora Library. Nothing new is invented here: the gallery reuses
     the card, line and sand tokens every other page already uses. */
  .lib-empty { margin-top:clamp(20px,2.4vw,30px); background:var(--sand); border:1px solid var(--line); border-radius:20px; padding:clamp(22px,2.4vw,30px); }
  .lib-empty h3 { margin:0; font-size:clamp(19px,2vw,24px); }
  .lib-empty p { margin:10px 0 0; font-size:14px; line-height:1.6; color:var(--text2); max-width:62ch; }

  .lib-themes { display:flex; flex-wrap:wrap; gap:8px; margin-top:20px; }
  .lib-theme { display:inline-flex; align-items:center; gap:9px; padding:10px 15px; background:var(--card); border:1px solid var(--line); border-radius:99px; font-size:12.5px; cursor:pointer; color:var(--ink); }
  .lib-theme:hover { border-color:var(--gold-light); }
  .lib-theme.selected { background:var(--ink); border-color:var(--ink); color:#FBF6EC; }
  .lib-theme .count { font-size:9px; letter-spacing:.12em; opacity:.7; }

  .lib-actions { display:flex; flex-wrap:wrap; align-items:center; gap:14px; margin-top:18px; }
  .lib-add { display:inline-flex; align-items:center; justify-content:center; min-height:46px; padding:0 20px; background:var(--gold); color:#FFF8EC; border-radius:13px; cursor:pointer; font-size:10.5px; letter-spacing:.14em; }
  .lib-add:hover { background:#6E5228; }
  .lib-hint { font-size:12px; color:var(--muted); }

  .lib-queue { margin-top:18px; padding:16px 18px; background:var(--sand); border:1px solid var(--line); border-radius:16px; }
  .lib-queue-head { display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:9.5px; letter-spacing:.16em; color:var(--muted); }
  .lib-cancel { background:none; border:none; padding:0; color:var(--err); font-size:9.5px; letter-spacing:.14em; cursor:pointer; text-decoration:underline; }
  .lib-bar { position:relative; height:5px; margin:12px 0 10px; border-radius:99px; background:var(--line); overflow:hidden; }
  .lib-bar span { position:absolute; inset:0 auto 0 0; border-radius:99px; background:linear-gradient(90deg, var(--gold), #B08D4E); transition:width .3s cubic-bezier(.4,0,.2,1); }
  .lib-failed { font-size:9.5px; letter-spacing:.1em; color:var(--err); margin-bottom:8px; }
  .lib-files { display:flex; flex-direction:column; gap:5px; max-height:210px; overflow:auto; }
  .lib-file { display:grid; grid-template-columns:1fr auto; gap:4px 12px; align-items:center; font-size:12px; }
  .lib-file-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lib-file-state { font-size:9px; letter-spacing:.1em; color:var(--muted); }
  .lib-file-done .lib-file-state { color:#4B7B52; }
  .lib-file-failed .lib-file-state { color:var(--err); }
  .lib-file-err { grid-column:1 / -1; font-size:10.5px; line-height:1.5; color:var(--err); }

  .lib-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:16px; margin-top:20px; }
  .lib-card { margin:0; background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; display:flex; flex-direction:column; }
  .lib-shot { aspect-ratio:4/3; background:var(--sand); border-bottom:1px solid var(--line); }
  .lib-shot img { width:100%; height:100%; object-fit:cover; display:block; }
  .lib-cap { padding:13px 15px 15px; display:flex; flex-direction:column; gap:6px; }
  .lib-title { font-size:13.5px; line-height:1.3; }
  .lib-meta { font-size:9px; letter-spacing:.1em; color:var(--muted); }
  .lib-del { align-self:flex-start; margin-top:3px; background:none; border:none; padding:0; color:var(--muted); font-size:9px; letter-spacing:.14em; cursor:pointer; text-decoration:underline; }
  .lib-del:hover:not(:disabled) { color:var(--err); }
  .lib-del:disabled { opacity:.6; cursor:not-allowed; }
</style>
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-row"><img class="brand-mark" src="img/devyora-mark.webp" alt="" width="30" height="30" decoding="async"><div class="brand name serif">DE’VYORA</div></div>
      <div class="brand tag mono">STUDIO &amp; SHOWROOM</div>
    </div>
    <div class="nav">
      <div class="nav-label mono">WORKSPACE</div>
      <nav class="nav-items" id="navItems"></nav>
    </div>
    <div class="profile-wrap">
      <div class="profile">
        <div class="avatar-circle serif" id="profileInitials">··</div>
        <div style="min-width:0; display:flex; flex-direction:column; gap:2px">
          <span class="name" id="profileName">—</span>
          <span class="role mono" id="profileRole">—</span>
        </div>
      </div>
      <button class="logout-btn mono" id="logoutBtn">SIGN OUT</button>
    </div>
  </aside>

  <main class="main" id="mainContent"></main>

<script src="assets/api-client.js"></script>
<script>
(function () {
  'use strict';

  const NAV_ITEMS = [
    { id: 'dashboard', label: 'Dashboard', href: 'dashboard.html' },
    { id: 'moodboard', label: 'Mood Board', href: 'mood-board.html' },
    { id: 'generations', label: 'Recent Generations', href: 'recent-generations.html' },
    { id: 'projects', label: 'Projects', href: 'projects.html' },
    { id: 'catalog', label: 'Catalog', href: 'catalog.html' },
    { id: 'library', label: 'De’vyora Library', href: 'devyora-library.html' },
  ];

  function renderNav() {
    const nav = document.getElementById('navItems');
    nav.innerHTML = '';
    NAV_ITEMS.forEach((item) => {
      const btn = document.createElement('button');
      btn.className = 'nav-item' + (item.id === 'library' ? ' active' : '');
      btn.innerHTML = '<span class="lbl">' + item.label + '</span>';
      btn.addEventListener('click', () => { location.href = item.href; });
      nav.appendChild(btn);
    });
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
  }

  const state = {
    themes: [],
    themeId: null,
    references: [],
    // The upload queue: one entry per file, each with its own state.
    queue: [],
    running: false,
    aborter: null,
  };

  // AT MOST THIS MANY AT ONCE.
  //
  // A hundred simultaneous uploads is a hundred simultaneous Drive calls
  // from one serverless function, which Google throttles and the browser
  // queues anyway. Four keeps the pipe full without either.
  const AT_ONCE = 4;

  const selectedTheme = () => state.themes.find((t) => t.id === state.themeId) || null;

  // ── rendering ─────────────────────────────────────────────────────

  function themeBarHtml() {
    return '<div class="lib-themes">' + state.themes.map((theme) =>
      '<button type="button" class="lib-theme' + (theme.id === state.themeId ? ' selected' : '')
      + '" data-theme="' + escapeHtml(theme.id) + '">'
      + escapeHtml(theme.label)
      + '<span class="count mono">' + theme.count + '</span></button>').join('') + '</div>';
  }

  function queueHtml() {
    if (!state.queue.length) return '';
    const done = state.queue.filter((f) => f.status === 'done').length;
    const failed = state.queue.filter((f) => f.status === 'failed').length;
    const total = state.queue.length;
    const share = total ? Math.round(((done + failed) / total) * 100) : 0;

    return '<div class="lib-queue" id="libQueue">'
      + '<div class="lib-queue-head">'
      + '<span class="mono">UPLOADING ' + (done + failed) + ' OF ' + total + '</span>'
      + (state.running
        ? '<button type="button" class="lib-cancel mono" id="libCancel">CANCEL</button>'
        : '<button type="button" class="lib-cancel mono" id="libClear">CLEAR</button>')
      + '</div>'
      + '<div class="lib-bar"><span style="width:' + share + '%"></span></div>'
      + (failed
        ? '<div class="lib-failed mono">' + failed + ' could not be uploaded — see below</div>'
        : '')
      + '<div class="lib-files">' + state.queue.map((item) =>
        '<div class="lib-file lib-file-' + item.status + '">'
        + '<span class="lib-file-name">' + escapeHtml(item.file.name) + '</span>'
        + '<span class="lib-file-state mono">' + escapeHtml(
          item.status === 'waiting' ? 'WAITING'
            : item.status === 'uploading' ? Math.round(item.progress * 100) + '%'
              : item.status === 'done' ? 'DONE' : 'FAILED'
        ) + '</span>'
        + (item.error ? '<span class="lib-file-err">' + escapeHtml(item.error) + '</span>' : '')
        + '</div>').join('') + '</div></div>';
  }

  function galleryHtml() {
    if (!state.themeId) {
      return '<div class="lib-empty"><h3 class="serif">Choose a theme</h3>'
        + '<p>Every reference room belongs to one theme. Pick one above to see what is in it '
        + 'and to add more.</p></div>';
    }
    if (!state.references.length) {
      return '<div class="lib-empty"><h3 class="serif">Nothing in this theme yet</h3>'
        + '<p>Add reference rooms with the button above. They are stored in the studio’s '
        + 'Google Drive.</p></div>';
    }
    return '<div class="lib-grid">' + state.references.map((ref) =>
      '<figure class="lib-card" data-id="' + escapeHtml(ref.id) + '">'
      + '<div class="lib-shot"><img src="' + escapeHtml(ref.imageUrl) + '" alt="'
      + escapeHtml(ref.title) + '" loading="lazy"></div>'
      + '<figcaption class="lib-cap">'
      + '<span class="lib-title">' + escapeHtml(ref.title) + '</span>'
      + '<span class="lib-meta mono">' + escapeHtml(
        [ref.room, ref.uploadedBy && ref.uploadedBy.name].filter(Boolean).join(' · ')
      ) + '</span>'
      + '<button type="button" class="lib-del mono" data-delete="' + escapeHtml(ref.id) + '">REMOVE</button>'
      + '</figcaption></figure>').join('') + '</div>';
  }

  function render() {
    const theme = selectedTheme();
    document.getElementById('mainContent').innerHTML =
      '<div class="stage">'
      + '<div class="mono" style="font-size:10px; letter-spacing:.18em; color:var(--muted)">REFERENCE ROOMS</div>'
      + '<h1 class="step-h1 serif">De’vyora Library</h1>'
      + '<p class="step-sub">Rooms the studio has chosen, kept by theme. Picking one finds the '
      + 'catalog tiles that match it, and the scene is then generated from that same picture.</p>'
      + themeBarHtml()
      + (theme
        ? '<div class="lib-actions">'
          + '<label class="lib-add mono" for="libFiles">ADD IMAGES TO ' + escapeHtml(theme.label.toUpperCase()) + '</label>'
          + '<input type="file" id="libFiles" accept="image/jpeg,image/png,image/webp" multiple hidden>'
          + '<span class="lib-hint">Pick as many as you like — they go up a few at a time.</span>'
          + '</div>'
        : '')
      + '<div class="alert" id="libAlert" style="display:none"></div>'
      + queueHtml()
      + galleryHtml()
      + '</div>';
    wire();
  }

  function repaintQueue() {
    const host = document.getElementById('libQueue');
    if (!host) { render(); return; }
    host.outerHTML = queueHtml();
    wireQueue();
  }

  function showAlert(message) {
    const el = document.getElementById('libAlert');
    if (!el) return;
    el.textContent = message;
    el.style.display = message ? 'flex' : 'none';
  }

  // ── the queue ─────────────────────────────────────────────────────

  async function runQueue() {
    if (state.running) return;
    state.running = true;
    state.aborter = new AbortController();
    repaintQueue();

    const theme = state.themeId;
    let next = 0;

    const worker = async () => {
      for (let i = next++; i < state.queue.length; i = next++) {
        if (state.aborter.signal.aborted) return;
        const item = state.queue[i];
        item.status = 'uploading';
        item.progress = 0;
        repaintQueue();

        try {
          const saved = await CasaApi.library.upload(item.file, { themeId: theme }, {
            signal: state.aborter.signal,
            onProgress: (share) => {
              item.progress = share;
              const cell = document.querySelectorAll('.lib-file')[i];
              const label = cell && cell.querySelector('.lib-file-state');
              if (label) label.textContent = Math.round(share * 100) + '%';
            },
          });
          item.status = 'done';
          // Shown at once rather than after the whole batch: on a
          // hundred files, waiting to the end is a blank page for
          // minutes.
          if (saved && state.themeId === theme) state.references.unshift(saved);
        } catch (err) {
          item.status = 'failed';
          item.error = (err && err.message) || 'Upload failed.';
        }
        repaintQueue();
      }
    };

    await Promise.all(
      Array.from({ length: Math.min(AT_ONCE, state.queue.length) }, worker)
    );

    state.running = false;
    const failed = state.queue.filter((f) => f.status === 'failed').length;
    const done = state.queue.filter((f) => f.status === 'done').length;

    // The counts on the theme bar are now wrong by `done`.
    const theirTheme = state.themes.find((t) => t.id === theme);
    if (theirTheme) theirTheme.count += done;

    render();
    if (failed) {
      showAlert(failed + ' of ' + state.queue.length + ' could not be uploaded. '
        + 'The rest are in the library.');
    }
  }

  function enqueue(files) {
    if (!state.themeId) return;
    state.queue = Array.from(files).map((file) => ({
      file, status: 'waiting', progress: 0, error: null,
    }));
    showAlert('');
    runQueue();
  }

  // ── wiring ────────────────────────────────────────────────────────

  function wireQueue() {
    const cancel = document.getElementById('libCancel');
    if (cancel) {
      cancel.addEventListener('click', () => {
        if (state.aborter) state.aborter.abort();
      });
    }
    const clear = document.getElementById('libClear');
    if (clear) {
      clear.addEventListener('click', () => { state.queue = []; render(); });
    }
  }

  function wire() {
    document.querySelectorAll('[data-theme]').forEach((btn) => {
      btn.addEventListener('click', () => selectTheme(btn.dataset.theme));
    });

    const files = document.getElementById('libFiles');
    if (files) {
      files.addEventListener('change', () => {
        if (files.files && files.files.length) enqueue(files.files);
        files.value = '';
      });
    }

    document.querySelectorAll('[data-delete]').forEach((btn) => {
      btn.addEventListener('click', () => remove(btn.dataset.delete, btn));
    });

    wireQueue();
  }

  async function remove(id, btn) {
    const ref = state.references.find((r) => r.id === id);
    if (!window.confirm('Remove "' + ((ref && ref.title) || 'this reference') + '" from the '
      + 'library? It is deleted from Google Drive too.')) return;

    btn.disabled = true;
    btn.textContent = 'REMOVING…';
    try {
      const result = await CasaApi.library.remove(id);
      state.references = state.references.filter((r) => r.id !== id);
      const theme = selectedTheme();
      if (theme && theme.count > 0) theme.count -= 1;
      render();
      if (result && result.driveDeleted === false) {
        showAlert('Removed from the library, but the file could not be deleted from Drive: '
          + (result.driveError || 'unknown error'));
      }
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'REMOVE';
      showAlert((err && err.message) || 'That could not be removed.');
    }
  }

  async function selectTheme(themeId) {
    if (state.running) return;
    state.themeId = themeId;
    state.references = [];
    state.queue = [];
    render();
    try {
      state.references = await CasaApi.library.references(themeId);
    } catch (err) {
      showAlert((err && err.message) || 'The library could not be read.');
    }
    render();
  }

  async function init() {
    const user = await CasaApi.requireAuth();

    document.getElementById('profileInitials').textContent = CasaApi.initials(user.name);
    document.getElementById('profileName').textContent = user.name || user.email;
    document.getElementById('profileRole').textContent = (user.role || '').toUpperCase();

    renderNav();
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await CasaApi.auth.logout();
      location.href = 'login.html';
    });

    // The themes come from the server, which reads shared/themes.json --
    // the one list the prompts, the theme check and the tile ranking are
    // written against. A copy kept in this page would drift from it.
    try {
      state.themes = await CasaApi.library.themes();
    } catch (err) {
      state.themes = [];
    }
    render();
    if (!state.themes.length) showAlert('The theme list could not be read.');
  }

  init();
})();
</script>
</body>
</html>
