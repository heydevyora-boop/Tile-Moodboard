<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>De’vyora Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1A1512; --paper:#F7F3EC; --card:#fff; --line:#E7DFD1; --sand:#F4EEE3; --gold:#8A6A3B; --gold-light:#E3C58E; --muted:#8B8177; --text2:#5B5147; --err:#A8552A; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:'DM Sans',sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:var(--gold); text-decoration:none; }
  .mono { font-family:'JetBrains Mono',monospace; }
  .serif { font-family:'Playfair Display',serif; }
  button { font-family:inherit; }
  img { max-width:100%; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:#DED3C0; border-radius:8px; border:3px solid var(--paper); }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  @keyframes rise { from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none} }
  @keyframes shimmer { from{background-position:180% 0} to{background-position:-180% 0} }

  .layout { display:flex; height:100vh; overflow:hidden; }
  .sidebar { flex:0 0 auto; width:266px; height:100%; display:flex; flex-direction:column; background:#FCFAF6; border-right:1px solid var(--line); overflow-y:auto; }
  .brand { padding:26px 22px 20px; border-bottom:1px solid #EFE7DA; }
  .brand .name { font-size:19px; letter-spacing:.14em; line-height:1.1; }
  .brand-row { display:flex; align-items:center; gap:10px; }
  .brand-mark { flex:0 0 auto; width:30px; height:30px; border-radius:7px; display:block; }
  /* The name div carries BOTH .brand and .name, so .brand's own
     22px padding was landing on it a second time and pushing the
     wordmark 22px clear of the mark, and .brand's border-bottom was
     drawing a second rule under it. Inside the row it is a wordmark,
     not a block: it shrink-wraps, carries neither, and the only space
     between the two is the gap above. */
  .brand-row .name { padding:0; border-bottom:none; flex:0 0 auto; }
  .brand .tag { font-size:9px; letter-spacing:.22em; color:var(--muted); margin-top:6px; }
  .nav { padding:20px 14px 8px; }
  .nav-label { font-size:9.5px; letter-spacing:.2em; color:#A0968A; padding:0 8px 10px; }
  .nav-items { display:flex; flex-direction:column; gap:3px; }
  .nav-item { display:flex; align-items:center; gap:12px; width:100%; min-height:48px; padding:0 12px; border:none; border-radius:12px; cursor:pointer; font-size:14px; text-align:left; background:transparent; color:#4A4038; }
  .nav-item.active { background:var(--ink); color:#FBF6EC; font-weight:500; }
  .nav-item:not(.active):hover { background:#F1EADD; }
  .nav-item .lbl { flex:1; }
  .nav-item .badge { font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.08em; padding:3px 7px; border-radius:100px; background:#F1EADD; color:var(--muted); }
  .nav-item.active .badge { background:rgba(227,197,142,.2); color:var(--gold-light); }
  .profile-wrap { margin-top:auto; padding:18px 16px; }
  .profile { display:flex; align-items:center; gap:11px; padding:12px; background:var(--sand); border:1px solid var(--line); border-radius:14px; }
  .avatar-circle { width:36px; height:36px; flex:0 0 auto; border-radius:50%; background:linear-gradient(150deg,#C09A5E,var(--gold)); display:grid; place-items:center; font-size:13px; color:#FFF8EC; }
  .profile .name { font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .profile .role { font-size:9px; letter-spacing:.14em; color:var(--muted); }
  .logout-btn { margin-top:10px; width:100%; padding:8px; background:transparent; border:1px solid var(--line); border-radius:10px; cursor:pointer; font-size:10px; letter-spacing:.1em; color:var(--muted); }
  .logout-btn:hover { color:var(--ink); border-color:#C7B393; }

  .main { flex:1; min-width:0; overflow-y:auto; padding:clamp(22px,3vw,44px); }
  .stage { animation:fadeIn .35s ease both; max-width:1100px; }

  .eyebrow { display:flex; align-items:center; gap:9px; font-size:10px; letter-spacing:.2em; color:var(--gold); }
  .dot { width:6px; height:6px; border-radius:50%; background:var(--gold); flex:0 0 auto; }
  h1.page-h1 { font-weight:600; font-size:clamp(28px,3.8vw,44px); line-height:1.08; margin:12px 0 0; }
  .page-sub { max-width:660px; margin:12px 0 0; font-size:clamp(14px,1.1vw,16px); line-height:1.55; color:var(--text2); }

  .search-box { display:flex; align-items:center; gap:9px; padding:0 14px; height:46px; max-width:420px; background:#fff; border:1px solid var(--line); border-radius:12px; margin-top:20px; }
  .search-box input { flex:1; min-width:0; border:none; outline:none; background:transparent; font-size:12px; letter-spacing:.02em; color:var(--ink); }

  .chip-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
  .chip { padding:9px 14px; border-radius:100px; cursor:pointer; font-size:10px; letter-spacing:.1em; background:var(--card); color:#4A4038; border:1px solid var(--line); }
  .chip.selected { background:var(--ink); color:#FBF6EC; border-color:var(--ink); }

  .skeleton-grid { display:flex; flex-direction:column; gap:10px; margin-top:20px; }
  .skeleton { height:74px; border-radius:16px; background:linear-gradient(90deg,#F1EADD 20%,#F8F3E9 50%,#F1EADD 80%); background-size:200% 100%; animation:shimmer 1.4s linear infinite; }

  .empty-state { padding:clamp(28px,4vw,48px) clamp(20px,3vw,32px); background:#fff; border:1px dashed #D8C9AE; border-radius:20px; text-align:center; margin-top:20px; }
  .empty-icon { width:58px; height:58px; margin:0 auto; border-radius:16px; background:var(--sand); display:grid; place-items:center; }
  .empty-title { font-weight:600; font-size:clamp(20px,2.2vw,26px); margin:18px 0 0; }
  .empty-desc { max-width:380px; margin:10px auto 0; font-size:14px; line-height:1.55; color:var(--text2); }
  .btn-primary { min-height:52px; padding:0 22px; margin-top:20px; background:var(--ink); color:#FBF6EC; border:none; border-radius:13px; cursor:pointer; font-size:10.5px; letter-spacing:.14em; }
  .btn-primary:hover { background:#33291F; }

  .sessions-list { display:flex; flex-direction:column; gap:8px; margin-top:20px; }
  .session-row { display:flex; align-items:center; gap:14px; flex-wrap:wrap; width:100%; text-align:left; padding:14px 16px; background:var(--sand); border:1px solid transparent; border-radius:16px; cursor:pointer; animation:rise .4s ease both; }
  .session-row:hover { background:#EFE7DA; border-color:#E1D5BF; }
  .session-icon { width:44px; height:44px; flex:0 0 auto; border-radius:12px; background:#E3D8C4; display:grid; place-items:center; }
  .session-main { flex:1; min-width:180px; display:flex; flex-direction:column; gap:4px; }
  .session-main .client { font-size:16.5px; }
  .session-main .meta { font-size:10px; letter-spacing:.1em; color:var(--muted); }
  .session-spec { font-size:10px; color:#4A4038; min-width:140px; }
  .status-pill { font-size:9px; letter-spacing:.1em; white-space:nowrap; padding:7px 10px; border-radius:100px; }
  .status-pill.approved { background:#F7DFBB; color:#6E5228; }
  .status-pill.neutral { background:#EDE8DF; color:#5B5147; }
  .status-pill.rejected { background:#F6E6DC; color:var(--err); }

  .load-more-row { display:flex; justify-content:center; margin-top:22px; }
  .btn-secondary { min-height:48px; padding:0 22px; background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:13px; cursor:pointer; font-size:10.5px; letter-spacing:.14em; }
  .btn-secondary:hover:not(:disabled) { background:#F1EADD; }
  .btn-secondary:disabled { opacity:.5; cursor:not-allowed; }

  /* ---- detail ---- */
  .detail-back { display:flex; align-items:center; gap:10px; min-height:44px; padding:0 4px; background:transparent; border:none; cursor:pointer; font-size:10px; letter-spacing:.18em; color:var(--muted); }
  .detail-back:hover { color:var(--ink); }
  .detail-head { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-top:6px; }
  .detail-head h1 { font-weight:600; font-size:clamp(26px,3.4vw,40px); line-height:1.14; margin:0; }
  .detail-head .sub { font-size:10px; letter-spacing:.14em; color:var(--muted); margin-top:8px; }
  .detail-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr)); gap:clamp(14px,1.8vw,22px); margin-top:clamp(18px,2.2vw,26px); }
  .thumb-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; border-radius:16px; overflow:hidden; }
  .thumb { width:100%; height:100px; background:var(--sand); overflow:hidden; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .facts-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(132px,100%),1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .fact-cell { background:var(--sand); padding:14px 16px; }
  .fact-cell .k { font-size:8.5px; letter-spacing:.16em; color:var(--muted); }
  .fact-cell .v { font-size:18px; margin-top:7px; line-height:1.2; }
  .formula-lbl { font-size:9.5px; letter-spacing:.18em; color:var(--muted); margin-top:4px; }
  .formula-list { display:flex; flex-direction:column; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .formula-row { display:flex; gap:12px; align-items:center; background:#fff; padding:13px 15px; }
  .formula-row img { width:32px; height:32px; flex:0 0 auto; border-radius:9px; object-fit:cover; background:var(--sand); }
  .formula-role { width:58px; flex:0 0 auto; font-size:9px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase; }
  .formula-val { flex:1; min-width:0; font-size:10.5px; color:#3A322A; }
  .products-list { display:flex; flex-direction:column; gap:10px; }
  .product-row { display:flex; gap:14px; align-items:center; padding:12px; background:#fff; border:1px solid var(--line); border-radius:14px; }
  .product-row img { width:48px; height:48px; flex:0 0 auto; border-radius:12px; object-fit:cover; background:var(--sand); }
  .product-row .pn { display:block; font-size:14px; font-weight:500; }
  .product-row .ps { display:block; font-size:9.5px; letter-spacing:.08em; color:var(--muted); margin-top:6px; }
  .stock-badge { font-size:8.5px; letter-spacing:.08em; }
  .stock-yes { color:#6E5228; }
  .stock-no { color:var(--err); }
  .detail-actions { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(186px,100%),1fr)); gap:10px; margin-top:auto; padding-top:8px; }
  .btn-detail-primary { display:flex; align-items:center; justify-content:center; gap:10px; min-height:54px; padding:0 16px; background:var(--ink); color:#FBF6EC; border:none; border-radius:13px; cursor:pointer; font-size:10.5px; letter-spacing:.14em; }
  .btn-detail-primary:hover { background:#33291F; }
  .btn-detail-secondary { display:flex; align-items:center; justify-content:center; gap:10px; min-height:54px; padding:0 16px; background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:13px; cursor:pointer; font-size:10.5px; letter-spacing:.14em; }
  .btn-detail-secondary:hover { background:#F1EADD; }
  .btn-detail-dashed { display:flex; align-items:center; justify-content:center; gap:10px; min-height:54px; padding:0 16px; background:transparent; color:#4A4038; border:1px dashed #D8C9AE; border-radius:13px; cursor:pointer; font-size:10.5px; letter-spacing:.14em; }
  .btn-detail-dashed:hover { background:#EFE7DA; }

  .modal-overlay { position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(26,21,18,.55); }
  .modal-box { width:min(480px,100%); background:var(--card); border:1px solid var(--line); border-radius:20px; padding:24px; }
  .modal-box h3 { font-weight:600; font-size:20px; margin:0 0 6px; }
  .modal-box p { margin:0 0 16px; font-size:13.5px; color:var(--text2); line-height:1.5; }
  .link-row { display:flex; gap:8px; align-items:center; padding:0 14px; height:48px; background:var(--sand); border:1px solid var(--line); border-radius:12px; }
  .link-row input { flex:1; min-width:0; border:none; outline:none; background:transparent; font-size:11.5px; color:var(--ink); }
  .modal-actions { display:flex; gap:10px; margin-top:16px; }

  @media (max-width: 860px) {
    .sidebar { display:none; }
    .main { padding:18px; }
  }
</style>

<style>
  /* De'vyora Library. Nothing new is invented here: the cards, lines and
     sand tones are the tokens every other page already uses. */
  .lib-empty { margin-top:clamp(20px,2.4vw,30px); background:var(--sand); border:1px solid var(--line); border-radius:20px; padding:clamp(22px,2.4vw,30px); }
  .lib-empty h3 { margin:0; font-size:clamp(19px,2vw,24px); }
  .lib-empty p { margin:10px 0 0; font-size:14px; line-height:1.6; color:var(--text2); max-width:62ch; }

  /* ── the chosen reference, said at the top of every view ── */
  .lib-active { display:flex; align-items:center; gap:14px; margin-top:18px; padding:12px 14px; background:var(--card); border:1px solid var(--gold-light); border-radius:16px; }
  .lib-active-shot { flex:0 0 auto; width:62px; height:46px; border-radius:10px; overflow:hidden; background:var(--sand); border:1px solid var(--line); }
  .lib-active-shot img { width:100%; height:100%; object-fit:cover; display:block; }
  .lib-active-text { min-width:0; display:flex; flex-direction:column; gap:3px; }
  .lib-active-lbl { font-size:8.5px; letter-spacing:.18em; color:var(--gold); }
  .lib-active-name { font-size:13.5px; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lib-active-meta { font-size:9px; letter-spacing:.1em; color:var(--muted); }
  /* The two things to do with a chosen room: spend it, or drop it.
     Pushed to the end of the banner together, so the name beside it
     stays the thing the eye lands on. */
  .lib-active-acts { margin-left:auto; flex:0 0 auto; display:flex; align-items:center; gap:14px; }
  .lib-active-go { flex:0 0 auto; font-size:9px; letter-spacing:.14em; color:var(--gold); text-decoration:none; border:1px solid var(--gold-light); border-radius:9px; padding:7px 11px; white-space:nowrap; }
  .lib-active-go:hover { color:var(--ink); border-color:var(--gold); }
  .lib-active-clear { flex:0 0 auto; background:none; border:none; padding:0; color:var(--muted); font-size:9px; letter-spacing:.14em; cursor:pointer; text-decoration:underline; }
  .lib-active-clear:hover { color:var(--err); }

  /* ── a line that explains something, rather than leaving a gap ── */
  /* Informative, deliberately not loud. These used to be two tall boxes
     that pushed the rooms below the fold -- and the rooms are the page. */
  .lib-note { display:flex; flex-direction:column; gap:4px; padding:10px 13px; margin:14px 0 0;
              border:1px solid var(--line); border-radius:12px; background:var(--card);
              font-size:11.5px; line-height:1.5; color:var(--text2); }
  .lib-note-k { font-size:8px; letter-spacing:.18em; color:var(--gold); }
  .lib-note code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px;
                   background:var(--sand); padding:1px 5px; border-radius:5px; }
  .lib-note-bad { border-color:var(--err); }
  .lib-note-bad .lib-note-k { color:var(--err); }
  /* showAlert() writes here. The class had no rule on this page, so
     every alert came out as unstyled body text sitting between the
     upload card and the pictures -- which is how the same sentence
     appeared to be printed twice. */
  .alert { padding:10px 13px; margin:14px 0 0; border:1px solid var(--err);
           border-radius:12px; background:var(--card); font-size:11.5px;
           line-height:1.5; color:var(--err); }

  /* ── the themes ──
     A theme card now shows a ROOM, not a swatch: the first starter in
     that theme, which is what the client is actually going to pick
     between. The pattern art stays as a small plate on top of it, so
     the surface the theme is built on is still legible at a glance. */
  .lib-theme-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(268px, 1fr)); gap:20px; margin-top:22px; }
  .lib-theme-card { position:relative; display:flex; flex-direction:column; text-align:left; padding:0;
                    background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden;
                    cursor:pointer; color:var(--ink); box-shadow:0 1px 2px rgba(26,21,18,.04);
                    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
  .lib-theme-card:hover { transform:translateY(-3px); border-color:var(--gold-light);
                          box-shadow:0 14px 30px -14px rgba(26,21,18,.28); }
  .lib-theme-card:focus-visible { outline:2px solid var(--gold); outline-offset:3px; }
  .lib-theme-art { position:relative; aspect-ratio:4/3; background:var(--sand); overflow:hidden; }
  .lib-theme-art > img { width:100%; height:100%; object-fit:cover; display:block;
                         transition:transform .5s cubic-bezier(.2,.7,.3,1); }
  .lib-theme-card:hover .lib-theme-art > img { transform:scale(1.045); }
  /* The bottom of the picture is where the text sits, so it is darkened
     to keep the name readable whatever the room behind it is doing. */
  .lib-theme-art::after { content:''; position:absolute; inset:auto 0 0 0; height:58%;
                          background:linear-gradient(to top, rgba(26,21,18,.74), rgba(26,21,18,0)); }
  .lib-theme-plate { position:absolute; top:12px; left:12px; width:52px; height:52px; border-radius:11px;
                     overflow:hidden; border:1px solid rgba(255,255,255,.5);
                     box-shadow:0 3px 10px rgba(26,21,18,.3); }
  .lib-theme-plate img { width:100%; height:100%; object-fit:cover; display:block; }
  .lib-theme-over { position:absolute; inset:auto 0 0 0; z-index:1; padding:14px 16px 13px;
                    display:flex; flex-direction:column; gap:3px; }
  .lib-theme-name { font-size:17px; color:#FFF8EC; line-height:1.25; }
  .lib-theme-pal { font-size:10.5px; line-height:1.4; color:rgba(255,248,236,.78);
                   overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lib-theme-foot { display:flex; align-items:center; justify-content:space-between; gap:10px;
                    padding:11px 16px 12px; }
  .lib-theme-count { font-size:8.5px; letter-spacing:.16em; color:var(--gold); }
  .lib-theme-go { font-size:8.5px; letter-spacing:.16em; color:var(--muted); }
  .lib-theme-card:hover .lib-theme-go { color:var(--ink); }

  /* ── which of a theme's five rooms hold anything ── */
  .lib-theme-rooms { display:flex; gap:4px; }
  .lib-room-dot { width:17px; height:17px; border-radius:5px; display:grid; place-items:center;
                  font-size:8px; letter-spacing:0; color:var(--muted);
                  background:var(--sand); border:1px solid var(--line); }
  .lib-room-dot.has { background:var(--gold); border-color:var(--gold); color:#FFF8EC; }

  /* ── the upload, with the two things a picture is filed under ── */
  .lib-upload { margin-top:18px; padding:15px 16px 16px; border:1px solid var(--line);
                border-radius:16px; background:var(--card); display:flex; flex-direction:column;
                gap:12px; align-items:flex-start; }
  .lib-upload-fields { display:flex; gap:14px; flex-wrap:wrap; width:100%; }
  .lib-field { display:flex; flex-direction:column; gap:5px; flex:1 1 180px; min-width:0; }
  .lib-field-k { font-size:8px; letter-spacing:.18em; color:var(--muted); }
  .lib-select { appearance:none; width:100%; padding:9px 30px 9px 11px; font:inherit; font-size:13px;
                color:var(--ink); background:var(--paper) url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='%238B8177' d='M1 1l5 5 5-5'/%3E%3C/svg%3E") no-repeat right 11px center/10px 7px;
                border:1px solid var(--line); border-radius:10px; cursor:pointer; }
  .lib-select:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }

  /* ── a room that ships with the app ── */
  .lib-starter-flag { position:absolute; top:10px; right:10px; padding:5px 9px; border-radius:99px;
                      background:rgba(26,21,18,.62); color:#FFF8EC; font-size:7.5px; letter-spacing:.16em;
                      backdrop-filter:blur(3px); }

  /* ── the opening line ── */
  .lib-hero { display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between;
              gap:16px; margin-top:4px; }
  .lib-hero-sub { max-width:62ch; }
  .lib-stat { display:flex; gap:26px; flex:none; }
  .lib-stat-n { display:block; font-size:25px; line-height:1; }
  .lib-stat-k { display:block; margin-top:5px; font-size:8px; letter-spacing:.17em; color:var(--muted); }

  /* ── one theme's rooms ── */
  .lib-back { display:inline-flex; align-items:center; gap:7px; margin-top:16px; background:none; border:none; padding:0; color:var(--muted); font-size:9.5px; letter-spacing:.14em; cursor:pointer; }
  .lib-back:hover { color:var(--ink); }
  .lib-head { display:flex; flex-wrap:wrap; align-items:baseline; gap:12px; margin-top:10px; }

  .lib-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(258px, 1fr)); gap:20px; margin-top:22px; }
  .lib-card { margin:0; background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden;
              display:flex; flex-direction:column; cursor:pointer; position:relative;
              box-shadow:0 1px 2px rgba(26,21,18,.04);
              transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
  .lib-card:hover { transform:translateY(-3px); border-color:var(--gold-light);
                    box-shadow:0 14px 30px -14px rgba(26,21,18,.28); }
  .lib-card:focus-visible { outline:2px solid var(--gold); outline-offset:3px; }
  .lib-card.chosen { border-color:var(--gold); box-shadow:0 0 0 2px var(--gold), 0 14px 30px -16px rgba(26,21,18,.3); }
  .lib-card.chosen:hover { transform:none; }
  .lib-shot { aspect-ratio:4/3; background:var(--sand); border-bottom:1px solid var(--line); overflow:hidden; }
  .lib-shot img { transition:transform .5s cubic-bezier(.2,.7,.3,1); }
  .lib-card:hover .lib-shot img { transform:scale(1.045); }
  .lib-shot img { width:100%; height:100%; object-fit:cover; display:block; }
  .lib-chosen-flag { position:absolute; top:10px; left:10px; padding:5px 9px; border-radius:99px; background:var(--gold); color:#FFF8EC; font-size:8px; letter-spacing:.16em; }
  .lib-cap { padding:13px 15px 15px; display:flex; flex-direction:column; gap:6px; }
  .lib-title { font-size:13.5px; line-height:1.3; }
  .lib-meta { font-size:9px; letter-spacing:.1em; color:var(--muted); }
  .lib-del { align-self:flex-start; margin-top:3px; background:none; border:none; padding:0; color:var(--muted); font-size:9px; letter-spacing:.14em; cursor:pointer; text-decoration:underline; }
  .lib-del:hover:not(:disabled) { color:var(--err); }
  .lib-del:disabled { opacity:.6; cursor:not-allowed; }

  /* ── waiting ── */
  .lib-skeleton { background:linear-gradient(100deg, var(--sand) 38%, rgba(255,255,255,.55) 50%, var(--sand) 62%); background-size:220% 100%; animation:libShimmer 1.3s ease-in-out infinite; }
  @keyframes libShimmer { from { background-position:150% 0; } to { background-position:-50% 0; } }
  @media (prefers-reduced-motion: reduce) { .lib-skeleton { animation:none; } }
  .lib-skel-card { border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  .lib-skel-art { aspect-ratio:4/3; }
  .lib-skel-lines { padding:13px 15px 15px; display:flex; flex-direction:column; gap:7px; }
  .lib-skel-line { height:10px; border-radius:99px; }
  .lib-skel-line.short { width:55%; }

  /* ── adding pictures (staff) ── */
  .lib-actions { display:flex; flex-wrap:wrap; align-items:center; gap:14px; margin-top:18px; }
  .lib-add { display:inline-flex; align-items:center; justify-content:center; min-height:46px; padding:0 20px; background:var(--gold); color:#FFF8EC; border-radius:13px; cursor:pointer; font-size:10.5px; letter-spacing:.14em; }
  .lib-add:hover { background:#6E5228; }
  .lib-hint { font-size:12px; color:var(--muted); }

  .lib-queue { margin-top:18px; padding:16px 18px; background:var(--sand); border:1px solid var(--line); border-radius:16px; }
  .lib-queue-head { display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:9.5px; letter-spacing:.16em; color:var(--muted); }
  .lib-cancel { background:none; border:none; padding:0; color:var(--err); font-size:9.5px; letter-spacing:.14em; cursor:pointer; text-decoration:underline; }
  .lib-bar { position:relative; height:5px; margin:12px 0 10px; border-radius:99px; background:var(--line); overflow:hidden; }
  .lib-bar span { position:absolute; inset:0 auto 0 0; border-radius:99px; background:linear-gradient(90deg, var(--gold), #B08D4E); transition:width .3s cubic-bezier(.4,0,.2,1); }
  .lib-failed { font-size:9.5px; letter-spacing:.1em; color:var(--err); margin-bottom:8px; }
  .lib-files { display:flex; flex-direction:column; gap:5px; max-height:210px; overflow:auto; }
  .lib-file { display:grid; grid-template-columns:1fr auto; gap:4px 12px; align-items:center; font-size:12px; }
  .lib-file-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lib-file-state { font-size:9px; letter-spacing:.1em; color:var(--muted); }
  .lib-file-done .lib-file-state { color:#4B7B52; }
  .lib-file-failed .lib-file-state { color:var(--err); }
  .lib-file-err { grid-column:1 / -1; font-size:10.5px; line-height:1.5; color:var(--err); }

  @media (max-width: 560px) {
    .lib-theme-grid, .lib-grid { grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px; }
    .lib-active { flex-wrap:wrap; }
    .lib-active-acts { margin-left:0; width:100%; }
  }
</style>
<link rel="stylesheet" href="assets/sidebar.css">
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-row"><img class="brand-mark" src="img/devyora-mark.webp" alt="" width="30" height="30" decoding="async"><div class="brand name serif">DE’VYORA</div></div>
      <div class="brand tag mono">STUDIO &amp; SHOWROOM</div>
    </div>
    <div class="nav">
      <div class="nav-label mono">WORKSPACE</div>
      <nav class="nav-items" id="navItems"></nav>
    </div>
    <div class="profile-wrap">
      <div class="profile">
        <div class="avatar-circle serif" id="profileInitials">··</div>
        <div style="min-width:0; display:flex; flex-direction:column; gap:2px">
          <span class="name" id="profileName">—</span>
          <span class="role mono" id="profileRole">—</span>
        </div>
      </div>
      <button class="logout-btn mono" id="logoutBtn">SIGN OUT</button>
    </div>
  </aside>

  <main class="main" id="mainContent"></main>

<script src="assets/api-client.js"></script>
<script>
(function () {
  'use strict';

  const NAV_ITEMS = [
    { id: 'dashboard', label: 'Dashboard', href: 'dashboard.html' },
    { id: 'moodboard', label: 'Mood Board', href: 'mood-board.html' },
    { id: 'generations', label: 'Recent Generations', href: 'recent-generations.html' },
    { id: 'projects', label: 'Projects', href: 'projects.html' },
    { id: 'catalog', label: 'Catalog', href: 'catalog.html' },
    { id: 'library', label: 'De’vyora Library', href: 'devyora-library.html' },
  ];

  function renderNav() {
    const nav = document.getElementById('navItems');
    nav.innerHTML = '';
    NAV_ITEMS.forEach((item) => {
      const btn = document.createElement('button');
      btn.className = 'nav-item' + (item.id === 'library' ? ' active' : '');
      btn.innerHTML = '<span class="lbl">' + item.label + '</span>';
      btn.addEventListener('click', () => { location.href = item.href; });
      nav.appendChild(btn);
    });
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
  }

  // TWO VIEWS, ONE PAGE.
  //
  //   themes  every theme, as a card with its own preview art
  //   theme   one theme's reference rooms, to look at and to choose from
  //
  // `view` is the whole of the navigation. There is no router here and
  // no second page: the client goes in and comes back out, and the
  // chosen reference is stated at the top of both views so it is never
  // a question what is currently selected.
  const state = {
    // themes -> rooms -> pictures. Three levels, because the library
    // is a Theme -> Room hierarchy: a theme card opens that theme's
    // rooms, and a room card opens its pictures.
    view: 'themes',
    themes: [],
    themeId: null,
    rooms: [],
    roomId: null,
    references: [],
    loading: true,
    chosen: null,
    canAdd: false,
    /**
     * Why the library's own storage is not answering, when it is not.
     *
     * Empty is the normal case. Non-empty means the themes are listed
     * (they come from the studio's theme file) but their counts, their
     * rooms and any upload cannot work until it is fixed -- and it
     * says, in the words the server used, exactly what to do.
     */
    storageError: '',
    /**
     * Why this deployment cannot upload, when it cannot.
     *
     * Known at page load, so the studio is warned before picking
     * files rather than after watching a hundred of them fail.
     */
    uploadError: '',
    /** True once the theme request has actually come back. */
    loadFailed: false,
    queue: [],
    running: false,
    aborter: null,
  };

  const AT_ONCE = 4;
  const theme = (id) => state.themes.find((t) => t.id === (id || state.themeId)) || null;
  const roomsOf = (id) => (theme(id) || {}).rooms || [];
  const room = (id) => roomsOf().find((r) => r.id === (id || state.roomId)) || null;

  // ── pieces ────────────────────────────────────────────────────────

  function activeHtml() {
    if (!state.chosen) return '';
    const where = theme(state.chosen.themeId);
    return '<div class="lib-active" id="libActive">'
      + '<span class="lib-active-shot"><img src="' + escapeHtml(state.chosen.imageUrl)
      + '" alt="" loading="lazy"></span>'
      + '<span class="lib-active-text">'
      + '<span class="lib-active-lbl mono">ACTIVE REFERENCE IMAGE</span>'
      + '<span class="lib-active-name">' + escapeHtml(state.chosen.title || 'Untitled') + '</span>'
      + '<span class="lib-active-meta mono">' + escapeHtml(
        [where ? where.label : state.chosen.themeId, state.chosen.room].filter(Boolean).join(' · ')
      ) + '</span></span>'
      // WHERE THE CHOICE IS ACTUALLY USED.
      //
      // Choosing a room here and then finding the way to generate from
      // it was the one step the client had to work out on their own:
      // this page keeps the choice, the mood board spends it. The link
      // closes that gap, and the wizard picks the choice up from the
      // same place whether they arrive through it or not.
      + '<span class="lib-active-acts">'
      + '<a class="lib-active-go mono" href="mood-board.html">USE IN A MOOD BOARD \u2192</a>'
      + '<button type="button" class="lib-active-clear mono" id="libClearChoice">CLEAR</button>'
      + '</span>'
      + '</div>';
  }

  function skeletonsHtml(count) {
    return '<div class="lib-grid">' + Array.from({ length: count }, () =>
      '<div class="lib-skel-card">'
      + '<div class="lib-skel-art lib-skeleton"></div>'
      + '<div class="lib-skel-lines">'
      + '<span class="lib-skel-line lib-skeleton"></span>'
      + '<span class="lib-skel-line short lib-skeleton"></span>'
      + '</div></div>').join('') + '</div>';
  }

  /**
   * WHERE THE PICTURES GO -- said on the first screen, not discovered.
   *
   * Uploading happens inside a theme, which is right (a picture has to
   * belong to one) and was also invisible: this screen showed nine
   * cards and nothing that said a room could be added at all, so the
   * studio had no way of knowing the feature was one click away.
   *
   * It also answers the other question out loud. An account without
   * `reference_images:write` used to simply never see the button, which
   * is indistinguishable from the feature not existing.
   */
  function addHintHtml() {
    if (state.loading || !state.themes.length) return '';

    if (!state.canAdd) {
      return '<div class="lib-note">'
        + '<span class="lib-note-k mono">ADDING ROOMS</span>'
        + '<span>Every theme opens with two starter rooms that ship with De’vyora, and this '
        + 'account can browse and choose any of them. Adding the studio’s own needs the '
        + '<code>reference_images:write</code> permission, which the Owner and Admin roles '
        + 'carry and Staff does not — sign in with one of those to upload.</span>'
        + '</div>';
    }

    return '<div class="lib-note">'
      + '<span class="lib-note-k mono">ADDING ROOMS</span>'
      + '<span>Every theme opens with two starter rooms that ship with De’vyora — '
      + 'enough to choose one and generate from it today. To add the studio’s own, open a '
      + 'theme and the upload is at the top of it: pick fifty or a hundred pictures at once, '
      + 'and they go to the studio’s Google Drive under that theme.</span>'
      + '</div>';
  }

  /**
   * How much there is to choose from, said as a number.
   *
   * Nine themes and a room count is the whole shape of the page in two
   * figures, and it is the first thing that tells a studio the library
   * is not empty.
   */
  function totalsHtml() {
    if (state.loading || !state.themes.length) return '';
    const known = state.themes.filter((t) => typeof t.count === 'number');
    const rooms = known.reduce((n, t) => n + t.count, 0);
    return '<div class="lib-stat">'
      + '<span><span class="lib-stat-n serif">' + state.themes.length + '</span>'
      + '<span class="lib-stat-k mono">THEMES</span></span>'
      + (known.length
        ? '<span><span class="lib-stat-n serif">' + rooms + '</span>'
          + '<span class="lib-stat-k mono">' + (rooms === 1 ? 'ROOM' : 'ROOMS') + '</span></span>'
        : '')
      + '</div>';
  }

  /**
   * Why uploading will not work, said BEFORE any files are picked.
   *
   * The studio's own account of what just happened: four files chosen,
   * four failures, and the reason only readable afterwards. The server
   * knows this at page load, so the page says it at page load.
   */
  function uploadBlockedHtml() {
    if (!state.canAdd || !state.uploadError) return '';
    return '<div class="lib-note lib-note-bad">'
      + '<span class="lib-note-k mono">UPLOADING WILL NOT WORK YET</span>'
      + '<span>' + escapeHtml(state.uploadError)
      // WHERE IT IS FIXED, not only what is wrong. Connecting the
      // studio's own Google account is the owner's answer to every
      // one of these, and it is one page away.
      + ' <a href="drive-connect.html">Open the studio\u2019s Drive settings</a> to connect '
      + 'the Google account and test an upload.</span>'
      + '</div>';
  }

  /** The library's storage, when it is not answering. */
  function storageHtml() {
    if (!state.storageError) return '';
    return '<div class="lib-note lib-note-bad">'
      + '<span class="lib-note-k mono">THE LIBRARY’S STORAGE IS NOT READY</span>'
      + '<span>' + escapeHtml(state.storageError) + ' The starter rooms are files and work '
      + 'either way — choose one and generate from it today. Only the studio’s own '
      + 'uploaded rooms are unavailable until this is done.</span>'
      + '</div>';
  }

  function themesHtml() {
    if (state.loading) return skeletonsHtml(6);
    if (!state.themes.length) {
      return '<div class="lib-empty"><h3 class="serif">No themes to show</h3>'
        + '<p>' + (state.loadFailed
          ? 'The theme list could not be fetched from the server. Reload the page; if it keeps '
            + 'happening, the server is not answering.'
          : 'The server answered with no themes at all, which means the studio’s theme '
            + 'file could not be loaded by it.')
        + '</p></div>';
    }
    return '<div class="lib-theme-grid">' + state.themes.map((t) => {
      const n = t.count === null || t.count === undefined ? null : t.count;
      return '<button type="button" class="lib-theme-card" data-theme="' + escapeHtml(t.id) + '">'
        // A ROOM, not a swatch. The theme's first starter is what the
        // client is actually going to be choosing between, so it is
        // what the card shows -- the page used to lead with an abstract
        // pattern plate and looked like a palette chooser.
        //
        // The bathroom is that first starter, and the filename is
        // <theme>-<room>.png. It used to ask for <theme>-1.png, which
        // is what the starters were called before they were filed by
        // room: nine cards, nine 404s, nine empty frames.
        + '<span class="lib-theme-art">'
        + '<img src="' + escapeHtml(CasaApi.resolveBackendImageUrl(
          '/static/library-starters/' + t.slug + '-bathroom.png')) + '" alt="" loading="lazy" decoding="async">'
        // ...with the pattern plate kept as a small inset, because the
        // surface is still the thing being chosen.
        + '<span class="lib-theme-plate"><img src="img/themes/' + escapeHtml(t.slug)
        + '.svg" alt="" loading="lazy"></span>'
        + '<span class="lib-theme-over">'
        + '<span class="lib-theme-name serif">' + escapeHtml(t.label) + '</span>'
        + '<span class="lib-theme-pal">' + escapeHtml(t.palette) + '</span>'
        + '</span></span>'
        + '<span class="lib-theme-foot">'
        + '<span class="lib-theme-count mono">'
        + (n === null ? 'COUNT UNAVAILABLE' : n + (n === 1 ? ' PICTURE' : ' PICTURES'))
        + '</span>'
        // The five room types, with the ones that hold something lit.
        // It tells the studio at a glance where the gaps are, which is
        // the question a Theme -> Room library exists to answer.
        + '<span class="lib-theme-rooms mono">'
        + (t.rooms || []).map((r) =>
          '<span class="lib-room-dot' + (r.count ? ' has' : '') + '" title="'
          + escapeHtml(r.label + ' \u00b7 ' + r.count) + '">'
          + escapeHtml(r.label.slice(0, 1)) + '</span>').join('')
        + '</span>'
        + '</span></button>';
    }).join('') + '</div>';
  }

  /**
   * ONE THEME'S ROOMS -- the hierarchy's middle level.
   *
   * Every room is shown whether or not it holds anything. An empty
   * Kitchen is a real answer, and hiding it would leave the studio with
   * no way to see the room exists, let alone upload into it. The card
   * leads with that room's own starter picture, so the grid reads as
   * rooms rather than as a list of words.
   */
  function roomsHtml() {
    if (state.loading) return skeletonsHtml(5);
    const current = theme();
    const list = roomsOf();

    if (!list.length) {
      return '<div class="lib-empty"><h3 class="serif">No room types</h3>'
        + '<p>The studio\u2019s room list could not be read by the server.</p></div>';
    }

    return '<div class="lib-theme-grid">' + list.map((r) => {
      // The unsorted bucket has no starter picture of its own, so it
      // borrows the theme's bathroom rather than showing a blank tile.
      const art = r.id === 'unsorted'
        ? (current ? current.slug + '-bathroom' : '')
        : (current ? current.slug + '-' + r.slug : '');
      return '<button type="button" class="lib-theme-card" data-room="' + escapeHtml(r.id) + '">'
        + '<span class="lib-theme-art">'
        + (art
          ? '<img src="' + escapeHtml(CasaApi.resolveBackendImageUrl(
            '/static/library-starters/' + art + '.png')) + '" alt="" loading="lazy" decoding="async">'
          : '')
        + '<span class="lib-theme-over">'
        + '<span class="lib-theme-name serif">' + escapeHtml(r.label) + '</span>'
        + '<span class="lib-theme-pal">' + escapeHtml(r.blurb || '') + '</span>'
        + '</span></span>'
        + '<span class="lib-theme-foot">'
        + '<span class="lib-theme-count mono">'
        + (r.count ? r.count + (r.count === 1 ? ' PICTURE' : ' PICTURES') : 'NOTHING YET')
        + '</span>'
        + '<span class="lib-theme-go mono">OPEN \u2192</span>'
        + '</span></button>';
    }).join('') + '</div>';
  }

  /**
   * THE UPLOAD, WITH THE TWO THINGS A PICTURE HAS TO BE FILED UNDER.
   *
   * Theme and room are both dropdowns, both pre-set to wherever the
   * studio is standing. They are editable on purpose: having walked
   * into British > Kitchen to upload, the commonest next thing is a
   * batch for British > Bathroom, and making that a trip back up two
   * levels would be the kind of small rudeness that stops people using
   * a tool.
   *
   * Whatever the dropdowns say when the files are picked is what the
   * whole batch is filed under -- stated on the button, so it can never
   * be a surprise.
   */
  function uploadHtml(current) {
    if (!state.canAdd) {
      return '<div class="lib-note">'
        + '<span class="lib-note-k mono">ADDING PICTURES</span>'
        + '<span>This account can browse and choose, but not add \u2014 that needs the '
        + '<code>reference_images:write</code> permission, which Owner and Admin carry '
        + 'and Staff does not.</span>'
        + '</div>';
    }
    if (!current) return '';

    const chosenRoom = state.uploadRoomId || state.roomId;
    const chosenTheme = state.uploadThemeId || state.themeId;

    const themeOptions = state.themes.map((t) =>
      '<option value="' + escapeHtml(t.id) + '"' + (t.id === chosenTheme ? ' selected' : '') + '>'
      + escapeHtml(t.label) + '</option>').join('');

    // The studio's five room types -- never the unsorted bucket, which
    // is where older pictures sit, not somewhere anything is filed.
    const roomOptions = (state.roomTypes || []).map((r) =>
      '<option value="' + escapeHtml(r.id) + '"' + (r.id === chosenRoom ? ' selected' : '') + '>'
      + escapeHtml(r.label) + '</option>').join('');

    const into = (state.themes.find((t) => t.id === chosenTheme) || {}).label || '';
    const intoRoom = ((state.roomTypes || []).find((r) => r.id === chosenRoom) || {}).label || '';

    return '<div class="lib-upload">'
      + '<div class="lib-upload-fields">'
      + '<label class="lib-field"><span class="lib-field-k mono">THEME</span>'
      + '<select id="libTheme" class="lib-select">' + themeOptions + '</select></label>'
      + '<label class="lib-field"><span class="lib-field-k mono">ROOM TYPE</span>'
      + '<select id="libRoom" class="lib-select">' + roomOptions + '</select></label>'
      + '</div>'
      + '<label class="lib-add mono" for="libFiles">ADD IMAGES TO '
      + escapeHtml((into + ' \u203a ' + intoRoom).toUpperCase()) + '</label>'
      + '<input type="file" id="libFiles" accept="image/jpeg,image/png,image/webp" multiple hidden>'
      + '<span class="lib-hint">Pick fifty or a hundred \u2014 they go up a few at a time, '
      + 'into that theme and room on Google Drive.</span>'
      + '</div>';
  }

  function queueHtml() {
    if (!state.queue.length) return '';
    const done = state.queue.filter((f) => f.status === 'done').length;
    const failed = state.queue.filter((f) => f.status === 'failed').length;
    const total = state.queue.length;
    const share = total ? Math.round(((done + failed) / total) * 100) : 0;

    return '<div class="lib-queue" id="libQueue">'
      + '<div class="lib-queue-head">'
      + '<span class="mono">UPLOADING ' + (done + failed) + ' OF ' + total + '</span>'
      + (state.running
        ? '<button type="button" class="lib-cancel mono" id="libCancel">CANCEL</button>'
        : '<button type="button" class="lib-cancel mono" id="libClear">CLEAR</button>')
      + '</div>'
      + '<div class="lib-bar"><span style="width:' + share + '%"></span></div>'
      + (failed ? '<div class="lib-failed mono">' + failed + ' could not be uploaded</div>' : '')
      + '<div class="lib-files">' + state.queue.map((item) =>
        '<div class="lib-file lib-file-' + item.status + '">'
        + '<span class="lib-file-name">' + escapeHtml(item.file.name) + '</span>'
        + '<span class="lib-file-state mono">' + escapeHtml(
          item.status === 'waiting' ? 'WAITING'
            : item.status === 'uploading' ? Math.round(item.progress * 100) + '%'
              : item.status === 'done' ? 'DONE' : 'FAILED'
        ) + '</span>'
        + (item.error ? '<span class="lib-file-err">' + escapeHtml(item.error) + '</span>' : '')
        + '</div>').join('') + '</div></div>';
  }

  function referencesHtml() {
    if (state.loading) return skeletonsHtml(8);
    if (!state.references.length) {
      return '<div class="lib-empty"><h3 class="serif">Nothing in this theme yet</h3>'
        + '<p>' + (state.canAdd
          ? 'Use ADD IMAGES above to put the first rooms in. They are stored in the '
            + 'studio’s Google Drive, under this theme.'
          : 'Reference rooms appear here once the studio adds them. They are stored in the '
            + 'studio’s Google Drive.')
        + '</p></div>';
    }
    return '<div class="lib-grid">' + state.references.map((ref) => {
      const chosen = state.chosen && state.chosen.id === ref.id;
      return '<figure class="lib-card' + (chosen ? ' chosen' : '') + '" data-choose="'
        + escapeHtml(ref.id) + '" tabindex="0" role="button" aria-pressed="' + (chosen ? 'true' : 'false') + '">'
        + '<div class="lib-shot"><img src="' + escapeHtml(ref.imageUrl) + '" alt="'
        + escapeHtml(ref.title) + '" loading="lazy"></div>'
        + (chosen ? '<span class="lib-chosen-flag mono">SELECTED</span>' : '')
        // Said plainly, because it is a drawing and not a photograph of
        // a room this studio built.
        + (ref.isStarter ? '<span class="lib-starter-flag mono">STARTER</span>' : '')
        + '<figcaption class="lib-cap">'
        + '<span class="lib-title">' + escapeHtml(ref.title) + '</span>'
        + '<span class="lib-meta mono">' + escapeHtml(
          [ref.room, ref.uploadedBy && ref.uploadedBy.name].filter(Boolean).join(' · ')
        ) + '</span>'
        // A starter ships with the application, so there is nothing for
        // the studio to remove -- the server refuses it too.
        + (state.canAdd && !ref.isStarter
          ? '<button type="button" class="lib-del mono" data-delete="' + escapeHtml(ref.id) + '">REMOVE</button>'
          : '')
        + '</figcaption></figure>';
    }).join('') + '</div>';
  }

  function render() {
    const current = theme();
    const head = '<div class="mono" style="font-size:10px; letter-spacing:.18em; color:var(--muted)">REFERENCE ROOMS</div>';

    document.getElementById('mainContent').innerHTML =
      '<div class="stage">'
      + (state.view === 'themes'
        ? head
          + '<div class="lib-hero">'
          + '<div class="lib-hero-sub">'
          + '<h1 class="step-h1 serif" style="margin:0">De’vyora Library</h1>'
          + '<p class="step-sub" style="margin-top:9px">Rooms kept by theme. Pick one and it '
          + 'becomes the reference: the catalog is searched for the tiles that match it, and '
          + 'the scene is generated from that same picture.</p>'
          + '</div>'
          + totalsHtml()
          + '</div>'
          + activeHtml()
          + storageHtml()
          + uploadBlockedHtml()
          + addHintHtml()
          + themesHtml()
        : state.view === 'rooms'
        ? '<button type="button" class="lib-back mono" id="libBack">← ALL THEMES</button>'
          + '<div class="lib-head">'
          + '<h1 class="step-h1 serif" style="margin:0">' + escapeHtml(current ? current.label : '') + '</h1>'
          + '<span class="lib-meta mono">' + escapeHtml(current ? current.palette : '') + '</span>'
          + '</div>'
          + '<p class="step-sub">Choose the room you are designing.</p>'
          + activeHtml()
          + storageHtml()
          + roomsHtml()
        : '<button type="button" class="lib-back mono" id="libBack">← '
          + escapeHtml((current ? current.label : 'ALL THEMES').toUpperCase()) + '</button>'
          + '<div class="lib-head">'
          + '<h1 class="step-h1 serif" style="margin:0">'
          + escapeHtml(room() ? room().label : '') + '</h1>'
          + '<span class="lib-meta mono">'
          + escapeHtml([current ? current.label : '', current ? current.palette : '']
            .filter(Boolean).join(' · ')) + '</span>'
          + '</div>'
          + '<p class="step-sub">Tap a picture to make it the reference image.</p>'
          + activeHtml()
          + storageHtml()
          + uploadBlockedHtml()
          + uploadHtml(current)
          + '<div class="alert" id="libAlert" style="display:none"></div>'
          + queueHtml()
          + referencesHtml())
      + '</div>';
    wire();
  }

  function repaintQueue() {
    const host = document.getElementById('libQueue');
    if (!host) { render(); return; }
    host.outerHTML = queueHtml();
    wireQueue();
  }

  function showAlert(message) {
    const el = document.getElementById('libAlert');
    if (!el) return;
    el.textContent = message;
    el.style.display = message ? 'flex' : 'none';
  }

  // ── choosing ──────────────────────────────────────────────────────
  //
  // The whole point of the library. The choice is kept by the API
  // client, which is what the generation step will read -- see the note
  // beside LIBRARY_SELECTION_KEY there.

  function choose(id) {
    const ref = state.references.find((r) => r.id === id);
    if (!ref) return;
    // The theme's LABEL travels with the choice, not only its id. The
    // mood-board wizard pre-selects its theme from this, and it works
    // in labels -- see the note beside themeLabel in the API client.
    const where = theme(ref.themeId);
    const inRoom = (state.roomTypes || []).find((r) => r.id === ref.roomId);
    state.chosen = CasaApi.library.select({
      ...ref,
      themeLabel: where ? where.label : '',
      // The wizard's own name for the room travels too, so choosing a
      // Kitchen reference pre-selects Kitchen on the mood board -- the
      // same reason themeLabel does.
      roomWizard: inRoom ? inRoom.wizard : '',
    });
    render();
  }

  function clearChoice() {
    CasaApi.library.clearSelection();
    state.chosen = null;
    render();
  }

  // ── adding (staff) ────────────────────────────────────────────────

  async function runQueue() {
    if (state.running) return;
    state.running = true;
    state.aborter = new AbortController();
    repaintQueue();

    // Whatever the two dropdowns said when the files were picked. Read
    // ONCE, here, so a studio that changes a dropdown while ninety
    // pictures are going up does not split the batch between two rooms.
    const into = state.uploadThemeId || state.themeId;
    const intoRoom = state.uploadRoomId || state.roomId;
    let next = 0;

    const worker = async () => {
      for (let i = next++; i < state.queue.length; i = next++) {
        if (state.aborter.signal.aborted) return;
        const item = state.queue[i];
        item.status = 'uploading';
        item.progress = 0;
        repaintQueue();
        try {
          const saved = await CasaApi.library.upload(item.file, { themeId: into, roomId: intoRoom }, {
            signal: state.aborter.signal,
            onProgress: (share) => {
              item.progress = share;
              const cell = document.querySelectorAll('.lib-file')[i];
              const label = cell && cell.querySelector('.lib-file-state');
              if (label) label.textContent = Math.round(share * 100) + '%';
            },
          });
          item.status = 'done';
          if (saved && state.themeId === into) state.references.unshift(saved);
        } catch (err) {
          item.status = 'failed';
          item.error = (err && err.message) || 'Upload failed.';
        }
        repaintQueue();
      }
    };

    await Promise.all(Array.from({ length: Math.min(AT_ONCE, state.queue.length) }, worker));

    state.running = false;
    const failed = state.queue.filter((f) => f.status === 'failed').length;
    const done = state.queue.filter((f) => f.status === 'done').length;

    // THE COUNTS, RE-READ RATHER THAN GUESSED AT.
    //
    // Both levels of the hierarchy carry a number, and they came down
    // with the themes when the page loaded -- so after a batch they are
    // both stale, and going back showed "1 PICTURE" over a room holding
    // sixty-one. Adding `done` to a local total was how the old flat
    // page kept up; it cannot work here, because the batch may have
    // been filed into a theme and room the client is not standing in.
    //
    // Nine rows and their room breakdown is a cheap thing to ask for
    // once, at the end of an upload, and it is the only way the two
    // numbers are certainly right.
    if (done) {
      try {
        const fresh = await CasaApi.library.themes();
        state.themes = fresh.themes;
        state.storageError = fresh.storage.ok ? '' : fresh.storage.reason;
        state.uploadError = fresh.uploads.ok ? '' : fresh.uploads.reason;
      } catch (err) {
        // The pictures went up; only the counts are stale. Not worth
        // failing an upload over, and the next page load fixes it.
      }
    }

    render();
    if (failed) {
      showAlert(failed + ' of ' + state.queue.length + ' could not be uploaded. '
        + 'The rest are in the library.');
    }
  }

  function enqueue(files) {
    if (!state.themeId) return;
    state.queue = Array.from(files).map((file) => ({
      file, status: 'waiting', progress: 0, error: null,
    }));
    showAlert('');
    runQueue();
  }

  async function remove(id, btn) {
    const ref = state.references.find((r) => r.id === id);
    if (!window.confirm('Remove "' + ((ref && ref.title) || 'this reference') + '" from the '
      + 'library? It is deleted from Google Drive too.')) return;

    btn.disabled = true;
    btn.textContent = 'REMOVING…';
    try {
      const result = await CasaApi.library.remove(id);
      state.references = state.references.filter((r) => r.id !== id);
      // A reference that no longer exists must not stay selected.
      if (state.chosen && state.chosen.id === id) {
        CasaApi.library.clearSelection();
        state.chosen = null;
      }
      const current = theme();
      if (current && current.count > 0) current.count -= 1;
      render();
      if (result && result.driveDeleted === false) {
        showAlert('Removed from the library, but the file could not be deleted from Drive: '
          + (result.driveError || 'unknown error'));
      }
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'REMOVE';
      showAlert((err && err.message) || 'That could not be removed.');
    }
  }

  // ── wiring ────────────────────────────────────────────────────────

  function wireQueue() {
    const cancel = document.getElementById('libCancel');
    if (cancel) cancel.addEventListener('click', () => { if (state.aborter) state.aborter.abort(); });
    const clear = document.getElementById('libClear');
    if (clear) clear.addEventListener('click', () => { state.queue = []; render(); });
  }

  function wire() {
    document.querySelectorAll('[data-theme]').forEach((btn) => {
      btn.addEventListener('click', () => openTheme(btn.dataset.theme));
    });

    document.querySelectorAll('[data-room]').forEach((btn) => {
      btn.addEventListener('click', () => openRoom(btn.dataset.room));
    });

    // Back goes up ONE level, not all the way out: from a room to its
    // theme's rooms, and from there to the themes.
    const back = document.getElementById('libBack');
    if (back) {
      back.addEventListener('click', () => {
        if (state.view === 'room') { openTheme(state.themeId); return; }
        openThemes();
      });
    }

    // The two dropdowns decide where the NEXT batch goes. Held on the
    // state rather than read at submit time, so the button above the
    // file picker can say where they are about to land.
    const themePicker = document.getElementById('libTheme');
    if (themePicker) {
      themePicker.addEventListener('change', () => {
        state.uploadThemeId = themePicker.value;
        render();
      });
    }
    const roomPicker = document.getElementById('libRoom');
    if (roomPicker) {
      roomPicker.addEventListener('change', () => {
        state.uploadRoomId = roomPicker.value;
        render();
      });
    }

    const clear = document.getElementById('libClearChoice');
    if (clear) clear.addEventListener('click', clearChoice);

    document.querySelectorAll('[data-choose]').forEach((card) => {
      card.addEventListener('click', (event) => {
        // REMOVE sits inside the card; a click on it is not a choice.
        if (event.target.closest('[data-delete]')) return;
        choose(card.dataset.choose);
      });
      card.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          choose(card.dataset.choose);
        }
      });
    });

    document.querySelectorAll('[data-delete]').forEach((btn) => {
      btn.addEventListener('click', () => remove(btn.dataset.delete, btn));
    });

    const files = document.getElementById('libFiles');
    if (files) {
      files.addEventListener('change', () => {
        // A picture filed under no room would land in the unsorted
        // bucket, which is where OLD pictures live -- not somewhere new
        // ones should be put by accident.
        if (state.uploadError) {
          // Every file in this batch would fail the same way, for the
          // same reason, one after another. Saying so once, before any
          // of them go up, beats a hundred identical failures.
          files.value = '';
          // Not the reason again -- it is already on screen, in the
          // warning directly above this card, and printing the same
          // paragraph twice reads like a bug rather than an answer.
          showAlert('Nothing was uploaded: the library cannot write to Google Drive yet. '
            + 'The warning above this card says what is missing.');
          return;
        }
        if (!(state.uploadRoomId || state.roomId)) {
          files.value = '';
          showAlert('Choose a room type first \u2014 every picture is filed under a theme '
            + 'and a room.');
          return;
        }
        if (files.files && files.files.length) enqueue(files.files);
        files.value = '';
      });
    }

    wireQueue();
  }

  // ── navigation ────────────────────────────────────────────────────

  function openThemes() {
    if (state.running) return;
    state.view = 'themes';
    state.themeId = null;
    state.roomId = null;
    state.references = [];
    state.queue = [];
    state.loading = false;
    render();
  }

  /** A theme opens its ROOMS now, which need no request: the counts
   *  came down with the themes. */
  function openTheme(themeId) {
    state.view = 'rooms';
    state.themeId = themeId;
    state.roomId = null;
    state.references = [];
    state.queue = [];
    state.loading = false;
    render();
  }

  async function openRoom(roomId) {
    state.view = 'room';
    state.roomId = roomId;
    // The upload form follows the studio into the room it just opened,
    // which is nearly always the one they want to file into.
    state.uploadThemeId = state.themeId;
    state.uploadRoomId = roomId === 'unsorted' ? (state.uploadRoomId || '') : roomId;
    state.references = [];
    state.queue = [];
    state.loading = true;
    render();
    try {
      const answer = await CasaApi.library.references(state.themeId, roomId);
      state.references = answer.references;
      // The starters are files and always arrive; only the studio's own
      // uploads need the database, so this now costs those alone rather
      // than emptying the theme.
      state.storageError = answer.storage.ok ? '' : answer.storage.reason;
    } catch (err) {
      state.references = [];
      state.storageError = (err && err.message) || '';
      state.loading = false;
      render();
      showAlert((err && err.message) || 'The library could not be read.');
      return;
    }
    state.loading = false;
    render();
  }

  async function init() {
    const user = await CasaApi.requireAuth();

    document.getElementById('profileInitials').textContent = CasaApi.initials(user.name);
    document.getElementById('profileName').textContent = user.name || user.email;
    document.getElementById('profileRole').textContent = (user.role || '').toUpperCase();

    renderNav();
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await CasaApi.auth.logout();
      location.href = 'login.html';
    });

    // Adding pictures is the studio's job, not the client's. The button
    // is shown to whoever may actually use it; the server refuses the
    // rest either way, so this only decides what is worth showing.
    //
    // '*' COUNTS, AND LEAVING IT OUT HID THE BUTTON FROM THE OWNER.
    //
    // The Owner role's permission list is exactly ["*"] (prisma/seed.ts),
    // and the server has always read it that way -- requirePermission is
    // `includes('*') || includes(permission)`. This line checked only for
    // the named permission, so the two asked the same question and gave
    // different answers: the Owner's upload would have been accepted, and
    // they were never shown the control to make one.
    state.canAdd = Array.isArray(user.permissions)
      && (user.permissions.indexOf('*') !== -1
        || user.permissions.indexOf('reference_images:write') !== -1);

    state.chosen = CasaApi.library.selection();

    render();
    try {
      const [answer, roomTypes] = await Promise.all([
        CasaApi.library.themes(),
        // The studio's five room types, for the upload dropdown. Asked
        // of the server rather than written into this page, so the two
        // cannot disagree about what a room is.
        CasaApi.library.rooms().catch(() => []),
      ]);
      state.themes = answer.themes;
      state.roomTypes = roomTypes;
      state.storageError = answer.storage.ok ? '' : answer.storage.reason;
      state.uploadError = answer.uploads.ok ? '' : answer.uploads.reason;
    } catch (err) {
      // The request itself failed -- not the same thing as the server
      // answering with no themes, and the page says so rather than
      // blaming the theme file for a network error.
      state.themes = [];
      state.loadFailed = true;
      state.storageError = (err && err.message) || '';
    }
    state.loading = false;
    render();
  }

  init();
})();
</script>
<script src="assets/sidebar.js" defer></script>
</body>
</html>
