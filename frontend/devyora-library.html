<script src="assets/api-client.js"></script>
<script>
(function () {
  'use strict';

  const NAV_ITEMS = [
    { id: 'moodboard', label: 'Mood Board', href: 'mood-board.html' },
    { id: 'generations', label: 'Recent Generations', href: 'recent-generations.html' },
    { id: 'projects', label: 'Projects', href: 'projects.html' },
    { id: 'catalog', label: 'Catalog', href: 'catalog.html' },
    { id: 'library', label: 'De’vyora Library', href: 'devyora-library.html' },
    { id: 'samples', label: 'Sample Placement', href: 'sample-placement.html' },
    { id: 'clients', label: 'Client Wishlists', href: 'client-wishlists.html', owner: true },
  ];


  /* THE CLIENT REGISTER IS THE STUDIO'S OWN BOOK -- owner and admin
     only, the same gate the server puts on it. Hidden from everyone
     else rather than shown and then refused. */
  function navItemAllowed(item) {
    if (!item.owner) return true;
    const user = (window.CasaApi && CasaApi.getCachedUser) ? CasaApi.getCachedUser() : null;
    const role = String((user && user.role) || '').toUpperCase();
    return role === 'OWNER' || role === 'ADMIN';
  }

  function renderNav() {
    const nav = document.getElementById('navItems');
    nav.innerHTML = '';
    NAV_ITEMS.filter(navItemAllowed).forEach((item) => {
      const btn = document.createElement('button');
      btn.className = 'nav-item' + (item.id === 'library' ? ' active' : '');
      btn.innerHTML = '<span class="lbl">' + item.label + '</span>';
      btn.addEventListener('click', () => { location.href = item.href; });
      nav.appendChild(btn);
    });
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
  }

  // TWO VIEWS, ONE PAGE.
  //
  //   themes  every theme, as a card with its own preview art
  //   theme   one theme's reference rooms, to look at and to choose from
  //
  // `view` is the whole of the navigation. There is no router here and
  // no second page: the client goes in and comes back out, and the
  // chosen reference is stated at the top of both views so it is never
  // a question what is currently selected.
  const state = {
    // themes -> rooms -> pictures. Three levels, because the library
    // is a Theme -> Room hierarchy: a theme card opens that theme's
    // rooms, and a room card opens its pictures.
    view: 'themes',
    themes: [],
    themeId: null,
    /**
     * THE WORKING SET -- the themes the studio is looking across.
     *
     * Browsing moves between these; it never narrows them. themeId is
     * which ONE of them the gallery below is currently showing, so
     * switching changes themeId and nothing else.
     *
     * Held as a bag of ids. Everywhere it is SHOWN -- the bar, the
     * switcher -- it is read back in the theme grid's own order, so the
     * switcher lists them the way the studio just saw them. Order of
     * ticking would mean un-ticking Floral and ticking it again moved
     * it to the end of the list, which is a surprise and no use to
     * anybody.
     */
    picked: [],
    /**
     * "themeId|roomId" -> { references, start, visible, storageError,
     * loaded }.
     *
     * One entry per gallery actually opened. Coming back to a theme
     * restores where it was left instead of asking the server for a
     * list it already has.
     */
    galleries: {},
    /** Is the switcher's menu open. */
    switchOpen: false,
    rooms: [],
    roomId: null,
    references: [],
    loading: true,
    chosen: null,
    canAdd: false,
    /** Whoever is signed in, so a client is never read across a sign-out. */
    userId: '',
    /**
     * The client this sitting is for -- { name, phone, userId, atISO }.
     *
     * Asked for once, before the library opens, and then left alone.
     * Nothing downstream reads it yet: it is held for the Clients &
     * Detailings module to pick up when that exists.
     */
    client: null,
    /**
     * Why the library's own storage is not answering, when it is not.
     *
     * Empty is the normal case. Non-empty means the themes are listed
     * (they come from the studio's theme file) but their counts, their
     * rooms and any upload cannot work until it is fixed -- and it
     * says, in the words the server used, exactly what to do.
     */
    storageError: '',
    /**
     * Why this deployment cannot upload, when it cannot.
     *
     * Known at page load, so the studio is warned before picking
     * files rather than after watching a hundred of them fail.
     */
    uploadError: '',
    /** True once the theme request has actually come back. */
    loadFailed: false,
    queue: [],
    running: false,
    aborter: null,
  };

  const AT_ONCE = 4;
  const theme = (id) => state.themes.find((t) => t.id === (id || state.themeId)) || null;
  const roomsOf = (id) => (theme(id) || {}).rooms || [];
  const room = (id) => roomsOf().find((r) => r.id === (id || state.roomId)) || null;

  /* HOW A GALLERY IS PAGED.
     Ten to begin with, ten more on request, and never more than twenty
     on screen at once -- then on to the next set. A theme and room can
     hold a hundred pictures, and a hundred <img> elements is a hundred
     downloads the moment the room opens. */
  const PAGE = 10;
  const SET = 20;

  /**
   * DE'VYORA MIX -- every theme at once.
   *
   * NOT a tenth theme. Nothing is filed under it, it has no Drive
   * folder and no palette of its own: it is a card that opens the
   * whole library in one place, so the studio can look across
   * everything without choosing a theme first.
   *
   * A picture chosen from it keeps the theme it actually belongs to.
   * That matters: the mood board ranks the catalogue against the
   * chosen picture's own theme and colour, so a British bathroom
   * picked out of the Mix is still matched as a British bathroom.
   */
  const MIX_ID = '__mix__';
  const isMix = (id) => (id === undefined ? state.themeId : id) === MIX_ID;
  const realThemes = () => state.themes.filter((t) => t.id !== MIX_ID);

  function mixEntry(real) {
    if (!real.length) return null;

    // Its rooms are every theme's rooms, added up -- the same shape a
    // theme's own room list has, so everything downstream (the room
    // chooser, the chips, the counts) works on it unchanged.
    const order = [];
    const byId = {};
    real.forEach((t) => (t.rooms || []).forEach((r) => {
      if (!byId[r.id]) {
        byId[r.id] = {
          id: r.id, label: r.label, slug: r.slug, blurb: r.blurb,
          count: 0, starterCount: 0,
        };
        order.push(r.id);
      }
      byId[r.id].count += r.count || 0;
      byId[r.id].starterCount += r.starterCount || 0;
    }));

    return {
      id: MIX_ID,
      label: 'De\u2019vyora Mix',
      slug: real[0].slug,
      palette: 'Every theme at once \u2014 the whole library in one place',
      count: real.reduce((n, t) => n + (t.count || 0), 0),
      starterCount: real.reduce((n, t) => n + (t.starterCount || 0), 0),
      rooms: order.map((id) => byId[id]),
      isMix: true,
    };
  }

  /**
   * The themes the server sent, led by the Mix that spans them.
   *
   * THE MIX GOES FIRST. It is the widest thing on the page -- every
   * theme's pictures in one grid -- so it is where a client with
   * nothing particular in mind should start, not something they reach
   * after scrolling past all nine. The real themes keep the order the
   * server sent them in, which is the studio's own: British, then the
   * rest.
   *
   * It carries no tick, so it never joins the working set and this
   * order never reaches pickedThemes().
   */
  function setThemes(list) {
    const real = (list || []).filter((t) => t.id !== MIX_ID);
    const mix = mixEntry(real);
    state.themes = mix ? [mix].concat(real) : real;
  }

  /*
   * WHOSE ROOM THIS IS.
   *
   * The library is browsed WITH a client sitting there, and every
   * picture chosen from it becomes the reference a board is built on.
   * Who that was is worth knowing, so the page asks once -- a name and
   * a number -- before it opens, and not again for the rest of the
   * sitting.
   *
   * KEPT ON THIS TAB ONLY. sessionStorage, not localStorage: a
   * showroom tablet closing its tab should not open tomorrow still
   * holding yesterday's client. Nothing is sent anywhere, no row is
   * written, and no API is called -- the details sit here until the
   * Clients & Detailings module exists to take them.
   */
  const CLIENT_KEY = 'casa_library_client';

  /**
   * The client on record for this sitting, or null.
   *
   * STAMPED WITH WHO WAS SIGNED IN. The tab outlives a sign-out, so
   * without this the next staff member to sign in on the same tablet
   * would inherit the last one's client and never be asked.
   */
  function clientOnRecord(userId) {
    try {
      const raw = sessionStorage.getItem(CLIENT_KEY);
      if (!raw) return null;
      const saved = JSON.parse(raw);
      if (!saved || !saved.name || !saved.phone) return null;
      if (userId && saved.userId && saved.userId !== userId) return null;
      return saved;
    } catch (err) {
      // A tablet with storage switched off asks every time, which is
      // the safe way round: it never silently skips the question.
      return null;
    }
  }

  /**
   * An Indian mobile number, or ''.
   *
   * Typed numbers carry spaces, hyphens, +91 and a leading 0, and all
   * of those mean the same ten digits. They are taken off, and what is
   * left has to be a real mobile series -- 6, 7, 8 or 9 and nine more.
   * A landline, a short number or eleven digits is not accepted.
   */
  function normalisePhone(value) {
    let digits = String(value || '').replace(/\D+/g, '');
    if (digits.length === 12 && digits.slice(0, 2) === '91') digits = digits.slice(2);
    if (digits.length === 11 && digits.charAt(0) === '0') digits = digits.slice(1);
    return /^[6-9][0-9]{9}$/.test(digits) ? digits : '';
  }

  const galKey = (t, r) => String(t == null ? state.themeId : t)
    + '|' + String(r == null ? state.roomId : r);
  const gallery = () => state.galleries[galKey()] || null;
  const isPicked = (id) => state.picked.indexOf(id) !== -1;
  const pickedThemes = () => state.themes.filter((t) => isPicked(t.id));
  /** The first of the chosen themes, in the order they are shown. */
  const firstPicked = () => (pickedThemes()[0] || {}).id || null;

  /** A tick, for the control that puts a theme in the working set. */
  const TICK = '<svg viewBox="0 0 14 14" fill="none" aria-hidden="true">'
    + '<path d="M2.5 7.3 5.6 10.4 11.5 4.2" stroke="currentColor" stroke-width="2" '
    + 'stroke-linecap="round" stroke-linejoin="round"/></svg>';

  /**
   * The active gallery's pictures, under the name the rest of this page
   * already uses -- and pointing at the SAME array the cache holds, so
   * choosing, removing and uploading go on working exactly as they did.
   */
  function setReferences(list) {
    state.references = list;
    const g = gallery();
    if (g) g.references = list;
  }

  /** What is actually drawn: one set's worth, at most. */
  function visibleRefs() {
    const g = gallery();
    if (!g) return state.references;
    return g.references.slice(g.start, g.start + g.visible);
  }

  /**
   * Every room in the working set, counted across ALL of its themes.
   *
   * One room chooser, not one per theme: the studio picks Bathroom
   * once and it means Bathroom in every theme they chose.
   */
  function mergedRooms() {
    // Inside the Mix the rooms are the Mix's own. It is already every
    // theme, so a working set has nothing to add to it -- and adding
    // it would count every room twice.
    const ids = isMix()
      ? [MIX_ID]
      : (state.picked.length ? state.picked : (state.themeId ? [state.themeId] : []));
    const order = [];
    const byId = {};
    ids.forEach((id) => roomsOf(id).forEach((r) => {
      if (!byId[r.id]) {
        byId[r.id] = { id: r.id, label: r.label, slug: r.slug, blurb: r.blurb, count: 0 };
        order.push(r.id);
      }
      byId[r.id].count += r.count || 0;
    }));
    return order.map((id) => byId[id]);
  }

  // ── pieces ────────────────────────────────────────────────────────

  function activeHtml() {
    if (!state.chosen) return '';
    const where = theme(state.chosen.themeId);
    return '<div class="lib-active" id="libActive">'
      + '<span class="lib-active-shot"><img src="' + escapeHtml(state.chosen.imageUrl)
      + '" alt="" loading="lazy"></span>'
      + '<span class="lib-active-text">'
      + '<span class="lib-active-lbl mono">ACTIVE REFERENCE IMAGE</span>'
      + '<span class="lib-active-name">' + escapeHtml(state.chosen.title || 'Untitled') + '</span>'
      + '<span class="lib-active-meta mono">' + escapeHtml(
        [where ? where.label : state.chosen.themeId, state.chosen.room].filter(Boolean).join(' · ')
      ) + '</span></span>'
      // THERE IS NO "USE IN A MOOD BOARD" BUTTON ANY MORE.
      //
      // Choosing a picture IS using it: tapping one now selects it and
      // opens the mood board in the same movement, so the step the
      // studio used to have to find for themselves no longer exists.
      // This banner is what they see on the way BACK -- which picture
      // is currently the reference, and the way to drop it.
      + '<span class="lib-active-acts">'
      + '<button type="button" class="lib-active-clear mono" id="libClearChoice">CLEAR</button>'
      + '</span>'
      + '</div>';
  }

  function skeletonsHtml(count) {
    return '<div class="lib-grid">' + Array.from({ length: count }, () =>
      '<div class="lib-skel-card">'
      + '<div class="lib-skel-art lib-skeleton"></div>'
      + '<div class="lib-skel-lines">'
      + '<span class="lib-skel-line lib-skeleton"></span>'
      + '<span class="lib-skel-line short lib-skeleton"></span>'
      + '</div></div>').join('') + '</div>';
  }

  /**
   * WHERE THE PICTURES GO -- said on the first screen, not discovered.
   *
   * Uploading happens inside a theme, which is right (a picture has to
   * belong to one) and was also invisible: this screen showed nine
   * cards and nothing that said a room could be added at all, so the
   * studio had no way of knowing the feature was one click away.
   *
   * It also answers the other question out loud. An account without
   * `reference_images:write` used to simply never see the button, which
   * is indistinguishable from the feature not existing.
   */
  function addHintHtml() {
    if (state.loading || !state.themes.length) return '';

    if (!state.canAdd) {
      return '<div class="lib-note">'
        + '<span class="lib-note-k mono">ADDING ROOMS</span>'
        + '<span>Every theme opens with two starter rooms that ship with De’vyora, and this '
        + 'account can browse and choose any of them. Adding the studio’s own needs the '
        + '<code>reference_images:write</code> permission, which the Owner and Admin roles '
        + 'carry and Staff does not — sign in with one of those to upload.</span>'
        + '</div>';
    }

    return '<div class="lib-note">'
      + '<span class="lib-note-k mono">ADDING ROOMS</span>'
      + '<span>Every theme opens with two starter rooms that ship with De’vyora — '
      + 'enough to choose one and generate from it today. To add the studio’s own, open a '
      + 'theme and the upload is at the top of it: pick fifty or a hundred pictures at once, '
      + 'and they go to the studio’s Google Drive under that theme.</span>'
      + '</div>';
  }

  /**
   * How much there is to choose from, said as a number.
   *
   * Nine themes and a room count is the whole shape of the page in two
   * figures, and it is the first thing that tells a studio the library
   * is not empty.
   */
  function totalsHtml() {
    if (state.loading || !state.themes.length) return '';
    // The Mix is every theme added up, so counting it as a theme would
    // say ten, and counting its rooms would count them all twice.
    const real = realThemes();
    const known = real.filter((t) => typeof t.count === 'number');
    const rooms = known.reduce((n, t) => n + t.count, 0);
    return '<div class="lib-stat">'
      + '<span><span class="lib-stat-n serif">' + real.length + '</span>'
      + '<span class="lib-stat-k mono">THEMES</span></span>'
      + (known.length
        ? '<span><span class="lib-stat-n serif">' + rooms + '</span>'
          + '<span class="lib-stat-k mono">' + (rooms === 1 ? 'ROOM' : 'ROOMS') + '</span></span>'
        : '')
      + '</div>';
  }

  /**
   * Why uploading will not work, said BEFORE any files are picked.
   *
   * The studio's own account of what just happened: four files chosen,
   * four failures, and the reason only readable afterwards. The server
   * knows this at page load, so the page says it at page load.
   */
  function uploadBlockedHtml() {
    if (!state.canAdd || !state.uploadError) return '';
    return '<div class="lib-note lib-note-bad">'
      + '<span class="lib-note-k mono">UPLOADING WILL NOT WORK YET</span>'
      + '<span>' + escapeHtml(state.uploadError)
      // WHERE IT IS FIXED, not only what is wrong. Connecting the
      // studio's own Google account is the owner's answer to every
      // one of these, and it is one page away.
      + ' <a href="drive-connect.html">Open the studio\u2019s Drive settings</a> to connect '
      + 'the Google account and test an upload.</span>'
      + '</div>';
  }

  /** The library's storage, when it is not answering. */
  function storageHtml() {
    if (!state.storageError) return '';
    return '<div class="lib-note lib-note-bad">'
      + '<span class="lib-note-k mono">THE LIBRARY’S STORAGE IS NOT READY</span>'
      + '<span>' + escapeHtml(state.storageError) + ' The starter rooms are files and work '
      + 'either way — choose one and generate from it today. Only the studio’s own '
      + 'uploaded rooms are unavailable until this is done.</span>'
      + '</div>';
  }

  /**
   * THE WORKING SET, NAMED AND COUNTED.
   *
   * Shown empty too, because "no themes selected" is the state the tick
   * is there to change, and a studio that has never seen the control
   * has no way to learn it exists.
   */
  function pickedHtml() {
    if (state.loading || !state.themes.length) return '';
    const chosen = pickedThemes();

    if (!chosen.length) {
      return '<div class="lib-picked empty">'
        + '<span class="lib-picked-k mono">NO THEMES SELECTED</span>'
        + '<span class="lib-picked-names">Tick one or more themes to work across them at '
        + 'once \u2014 you can switch between them while browsing without losing the '
        + 'others. Opening a theme selects it too.</span>'
        + '</div>';
    }

    return '<div class="lib-picked has">'
      + '<span class="lib-picked-k mono">' + chosen.length
      + (chosen.length === 1 ? ' THEME SELECTED' : ' THEMES SELECTED') + '</span>'
      + '<span class="lib-picked-names">'
      + chosen.map((t) => escapeHtml(t.label)).join(' \u00b7 ') + '</span>'
      + '<span class="lib-picked-acts">'
      + '<button type="button" class="lib-quiet mono" id="libPickNone">CLEAR</button>'
      + '<button type="button" class="lib-go mono" id="libPickGo">CHOOSE A ROOM \u2192</button>'
      + '</span></div>';
  }

  function themesHtml() {
    if (state.loading) return skeletonsHtml(6);
    if (!state.themes.length) {
      return '<div class="lib-empty"><h3 class="serif">No themes to show</h3>'
        + '<p>' + (state.loadFailed
          ? 'The theme list could not be fetched from the server. Reload the page; if it keeps '
            + 'happening, the server is not answering.'
          : 'The server answered with no themes at all, which means the studio’s theme '
            + 'file could not be loaded by it.')
        + '</p></div>';
    }
    return '<div class="lib-theme-grid">' + state.themes.map((t) => {
      const n = t.count === null || t.count === undefined ? null : t.count;
      const picked = isPicked(t.id);
      return '<div class="lib-theme-cell' + (picked ? ' is-picked' : '')
        + (t.isMix ? ' is-mix' : '') + '">'
        // The card is a <button>, and a button cannot hold another one,
        // so the tick is its sibling rather than its child.
        //
        // The Mix carries no tick: it is already every theme, and
        // ticking it alongside British would be asking for everything
        // and for one of them at the same time.
        + (t.isMix ? ''
          : '<button type="button" class="lib-pick" data-pick="' + escapeHtml(t.id) + '"'
            + ' aria-pressed="' + (picked ? 'true' : 'false') + '"'
            + ' aria-label="' + escapeHtml((picked ? 'Remove ' : 'Add ') + t.label
              + (picked ? ' from the selection' : ' to the selection')) + '">' + TICK + '</button>')
        + '<button type="button" class="lib-theme-card" data-theme="' + escapeHtml(t.id) + '">'
        // A ROOM, not a swatch. The theme's first starter is what the
        // client is actually going to be choosing between, so it is
        // what the card shows -- the page used to lead with an abstract
        // pattern plate and looked like a palette chooser.
        //
        // The bathroom is that first starter, and the filename is
        // <theme>-<room>.png. It used to ask for <theme>-1.png, which
        // is what the starters were called before they were filed by
        // room: nine cards, nine 404s, nine empty frames.
        + '<span class="lib-theme-art' + (t.isMix ? ' mix' : '') + '">'
        // The Mix shows three themes side by side rather than one
        // theme's room, because showing one of them would be a claim
        // about which theme it is.
        + (t.isMix
          ? realThemes().slice(0, 3).map((o) =>
            '<img src="' + escapeHtml(CasaApi.resolveBackendImageUrl(
              '/static/library-starters/' + o.slug + '-bathroom.png'))
            + '" alt="" loading="lazy" decoding="async">').join('')
          : '<img src="' + escapeHtml(CasaApi.resolveBackendImageUrl(
            '/static/library-starters/' + t.slug + '-bathroom.png'))
            + '" alt="" loading="lazy" decoding="async">'
            // ...with the pattern plate kept as a small inset, because
            // the surface is still the thing being chosen.
            + '<span class="lib-theme-plate"><img src="img/themes/' + escapeHtml(t.slug)
            + '.svg" alt="" loading="lazy"></span>')
        + '<span class="lib-theme-over">'
        + '<span class="lib-theme-name serif">' + escapeHtml(t.label) + '</span>'
        + '<span class="lib-theme-pal">' + escapeHtml(t.palette) + '</span>'
        + '</span></span>'
        + '<span class="lib-theme-foot">'
        + '<span class="lib-theme-count mono">'
        + (n === null ? 'COUNT UNAVAILABLE' : n + (n === 1 ? ' PICTURE' : ' PICTURES'))
        + '</span>'
        + '<span class="lib-theme-go mono">OPEN \u2192</span>'
        + '</span></button>'
        // Every room this theme has, named in full and counted, each
        // one a way straight into it. Empty rooms are listed too -- an
        // empty Kitchen is a real answer, and it is also where the
        // studio would upload the first one.
        + '<span class="lib-theme-rooms">'
        + (t.rooms || []).map((r) =>
          '<button type="button" class="lib-room-chip' + (r.count ? ' has' : '')
          + '" data-open="' + escapeHtml(t.id + '|' + r.id) + '">'
          + '<span class="lbl">' + escapeHtml(r.label) + '</span>'
          + '<span class="n mono">' + (r.count || 0) + '</span>'
          + '</button>').join('')
        + '</span></div>';
    }).join('') + '</div>';
  }

  /**
   * ONE THEME'S ROOMS -- the hierarchy's middle level.
   *
   * Every room is shown whether or not it holds anything. An empty
   * Kitchen is a real answer, and hiding it would leave the studio with
   * no way to see the room exists, let alone upload into it. The card
   * leads with that room's own starter picture, so the grid reads as
   * rooms rather than as a list of words.
   */
  function roomsHtml() {
    if (state.loading) return skeletonsHtml(5);
    const current = theme();
    // Counted across every theme in the working set, so the number
    // beside Bathroom is how many bathrooms the studio is choosing
    // between -- not how many one of the themes happens to hold.
    const list = mergedRooms();

    if (!list.length) {
      return '<div class="lib-empty"><h3 class="serif">No room types</h3>'
        + '<p>The studio\u2019s room list could not be read by the server.</p></div>';
    }

    return '<div class="lib-theme-grid">' + list.map((r) => {
      // The unsorted bucket has no starter picture of its own, so it
      // borrows the theme's bathroom rather than showing a blank tile.
      const art = r.id === 'unsorted'
        ? (current ? current.slug + '-bathroom' : '')
        : (current ? current.slug + '-' + r.slug : '');
      return '<button type="button" class="lib-theme-card" data-room="' + escapeHtml(r.id) + '">'
        + '<span class="lib-theme-art">'
        + (art
          ? '<img src="' + escapeHtml(CasaApi.resolveBackendImageUrl(
            '/static/library-starters/' + art + '.png')) + '" alt="" loading="lazy" decoding="async">'
          : '')
        + '<span class="lib-theme-over">'
        + '<span class="lib-theme-name serif">' + escapeHtml(r.label) + '</span>'
        + '<span class="lib-theme-pal">' + escapeHtml(r.blurb || '') + '</span>'
        + '</span></span>'
        + '<span class="lib-theme-foot">'
        + '<span class="lib-theme-count mono">'
        + (r.count ? r.count + (r.count === 1 ? ' PICTURE' : ' PICTURES') : 'NOTHING YET')
        + '</span>'
        + '<span class="lib-theme-go mono">OPEN \u2192</span>'
        + '</span></button>';
    }).join('') + '</div>';
  }

  /**
   * THE UPLOAD, WITH THE TWO THINGS A PICTURE HAS TO BE FILED UNDER.
   *
   * Theme and room are both dropdowns, both pre-set to wherever the
   * studio is standing. They are editable on purpose: having walked
   * into British > Kitchen to upload, the commonest next thing is a
   * batch for British > Bathroom, and making that a trip back up two
   * levels would be the kind of small rudeness that stops people using
   * a tool.
   *
   * Whatever the dropdowns say when the files are picked is what the
   * whole batch is filed under -- stated on the button, so it can never
   * be a surprise.
   */
  function uploadHtml(current) {
    if (!state.canAdd) {
      return '<div class="lib-note">'
        + '<span class="lib-note-k mono">ADDING PICTURES</span>'
        + '<span>This account can browse and choose, but not add \u2014 that needs the '
        + '<code>reference_images:write</code> permission, which Owner and Admin carry '
        + 'and Staff does not.</span>'
        + '</div>';
    }
    if (!current) return '';

    // NOTHING IS FILED UNDER THE MIX. It has no Drive folder, so an
    // upload form here would have nowhere to put the pictures. Said,
    // rather than silently leaving a gap where the card usually is.
    if (isMix()) {
      return '<div class="lib-note">'
        + '<span class="lib-note-k mono">ADDING PICTURES</span>'
        + '<span>De\u2019vyora Mix is every theme at once, not a theme of its own \u2014 '
        + 'there is nowhere under it to file a picture. Open the theme the picture belongs '
        + 'to and the upload is at the top of its room.</span>'
        + '</div>';
    }

    const chosenRoom = state.uploadRoomId || state.roomId;
    const chosenTheme = state.uploadThemeId || state.themeId;

    const themeOptions = realThemes().map((t) =>
      '<option value="' + escapeHtml(t.id) + '"' + (t.id === chosenTheme ? ' selected' : '') + '>'
      + escapeHtml(t.label) + '</option>').join('');

    // The studio's five room types -- never the unsorted bucket, which
    // is where older pictures sit, not somewhere anything is filed.
    const roomOptions = (state.roomTypes || []).map((r) =>
      '<option value="' + escapeHtml(r.id) + '"' + (r.id === chosenRoom ? ' selected' : '') + '>'
      + escapeHtml(r.label) + '</option>').join('');

    const into = (state.themes.find((t) => t.id === chosenTheme) || {}).label || '';
    const intoRoom = ((state.roomTypes || []).find((r) => r.id === chosenRoom) || {}).label || '';

    return '<div class="lib-upload">'
      + '<div class="lib-upload-fields">'
      + '<label class="lib-field"><span class="lib-field-k mono">THEME</span>'
      + '<select id="libTheme" class="lib-select">' + themeOptions + '</select></label>'
      + '<label class="lib-field"><span class="lib-field-k mono">ROOM TYPE</span>'
      + '<select id="libRoom" class="lib-select">' + roomOptions + '</select></label>'
      + '</div>'
      + '<label class="lib-add mono" for="libFiles">ADD IMAGES TO '
      + escapeHtml((into + ' \u203a ' + intoRoom).toUpperCase()) + '</label>'
      + '<input type="file" id="libFiles" accept="image/jpeg,image/png,image/webp" multiple hidden>'
      + '<span class="lib-hint">Pick fifty or a hundred \u2014 they go up a few at a time, '
      + 'into that theme and room on Google Drive.</span>'
      + '</div>';
  }

  function queueHtml() {
    if (!state.queue.length) return '';
    const done = state.queue.filter((f) => f.status === 'done').length;
    const failed = state.queue.filter((f) => f.status === 'failed').length;
    const total = state.queue.length;
    const share = total ? Math.round(((done + failed) / total) * 100) : 0;

    return '<div class="lib-queue" id="libQueue">'
      + '<div class="lib-queue-head">'
      + '<span class="mono">UPLOADING ' + (done + failed) + ' OF ' + total + '</span>'
      + (state.running
        ? '<button type="button" class="lib-cancel mono" id="libCancel">CANCEL</button>'
        : '<button type="button" class="lib-cancel mono" id="libClear">CLEAR</button>')
      + '</div>'
      + '<div class="lib-bar"><span style="width:' + share + '%"></span></div>'
      + (failed ? '<div class="lib-failed mono">' + failed + ' could not be uploaded</div>' : '')
      + '<div class="lib-files">' + state.queue.map((item) =>
        '<div class="lib-file lib-file-' + item.status + '">'
        + '<span class="lib-file-name">' + escapeHtml(item.file.name) + '</span>'
        + '<span class="lib-file-state mono">' + escapeHtml(
          item.status === 'waiting' ? 'WAITING'
            : item.status === 'uploading' ? Math.round(item.progress * 100) + '%'
              : item.status === 'done' ? 'DONE' : 'FAILED'
        ) + '</span>'
        + (item.error ? '<span class="lib-file-err">' + escapeHtml(item.error) + '</span>' : '')
        + '</div>').join('') + '</div></div>';
  }

  /**
   * WHICH OF THE CHOSEN THEMES THE GALLERY BELOW IS SHOWING.
   *
   * Not the upload card's THEME dropdown further down the page: that
   * one says where the next batch of files is filed, and still does.
   * This one only changes what is on screen, and leaves the working
   * set exactly as it was.
   */
  function switchHtml() {
    // Nothing to switch between inside the Mix: it is already all of
    // them, and the way out is the way back.
    if (isMix()) return '';
    const chosen = pickedThemes();
    if (!chosen.length) return '';
    const current = theme();
    const caret = '<svg class="lib-switch-caret" viewBox="0 0 12 8" fill="none" aria-hidden="true">'
      + '<path d="M1 1l5 5 5-5" stroke="currentColor" stroke-width="1.6" '
      + 'stroke-linecap="round" stroke-linejoin="round"/></svg>';

    return '<div class="lib-switch' + (state.switchOpen ? ' open' : '') + '" id="libSwitch">'
      + '<button type="button" class="lib-switch-btn" id="libSwitchBtn" aria-haspopup="true"'
      + ' aria-expanded="' + (state.switchOpen ? 'true' : 'false') + '">'
      + '<span class="lib-switch-now">'
      + '<span class="lib-switch-k mono">BROWSING</span>'
      + '<span class="lib-switch-name serif" id="libSwitchName">'
      + escapeHtml(current ? current.label : '') + '</span></span>'
      + caret + '</button>'
      + '<div class="lib-switch-menu" role="menu">'
      + chosen.map((t) => {
        const g = state.galleries[galKey(t.id, state.roomId)];
        const known = g && g.loaded ? g.references.length : null;
        return '<div class="lib-switch-row">'
          + '<button type="button" class="lib-switch-item'
          + (t.id === state.themeId ? ' active' : '') + '" role="menuitem"'
          + ' data-switch="' + escapeHtml(t.id) + '"'
          + ' aria-current="' + (t.id === state.themeId ? 'true' : 'false') + '">'
          + '<span class="lib-switch-lbl">' + escapeHtml(t.label) + '</span>'
          + '<span class="lib-switch-n mono">' + (known === null
            ? escapeHtml(t.palette.split(',')[0].toUpperCase())
            : known + (known === 1 ? ' PICTURE' : ' PICTURES')) + '</span>'
          + '</button>'
          // A theme leaves the set from here too, which is the only
          // place it can be done while a gallery is open. Never the
          // last one: that would leave nothing to show.
          + (chosen.length > 1
            ? '<button type="button" class="lib-switch-x" data-unpick="' + escapeHtml(t.id) + '"'
              + ' aria-label="' + escapeHtml('Remove ' + t.label + ' from the selection')
              + '" title="Remove from the selection">\u00d7</button>'
            : '')
          + '</div>';
      }).join('')
      + '</div></div>';
  }

  /**
   * THE ACTION BAR, and the only way past the first ten pictures.
   *
   * Ten, then twenty, then the next set of twenty. The count is of the
   * pictures this theme and room actually hold -- the list came down in
   * one request when the room opened, and what is paged here is how
   * many of them the browser is asked to DOWNLOAD, which is the part
   * that costs anything.
   */
  function dockHtml() {
    const g = gallery();
    if (state.loading || !g || !g.references.length) return '';

    const total = g.references.length;
    const from = g.start + 1;
    const to = Math.min(g.start + g.visible, total);
    const moreInSet = g.visible < SET && total > g.start + g.visible;
    const nextSet = total > g.start + SET;
    const current = theme();
    const here = [current ? current.label : '', room() ? room().label : '']
      .filter(Boolean).join(' \u00b7 ');

    return '<div class="lib-dock" id="libDock">'
      + '<span class="lib-dock-text">'
      + '<span class="lib-dock-k mono">SHOWING ' + from + '\u2013' + to + ' OF ' + total
      + (here ? ' \u00b7 ' + escapeHtml(here.toUpperCase()) : '') + '</span>'
      + '<span class="lib-dock-sub" id="libDockSub">'
      + (moreInSet || nextSet
        ? 'Twenty at a time, so the room opens without fetching every picture in it.'
        : 'You\u2019ve explored all available images.')
      + '</span></span>'
      + '<span class="lib-dock-acts">'
      + (g.start > 0
        ? '<button type="button" class="lib-quiet mono" id="libPrevSet">\u2190 PREVIOUS SET</button>'
        : '')
      + (moreInSet
        ? '<button type="button" class="lib-go mono" id="libMore">LOAD MORE IMAGES</button>'
        : nextSet
          ? '<button type="button" class="lib-go mono" id="libNextSet">EXPLORE NEXT SET \u2192</button>'
          : '')
      + '</span></div>';
  }

  function referencesHtml() {
    if (state.loading) return skeletonsHtml(8);
    if (!state.references.length) {
      return '<div class="lib-empty"><h3 class="serif">Nothing in this theme yet</h3>'
        + '<p>' + (state.canAdd
          ? 'Use ADD IMAGES above to put the first rooms in. They are stored in the '
            + 'studio’s Google Drive, under this theme.'
          : 'Reference rooms appear here once the studio adds them. They are stored in the '
            + 'studio’s Google Drive.')
        + '</p></div>';
    }
    return '<div class="lib-grid">' + visibleRefs().map((ref) => {
      const chosen = state.chosen && state.chosen.id === ref.id;
      return '<figure class="lib-card' + (chosen ? ' chosen' : '') + '" data-choose="'
        + escapeHtml(ref.id) + '" tabindex="0" role="button" aria-pressed="' + (chosen ? 'true' : 'false') + '">'
        + '<div class="lib-shot"><img src="' + escapeHtml(ref.imageUrl) + '" alt="'
        + escapeHtml(ref.title) + '" loading="lazy"></div>'
        + (chosen ? '<span class="lib-chosen-flag mono">SELECTED</span>' : '')
        // Said plainly, because it is a drawing and not a photograph of
        // a room this studio built.
        + (ref.isStarter ? '<span class="lib-starter-flag mono">STARTER</span>' : '')
        + '<figcaption class="lib-cap">'
        + '<span class="lib-title">' + escapeHtml(ref.title) + '</span>'
        + '<span class="lib-meta mono">' + escapeHtml(
          [ref.room, ref.uploadedBy && ref.uploadedBy.name].filter(Boolean).join(' · ')
        ) + '</span>'
        // A starter ships with the application, so there is nothing for
        // the studio to remove -- the server refuses it too.
        + (state.canAdd && !ref.isStarter
          ? '<button type="button" class="lib-del mono" data-delete="' + escapeHtml(ref.id) + '">REMOVE</button>'
          : '')
        + '</figcaption></figure>';
    }).join('') + '</div>';
  }

  /**
   * THE QUESTION THE LIBRARY ASKS FIRST.
   *
   * Drawn in place of the library, not over it: there is nothing
   * behind this to click past, and no way on but through it.
   *
   * It leaves the rest of the page exactly as it is -- the sidebar,
   * the profile, the sign-out are all already wired by the time this
   * is drawn, so the studio can still go elsewhere.
   */
  function renderClientGate(onDone) {
    document.getElementById('mainContent').innerHTML =
      '<div class="stage">'
      + '<div class="mono" style="font-size:10px; letter-spacing:.18em; color:var(--muted)">'
      + 'BEFORE THE LIBRARY OPENS</div>'
      + '<h1 class="page-h1 serif">Who is this sitting for?</h1>'
      + '<p class="page-sub">Both are needed. The rooms chosen from here become the reference '
      + 'a board is built on, so the library is opened in a client\u2019s name.</p>'
      + '<form class="lib-gate" id="libGateForm" novalidate>'
      + '<label class="lib-gate-field">'
      + '<span class="lib-gate-k mono">CLIENT NAME<span class="req">*</span></span>'
      + '<input type="text" id="libClientName" name="clientName" autocomplete="name" '
      + 'required aria-required="true" aria-describedby="libClientNameErr" '
      + 'placeholder="Full name">'
      + '<span class="lib-gate-err mono" id="libClientNameErr" role="alert"></span>'
      + '</label>'
      + '<label class="lib-gate-field">'
      + '<span class="lib-gate-k mono">PHONE NUMBER<span class="req">*</span></span>'
      + '<input type="tel" id="libClientPhone" name="clientPhone" autocomplete="tel" '
      + 'inputmode="numeric" required aria-required="true" aria-describedby="libClientPhoneErr" '
      + 'placeholder="10-digit mobile number">'
      + '<span class="lib-gate-err mono" id="libClientPhoneErr" role="alert"></span>'
      + '</label>'
      + '<button type="submit" class="lib-go mono" id="libGateGo">CONTINUE TO LIBRARY \u2192</button>'
      + '<p class="lib-gate-hint">Kept on this device for this sitting only. Nothing is sent '
      + 'anywhere and nothing is saved to the studio\u2019s records.</p>'
      + '</form>'
      + '</div>';

    const form = document.getElementById('libGateForm');
    const nameInput = document.getElementById('libClientName');
    const phoneInput = document.getElementById('libClientPhone');
    const nameErr = document.getElementById('libClientNameErr');
    const phoneErr = document.getElementById('libClientPhoneErr');

    /** Says what is wrong with a field, or clears it when nothing is. */
    const complain = (input, slot, message) => {
      slot.textContent = message;
      input.setAttribute('aria-invalid', message ? 'true' : 'false');
      return !message;
    };

    const checkName = (quiet) => {
      const value = nameInput.value.trim();
      if (quiet && !value) return false;
      return complain(nameInput, nameErr, value ? '' : 'Client name is required.');
    };

    const checkPhone = (quiet) => {
      const typed = phoneInput.value.trim();
      if (quiet && !typed) return false;
      if (!typed) return complain(phoneInput, phoneErr, 'Phone number is required.');
      return complain(phoneInput, phoneErr, normalisePhone(typed)
        ? '' : 'Enter a valid 10-digit Indian mobile number.');
    };

    // Re-checked as it is typed, so a message goes the moment it stops
    // being true -- but QUIETLY while a field is still empty, because
    // "required" shouted at somebody mid-sentence is just noise.
    nameInput.addEventListener('input', () => checkName(true));
    phoneInput.addEventListener('input', () => checkPhone(true));

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      // BOTH, every time. & would stop at the first failure and leave
      // the second field silent about what is wrong with it.
      const ok = [checkName(false), checkPhone(false)].every(Boolean);
      if (!ok) {
        (nameErr.textContent ? nameInput : phoneInput).focus();
        return;
      }

      const client = {
        name: nameInput.value.trim(),
        phone: normalisePhone(phoneInput.value),
        userId: state.userId || '',
        atISO: new Date().toISOString(),
      };
      try {
        sessionStorage.setItem(CLIENT_KEY, JSON.stringify(client));
      } catch (err) {
        // Storage refused, so the next visit asks again. That is a
        // repeated question, not a closed door: the library still
        // opens now.
      }
      state.client = client;
      onDone();
    });

    nameInput.focus();
  }

  function render() {
    const current = theme();
    const head = '<div class="mono" style="font-size:10px; letter-spacing:.18em; color:var(--muted)">REFERENCE ROOMS</div>';

    document.getElementById('mainContent').innerHTML =
      '<div class="stage">'
      + (state.view === 'themes'
        ? head
          + '<div class="lib-hero">'
          + '<div class="lib-hero-sub">'
          + '<h1 class="step-h1 serif" style="margin:0">De’vyora Library</h1>'
          + '<p class="step-sub" style="margin-top:9px">Rooms kept by theme. Pick one and it '
          + 'becomes the reference: the catalog is searched for the tiles that match it, and '
          + 'the scene is generated from that same picture.</p>'
          // THE SHOWROOM TABLET'S WAY IN to the client's own side of
          // the library. A client has no login, so their screens are
          // a separate page (wishlist.html) rather than this one in a
          // different mood -- this is only the door to it, opened in
          // its own tab so the staff view is still here afterwards.
          + '<a class="lib-back mono" href="wishlist.html" target="_blank" rel="noopener" '
          + 'id="libClientWishlist">OPEN THE CLIENT WISHLIST →</a>'
          + '</div>'
          + totalsHtml()
          + '</div>'
          + activeHtml()
          + storageHtml()
          + uploadBlockedHtml()
          + addHintHtml()
          + pickedHtml()
          + themesHtml()
        : state.view === 'rooms'
        ? '<button type="button" class="lib-back mono" id="libBack">← ALL THEMES</button>'
          + '<div class="lib-head">'
          + '<h1 class="step-h1 serif" style="margin:0">'
          + escapeHtml(!isMix() && state.picked.length > 1
            ? 'Room types' : (current ? current.label : ''))
          + '</h1>'
          + '<span class="lib-meta mono">' + escapeHtml(!isMix() && state.picked.length > 1
            ? pickedThemes().map((t) => t.label).join(' \u00b7 ')
            : (current ? current.palette : '')) + '</span>'
          + '</div>'
          + '<p class="step-sub">' + (!isMix() && state.picked.length > 1
            ? 'Choose the room you are designing. The number beside each one counts every '
              + 'selected theme \u2014 inside, you switch between them without losing any.'
            : 'Choose the room you are designing.') + '</p>'
          + activeHtml()
          + storageHtml()
          + roomsHtml()
        : '<button type="button" class="lib-back mono" id="libBack">← '
          + escapeHtml(!isMix() && state.picked.length > 1
            ? 'ROOM TYPES'
            : (current ? current.label : 'ALL THEMES').toUpperCase()) + '</button>'
          + '<div class="lib-head">'
          + '<h1 class="step-h1 serif" style="margin:0">'
          + escapeHtml(room() ? room().label : '') + '</h1>'
          + '<span class="lib-meta mono">'
          + escapeHtml([current ? current.label : '', current ? current.palette : '']
            .filter(Boolean).join(' · ')) + '</span>'
          + '</div>'
          + '<p class="step-sub">Tap a picture to make it the reference image.</p>'
          + switchHtml()
          + activeHtml()
          + storageHtml()
          + uploadBlockedHtml()
          + uploadHtml(current)
          + '<div class="alert" id="libAlert" style="display:none"></div>'
          + queueHtml()
          + referencesHtml()
          + dockHtml())
      + '</div>';
    wire();
  }

  function repaintQueue() {
    const host = document.getElementById('libQueue');
    if (!host) { render(); return; }
    host.outerHTML = queueHtml();
    wireQueue();
  }

  function showAlert(message) {
    const el = document.getElementById('libAlert');
    if (!el) return;
    el.textContent = message;
    el.style.display = message ? 'flex' : 'none';
  }

  // ── choosing ──────────────────────────────────────────────────────
  //
  // The whole point of the library. The choice is kept by the API
  // client, which is what the generation step will read -- see the note
  // beside LIBRARY_SELECTION_KEY there.

  function choose(id) {
    const ref = state.references.find((r) => r.id === id);
    if (!ref) return;
    // The theme's LABEL travels with the choice, not only its id. The
    // mood-board wizard pre-selects its theme from this, and it works
    // in labels -- see the note beside themeLabel in the API client.
    const where = theme(ref.themeId);
    const inRoom = (state.roomTypes || []).find((r) => r.id === ref.roomId);
    state.chosen = CasaApi.library.select({
      ...ref,
      themeLabel: where ? where.label : '',
      // The wizard's own name for the room travels too, so choosing a
      // Kitchen reference pre-selects Kitchen on the mood board -- the
      // same reason themeLabel does.
      roomWizard: inRoom ? inRoom.wizard : '',
    });

    // STRAIGHT ON TO THE BOARDS.
    //
    // The choice is already stored -- CasaApi.library.select writes it
    // where the wizard reads it -- so there is nothing left to do on
    // this page. ?generate=1 says the rest out loud: do not stop on
    // the brief, build the boards from this picture and show them.
    location.href = 'mood-board.html?generate=1';
  }

  function clearChoice() {
    CasaApi.library.clearSelection();
    state.chosen = null;
    render();
  }

  // ── adding (staff) ────────────────────────────────────────────────

  async function runQueue() {
    if (state.running) return;
    state.running = true;
    state.aborter = new AbortController();
    repaintQueue();

    // Whatever the two dropdowns said when the files were picked. Read
    // ONCE, here, so a studio that changes a dropdown while ninety
    // pictures are going up does not split the batch between two rooms.
    const into = state.uploadThemeId || state.themeId;
    const intoRoom = state.uploadRoomId || state.roomId;
    let next = 0;

    const worker = async () => {
      for (let i = next++; i < state.queue.length; i = next++) {
        if (state.aborter.signal.aborted) return;
        const item = state.queue[i];
        item.status = 'uploading';
        item.progress = 0;
        repaintQueue();
        try {
          const saved = await CasaApi.library.upload(item.file, { themeId: into, roomId: intoRoom }, {
            signal: state.aborter.signal,
            onProgress: (share) => {
              item.progress = share;
              const cell = document.querySelectorAll('.lib-file')[i];
              const label = cell && cell.querySelector('.lib-file-state');
              if (label) label.textContent = Math.round(share * 100) + '%';
            },
          });
          item.status = 'done';
          // BOTH, not just the theme. Standing in British > Kitchen and
          // filing a batch into British > Bathroom used to put the new
          // bathroom pictures into the kitchen gallery on screen.
          if (saved && state.themeId === into && state.roomId === intoRoom) {
            state.references.unshift(saved);
          }
        } catch (err) {
          item.status = 'failed';
          item.error = (err && err.message) || 'Upload failed.';
        }
        repaintQueue();
      }
    };

    await Promise.all(Array.from({ length: Math.min(AT_ONCE, state.queue.length) }, worker));

    state.running = false;
    const failed = state.queue.filter((f) => f.status === 'failed').length;
    const done = state.queue.filter((f) => f.status === 'done').length;

    // THE COUNTS, RE-READ RATHER THAN GUESSED AT.
    //
    // Both levels of the hierarchy carry a number, and they came down
    // with the themes when the page loaded -- so after a batch they are
    // both stale, and going back showed "1 PICTURE" over a room holding
    // sixty-one. Adding `done` to a local total was how the old flat
    // page kept up; it cannot work here, because the batch may have
    // been filed into a theme and room the client is not standing in.
    //
    // Nine rows and their room breakdown is a cheap thing to ask for
    // once, at the end of an upload, and it is the only way the two
    // numbers are certainly right.
    if (done) {
      try {
        const fresh = await CasaApi.library.themes();
        setThemes(fresh.themes);
        state.storageError = fresh.storage.ok ? '' : fresh.storage.reason;
        state.uploadError = fresh.uploads.ok ? '' : fresh.uploads.reason;
      } catch (err) {
        // The pictures went up; only the counts are stale. Not worth
        // failing an upload over, and the next page load fixes it.
      }

      const filed = state.galleries[galKey(into, intoRoom)];
      if (filed) {
        if (state.themeId === into && state.roomId === intoRoom) {
          // The new pictures went to the front of the list; showing the
          // first set again is how the studio sees what they just added.
          filed.start = 0;
          filed.visible = PAGE;
        } else {
          // Filed somewhere the studio is not standing. That gallery's
          // cached list is now short by a batch, so it is asked for
          // again the next time it is opened rather than shown stale.
          filed.loaded = false;
        }
      }
    }

    render();
    if (failed) {
      showAlert(failed + ' of ' + state.queue.length + ' could not be uploaded. '
        + 'The rest are in the library.');
    }
  }

  function enqueue(files) {
    if (!state.themeId) return;
    state.queue = Array.from(files).map((file) => ({
      file, status: 'waiting', progress: 0, error: null,
    }));
    showAlert('');
    runQueue();
  }

  async function remove(id, btn) {
    const ref = state.references.find((r) => r.id === id);
    if (!window.confirm('Remove "' + ((ref && ref.title) || 'this reference') + '" from the '
      + 'library? It is deleted from Google Drive too.')) return;

    btn.disabled = true;
    btn.textContent = 'REMOVING…';
    try {
      const result = await CasaApi.library.remove(id);
      setReferences(state.references.filter((r) => r.id !== id));
      // Removing the last picture of a set would otherwise leave a
      // blank gallery under a bar reading "21-20 of 20".
      const g = gallery();
      if (g && g.start && g.start >= g.references.length) {
        g.start = Math.max(0, g.start - SET);
      }
      // A reference that no longer exists must not stay selected.
      if (state.chosen && state.chosen.id === id) {
        CasaApi.library.clearSelection();
        state.chosen = null;
      }
      const current = theme();
      if (current && current.count > 0) current.count -= 1;
      render();
      if (result && result.driveDeleted === false) {
        showAlert('Removed from the library, but the file could not be deleted from Drive: '
          + (result.driveError || 'unknown error'));
      }
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'REMOVE';
      showAlert((err && err.message) || 'That could not be removed.');
    }
  }

  // ── wiring ────────────────────────────────────────────────────────

  function wireQueue() {
    const cancel = document.getElementById('libCancel');
    if (cancel) cancel.addEventListener('click', () => { if (state.aborter) state.aborter.abort(); });
    const clear = document.getElementById('libClear');
    if (clear) clear.addEventListener('click', () => { state.queue = []; render(); });
  }

  function wire() {
    document.querySelectorAll('[data-theme]').forEach((btn) => {
      btn.addEventListener('click', () => openTheme(btn.dataset.theme));
    });

    document.querySelectorAll('[data-room]').forEach((btn) => {
      btn.addEventListener('click', () => openRoom(btn.dataset.room));
    });

    // The named room chips under a theme card, each a way straight in.
    document.querySelectorAll('[data-open]').forEach((btn) => {
      btn.addEventListener('click', (event) => {
        // The chip sits under the card, not in it -- but a stray bubble
        // reaching the grid must not also open the theme.
        event.stopPropagation();
        const [themeId, roomId] = String(btn.dataset.open).split('|');
        openThemeRoom(themeId, roomId);
      });
    });

    // ── the working set ──
    document.querySelectorAll('[data-pick]').forEach((btn) => {
      btn.addEventListener('click', (event) => {
        // The tick sits over the card. Ticking a theme is not opening it.
        event.stopPropagation();
        togglePick(btn.dataset.pick);
      });
    });
    const pickGo = document.getElementById('libPickGo');
    if (pickGo) pickGo.addEventListener('click', () => openTheme(firstPicked()));
    const pickNone = document.getElementById('libPickNone');
    if (pickNone) {
      pickNone.addEventListener('click', () => { state.picked = []; render(); });
    }

    // ── the switcher ──
    const switchBtn = document.getElementById('libSwitchBtn');
    if (switchBtn) {
      switchBtn.addEventListener('click', (event) => {
        event.stopPropagation();
        state.switchOpen = !state.switchOpen;
        render();
      });
    }
    document.querySelectorAll('[data-switch]').forEach((btn) => {
      btn.addEventListener('click', () => switchTheme(btn.dataset.switch));
    });
    document.querySelectorAll('[data-unpick]').forEach((btn) => {
      btn.addEventListener('click', (event) => {
        // Taking a theme out of the set is not choosing it.
        event.stopPropagation();
        togglePick(btn.dataset.unpick);
      });
    });

    // ── the action bar ──
    const more = document.getElementById('libMore');
    if (more) more.addEventListener('click', loadMore);
    const onward = document.getElementById('libNextSet');
    if (onward) onward.addEventListener('click', nextSet);
    const back2 = document.getElementById('libPrevSet');
    if (back2) back2.addEventListener('click', prevSet);

    // Back goes up ONE level, not all the way out: from a room to its
    // theme's rooms, and from there to the themes.
    const back = document.getElementById('libBack');
    if (back) {
      back.addEventListener('click', () => {
        if (state.view === 'room') { openTheme(state.themeId); return; }
        openThemes();
      });
    }

    // The two dropdowns decide where the NEXT batch goes. Held on the
    // state rather than read at submit time, so the button above the
    // file picker can say where they are about to land.
    const themePicker = document.getElementById('libTheme');
    if (themePicker) {
      themePicker.addEventListener('change', () => {
        state.uploadThemeId = themePicker.value;
        render();
      });
    }
    const roomPicker = document.getElementById('libRoom');
    if (roomPicker) {
      roomPicker.addEventListener('change', () => {
        state.uploadRoomId = roomPicker.value;
        render();
      });
    }

    const clear = document.getElementById('libClearChoice');
    if (clear) clear.addEventListener('click', clearChoice);

    document.querySelectorAll('[data-choose]').forEach((card) => {
      card.addEventListener('click', (event) => {
        // REMOVE sits inside the card; a click on it is not a choice.
        if (event.target.closest('[data-delete]')) return;
        choose(card.dataset.choose);
      });
      card.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          choose(card.dataset.choose);
        }
      });
    });

    document.querySelectorAll('[data-delete]').forEach((btn) => {
      btn.addEventListener('click', () => remove(btn.dataset.delete, btn));
    });

    const files = document.getElementById('libFiles');
    if (files) {
      files.addEventListener('change', () => {
        // A picture filed under no room would land in the unsorted
        // bucket, which is where OLD pictures live -- not somewhere new
        // ones should be put by accident.
        if (state.uploadError) {
          // Every file in this batch would fail the same way, for the
          // same reason, one after another. Saying so once, before any
          // of them go up, beats a hundred identical failures.
          files.value = '';
          // Not the reason again -- it is already on screen, in the
          // warning directly above this card, and printing the same
          // paragraph twice reads like a bug rather than an answer.
          showAlert('Nothing was uploaded: the library cannot write to Google Drive yet. '
            + 'The warning above this card says what is missing.');
          return;
        }
        if (!(state.uploadRoomId || state.roomId)) {
          files.value = '';
          showAlert('Choose a room type first \u2014 every picture is filed under a theme '
            + 'and a room.');
          return;
        }
        if (files.files && files.files.length) enqueue(files.files);
        files.value = '';
      });
    }

    wireQueue();
  }

  // ── navigation ────────────────────────────────────────────────────

  function openThemes() {
    if (state.running) return;
    state.view = 'themes';
    state.themeId = null;
    state.roomId = null;
    state.references = [];
    state.queue = [];
    state.switchOpen = false;
    state.loading = false;
    // The working set survives coming back out: it is what the studio
    // chose to work across, not where they happen to be standing.
    render();
  }

  /**
   * A theme opens its ROOMS, which need no request: the counts came
   * down with the themes.
   *
   * OPENING A THEME IS BROWSING, NOT CHOOSING. On its own it starts no
   * working set, so a studio that never touches a tick gets exactly the
   * Library it had before: one theme, its own room counts, its own
   * pictures, and no switcher to wonder about.
   *
   * But if there IS a set, the theme just opened belongs in it --
   * otherwise the switcher above the gallery would be offering themes,
   * none of them the one actually on screen.
   */
  function openTheme(themeId) {
    if (!themeId) return;
    // The Mix never joins the working set -- it IS every theme, and the
    // switcher is for moving between the chosen few.
    if (!isMix(themeId) && state.picked.length && !isPicked(themeId)) {
      state.picked.push(themeId);
    }
    state.view = 'rooms';
    state.themeId = themeId;
    state.roomId = null;
    state.references = [];
    state.queue = [];
    state.switchOpen = false;
    state.loading = false;
    render();
  }

  /**
   * STRAIGHT INTO ONE THEME'S ROOM, from the theme grid.
   *
   * What the named chips under each theme card do. Two steps collapsed
   * into one, and the same rule about the working set as opening a
   * theme card: browsing starts no set, but if there is one, the theme
   * being opened belongs in it.
   */
  async function openThemeRoom(themeId, roomId) {
    if (!themeId || !roomId) return;
    if (!isMix(themeId) && state.picked.length && !isPicked(themeId)) {
      state.picked.push(themeId);
    }
    state.themeId = themeId;
    await openRoom(roomId);
  }

  /**
   * A room, for whichever theme in the set is active.
   *
   * Choosing a room is an explicit fresh start, so the paging goes back
   * to the first set even when the pictures are already in hand.
   */
  async function openRoom(roomId) {
    state.view = 'room';
    state.roomId = roomId;
    // The upload form follows the studio into the room it just opened,
    // which is nearly always the one they want to file into.
    state.uploadThemeId = state.themeId;
    state.uploadRoomId = roomId === 'unsorted' ? (state.uploadRoomId || '') : roomId;
    state.queue = [];
    state.switchOpen = false;
    const already = state.galleries[galKey(state.themeId, roomId)];
    if (already) { already.start = 0; already.visible = PAGE; }
    await loadGallery(state.themeId, roomId);
  }

  /**
   * SWITCHING THEMES CHANGES EXACTLY ONE THING: which of the chosen
   * themes the gallery is showing.
   *
   * The working set, the room, and every other theme's place in its own
   * gallery are left alone -- and a theme already fetched is not
   * fetched again.
   */
  function switchTheme(themeId) {
    state.switchOpen = false;
    if (!themeId || themeId === state.themeId) { render(); return; }
    state.themeId = themeId;
    // The upload card follows the gallery, as it always has.
    state.uploadThemeId = themeId;
    loadGallery(themeId, state.roomId);
  }

  /**
   * ONE THEME AND ROOM'S PICTURES.
   *
   * The server has no paging: /library/references answers with the
   * whole list for a theme and room, and that list is rows, not
   * pictures. So it is asked once per gallery and kept. What the bar at
   * the bottom pages is how many of those rows become an <img> -- which
   * is the part that actually costs a hundred downloads.
   */
  async function loadGallery(themeId, roomId) {
    const key = galKey(themeId, roomId);
    const cached = state.galleries[key];

    if (cached && cached.loaded) {
      state.references = cached.references;
      state.storageError = cached.storageError;
      state.loading = false;
      render();
      return;
    }

    state.galleries[key] = cached
      || { references: [], start: 0, visible: PAGE, storageError: '', loaded: false };
    state.references = [];
    state.loading = true;
    render();

    let answer = null;
    let failure = '';
    try {
      // No themeId means every theme, which is exactly what the Mix
      // wants: the server answers with all their starters and all
      // their uploads for this room.
      answer = await CasaApi.library.references(isMix(themeId) ? null : themeId, roomId);
    } catch (err) {
      failure = (err && err.message) || 'The library could not be read.';
    }

    const g = state.galleries[key];
    if (answer) {
      g.references = answer.references;
      // The starters are files and always arrive; only the studio's own
      // uploads need the database, so this costs those alone rather
      // than emptying the room.
      g.storageError = answer.storage.ok ? '' : answer.storage.reason;
      g.loaded = true;
    } else {
      g.references = [];
      g.storageError = failure;
    }
    g.start = 0;
    g.visible = PAGE;

    // The studio may have switched again while this was in flight. The
    // answer still belongs in the cache; it no longer belongs on screen.
    if (galKey() !== key) return;

    state.references = g.references;
    state.storageError = g.storageError;
    state.loading = false;
    render();
    if (failure) showAlert(failure);
  }

  /**
   * A theme joins or leaves the working set.
   *
   * Leaving is the interesting half: if it was the one on screen,
   * another of the chosen themes takes its place rather than leaving a
   * gallery with nothing in it -- and if it was the last one, the
   * studio goes back out to choose again.
   */
  function togglePick(themeId) {
    const at = state.picked.indexOf(themeId);
    if (at === -1) { state.picked.push(themeId); render(); return; }

    state.picked.splice(at, 1);
    if (state.themeId !== themeId) { render(); return; }

    const next = firstPicked();
    if (next) {
      if (state.view === 'room') { switchTheme(next); return; }
      openTheme(next);
      return;
    }
    openThemes();
  }

  // ── a set at a time ───────────────────────────────────────────────

  function toTopOfGallery() {
    const grid = document.querySelector('.lib-grid');
    if (grid && grid.scrollIntoView) {
      grid.scrollIntoView({ block: 'start', behavior: 'smooth' });
    }
  }

  /** Ten more, up to the twenty a set holds. */
  function loadMore() {
    const g = gallery();
    if (!g) return;
    g.visible = Math.min(SET, g.visible + PAGE);
    render();
  }

  /** On to the next twenty, starting with its first ten. */
  function nextSet() {
    const g = gallery();
    if (!g) return;
    g.start += SET;
    g.visible = PAGE;
    render();
    toTopOfGallery();
  }

  /** Back to a set already browsed, shown whole rather than halved. */
  function prevSet() {
    const g = gallery();
    if (!g || !g.start) return;
    g.start = Math.max(0, g.start - SET);
    g.visible = SET;
    render();
    toTopOfGallery();
  }

  async function init() {
    const user = await CasaApi.requireAuth();

    document.getElementById('profileInitials').textContent = CasaApi.initials(user.name);
    document.getElementById('profileName').textContent = user.name || user.email;
    document.getElementById('profileRole').textContent = (user.role || '').toUpperCase();

    renderNav();
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await CasaApi.auth.logout();
      location.href = 'login.html';
    });

    // The switcher's menu closes when attention goes elsewhere. Bound
    // ONCE, here, rather than in wire(), which runs on every repaint
    // and would stack a listener per draw.
    document.addEventListener('click', (event) => {
      if (!state.switchOpen) return;
      if (event.target.closest && event.target.closest('#libSwitch')) return;
      state.switchOpen = false;
      render();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && state.switchOpen) {
        state.switchOpen = false;
        render();
      }
    });

    // Adding pictures is the studio's job, not the client's. The button
    // is shown to whoever may actually use it; the server refuses the
    // rest either way, so this only decides what is worth showing.
    //
    // '*' COUNTS, AND LEAVING IT OUT HID THE BUTTON FROM THE OWNER.
    //
    // The Owner role's permission list is exactly ["*"] (prisma/seed.ts),
    // and the server has always read it that way -- requirePermission is
    // `includes('*') || includes(permission)`. This line checked only for
    // the named permission, so the two asked the same question and gave
    // different answers: the Owner's upload would have been accepted, and
    // they were never shown the control to make one.
    state.canAdd = Array.isArray(user.permissions)
      && (user.permissions.indexOf('*') !== -1
        || user.permissions.indexOf('reference_images:write') !== -1);

    state.chosen = CasaApi.library.selection();

    /*
     * THE CLIENT COMES FIRST.
     *
     * Asked before anything is fetched, so a sitting that is never
     * named costs the server nothing. Every way in lands here -- the
     * home page's card, the sidebar on any page, the mood board's
     * CHANGE link, a typed address -- because the question is asked by
     * the library itself rather than by whatever opened it.
     *
     * Asked ONCE. A client already on record for this tab and this
     * signed-in user goes straight through.
     */
    state.userId = user.id || '';
    state.client = clientOnRecord(state.userId);
    if (!state.client) {
      renderClientGate(() => { openLibrary(); });
      return;
    }

    await openLibrary();
  }

  /** The library itself, once there is a client to open it for. */
  async function openLibrary() {
    render();
    try {
      const [answer, roomTypes] = await Promise.all([
        CasaApi.library.themes(),
        // The studio's five room types, for the upload dropdown. Asked
        // of the server rather than written into this page, so the two
        // cannot disagree about what a room is.
        CasaApi.library.rooms().catch(() => []),
      ]);
      setThemes(answer.themes);
      state.roomTypes = roomTypes;
      state.storageError = answer.storage.ok ? '' : answer.storage.reason;
      state.uploadError = answer.uploads.ok ? '' : answer.uploads.reason;
    } catch (err) {
      // The request itself failed -- not the same thing as the server
      // answering with no themes, and the page says so rather than
      // blaming the theme file for a network error.
      state.themes = [];
      state.loadFailed = true;
      state.storageError = (err && err.message) || '';
    }
    state.loading = false;
    render();
  }

  init();
})();
</script>
<script src="assets/sidebar.js" defer></script>
</body>
</html>
