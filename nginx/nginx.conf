worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Real IP handling — the backend's own rate limiter and login-attempt
  # logging (Module 25) read req.ip, which is meaningless if every request
  # arrives from nginx's own address. This restores the client's real IP.
  set_real_ip_from 0.0.0.0/0;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
  gzip_min_length 512;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" $request_time';
  access_log /var/log/nginx/access.log main;

  # Same body-size ceiling as the backend's own multer limits (catalog PDFs
  # up to 50MB by default) — no point letting nginx accept a request the
  # backend would reject anyway, and this fails fast before wasting an
  # upload's worth of bandwidth.
  client_max_body_size 55M;

  upstream backend {
    server backend:5000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    # ---- Security headers ----
    # Helmet already sets most of these on the API's own responses; these
    # cover the static frontend responses, which never pass through Helmet.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- API: reverse proxy to the backend container ----
    location /api/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }

    # ---- API docs (Module 26) ----
    location /api-docs {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Uploaded/generated files served by the backend ----
    location /static/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_cache_valid 200 10m;
      add_header Cache-Control "public, max-age=600";
    }

    # ---- Health check passthrough ----
    location = /health {
      proxy_pass http://backend/api/v1/health;
      proxy_http_version 1.1;
      access_log off;
    }

    # ---- Static frontend ----
    root /usr/share/nginx/html;
    index login.html;

    location / {
      try_files $uri $uri/ =404;
    }

    location ~* \.html$ {
      add_header Cache-Control "no-cache";
    }
    location /assets/ {
      add_header Cache-Control "public, max-age=3600";
    }
  }
}
